const colorOf = name => {
  const map = {
    "Ecuador": "#EA5E33",
    "Jamaica": "#F29A44",
    "Honduras": "#C4715A",
    "Brazil": "#C49A45",
    "Colombia": "#5B9E78",
    "Estonia": "#3D7A5A",
    "Croatia": "#3D7A5A",
    "Italy": "#5B9E78",
    "Germany": "#A6C4A2",
    "France": "#A6C4A2",
    "Japan": "#8BAD72"
  };
  return map[name] || "#A6C4A2";
};

const W = 820, H = 500;
const mg = { top: 40, right: 140, bottom: 40, left: 58 };
const yearMin = 1990, yearMax = 2023;
const valMin = 0, valMax = 90;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const xS = y => mg.left + (y - yearMin) / (yearMax - yearMin) * (W - mg.left - mg.right);
const yS = v => mg.top + (valMax - v) / (valMax - valMin) * (H - mg.top - mg.bottom);

// Grid
[0, 20, 40, 60, 80].forEach(v => {
  svg.appendChild(mkEl("line", { x1: mg.left, y1: yS(v), x2: W - mg.right, y2: yS(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  svg.appendChild(mkEl("text", { x: mg.left - 6, y: yS(v) + 3, "text-anchor": "end", "font-size": "9", "font-family": "JetBrains Mono, monospace", fill: "#7A786F" })).textContent = v;
});

// X-axis ticks
[1990, 1995, 2000, 2005, 2010, 2015, 2020, 2023].forEach(y => {
  svg.appendChild(mkEl("text", { x: xS(y), y: H - mg.bottom + 14, "text-anchor": "middle", "font-size": "9", "font-family": "JetBrains Mono, monospace", fill: "#7A786F" })).textContent = y;
});

// Y-axis label
const yLabel = mkEl("text", { transform: `rotate(-90)`, x: -(mg.top + (H - mg.top - mg.bottom) / 2), y: 13, "text-anchor": "middle", "font-size": "9", "font-family": "JetBrains Mono, monospace", fill: "#7A786F" });
yLabel.textContent = "per 100,000 people";
svg.appendChild(yLabel);

// resolveCollisions
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
const groups = [];

data.forEach(series => {
  const color = colorOf(series.n);
  const g = mkEl("g", {});
  svg.appendChild(g);

  // Build path segments - skip gaps > 2 years
  let pathD = "";
  for (let i = 0; i < series.pts.length; i++) {
    const p = series.pts[i];
    const move = i === 0 || (series.pts[i].y - series.pts[i - 1].y) > 2;
    pathD += `${move ? "M" : "L"} ${xS(p.y)} ${yS(p.v)} `;
  }

  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
  g.appendChild(line);

  // Invisible hit area
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  const lastPt = series.pts[series.pts.length - 1];

  groups.push({ g, line, color, name: series.n, pts: series.pts, labelY: yS(lastPt.v), lastVal: lastPt.v, lastYear: lastPt.y });

  hit.addEventListener("mousemove", e => {
    groups.forEach(gr => {
      gr.line.setAttribute("stroke-width", gr === groups.find(x => x.name === series.n) ? "2.5" : "1");
      gr.line.setAttribute("stroke-opacity", gr === groups.find(x => x.name === series.n) ? "1" : "0.12");
    });
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const rawYear = yearMin + (mx - mg.left) / (W - mg.left - mg.right) * (yearMax - yearMin);
    const closestPt = series.pts.reduce((a, b) => Math.abs(b.y - rawYear) < Math.abs(a.y - rawYear) ? b : a);
    tip.textContent = `${series.n}  ${closestPt.y}: ${closestPt.v.toFixed(1)}`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(gr => {
      gr.line.setAttribute("stroke-width", "1.5");
      gr.line.setAttribute("stroke-opacity", "1");
    });
    tip.style.opacity = "0";
  });
});

// Endpoint labels (collision-resolved)
const labelItems = groups.map(gr => ({ y: gr.labelY, name: gr.name, val: gr.lastVal, color: gr.color }));
const resolved = resolveCollisions(labelItems, 12);

resolved.forEach(item => {
  const lastPt = groups.find(g => g.name === item.name);
  const lineEndX = xS(lastPt.lastYear);
  const labelX = W - mg.right + 8;

  // Leader line if label moved significantly
  if (Math.abs(item.y - lastPt.labelY) > 3) {
    svg.appendChild(mkEl("line", {
      x1: lineEndX + 2, y1: lastPt.labelY,
      x2: labelX - 2, y2: item.y,
      stroke: item.color, "stroke-width": "0.5", "stroke-opacity": "0.5"
    }));
  }

  const lbl = mkEl("text", {
    x: labelX, y: item.y + 3,
    "font-size": "9", "font-family": "Inter, sans-serif", "font-weight": "500",
    fill: item.color
  });
  lbl.textContent = `${item.val.toFixed(1)}  ${item.name}`;
  svg.appendChild(lbl);
});

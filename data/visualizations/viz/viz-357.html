<script>

,"v":13.57},{"y":2001,"v":14.68},{"y":2002,"v":14.92},{"y":2003,"v":14.79},{"y":2004,"v":14.27},{"y":2005,"v":15.94},{"y":2006,"v":17.28},{"y":2013,"v":20.11},{"y":2014,"v":24.27},{"y":2015,"v":26.11},{"y":2016,"v":28.07},{"y":2017,"v":30.16},{"y":2018,"v":33.07},{"y":2019,"v":34.01},{"y":2020,"v":7.41}]},{"n":"Austria","pts":[{"y":1995,"v":17.17},{"y":1996,"v":17.09},{"y":1997,"v":16.65},{"y":1998,"v":17.35},{"y":1999,"v":17.47},{"y":2000,"v":17.98},{"y":2001,"v":18.18},{"y":2002,"v":18.61},{"y":2003,"v":19.08},{"y":2004,"v":19.37},{"y":2005,"v":19.95},{"y":2006,"v":20.27},{"y":2007,"v":20.77},{"y":2008,"v":21.93},{"y":2009,"v":21.36},{"y":2010,"v":22.0},{"y":2011,"v":23.01},{"y":2012,"v":24.15},{"y":2013,"v":24.81},{"y":2014,"v":25.29},{"y":2015,"v":26.73},{"y":2016,"v":28.12},{"y":2017,"v":29.46},{"y":2018,"v":30.82},{"y":2019,"v":31.88},{"y":2020,"v":15.09}]},{"n":"Japan","pts":[{"y":1995,"v":3.35},{"y":1996,"v":3.84},{"y":1997,"v":4.22},{"y":1998,"v":4.11},{"y":1999,"v":4.44},{"y":2000,"v":4.76},{"y":2001,"v":4.77},{"y":2002,"v":5.24},{"y":2003,"v":5.21},{"y":2004,"v":6.14},{"y":2005,"v":6.73},{"y":2006,"v":7.33},{"y":2007,"v":8.35},{"y":2008,"v":8.35},{"y":2009,"v":6.79},{"y":2010,"v":8.61},{"y":2011,"v":6.22},{"y":2012,"v":8.36},{"y":2013,"v":10.36},{"y":2014,"v":13.41},{"y":2015,"v":19.74},{"y":2016,"v":24.04},{"y":2017,"v":28.69},{"y":2018,"v":31.19},{"y":2019,"v":31.88},{"y":2020,"v":4.12}]}];

const COLORS = ["#EA5E33","#C4715A","#F29A44","#C49A45","#8BAD72","#5B9E78","#3D7A5A","#7A9EC9","#9A86C4","#9A9890"];

const W = 800, H = 460;
const margin = {top:40, right:130, bottom:36, left:55};
const yearMin = 1995, yearMax = 2020;
const valMin = 0, valMax = 230;

function mkEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg","svg"===tag?"svg":tag==="text"||tag==="path"||tag==="line"||tag==="rect"||tag==="g"||tag==="circle"?tag:tag,"http://www.w3.org/2000/svg");
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("width","100%");
svg.style.maxWidth=W+"px";
svg.style.cursor="crosshair";
document.getElementById("chart").appendChild(svg);

const xScale = y => margin.left + (y-yearMin)/(yearMax-yearMin)*(W-margin.left-margin.right);
const yScale = v => margin.top + (valMax-v)/(valMax-valMin)*(H-margin.top-margin.bottom);

// Grid lines and Y axis ticks
[0,50,100,150,200].forEach(v=>{
  svg.appendChild(mkEl("line",{x1:margin.left,y1:yScale(v),x2:W-margin.right,y2:yScale(v),stroke:"#E2E0D5","stroke-width":"0.5"}));
  const t = mkEl("text",{x:margin.left-6,y:yScale(v)+3,"text-anchor":"end","font-family":"JetBrains Mono, monospace","font-size":"9","fill":"#7A786F"});
  t.textContent = v===0?"0":v+"M";
  svg.appendChild(t);
});

// X axis ticks
[1995,2000,2005,2010,2015,2019,2020].forEach(y=>{
  const x = xScale(y);
  svg.appendChild(mkEl("line",{x1:x,y1:H-margin.bottom,x2:x,y2:H-margin.bottom+4,stroke:"#C2C0B5","stroke-width":"0.5"}));
  const t = mkEl("text",{x,y:H-margin.bottom+14,"text-anchor":"middle","font-family":"JetBrains Mono, monospace","font-size":"9","fill":"#7A786F"});
  t.textContent = y;
  svg.appendChild(t);
});

// COVID annotation
const covidX = xScale(2020);
const covidRect = mkEl("rect",{x:xScale(2019.5),y:margin.top,width:covidX-xScale(2019.5)+margin.right*0.5,height:H-margin.top-margin.bottom,fill:"#EA5E33",opacity:"0.06"});
svg.appendChild(covidRect);
const covidLabel = mkEl("text",{x:covidX+4,y:margin.top+14,"font-family":"Inter, sans-serif","font-size":"8","fill":"#C4715A","font-weight":"500"});
covidLabel.textContent="COVID-19";
svg.appendChild(covidLabel);

// Build series as {name, pts: [{year,value}], color}
const series = data.map((d,i)=>({
  name:d.n,
  pts:d.pts.map(p=>({year:p.y,value:p.v})),
  color:COLORS[i]
}));

const groups = [];

function resolveCollisions(items, minGap){
  const sorted = items.slice().sort((a,b)=>a.y-b.y);
  for(let pass=0;pass<40;pass++){
    let moved=false;
    for(let i=1;i<sorted.length;i++){
      const gap = sorted[i].y - sorted[i-1].y;
      if(gap<minGap){
        const shift=(minGap-gap)/2;
        sorted[i-1].y-=shift;
        sorted[i].y+=shift;
        moved=true;
      }
    }
    if(!moved) break;
  }
  // Clamp within chart
  for(const item of sorted){
    item.y = Math.max(margin.top+6, Math.min(H-margin.bottom-2, item.y));
  }
  return sorted;
}

// Draw lines
series.forEach((s,si)=>{
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  const pts = s.pts;
  if(pts.length<2) return;

  const pathD = pts.map((p,i)=>`${i===0?"M":"L"} ${xScale(p.year)} ${yScale(p.value)}`).join(" ");

  const line = mkEl("path",{d:pathD,stroke:s.color,"stroke-width":"1.5",fill:"none","stroke-linejoin":"round","stroke-linecap":"round"});
  g.appendChild(line);

  // Invisible wide hit path
  const hit = mkEl("path",{d:pathD,stroke:"transparent","stroke-width":"12",fill:"none"});
  g.appendChild(hit);

  const tip = document.getElementById("tip");

  hit.addEventListener("mousemove",e=>{
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0,Math.min(1,(mx-margin.left)/(W-margin.left-margin.right)));
    const yr = yearMin + Math.round(ratio*(yearMax-yearMin));
    const closest = pts.reduce((best,p)=>Math.abs(p.year-yr)<Math.abs(best.year-yr)?p:best, pts[0]);
    tip.textContent = `${s.name}: ${closest.value.toFixed(1)}M arrivals (${closest.year})`;
    tip.style.opacity="1";
    tip.style.left=(e.clientX+12)+"px";
    tip.style.top=(e.clientY-20)+"px";
    groups.forEach((gg,gi)=>{ gg.style.opacity = gi===si?"1":"0.1"; });
    line.setAttribute("stroke-width","2.5");
  });
  hit.addEventListener("mouseleave",()=>{
    tip.style.opacity="0";
    groups.forEach(gg=>{ gg.style.opacity="1"; });
    line.setAttribute("stroke-width","1.5");
  });

  svg.appendChild(g);
  groups.push(g);
});

// Endpoint labels (2019 for most, last available)
const labelItems = series.map(s=>{
  const last2019 = s.pts.find(p=>p.year===2019) || s.pts[s.pts.length-1];
  return {y:yScale(last2019.value), name:s.name, value:last2019.value, color:s.color};
});

const resolved = resolveCollisions(labelItems.map(item=>({...item})), 13);

resolved.forEach((item,i)=>{
  const origY = yScale(labelItems[i].value);
  const labelX = W - margin.right + 6;
  // Leader line if displaced
  if(Math.abs(item.y - origY) > 2){
    svg.appendChild(mkEl("line",{x1:W-margin.right,y1:origY,x2:labelX-2,y2:item.y,stroke:item.color,opacity:"0.4","stroke-width":"0.7"}));
  }
  const t = mkEl("text",{x:labelX,y:item.y+3.5,"font-family":"JetBrains Mono, monospace","font-size":"9","fill":item.color,"font-weight":"500"});
  t.textContent=`${item.value.toFixed(0)}M ${item.name}`;
  svg.appendChild(t);
});

// Y axis label
const yLabel = mkEl("text",{x:margin.left-30,y:margin.top-8,"font-family":"Inter, sans-serif","font-size":"9","fill":"#7A786F","font-weight":"400"});
yLabel.textContent="Arrivals";
svg.appendChild(yLabel);
</script>

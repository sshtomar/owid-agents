      background: #0f172a; color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 4px; white-space: nowrap;
      transition: opacity 0.1s; z-index: 100; font-family: 'JetBrains Mono', monospace;

<body>

  <div id="tip"></div>

019,"v":34.3},{"y":2020,"v":35.8},{"y":2021,"v":36.6},{"y":2022,"v":34.3},{"y":2023,"v":33.4},{"y":2024,"v":35.0}]},{"n":"Brazil","pts":[{"y":1980,"v":17.7},{"y":1981,"v":19.0},{"y":1982,"v":15.9},{"y":1983,"v":14.3},{"y":1984,"v":17.5},{"y":1985,"v":20.2},{"y":1986,"v":17.9},{"y":1987,"v":22.7},{"y":1988,"v":25.7},{"y":1989,"v":35.8},{"y":1990,"v":19.0},{"y":1991,"v":18.7},{"y":1992,"v":20.2},{"y":1993,"v":20.3},{"y":1994,"v":19.1},{"y":1995,"v":14.4},{"y":1996,"v":14.0},{"y":1997,"v":13.7},{"y":1998,"v":13.9},{"y":1999,"v":12.7},{"y":2000,"v":14.0},{"y":2001,"v":13.6},{"y":2002,"v":15.4},{"y":2003,"v":16.4},{"y":2004,"v":18.9},{"y":2005,"v":18.1},{"y":2006,"v":18.4},{"y":2007,"v":19.3},{"y":2008,"v":19.2},{"y":2009,"v":16.4},{"y":2010,"v":17.8},{"y":2011,"v":18.6},{"y":2012,"v":17.7},{"y":2013,"v":18.2},{"y":2014,"v":16.1},{"y":2015,"v":14.5},{"y":2016,"v":13.4},{"y":2017,"v":13.6},{"y":2018,"v":12.7},{"y":2019,"v":12.3},{"y":2020,"v":14.8},{"y":2021,"v":17.2},{"y":2022,"v":15.9},{"y":2023,"v":15.0},{"y":2024,"v":14.1}]},{"n":"Greece","pts":[{"y":1980,"v":27.6},{"y":1981,"v":24.9},{"y":1982,"v":25.8},{"y":1983,"v":24.1},{"y":1984,"v":24.9},{"y":1985,"v":25.0},{"y":1986,"v":25.4},{"y":1987,"v":21.8},{"y":1988,"v":23.4},{"y":1989,"v":22.0},{"y":1990,"v":21.7},{"y":1991,"v":24.2},{"y":1992,"v":23.1},{"y":1993,"v":22.2},{"y":1994,"v":22.9},{"y":1995,"v":21.5},{"y":1996,"v":21.2},{"y":1997,"v":22.1},{"y":1999,"v":17.8},{"y":2000,"v":20.2},{"y":2001,"v":19.4},{"y":2002,"v":17.7},{"y":2003,"v":18.7},{"y":2004,"v":18.0},{"y":2005,"v":16.0},{"y":2006,"v":16.3},{"y":2007,"v":13.6},{"y":2008,"v":11.3},{"y":2009,"v":7.2},{"y":2010,"v":7.7},{"y":2011,"v":4.9},{"y":2012,"v":7.5},{"y":2013,"v":10.1},{"y":2014,"v":10.4},{"y":2015,"v":10.1},{"y":2016,"v":9.7},{"y":2017,"v":9.1},{"y":2018,"v":9.0},{"y":2019,"v":9.5},{"y":2020,"v":5.5},{"y":2021,"v":9.9},{"y":2022,"v":7.7},{"y":2023,"v":9.1},{"y":2024,"v":10.8}]}];

    const COLORS = {
      "China": "#E63946",
      "India": "#F4A261",
      "Korea, Rep.": "#2A9D8F",
      "Germany": "#457B9D",
      "Japan": "#6A4C93",
      "Brazil": "#1D3557",
      "Greece": "#A8DADC"
    };
    const DISPLAY = {
      "Korea, Rep.": "South Korea"
    };

    const W = 820, H = 460;
    const M = { top: 36, right: 130, bottom: 36, left: 48 };

    const allPts = data.flatMap(s => s.pts);
    const yearMin = Math.min(...allPts.map(p => p.y));
    const yearMax = Math.max(...allPts.map(p => p.y));
    const valMin = 0;
    const valMax = 56;

    const xS = y => M.left + (y - yearMin) / (yearMax - yearMin) * (W - M.left - M.right);
    const yS = v => M.top + (valMax - v) / (valMax - valMin) * (H - M.top - M.bottom);

    function mkEl(tag, attrs, text) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text != null) el.textContent = text;
      return el;
    }

    const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:820px;display:block" });

    // Grid lines
    [0, 10, 20, 30, 40, 50].forEach(v => {
      svg.appendChild(mkEl("line", { x1: M.left, y1: yS(v), x2: W - M.right, y2: yS(v), stroke: "#e2e8f0", "stroke-width": "1" }));
      svg.appendChild(mkEl("text", { x: M.left - 6, y: yS(v) + 4, "text-anchor": "end", fill: "#94a3b8", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, v + "%"));
    });

    // X axis ticks
    [1980, 1990, 2000, 2010, 2020].forEach(y => {
      svg.appendChild(mkEl("line", { x1: xS(y), y1: M.top, x2: xS(y), y2: H - M.bottom, stroke: "#f1f5f9", "stroke-width": "1" }));
      svg.appendChild(mkEl("text", { x: xS(y), y: H - M.bottom + 14, "text-anchor": "middle", fill: "#94a3b8", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, y));
    });

    // Build endpoint label positions
    const endLabels = data.map(s => {
      const last = s.pts[s.pts.length - 1];
      return { s, y: yS(last.v), orig: yS(last.v) };
    });

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      // Clamp within chart bounds
      for (const item of sorted) {
        item.y = Math.max(M.top + 6, Math.min(H - M.bottom - 6, item.y));
      }
      return sorted;
    }

    const resolved = resolveCollisions(endLabels, 13);

    const tip = document.getElementById("tip");
    const groups = [];

    data.forEach(s => {
      const color = COLORS[s.name] || "#888";
      const g = mkEl("g", {});

      // Line path
      const validPts = s.pts;
      const pathD = validPts.map((p, i) => `${i === 0 ? "M" : "L"}${xS(p.y).toFixed(1)},${yS(p.v).toFixed(1)}`).join(" ");

      const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "2", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
      g.appendChild(line);

      // Hit area
      const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "14", fill: "none", cursor: "pointer" });
      g.appendChild(hit);

      // Endpoint label
      const labelEntry = resolved.find(e => e.s === s);
      const labelY = labelEntry ? labelEntry.y : yS(s.pts[s.pts.length - 1].v);
      const last = s.pts[s.pts.length - 1];
      const displayName = DISPLAY[s.n] || s.n;

      // Leader line from actual endpoint to label
      const actualY = yS(last.v);
      if (Math.abs(actualY - labelY) > 3) {
        svg.appendChild(mkEl("line", {
          x1: xS(last.y) + 4, y1: actualY,
          x2: W - M.right + 4, y2: labelY,
          stroke: color, "stroke-width": "0.8", opacity: "0.4"
        }));
      }

      const labelText = mkEl("text", {
        x: W - M.right + 8, y: labelY + 3.5,
        fill: color, "font-size": "9.5", "font-family": "JetBrains Mono, monospace", "font-weight": "500"
      }, `${last.v}%  ${displayName}`);
      svg.appendChild(labelText);

      hit.addEventListener("mousemove", e => {
        groups.forEach(gg => gg.setAttribute("opacity", "0.12"));
        g.setAttribute("opacity", "1");
        line.setAttribute("stroke-width", "3");

        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - M.left) / (W - M.left - M.right)));
        const hoverYear = yearMin + ratio * (yearMax - yearMin);
        const closest = validPts.reduce((a, b) => Math.abs(b.y - hoverYear) < Math.abs(a.y - hoverYear) ? b : a);
        tip.textContent = `${displayName}: ${closest.v}% (${closest.y})`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });

      hit.addEventListener("mouseleave", () => {
        groups.forEach(gg => gg.setAttribute("opacity", "1"));
        line.setAttribute("stroke-width", "2");
        tip.style.opacity = "0";
      });

      groups.push(g);
    });

    groups.forEach(g => svg.appendChild(g));

    // Y axis label
    svg.appendChild(mkEl("text", {
      x: M.left - 38, y: M.top - 12,
      fill: "#64748b", "font-size": "10", "font-family": "Inter, sans-serif"
    }, "% of GDP"));

    document.getElementById("chart").appendChild(svg);
  </script>

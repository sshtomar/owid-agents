<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Universal Health Coverage: Progress Over Two Decades</h1>
<p class="subtitle">UHC Service Coverage Index (0–100) comparing early 2000s to 2022–2023. Nepal, Rwanda and India show the steepest gains; Norway and Cuba lead overall.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: WHO Global Health Observatory — UHC Service Coverage Index (SDG 3.8.1)</p>
<script>
const data = [{"n":"Norway","a":76,"b":89},{"n":"Cuba","a":74,"b":86},{"n":"China","a":65,"b":85},{"n":"Brazil","a":70,"b":84},{"n":"Costa Rica","a":76,"b":84},{"n":"Chile","a":67,"b":82},{"n":"Cape Verde","a":49,"b":71},{"n":"India","a":36,"b":69},{"n":"Bhutan","a":46,"b":69},{"n":"Rwanda","a":21,"b":58},{"n":"Nepal","a":18,"b":58},{"n":"Uganda","a":25,"b":52},{"n":"Ethiopia","a":13,"b":33},{"n":"Madagascar","a":15,"b":34},{"n":"Niger","a":18,"b":37}];

const W = 700, H = 580;
const pad = { left: 120, right: 130, top: 50, bottom: 20 };

const allVals = data.flatMap(d => [d.a, d.b]);
const minV = Math.min(...allVals) - 3;
const maxV = Math.max(...allVals) + 3;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const xL = pad.left;
const xR = W - pad.right;

function colorForChange(d) {
  const ch = d.b - d.a;
  if (ch >= 35) return "#3D7A5A";
  if (ch >= 25) return "#5B9E78";
  if (ch >= 15) return "#8BAD72";
  if (ch >= 10) return "#C49A45";
  return "#C4715A";
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // Clamp to bounds
  const topBound = pad.top - 4;
  const bottomBound = H - pad.bottom + 4;
  for (const item of sorted) {
    item.y = Math.max(topBound, Math.min(bottomBound, item.y));
  }
  return sorted;
}

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

// Column headers
const yearL = "~2000–2003";
const yearR = "~2019–2023";
[{x: xL, txt: yearL, anchor: "middle"}, {x: xR, txt: yearR, anchor: "middle"}].forEach(({x, txt, anchor}) => {
  const t = mkEl("text", {x, y: 30, "text-anchor": anchor, fill: "#7A786F",
    "font-family": "'JetBrains Mono', monospace", "font-size": "9", "letter-spacing": "0.3"});
  t.textContent = txt.toUpperCase();
  svg.appendChild(t);
});

// Axis lines
[xL, xR].forEach(x => {
  svg.appendChild(mkEl("line", {x1: x, y1: pad.top - 8, x2: x, y2: H - pad.bottom + 8,
    stroke: "#C2C0B5", "stroke-width": "0.5"}));
});

// Grid lines
[20, 30, 40, 50, 60, 70, 80, 90].forEach(v => {
  if (v < minV || v > maxV) return;
  svg.appendChild(mkEl("line", {x1: xL, y1: scale(v), x2: xR, y2: scale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"}));
  const t = mkEl("text", {x: xR + 8, y: scale(v) + 3, fill: "#C2C0B5",
    "font-family": "'JetBrains Mono', monospace", "font-size": "8"});
  t.textContent = v;
  svg.appendChild(t);
});

// Left labels: resolved
const leftItems = data.map(d => ({ d, y: scale(d.a) }));
resolveCollisions(leftItems, 13);

// Right labels: resolved
const rightItems = data.map(d => ({ d, y: scale(d.b) }));
resolveCollisions(rightItems, 13);

const leftMap = new Map(leftItems.map(it => [it.d.n, it.y]));
const rightMap = new Map(rightItems.map(it => [it.d.n, it.y]));

const tip = document.getElementById("tip");
const groups = [];

data.forEach(d => {
  const color = colorForChange(d);
  const ya = scale(d.a);
  const yb = scale(d.b);
  const lyL = leftMap.get(d.n);
  const lyR = rightMap.get(d.n);

  const g = mkEl("g", {});
  svg.appendChild(g);
  groups.push(g);

  // Connecting line
  const line = mkEl("line", { x1: xL, y1: ya, x2: xR, y2: yb,
    stroke: color, "stroke-width": "1.5", opacity: "0.85" });
  g.appendChild(line);

  // Dots
  [{ x: xL, y: ya }, { x: xR, y: yb }].forEach(({x, y}) => {
    g.appendChild(mkEl("circle", { cx: x, cy: y, r: "3", fill: color }));
  });

  // Leader lines (left)
  if (Math.abs(lyL - ya) > 1) {
    g.appendChild(mkEl("line", { x1: xL - 4, y1: ya, x2: xL - 4, y2: lyL,
      stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
  }
  // Leader lines (right)
  if (Math.abs(lyR - yb) > 1) {
    g.appendChild(mkEl("line", { x1: xR + 4, y1: yb, x2: xR + 4, y2: lyR,
      stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
  }

  // Left label
  const tL = mkEl("text", { x: xL - 8, y: lyL + 3.5, "text-anchor": "end", fill: "#2B2A27",
    "font-size": "9.5", "font-weight": "500" });
  tL.textContent = `${d.n}  ${d.a}`;
  g.appendChild(tL);

  // Right label
  const tR = mkEl("text", { x: xR + 8, y: lyR + 3.5, fill: "#2B2A27", "font-size": "9.5", "font-weight": "500" });
  tR.textContent = `${d.b}  ${d.n}`;
  g.appendChild(tR);

  // Invisible hit target
  const hit = mkEl("line", { x1: xL, y1: ya, x2: xR, y2: yb,
    stroke: "transparent", "stroke-width": "12" });
  g.appendChild(hit);

  hit.addEventListener("mouseenter", e => {
    groups.forEach(g2 => g2.style.opacity = "0.1");
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "2.5");
    const ch = d.b - d.a;
    tip.textContent = `${d.n}: ${d.a} → ${d.b}  (+${ch})`;
    tip.style.opacity = "1";
  });
  hit.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(g2 => g2.style.opacity = "1");
    line.setAttribute("stroke-width", "1.5");
    tip.style.opacity = "0";
  });
});

// Legend
const legendItems = [
  { color: "#3D7A5A", label: "35+ point gain" },
  { color: "#5B9E78", label: "25–34 point gain" },
  { color: "#8BAD72", label: "15–24 point gain" },
  { color: "#C49A45", label: "10–14 point gain" },
  { color: "#C4715A", label: "<10 point gain" }
];
const lx = xL + 10, ly = H - 12;
legendItems.forEach((item, i) => {
  const ox = i * 115;
  const r = mkEl("rect", { x: lx + ox, y: ly - 7, width: 8, height: 8, fill: item.color });
  svg.appendChild(r);
  const t = mkEl("text", { x: lx + ox + 11, y: ly, fill: "#7A786F", "font-size": "8.5" });
  t.textContent = item.label;
  svg.appendChild(t);
});
</script>
</body></html>

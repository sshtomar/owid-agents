<h1>Population Growth Rate, 1961–2024</h1>

,3.24,3.06,2.97,2.9,2.84,2.75,2.73,2.76,2.88,3.01,3.14,3.15,3.09,3.1,3.07,3.05,3.02,3.03,3.02,2.9,2.75,2.61,2.47,2.34,2.23,2.21,2.17,2.03,1.96,1.96,1.9,1.92,1.98,1.96],"y0":1961,"step":1},{"n":"Brazil","s":[3.02,2.98,2.95,2.89,2.82,2.73,2.64,2.56,2.51,2.47,2.45,2.43,2.42,2.4,2.38,2.38,2.39,2.39,2.38,2.36,2.33,2.28,2.23,2.19,2.13,2.06,1.98,1.91,1.84,1.79,1.72,1.67,1.62,1.56,1.54,1.51,1.49,1.49,1.46,1.38,1.3,1.24,1.18,1.13,1.1,1.06,1.01,0.96,0.9,0.84,0.81,0.81,0.81,0.81,0.79,0.76,0.73,0.68,0.65,0.58,0.43,0.36,0.4,0.41],"y0":1961,"step":1},{"n":"Iran","s":[3.01,3.04,3.07,3.11,3.14,3.12,3.05,2.99,3.0,3.04,2.99,2.93,2.93,2.96,3.02,3.01,3.1,3.27,3.44,3.62,5.25,5.29,3.89,3.76,3.67,3.69,3.58,3.23,2.92,2.91,2.72,1.98,0.36,0.19,1.11,1.08,1.2,1.37,1.42,1.48,1.54,0.83,1.11,2.14,2.21,2.15,1.64,1.21,1.24,1.25,1.24,1.25,1.31,1.34,1.36,1.43,1.44,1.28,1.08,0.77,0.83,1.2,1.2,1.05],"y0":1961,"step":1},{"n":"Indonesia","s":[2.79,2.81,2.83,2.86,2.53,2.37,2.6,2.71,2.76,2.75,2.71,2.66,2.63,2.57,2.53,2.49,2.46,2.44,2.42,2.39,2.35,2.31,2.28,2.23,2.14,2.02,1.94,1.91,1.87,1.81,1.77,1.73,1.7,1.69,1.66,1.65,1.63,1.58,1.5,1.43,1.39,1.36,1.32,1.27,1.28,1.33,1.32,1.3,1.27,1.26,1.28,1.29,1.24,1.18,1.12,1.07,1.02,0.97,0.94,0.85,0.7,0.75,0.84,0.81],"y0":1961,"step":1},{"n":"Bangladesh","s":[2.82,2.9,2.91,2.92,2.92,2.91,2.94,2.94,2.84,2.59,1.75,1.92,2.86,2.83,2.62,2.54,2.49,2.44,2.41,2.39,2.56,2.74,2.68,2.57,2.46,2.35,2.24,2.13,2.05,1.99,1.91,1.88,1.86,1.85,1.86,1.83,1.85,1.89,1.9,1.83,1.67,1.54,1.46,1.36,1.26,1.16,1.08,1.0,0.93,0.88,0.91,0.96,0.94,0.91,0.89,0.89,0.85,0.82,0.85,0.84,0.81,1.02,1.22,1.21],"y0":1961,"step":1},{"n":"France","s":[1.03,1.0,1.0,1.07,0.96,0.87,0.81,0.77,0.82,0.91,0.94,0.88,0.81,0.66,0.48,0.42,0.47,0.45,0.45,0.53,0.59,0.37,0.54,0.49,0.5,0.51,0.54,0.58,0.6,0.55,0.5,0.5,0.43,0.37,0.36,0.36,0.36,0.37,0.52,0.69,0.73,0.73,0.71,0.73,0.75,0.7,0.62,0.56,0.51,0.49,0.48,0.48,0.52,0.47,0.36,0.26,0.29,0.36,0.33,0.32,0.36,0.5,0.28,0.26],"y0":1961,"step":1}];

const W = 760, H = 440;
const margin = { top: 40, right: 140, bottom: 36, left: 50 };

function colorByLatest(v) {
  if (v < 0) return "#A6C4A2";
  if (v < 0.5) return "#C2C0B5";
  if (v < 1.2) return "#F5D38A";
  if (v < 2.0) return "#F29A44";
  return "#EA5E33";
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const tip = document.getElementById("tip");

// Compute global value range (exclude Iran's 1980 spike for axis)
let allVals = data.flatMap(d => d.s);
const valMin = -1.0, valMax = 5.5;
const yearMin = 1961, yearMax = 2024;

const xS = year => margin.left + (year - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yS = val => margin.top + (valMax - Math.max(valMin, Math.min(valMax, val))) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[-1, 0, 1, 2, 3, 4, 5].forEach(v => {
  if (v < valMin || v > valMax) return;
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yS(v), x2: W - margin.right, y2: yS(v), stroke: v === 0 ? "#C2C0B5" : "#E2E0D5", "stroke-width": v === 0 ? "1" : "0.5" }));
  svg.appendChild(mkEl("text", { x: margin.left - 6, y: yS(v) + 3.5, "text-anchor": "end", "font-size": "9", "font-family": "'JetBrains Mono', monospace", fill: "#7A786F" })).textContent = v + "%";
});

// X axis ticks
[1970, 1980, 1990, 2000, 2010, 2020].forEach(y => {
  svg.appendChild(mkEl("text", { x: xS(y), y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "9", "font-family": "'JetBrains Mono', monospace", fill: "#7A786F" })).textContent = y;
});

// 0% reference label
svg.appendChild(mkEl("text", { x: W - margin.right + 4, y: yS(0) + 3.5, "font-size": "9", "font-family": "'JetBrains Mono', monospace", fill: "#C2C0B5" })).textContent = "0%";

// Resolve endpoint label collisions
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const groups = [];

data.forEach((series, si) => {
  const latestVal = series.s[series.s.length - 1];
  const color = colorByLatest(latestVal);
  const pts = series.s.map((v, i) => ({ year: series.y0 + i * series.step, value: v }));

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xS(p.year)} ${yS(p.value)}`).join(" ");
  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
  g.appendChild(line);

  // Invisible hit area
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(hit);

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const idx = Math.round(ratio * (pts.length - 1));
    const pt = pts[idx];
    if (!pt) return;
    tip.textContent = `${series.n} · ${pt.year}: ${pt.value.toFixed(2)}%`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
    groups.forEach((gg, gi) => { gg.g.style.opacity = gi === si ? "1" : "0.1"; });
    gg.line.setAttribute("stroke-width", "2.5");
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach(gg => { gg.g.style.opacity = "1"; gg.line.setAttribute("stroke-width", "1.5"); });
  });

  const endPt = pts[pts.length - 1];
  groups.push({ g, line, endY: yS(endPt.value), name: series.n, val: latestVal });
  svg.appendChild(g);
});

// Endpoint labels with collision resolution
const labelItems = groups.map(gg => ({ ...gg, y: gg.endY }));
resolveCollisions(labelItems, 12);

const rightX = W - margin.right + 8;
labelItems.forEach(item => {
  // Leader line if displaced
  const origY = item.endY;
  const clampedY = Math.max(margin.top + 6, Math.min(H - margin.bottom - 6, item.y));
  if (Math.abs(clampedY - origY) > 2) {
    item.g.appendChild(mkEl("line", { x1: W - margin.right, y1: origY, x2: rightX + 2, y2: clampedY, stroke: "#C2C0B5", "stroke-width": "0.7" }));
  }
  const t = mkEl("text", { x: rightX, y: clampedY + 3.5, "font-size": "9", "font-family": "'Inter', sans-serif", "font-weight": "500", fill: "#2B2A27" });
  t.textContent = `${item.val.toFixed(2)}  ${item.name}`;
  item.g.appendChild(t);
});
</script>

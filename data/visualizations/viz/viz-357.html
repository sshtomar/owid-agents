<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>International Tourist Arrivals by Top Destination, 1995–2020</h1>
<p class="subtitle">Annual tourist arrivals (millions) for top destination countries. The 2020 COVID-19 pandemic caused the sharpest collapse in global tourism ever recorded.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank · International tourism, number of arrivals (ST.INT.ARVL)</p>
<script>
const data = [
  {"n":"France","s":[null,148.26,157.55,null,null,null,null,null,null,190.28,185.83,193.88,193.32,193.57,192.37,189.83,196.59,197.52,204.41,206.6,203.3,203.04,207.27,212.0,217.88,117.11],"y0":1995},
  {"n":"Croatia","s":[16.1,19.09,23.66,25.5,29.21,37.23,40.13,41.74,42.86,44.97,45.76,47.73,52.27,51.34,47.57,49.01,49.97,47.19,48.34,51.17,55.86,57.59,59.24,57.67,60.02,21.61],"y0":1995},
  {"n":"Hungary","s":[39.24,39.83,37.31,33.62,28.8,31.14,30.68,31.74,31.41,33.93,36.17,38.32,39.38,39.55,40.62,39.9,41.3,43.56,43.61,45.98,48.34,52.89,54.96,57.67,61.4,31.64],"y0":1995},
  {"n":"Austria","s":[17.17,17.09,16.65,17.35,17.47,17.98,18.18,18.61,19.08,19.37,19.95,20.27,20.77,21.93,21.36,22.0,23.01,24.15,24.81,25.29,26.73,28.12,29.46,30.82,31.88,15.09],"y0":1995},
  {"n":"Italy","s":[55.71,59.8,58.0,58.5,59.52,62.7,60.96,63.56,63.03,58.48,59.23,66.35,70.27,70.72,71.69,73.22,75.87,76.29,76.76,77.69,81.07,84.92,89.93,93.23,95.4,38.42],"y0":1995},
  {"n":"Germany","s":[14.85,15.21,15.84,16.51,17.12,18.98,17.86,17.97,18.4,20.14,21.5,23.57,24.42,24.88,24.22,26.88,28.37,30.41,31.55,33.0,34.97,35.55,37.45,38.88,39.56,12.45],"y0":1995},
  {"n":"Greece","s":[10.71,9.78,10.59,11.36,12.61,13.57,14.68,14.92,14.79,14.27,15.94,17.28,null,null,null,null,null,null,20.11,24.27,26.11,28.07,30.16,33.07,34.01,7.41],"y0":1995},
  {"n":"Japan","s":[3.35,3.84,4.22,4.11,4.44,4.76,4.77,5.24,5.21,6.14,6.73,7.33,8.35,8.35,6.79,8.61,6.22,8.36,10.36,13.41,19.74,24.04,28.69,31.19,31.88,4.12],"y0":1995},
  {"n":"South Korea","s":[3.75,3.68,3.91,4.25,4.66,5.32,5.15,5.35,4.75,5.82,6.02,6.16,6.45,6.89,7.82,8.8,9.79,11.14,12.18,14.2,13.23,17.24,13.34,15.35,17.5,2.52],"y0":1995},
  {"n":"Indonesia","s":[4.32,5.03,5.18,4.61,4.73,5.06,5.15,5.03,4.47,5.32,5.0,4.87,5.51,6.23,6.32,7.0,7.65,8.04,8.8,9.44,10.41,11.52,14.04,15.81,16.11,4.05],"y0":1995}
];

const COLORS = ["#EA5E33","#F29A44","#5B9E78","#8BAD72","#3D7A5A","#C49A45","#C4715A","#B34B3B","#7A786F","#4A7FA5"];

const W = 780, H = 440;
const margin = { top: 30, right: 115, bottom: 36, left: 52 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

const years = Array.from({length: 26}, (_, i) => 1995 + i);
const allVals = data.flatMap(d => d.s.filter(v => v !== null));
const valMax = Math.ceil(Math.max(...allVals) / 50) * 50;
const valMin = 0;

const xScale = yr => margin.left + (yr - 1995) / 25 * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[0, 50, 100, 150, 200].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3,
    "font-family": "JetBrains Mono, monospace", "font-size": "9",
    "text-anchor": "end", fill: "#7A786F"
  }, v === 0 ? "0" : v + "M"));
});

// COVID band
const covidX = xScale(2019.5);
const covidW = xScale(2021) - covidX;
svg.appendChild(mkEl("rect", {
  x: covidX, y: margin.top,
  width: covidW, height: H - margin.top - margin.bottom,
  fill: "#EA5E33", opacity: "0.06"
}));
svg.appendChild(mkEl("text", {
  x: covidX + covidW / 2, y: margin.top + 12,
  "font-family": "JetBrains Mono, monospace", "font-size": "8",
  "text-anchor": "middle", fill: "#EA5E33"
}, "COVID-19"));

// X axis labels
[1995, 2000, 2005, 2010, 2015, 2020].forEach(yr => {
  svg.appendChild(mkEl("text", {
    x: xScale(yr), y: H - margin.bottom + 14,
    "font-family": "JetBrains Mono, monospace", "font-size": "9",
    "text-anchor": "middle", fill: "#7A786F"
  }, yr.toString()));
});

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 22) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

const groups = [];
data.forEach((d, di) => {
  const color = COLORS[di % COLORS.length];
  const g = mkEl("g", {});

  // Build path segments (handle nulls)
  let pathD = "";
  let inSeg = false;
  d.s.forEach((v, i) => {
    if (v === null) { inSeg = false; return; }
    const x = xScale(1995 + i), y = yScale(v);
    if (!inSeg) { pathD += `M ${x} ${y}`; inSeg = true; }
    else { pathD += ` L ${x} ${y}`; }
  });

  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
  g.appendChild(line);

  // Invisible hit path
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(hit);

  // Endpoint label
  const lastIdx = d.s.reduceRight((acc, v, i) => acc === -1 && v !== null ? i : acc, -1);
  const lastVal = d.s[lastIdx];
  const labelY = yScale(lastVal);
  const label = mkEl("text", {
    x: xScale(1995 + lastIdx) + 5, y: labelY + 4,
    "font-family": "JetBrains Mono, monospace", "font-size": "8.5",
    fill: color
  }, `${lastVal}M  ${d.n}`);
  g.appendChild(label);

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const rawIdx = Math.round(ratio * 25);
    const v = d.s[rawIdx];
    const yr = 1995 + rawIdx;
    if (v !== null) showTip(`${d.n} (${yr}): ${v.toFixed(1)}M arrivals`, e);
  });
  hit.addEventListener("mouseenter", () => {
    groups.forEach(og => { og.style.opacity = "0.1"; });
    g.style.opacity = "1";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(og => { og.style.opacity = "1"; });
    hideTip();
  });

  groups.push(g);
  svg.appendChild(g);
});

// Resolve endpoint label collisions
const labelEls = [];
groups.forEach((g, i) => {
  const lbl = g.querySelector("text");
  const lastIdx = data[i].s.reduceRight((acc, v, idx) => acc === -1 && v !== null ? idx : acc, -1);
  const lastVal = data[i].s[lastIdx];
  labelEls.push({ el: lbl, y: yScale(lastVal) });
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        const newPrev = Math.max(margin.top + 6, sorted[i - 1].y - shift);
        const newCurr = Math.min(H - margin.bottom - 4, sorted[i].y + shift);
        sorted[i - 1].y = newPrev;
        sorted[i].y = newCurr;
        moved = true;
      }
    }
    if (!moved) break;
  }
  sorted.forEach(item => item.el.setAttribute("y", item.y + 4));
}

resolveCollisions(labelEls, 12);

</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }

  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }

<h1>Solar Electricity Generation, 2000–2024</h1>
<p class="subtitle">Annual solar power output (TWh) for the top 10 producing countries. China's output grew 8,000-fold over 22 years, now exceeding the next nine countries combined.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: Ember Climate — ember--GEN-SOLAR</p>
<script>
const data = [{"n":"China","pts":[{"y":2002,"v":0.1},{"y":2003,"v":0.1},{"y":2004,"v":0.1},{"y":2005,"v":0.1},{"y":2006,"v":0.1},{"y":2007,"v":0.1},{"y":2008,"v":0.1},{"y":2009,"v":0.3},{"y":2010,"v":0.7},{"y":2011,"v":2.6},{"y":2012,"v":3.6},{"y":2013,"v":8.4},{"y":2014,"v":23.5},{"y":2015,"v":39.5},{"y":2016,"v":66.5},{"y":2017,"v":117.8},{"y":2018,"v":176.9},{"y":2019,"v":224},{"y":2020,"v":261.1},{"y":2021,"v":327},{"y":2022,"v":427.3},{"y":2023,"v":584.1},{"y":2024,"v":839.0}]},{"n":"United States of America","pts":[{"y":2000,"v":0.5},{"y":2001,"v":0.5},{"y":2002,"v":0.6},{"y":2003,"v":0.5},{"y":2004,"v":0.6},{"y":2005,"v":0.6},{"y":2006,"v":0.5},{"y":2007,"v":0.6},{"y":2008,"v":0.9},{"y":2009,"v":0.9},{"y":2010,"v":1.2},{"y":2011,"v":1.8},{"y":2012,"v":4.3},{"y":2013,"v":9.0},{"y":2014,"v":28.9},{"y":2015,"v":39.0},{"y":2016,"v":54.9},{"y":2017,"v":77.3},{"y":2018,"v":93.4},{"y":2019,"v":106.9},{"y":2020,"v":130.7},{"y":2021,"v":164.4},{"y":2022,"v":205.1},{"y":2023,"v":238.9},{"y":2024,"v":303.8}]},{"n":"India","pts":[{"y":2007,"v":0.1},{"y":2008,"v":0.1},{"y":2009,"v":0.1},{"y":2010,"v":0.1},{"y":2011,"v":0.8},{"y":2012,"v":2.1},{"y":2013,"v":3.4},{"y":2014,"v":4.9},{"y":2015,"v":7.1},{"y":2016,"v":12.2},{"y":2017,"v":22.4},{"y":2018,"v":37.5},{"y":2019,"v":37.5},{"y":2020,"v":52.9},{"y":2021,"v":65.6},{"y":2022,"v":95.9},{"y":2023,"v":115.4},{"y":2024,"v":143.1}]},{"n":"Japan","pts":[{"y":2000,"v":0.3},{"y":2001,"v":0.5},{"y":2002,"v":0.7},{"y":2003,"v":0.9},{"y":2004,"v":1.3},{"y":2005,"v":1.6},{"y":2006,"v":2},{"y":2007,"v":2.3},{"y":2008,"v":2.6},{"y":2009,"v":3.0},{"y":2010,"v":4.0},{"y":2011,"v":5.4},{"y":2012,"v":7.4},{"y":2013,"v":12.9},{"y":2014,"v":23.6},{"y":2015,"v":34.5},{"y":2016,"v":43.3},{"y":2017,"v":54.0},{"y":2018,"v":61.2},{"y":2019,"v":67.4},{"y":2020,"v":75.9},{"y":2021,"v":84.2},{"y":2022,"v":91.1},{"y":2023,"v":96.4},{"y":2024,"v":96.7}]},{"n":"Germany","pts":[{"y":2001,"v":0.1},{"y":2002,"v":0.2},{"y":2003,"v":0.3},{"y":2004,"v":0.6},{"y":2005,"v":1.3},{"y":2006,"v":2.3},{"y":2007,"v":3.1},{"y":2008,"v":4.5},{"y":2009,"v":6.7},{"y":2010,"v":12.0},{"y":2011,"v":20.0},{"y":2012,"v":26.7},{"y":2013,"v":30.6},{"y":2014,"v":35.5},{"y":2015,"v":38.1},{"y":2016,"v":37.6},{"y":2017,"v":38.8},{"y":2018,"v":44.3},{"y":2019,"v":45.2},{"y":2020,"v":49.5},{"y":2021,"v":49.3},{"y":2022,"v":60.3},{"y":2023,"v":63.9},{"y":2024,"v":74.1}]},{"n":"Brazil","pts":[{"y":2015,"v":0.1},{"y":2016,"v":0.1},{"y":2017,"v":0.8},{"y":2018,"v":3.5},{"y":2019,"v":6.7},{"y":2020,"v":10.8},{"y":2021,"v":16.8},{"y":2022,"v":30.1},{"y":2023,"v":50.6},{"y":2024,"v":71.3}]},{"n":"Spain","pts":[{"y":2005,"v":0.1},{"y":2006,"v":0.1},{"y":2007,"v":0.5},{"y":2008,"v":2.6},{"y":2009,"v":6.1},{"y":2010,"v":7.2},{"y":2011,"v":9.4},{"y":2012,"v":12.0},{"y":2013,"v":13.1},{"y":2014,"v":13.7},{"y":2015,"v":13.9},{"y":2016,"v":13.6},{"y":2017,"v":14.4},{"y":2018,"v":12.7},{"y":2019,"v":15.1},{"y":2020,"v":20.7},{"y":2021,"v":27.1},{"y":2022,"v":35.7},{"y":2023,"v":48.6},{"y":2024,"v":58.3}]},{"n":"Australia","pts":[{"y":2000,"v":0.1},{"y":2001,"v":0.1},{"y":2002,"v":0.1},{"y":2003,"v":0.1},{"y":2004,"v":0.1},{"y":2005,"v":0.1},{"y":2006,"v":0.1},{"y":2007,"v":0.1},{"y":2008,"v":0.1},{"y":2009,"v":0.3},{"y":2010,"v":1.0},{"y":2011,"v":2.0},{"y":2012,"v":2.4},{"y":2013,"v":3.9},{"y":2014,"v":5.0},{"y":2015,"v":6.2},{"y":2016,"v":7.4},{"y":2017,"v":8.9},{"y":2018,"v":12.3},{"y":2019,"v":18.3},{"y":2020,"v":23.8},{"y":2021,"v":31.2},{"y":2022,"v":37.5},{"y":2023,"v":45.0},{"y":2024,"v":50.2}]},{"n":"Italy","pts":[{"y":2008,"v":0.2},{"y":2009,"v":0.7},{"y":2010,"v":1.9},{"y":2011,"v":10.8},{"y":2012,"v":18.9},{"y":2013,"v":21.6},{"y":2014,"v":22.3},{"y":2015,"v":22.9},{"y":2016,"v":22.1},{"y":2017,"v":24.4},{"y":2018,"v":22.6},{"y":2019,"v":23.7},{"y":2020,"v":24.9},{"y":2021,"v":25.0},{"y":2022,"v":28.1},{"y":2023,"v":30.7},{"y":2024,"v":36.0}]},{"n":"South Korea","pts":[{"y":2007,"v":0.1},{"y":2008,"v":0.3},{"y":2009,"v":0.6},{"y":2010,"v":0.8},{"y":2011,"v":0.9},{"y":2012,"v":1.1},{"y":2013,"v":1.7},{"y":2014,"v":2.7},{"y":2015,"v":4.2},{"y":2016,"v":5.5},{"y":2017,"v":7.7},{"y":2018,"v":10.2},{"y":2019,"v":14.2},{"y":2020,"v":19.3},{"y":2021,"v":24.7},{"y":2022,"v":30.7},{"y":2023,"v":33.2},{"y":2024,"v":32.7}]}];

const COLORS = ["#EA5E33","#3D7A5A","#C49A45","#B34B3B","#5B9E78","#F29A44","#8BAD72","#A6C4A2","#7A786F","#9A9890"];
const W = 800, H = 460;
const margin = { top: 30, right: 145, bottom: 30, left: 55 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const yearMin = 2000, yearMax = 2024;
const valMin = 0, valMax = 850;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[0, 200, 400, 600, 800].forEach(v => {
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  svg.appendChild(mkEl("text", { x: margin.left - 6, y: yScale(v) + 3, "text-anchor": "end", fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" })).textContent = v === 0 ? "0" : v + " TWh";
});

// X axis ticks
[2000, 2005, 2010, 2015, 2020, 2024].forEach(y => {
  svg.appendChild(mkEl("text", { x: xScale(y), y: H - margin.bottom + 14, "text-anchor": "middle", fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" })).textContent = y;
});

// Resolve label collisions
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

// Build line groups
const groups = [];
data.forEach((series, idx) => {
  const color = COLORS[idx];
  const pts = series.pts;
  if (pts.length < 2) return;

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");

  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  g.appendChild(line);

  const hitPath = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(hitPath);

  const lastPt = pts[pts.length - 1];
  groups.push({ g, line, hitPath, color, series, idx, labelY: yScale(lastPt.v), lastPt });
  svg.appendChild(g);
});

// Endpoint labels with collision resolution
const labelItems = groups.map(g => ({ ...g, y: g.labelY }));
resolveCollisions(labelItems, 12);

labelItems.forEach(item => {
  const { series, color, lastPt } = item;
  const lx = xScale(lastPt.y) + 6;
  const ly = item.y;
  const lbl = mkEl("text", { x: lx, y: ly + 3.5, fill: color, "font-size": "9", "font-weight": "500" });
  lbl.textContent = `${lastPt.v}  ${series.n === "United States of America" ? "USA" : series.n === "South Korea" ? "S. Korea" : series.n}`;
  svg.appendChild(lbl);

  // Faint leader if label moved
  const origY = item.labelY;
  if (Math.abs(ly - origY) > 2) {
    svg.appendChild(mkEl("line", { x1: xScale(lastPt.y) + 2, y1: origY, x2: xScale(lastPt.y) + 4, y2: ly, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
  }
});

// Interactivity
const tip = document.getElementById("tip");
groups.forEach(({ hitPath, line, series, color }) => {
  hitPath.addEventListener("mousemove", e => {
    groups.forEach(g => { g.line.setAttribute("stroke-width", "0.8"); g.line.style.opacity = "0.15"; });
    line.setAttribute("stroke-width", "3");
    line.style.opacity = "1";

    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const year = Math.round(yearMin + ratio * (yearMax - yearMin));
    const closest = series.pts.reduce((a, b) => Math.abs(b.y - year) < Math.abs(a.y - year) ? b : a);
    const name = series.n === "United States of America" ? "USA" : series.n;
    tip.textContent = `${name} · ${closest.y}: ${closest.v} TWh`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 28) + "px";
  });
  hitPath.addEventListener("mouseleave", () => {
    groups.forEach(g => { g.line.setAttribute("stroke-width", "1.5"); g.line.style.opacity = "1"; });
    tip.style.opacity = "0";
  });
});
</script>

const COLORS = {
  'Japan':   '#B34B3B',
  'Germany': '#C4715A',
  'Korea':   '#C49A45',
  'China':   '#F29A44',
  'Brazil':  '#8BAD72',
  'India':   '#5B9E78',
  'Ethiopia':'#3D7A5A',
  'Canada':  '#7A9BB5'
};

const W = 740, H = 460;
const mar = { top: 36, right: 118, bottom: 32, left: 46 };

const allYears = data.flatMap(d => d.pts.map(p => p.y));
const allVals  = data.flatMap(d => d.pts.map(p => p.v));
const yMin = -0.6, yMax = 4.0;
const xMin = 1970, xMax = 2024;

const xS = y => mar.left + (y - xMin) / (xMax - xMin) * (W - mar.left - mar.right);
const yS = v => mar.top + (yMax - v) / (yMax - yMin) * (H - mar.top - mar.bottom);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

// Grid lines
[-0.5, 0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: mar.left, y1: yS(v), x2: W - mar.right, y2: yS(v),
    stroke: v === 0 ? "#C2C0B5" : "#E2E0D5",
    "stroke-width": v === 0 ? "1" : "0.5",
    "stroke-dasharray": v === 0 ? "none" : "none"
  }));
  svg.appendChild(mkEl("text", {
    x: mar.left - 6, y: yS(v) + 3.5,
    "text-anchor": "end", fill: "#9A9890",
    "font-family": "JetBrains Mono, monospace", "font-size": "9"
  })).textContent = v === 0 ? "0%" : v.toFixed(1) + "%";
});

// Zero line label
const zeroLbl = mkEl("text", {
  x: W - mar.right + 2, y: yS(0) + 3.5,
  fill: "#9A9890", "font-size": "8", "font-family": "JetBrains Mono, monospace"
});
zeroLbl.textContent = "0%";
svg.appendChild(zeroLbl);

// X-axis labels
[1970, 1980, 1990, 2000, 2010, 2020].forEach(yr => {
  svg.appendChild(mkEl("text", {
    x: xS(yr), y: H - mar.bottom + 14,
    "text-anchor": "middle", fill: "#9A9890",
    "font-family": "JetBrains Mono, monospace", "font-size": "9"
  })).textContent = yr;
});

// Tooltip
const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 26) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

// All line groups
const groups = [];
data.forEach(series => {
  const color = COLORS[series.n] || "#888";
  const g = mkEl("g", {});

  const pathPts = series.pts.map(p => `${xS(p.y)},${yS(p.v)}`).join(" L ");
  const line = mkEl("path", {
    d: "M " + pathPts, stroke: color, "stroke-width": "1.8",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  g.appendChild(line);

  // Hit area
  const hit = mkEl("path", {
    d: "M " + pathPts, stroke: "transparent", "stroke-width": "12", fill: "none"
  });
  g.appendChild(hit);

  svg.appendChild(g);
  groups.push({ g, line, series, color });
});

// Endpoint labels (right side) with collision resolution
const endLabels = groups.map(({ series, color }) => {
  const last = series.pts[series.pts.length - 1];
  return { n: series.n, y: yS(last.v), origY: yS(last.v), color };
});

const resolved = resolveCollisions(endLabels.map(l => ({...l})), 12);
resolved.forEach(lbl => {
  const origLbl = endLabels.find(l => l.n === lbl.n);
  const needsLeader = Math.abs(lbl.y - origLbl.origY) > 4;
  if (needsLeader) {
    svg.appendChild(mkEl("line", {
      x1: W - mar.right + 2, y1: origLbl.origY,
      x2: W - mar.right + 8, y2: lbl.y,
      stroke: lbl.color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
  const t = mkEl("text", {
    x: W - mar.right + 10, y: lbl.y + 3.5,
    fill: lbl.color, "font-size": "9.5", "font-weight": "500"
  });
  t.textContent = lbl.n;
  svg.appendChild(t);
});

// Interactivity
groups.forEach(({ g, line, series, color }) => {
  const hitPath = g.children[1];
  hitPath.addEventListener("mouseenter", e => {
    groups.forEach(other => {
      other.g.style.opacity = other.series.n === series.n ? "1" : "0.1";
      other.line.setAttribute("stroke-width", other.series.n === series.n ? "2.5" : "1.8");
    });
    const last = series.pts[series.pts.length - 1];
    showTip(`${series.n}: ${last.v > 0 ? "+" : ""}${last.v.toFixed(2)}% (2024)`, e);
  });
  hitPath.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - mar.left) / (W - mar.left - mar.right)));
    const yr = Math.round(xMin + ratio * (xMax - xMin));
    const closest = series.pts.reduce((best, p) =>
      Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best
    );
    showTip(`${series.n} ${closest.y}: ${closest.v > 0 ? "+" : ""}${closest.v.toFixed(2)}%`, e);
  });
  hitPath.addEventListener("mouseleave", () => {
    groups.forEach(other => {
      other.g.style.opacity = "1";
      other.line.setAttribute("stroke-width", "1.8");
    });
    hideTip();
  });
});

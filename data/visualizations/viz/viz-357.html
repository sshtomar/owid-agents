<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>The Age Divide: Old-Age Dependency Ratios Since 1980</h1>
<p class="subtitle">Number of people aged 65+ per 100 working-age adults (15–64). Japan's ratio has nearly quadrupled since 1980 while much of Africa and South Asia remain young.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Age dependency ratio, old (% of working-age population)</p>
<script>
// Data exported from notebook — do not modify
const data = [{"n":"Japan","s":[13.44,13.8,14.16,14.44,14.81,15.23,15.58,15.95,16.35,16.84,17.42,18.07,18.78,19.51,20.25,21.03,21.88,22.79,23.7,24.61,25.58,26.62,27.63,28.52,29.49,30.75,32.1,33.39,34.65,35.69,36.36,37.51,39.35,41.32,43.13,44.7,46.03,47.09,47.91,48.52,49.13,49.74,50.06,50.28],"y0":1980},{"n":"South Korea","s":[6.16,6.23,6.34,6.39,6.41,6.47,6.58,6.68,6.8,6.93,7.05,7.21,7.4,7.62,7.86,8.11,8.35,8.65,8.99,9.38,9.86,10.37,10.9,11.44,12.0,12.54,13.11,13.68,14.19,14.65,15.14,15.58,16.01,16.52,17.09,17.68,18.24,18.98,19.85,20.77,21.96,23.29,24.59,25.94],"y0":1980},{"n":"Italy","s":[20.48,20.35,20.1,19.67,19.33,19.48,19.91,20.38,20.89,21.35,21.82,22.25,22.71,23.23,24.39,24.93,24.88,25.44,25.94,26.44,26.98,27.53,28.08,28.55,29.06,29.64,30.21,30.57,30.72,30.94,31.23,31.68,32.29,32.94,33.65,34.28,34.79,35.22,35.65,36.17,36.65,37.13,37.58,38.06],"y0":1980},{"n":"Germany","s":[23.65,22.97,22.14,21.35,20.89,20.92,21.14,21.35,21.48,21.49,21.53,21.65,21.75,21.93,22.23,22.53,22.75,22.92,23.2,23.65,24.25,24.91,25.59,26.34,27.27,28.3,29.41,30.28,30.8,31.23,31.28,31.14,31.28,31.56,31.82,32.03,32.25,32.63,33.01,33.42,33.92,34.58,35.3,36.01],"y0":1980},{"n":"France","s":[21.86,21.24,20.56,19.99,19.56,19.59,19.95,20.27,20.58,20.88,21.22,21.62,21.99,22.35,22.72,23.1,23.46,23.79,24.1,24.37,24.6,24.8,24.95,25.04,25.16,25.27,25.26,25.29,25.46,25.7,25.94,26.48,27.32,28.18,29.06,29.97,30.79,31.52,32.23,32.93,33.56,34.12,34.71,35.38],"y0":1980},{"n":"China","s":[7.39,7.43,7.48,7.52,7.54,7.58,7.65,7.72,7.81,7.95,8.12,8.27,8.45,8.66,8.88,9.1,9.32,9.52,9.76,10.02,10.25,10.46,10.62,10.77,10.89,10.99,11.13,11.31,11.48,11.66,11.89,12.17,12.52,12.93,13.42,14.04,14.73,15.54,16.42,17.29,18.22,19.08,19.95,20.72],"y0":1980},{"n":"Brazil","s":[6.06,6.11,6.16,6.22,6.28,6.34,6.42,6.5,6.6,6.71,6.82,6.94,7.05,7.17,7.28,7.4,7.52,7.63,7.74,7.84,7.93,8.04,8.15,8.28,8.44,8.61,8.79,9.0,9.22,9.46,9.71,9.99,10.29,10.63,11.01,11.43,11.86,12.32,12.81,13.31,13.78,14.24,14.74,15.32],"y0":1980},{"n":"India","s":[7.02,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.05,7.07,7.09,7.12,7.16,7.19,7.23,7.26,7.31,7.35,7.39,7.44,7.49,7.53,7.57,7.6,7.63,7.66,7.7,7.75,7.82,7.9,7.99,8.13,8.33,8.55,8.78,9.03,9.3,9.54,9.69,9.88,10.18],"y0":1980},{"n":"Ethiopia","s":[5.49,5.49,5.49,5.44,5.36,5.3,5.27,5.28,5.32,5.35,5.36,5.39,5.41,5.4,5.39,5.34,5.28,5.27,5.27,5.27,5.27,5.28,5.27,5.27,5.27,5.28,5.28,5.28,5.29,5.3,5.32,5.35,5.38,5.4,5.42,5.41,5.39,5.39,5.4,5.42,5.43,5.44,5.47,5.52],"y0":1980}];

const W = 760, H = 460;
const margin = { top: 36, right: 130, bottom: 36, left: 48 };

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 28) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

const Y0 = data[0].y0;
const nYears = data[0].s.length;
const yearMax = Y0 + nYears - 1;

const allVals = data.flatMap(d => d.s.filter(v => v != null));
const valMin = 0, valMax = 55;

const xScale = y => margin.left + (y - Y0) / (nYears - 1) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Color by 2023 value
function colorForVal(v) {
  if (v >= 40) return "#EA5E33";
  if (v >= 25) return "#F29A44";
  if (v >= 15) return "#C49A45";
  if (v >= 10) return "#8BAD72";
  return "#5B9E78";
}

// Grid lines
[0, 10, 20, 30, 40, 50].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v),
    x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3.5,
    fill: "#7A786F", "font-size": "9", "text-anchor": "end",
    "font-family": "'JetBrains Mono', monospace"
  })).textContent = v + "%";
});

// X axis ticks
[1980, 1990, 2000, 2010, 2020, 2023].forEach(y => {
  svg.appendChild(mkEl("line", {
    x1: xScale(y), y1: margin.top,
    x2: xScale(y), y2: H - margin.bottom + 4,
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    fill: "#7A786F", "font-size": "9", "text-anchor": "middle",
    "font-family": "'JetBrains Mono', monospace"
  })).textContent = y;
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // Clamp to bounds
  for (const item of sorted) {
    item.y = Math.max(margin.top + 6, Math.min(H - margin.bottom - 6, item.y));
  }
  return sorted;
}

// Build label positions
const labelItems = data.map(d => ({
  d,
  y: yScale(d.s[nYears - 1]),
  anchor: d.s[nYears - 1]
}));
resolveCollisions(labelItems, 13);

const groups = [];
data.forEach((series, idx) => {
  const color = colorForVal(series.s[nYears - 1]);
  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  // Build path
  const pts = series.s.map((v, i) => [xScale(Y0 + i), yScale(v)]);
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");

  const line = mkEl("path", {
    d: pathD, stroke: color, "stroke-width": "1.5",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  g.appendChild(line);

  // Invisible wide hit path
  const hit = mkEl("path", {
    d: pathD, stroke: "transparent", "stroke-width": "14",
    fill: "none", "pointer-events": "stroke"
  });
  g.appendChild(hit);

  // Endpoint dot
  const lastPt = pts[nYears - 1];
  const dot = mkEl("circle", {
    cx: lastPt[0], cy: lastPt[1], r: "2.5",
    fill: color
  });
  g.appendChild(dot);

  svg.appendChild(g);
  groups.push({ g, line, color, series });
});

// Labels after all lines (so they render on top)
labelItems.forEach(item => {
  const endVal = item.d.s[nYears - 1];
  const color = colorForVal(endVal);
  const lx = xScale(Y0 + nYears - 1) + 8;
  const rawY = yScale(endVal);

  // Leader line if label was moved
  if (Math.abs(item.y - rawY) > 3) {
    svg.appendChild(mkEl("line", {
      x1: xScale(Y0 + nYears - 1) + 2, y1: rawY,
      x2: lx + 2, y2: item.y,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }

  const txt = mkEl("text", {
    x: lx, y: item.y + 3.5,
    fill: "#2B2A27", "font-size": "9.5", "text-anchor": "start",
    "font-weight": "500"
  });
  txt.textContent = `${endVal.toFixed(1)}  ${item.d.n}`;
  svg.appendChild(txt);
});

// Interactivity
groups.forEach(({ g, line, color, series }) => {
  const hit = g.querySelectorAll("path")[1];
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const svgX = mx / rect.width * W;
    const ratio = (svgX - margin.left) / (W - margin.left - margin.right);
    const idx = Math.max(0, Math.min(nYears - 1, Math.round(ratio * (nYears - 1))));
    const year = Y0 + idx;
    const val = series.s[idx];
    showTip(`${series.n} (${year}): ${val !== null ? val.toFixed(1) + "%" : "n/a"}`, e);
    groups.forEach(other => {
      other.line.style.opacity = other.series === series ? "1" : "0.08";
      other.line.style.strokeWidth = other.series === series ? "2.5" : "1.5";
    });
  });
  hit.addEventListener("mouseout", () => {
    hideTip();
    groups.forEach(other => {
      other.line.style.opacity = "1";
      other.line.style.strokeWidth = "1.5";
    });
  });
});
</script>
</body></html>

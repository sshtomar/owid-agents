<h1>The Aging World: Old-Age Dependency Ratios, 1960–2024</h1>
<p class="subtitle">Older dependents (65+) per 100 working-age people (15–64). Japan has surged from 9 in 1960 to 51 today — while sub-Saharan Africa remains young.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Age dependency ratio, old (SP.POP.DPND.OL)</p>
<script>
const data = [{"n":"Japan","s":[8.91,8.99,9.01,9.04,9.11,9.23,9.41,9.62,9.8,9.98,10.14,10.35,10.68,11.0,11.3,11.61,11.96,12.33,12.72,13.09,13.44,13.8,14.16,14.44,14.81,15.23,15.58,15.95,16.35,16.84,17.42,18.07,18.78,19.51,20.25,21.03,21.88,22.79,23.7,24.61,25.58,26.62,27.63,28.52,29.49,30.75,32.1,33.39,34.65,35.69,36.36,37.51,39.35,41.32,43.13,44.7,46.03,47.09,47.91,48.52,49.13,49.74,50.06,50.28,50.66],"y0":1960},{"n":"Germany","s":[17.07,17.54,18.02,18.43,18.89,19.33,19.82,20.44,20.95,21.25,21.63,22.03,22.34,22.63,22.96,23.3,23.53,23.74,23.91,23.93,23.65,22.97,22.14,21.35,20.89,20.92,21.14,21.35,21.48,21.49,21.53,21.65,21.75,21.93,22.23,22.53,22.75,22.92,23.2,23.65,24.25,24.91,25.59,26.34,27.27,28.3,29.41,30.28,30.8,31.23,31.28,31.14,31.28,31.56,31.82,32.03,32.25,32.63,33.01,33.42,33.92,34.58,35.3,36.01,36.88],"y0":1960},{"n":"Italy","s":[14.52,14.77,14.95,15.08,15.26,15.52,15.81,16.14,16.46,16.79,17.2,17.65,18.05,18.4,18.78,19.13,19.45,19.77,20.11,20.41,20.48,20.35,20.1,19.67,19.33,19.48,19.91,20.38,20.89,21.35,21.82,22.25,22.71,23.23,24.39,24.93,24.88,25.44,25.94,26.44,26.98,27.53,28.08,28.55,29.06,29.64,30.21,30.57,30.72,30.94,31.23,31.68,32.29,32.94,33.65,34.28,34.79,35.22,35.65,36.17,36.65,37.13,37.58,38.06,38.79],"y0":1960},{"n":"France","s":[18.57,18.73,18.9,19.01,19.18,19.42,19.7,20.03,20.29,20.47,20.64,20.81,20.98,21.15,21.32,21.51,21.64,21.77,21.94,22.06,21.86,21.24,20.56,19.99,19.56,19.59,19.95,20.27,20.58,20.88,21.22,21.62,21.99,22.35,22.72,23.1,23.46,23.79,24.1,24.37,24.6,24.8,24.95,25.04,25.16,25.27,25.26,25.29,25.46,25.7,25.94,26.48,27.32,28.18,29.06,29.97,30.79,31.52,32.23,32.93,33.56,34.12,34.71,35.38,36.1],"y0":1960},{"n":"Korea, Rep.","s":[5.63,5.75,5.89,6.02,6.08,6.13,6.15,6.16,6.18,6.16,6.16,6.22,6.27,6.28,6.28,6.23,6.19,6.16,6.14,6.14,6.16,6.23,6.34,6.39,6.41,6.47,6.58,6.68,6.8,6.93,7.05,7.21,7.4,7.62,7.86,8.11,8.35,8.65,8.99,9.38,9.86,10.37,10.9,11.44,12.0,12.54,13.11,13.68,14.19,14.65,15.14,15.58,16.01,16.52,17.09,17.68,18.24,18.98,19.85,20.77,21.96,23.29,24.59,25.94,27.47],"y0":1960},{"n":"China","s":[7.12,6.91,6.8,6.75,6.69,6.64,6.62,6.61,6.62,6.65,6.68,6.72,6.76,6.81,6.94,7.08,7.21,7.29,7.3,7.33,7.39,7.43,7.48,7.52,7.54,7.58,7.65,7.72,7.81,7.95,8.12,8.27,8.45,8.66,8.88,9.1,9.32,9.52,9.76,10.02,10.25,10.46,10.62,10.77,10.89,10.99,11.13,11.31,11.48,11.66,11.89,12.17,12.52,12.93,13.42,14.04,14.73,15.54,16.42,17.29,18.22,19.08,19.95,20.72,21.15],"y0":1960},{"n":"India","s":[5.88,5.98,6.12,6.28,6.4,6.48,6.54,6.56,6.58,6.62,6.66,6.71,6.77,6.84,6.89,6.93,6.97,6.99,7.0,7.01,7.02,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.03,7.05,7.07,7.09,7.12,7.16,7.19,7.23,7.26,7.31,7.35,7.39,7.44,7.49,7.53,7.57,7.6,7.63,7.66,7.7,7.75,7.82,7.9,7.99,8.13,8.33,8.55,8.78,9.03,9.3,9.54,9.69,9.88,10.18,10.47],"y0":1960},{"n":"Brazil","s":[4.74,4.82,4.9,4.98,5.05,5.12,5.19,5.25,5.31,5.38,5.44,5.5,5.56,5.63,5.69,5.76,5.83,5.89,5.95,6.01,6.06,6.11,6.16,6.22,6.28,6.34,6.42,6.5,6.6,6.71,6.82,6.94,7.05,7.17,7.28,7.4,7.52,7.63,7.74,7.84,7.93,8.04,8.15,8.28,8.44,8.61,8.79,9.0,9.22,9.46,9.71,9.99,10.29,10.63,11.01,11.43,11.86,12.32,12.81,13.31,13.78,14.24,14.74,15.32,15.95],"y0":1960},{"n":"Chad","s":[7.23,7.26,7.3,7.35,7.39,7.4,7.41,7.41,7.41,7.4,7.4,7.4,7.4,7.39,7.39,7.39,7.4,7.42,7.45,7.45,7.61,7.78,7.54,7.3,7.37,7.46,7.39,7.27,7.15,7.05,6.99,6.86,6.69,6.66,6.63,6.45,6.28,6.19,6.08,5.96,5.84,5.73,5.62,5.47,5.3,5.15,5.02,4.89,4.77,4.66,4.56,4.46,4.36,4.26,4.2,4.17,4.15,4.13,4.12,4.11,4.1,4.07,4.07,4.05,4.05],"y0":1960}];

const COLORS = {
  "Japan": "#EA5E33",
  "Korea, Rep.": "#F29A44",
  "Italy": "#C4715A",
  "Germany": "#8BAD72",
  "France": "#5B9E78",
  "China": "#8B89CC",
  "Brazil": "#C49A45",
  "India": "#9A9890",
  "Chad": "#A6C4A2"
};

const W = 820, H = 480;
const margin = { top: 40, right: 130, bottom: 40, left: 55 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

const yearMin = 1960, yearMax = 2024;
const valMin = 0, valMax = 55;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[0, 10, 20, 30, 40, 50].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v),
    x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 4,
    "text-anchor": "end",
    "font-family": "'JetBrains Mono', monospace",
    "font-size": "9",
    fill: "#7A786F"
  }, v));
});

// X-axis ticks
[1960, 1970, 1980, 1990, 2000, 2010, 2020].forEach(y => {
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 16,
    "text-anchor": "middle",
    "font-family": "'JetBrains Mono', monospace",
    "font-size": "9",
    fill: "#7A786F"
  }, y));
});

// Axis label
svg.appendChild(mkEl("text", {
  x: margin.left - 40, y: margin.top - 14,
  "font-family": "'JetBrains Mono', monospace",
  "font-size": "9",
  fill: "#7A786F"
}, "older dependents per 100 workers"));

// Build groups and collect endpoint positions
const groups = [];
data.forEach(series => {
  const color = COLORS[series.n] || "#7A786F";
  const pts = series.s.map((v, i) => ({ year: series.y0 + i, value: v }));
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.year).toFixed(1)} ${yScale(p.value).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  groups.push({ series, color, pts, pathD, endX: xScale(last.year), endY: yScale(last.value), endVal: last.value });
});

// Resolve endpoint label collisions
const labelItems = groups.map(g => ({ y: g.endY, ref: g }));
labelItems.sort((a, b) => a.y - b.y);
function resolveCollisions(items, minGap) {
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < items.length; i++) {
      const gap = items[i].y - items[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        items[i - 1].y -= shift;
        items[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // Clamp to chart bounds
  items.forEach(item => {
    item.y = Math.max(margin.top + 8, Math.min(H - margin.bottom - 4, item.y));
  });
  return items;
}
resolveCollisions(labelItems, 13);

// Render lines + hit areas
const lineEls = {};
groups.forEach((g, gi) => {
  const grp = mkEl("g", {});
  const line = mkEl("path", {
    d: g.pathD, stroke: g.color, "stroke-width": "1.8",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  const hit = mkEl("path", {
    d: g.pathD, stroke: "transparent", "stroke-width": "12",
    fill: "none", cursor: "pointer"
  });
  grp.appendChild(line);
  grp.appendChild(hit);
  lineEls[gi] = { grp, line };
  svg.appendChild(grp);

  const tip = document.getElementById("tip");

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const totalYears = yearMax - yearMin;
    const year = Math.round(yearMin + ratio * totalYears);
    const idx = year - g.series.y0;
    const val = g.series.s[Math.max(0, Math.min(g.series.s.length - 1, idx))];
    tip.textContent = `${g.series.n} (${year}): ${val.toFixed(1)} per 100`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
    // Highlight
    Object.values(lineEls).forEach((el, i) => {
      el.line.style.opacity = i === gi ? "1" : "0.1";
      el.line.setAttribute("stroke-width", i === gi ? "3" : "1.8");
    });
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    Object.values(lineEls).forEach(el => {
      el.line.style.opacity = "1";
      el.line.setAttribute("stroke-width", "1.8");
    });
  });
});

// Render endpoint labels (collision-resolved)
labelItems.forEach(item => {
  const g = item.ref;
  const labelX = g.endX + 6;
  const labelY = item.y;
  // Leader line if label moved significantly from endpoint
  if (Math.abs(labelY - g.endY) > 2) {
    svg.appendChild(mkEl("line", {
      x1: g.endX, y1: g.endY,
      x2: labelX - 1, y2: labelY,
      stroke: g.color, "stroke-width": "0.6", opacity: "0.5"
    }));
  }
  svg.appendChild(mkEl("text", {
    x: labelX + 2, y: labelY + 3.5,
    "font-size": "9", "font-weight": "500",
    fill: g.color
  }, `${g.endVal.toFixed(1)}  ${g.series.n}`));
});
</script>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>International Tourism Arrivals, 2005-2020</h1>
<p class="subtitle">Annual international tourist arrivals for the world's top destinations. The 2020 COVID-19 pandemic caused the sharpest single-year collapse in global tourism on record.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank (ST.INT.ARVL) &mdash; International tourism, number of arrivals</p>
<script>
// Data from notebook -- do not modify
const data = [{"n":"France","s":[185.83,193.88,193.32,193.57,192.37,189.83,196.59,197.52,204.41,206.6,203.3,203.04,207.27,212.0,217.88,117.11],"y0":2005,"step":1},{"n":"China","s":[120.29,124.94,131.87,130.03,126.48,133.76,135.42,132.41,129.08,128.5,133.82,141.77,153.26,158.61,162.54,30.4],"y0":2005,"step":1},{"n":"Italy","s":[59.23,66.35,70.27,70.72,71.69,73.22,75.87,76.29,76.76,77.69,81.07,84.92,89.93,93.23,95.4,38.42],"y0":2005,"step":1},{"n":"Germany","s":[21.5,23.57,24.42,24.88,24.22,26.88,28.37,30.41,31.55,33.0,34.97,35.55,37.45,38.88,39.56,12.45],"y0":2005,"step":1},{"n":"Austria","s":[19.95,20.27,20.77,21.93,21.36,22.0,23.01,24.15,24.81,25.29,26.73,28.12,29.46,30.82,31.88,15.09],"y0":2005,"step":1},{"n":"Japan","s":[6.73,7.33,8.35,8.35,6.79,8.61,6.22,8.36,10.36,13.41,19.74,24.04,28.69,31.19,31.88,4.12],"y0":2005,"step":1}];

const COLORS = ["#EA5E33","#2B2A27","#5B9E78","#F29A44","#7A786F","#3D7A5A"];
const W = 720, H = 400;
const margin = { top: 36, right: 90, bottom: 36, left: 56 };

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 28) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.display = "block";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const yearMin = 2005, yearMax = 2020;
const allVals = data.flatMap(d => d.s.filter(v => v !== null));
const valMin = 0, valMax = Math.ceil(Math.max(...allVals) / 50) * 50;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[50, 100, 150, 200].forEach(v => {
  if (v <= valMax) {
    svg.appendChild(mkEl("line", {
      x1: margin.left, y1: yScale(v),
      x2: W - margin.right, y2: yScale(v),
      stroke: "#E2E0D5", "stroke-width": "0.5"
    }));
    const lbl = mkEl("text", {
      x: margin.left - 6, y: yScale(v) + 3.5,
      "text-anchor": "end", fill: "#9A9890",
      "font-family": "JetBrains Mono, monospace", "font-size": "8"
    });
    lbl.textContent = v + "M";
    svg.appendChild(lbl);
  }
});

// COVID annotation band
const covidX = xScale(2020);
svg.appendChild(mkEl("rect", {
  x: xScale(2019.5), y: margin.top,
  width: covidX - xScale(2019.5) + 10,
  height: H - margin.top - margin.bottom,
  fill: "#EA5E33", opacity: "0.06"
}));
const covidLbl = mkEl("text", {
  x: covidX + 3, y: margin.top + 12,
  fill: "#EA5E33", "font-size": "9", "font-weight": "600"
});
covidLbl.textContent = "COVID-19";
svg.appendChild(covidLbl);

// X-axis year labels
for (let y = 2005; y <= 2020; y += 5) {
  const lbl = mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    "text-anchor": "middle", fill: "#7A786F",
    "font-family": "JetBrains Mono, monospace", "font-size": "9"
  });
  lbl.textContent = y;
  svg.appendChild(lbl);
}
// Also label 2020
const lbl2020 = mkEl("text", {
  x: xScale(2020), y: H - margin.bottom + 14,
  "text-anchor": "middle", fill: "#EA5E33",
  "font-family": "JetBrains Mono, monospace", "font-size": "9", "font-weight": "600"
});
lbl2020.textContent = "2020";
svg.appendChild(lbl2020);

// Label collision resolver
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

// Build endpoint label positions
const endLabels = data.map((d, i) => {
  const lastVal = d.s[d.s.length - 1];
  return { name: d.n, val: lastVal, y: yScale(lastVal), idx: i };
});
const resolved = resolveCollisions(endLabels, 13);

const groups = [];

data.forEach((d, i) => {
  const color = COLORS[i % COLORS.length];
  const startYear = d.y0;
  const step = d.step;
  const pts = d.s.map((v, j) => ({ year: startYear + j * step, value: v }))
    .filter(p => p.value !== null);

  const pathD = pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.year)} ${yScale(p.value)}`).join(" ");

  const g = mkEl("g", {});

  const line = mkEl("path", {
    d: pathD, stroke: color, "stroke-width": "1.8",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  g.appendChild(line);

  // Invisible wide hit path
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(hit);

  // Dots at first and last
  [pts[0], pts[pts.length - 1]].forEach(p => {
    g.appendChild(mkEl("circle", { cx: xScale(p.year), cy: yScale(p.value), r: "3", fill: color }));
  });

  // Endpoint label
  const resolved_item = resolved.find(r => r.idx === i);
  const labelY = resolved_item ? resolved_item.y : yScale(d.s[d.s.length - 1]);
  const actualY = yScale(d.s[d.s.length - 1]);

  if (Math.abs(labelY - actualY) > 5) {
    g.appendChild(mkEl("line", {
      x1: xScale(2020), y1: actualY,
      x2: xScale(2020) + 6, y2: labelY,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text", {
    x: xScale(2020) + 8, y: labelY + 3.5,
    fill: color, "font-size": "9.5", "font-weight": "500"
  });
  lbl.textContent = d.n;
  g.appendChild(lbl);

  hit.addEventListener("mousemove", e => {
    groups.forEach((gg, j) => {
      gg.querySelector("path").style.opacity = j === i ? "1" : "0.1";
      gg.querySelector("path").setAttribute("stroke-width", j === i ? "2.5" : "1.5");
    });
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yearIdx = Math.min(Math.round(ratio * (d.s.length - 1)), d.s.length - 1);
    const year = d.y0 + yearIdx * d.step;
    const val = d.s[yearIdx];
    const drop = yearIdx > 0 ? ((d.s[yearIdx] - d.s[yearIdx - 1]) / d.s[yearIdx - 1] * 100).toFixed(1) : null;
    const dropStr = drop ? (drop < 0 ? ` (${drop}% vs prev yr)` : "") : "";
    showTip(`${d.n} · ${year}: ${val !== null ? val.toFixed(1) + "M arrivals" : "no data"}${dropStr}`, e);
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach((gg, j) => {
      gg.querySelector("path").style.opacity = "1";
      gg.querySelector("path").setAttribute("stroke-width", "1.8");
    });
    hideTip();
  });

  groups.push(g);
  svg.appendChild(g);
});
</script>
</body></html>

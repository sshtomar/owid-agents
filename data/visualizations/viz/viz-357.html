<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>International Tourism Arrivals, 1995–2020</h1>
<p class="subtitle">Visitor arrivals (millions) for nine major destinations. Decades of steady growth were erased in a single year as COVID-19 closed borders worldwide.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — International Tourism, Number of Arrivals (ST.INT.ARVL)</p>
<script>
const data = [{"n":"Austria","s":[17.17,17.09,16.65,17.35,17.47,17.98,18.18,18.61,19.08,19.37,19.95,20.27,20.77,21.93,21.36,22.0,23.01,24.15,24.81,25.29,26.73,28.12,29.46,30.82,31.88,15.09],"y0":1995},{"n":"Croatia","s":[16.1,19.09,23.66,25.5,29.21,37.23,40.13,41.74,42.86,44.97,45.76,47.73,52.27,51.34,47.57,49.01,49.97,47.19,48.34,51.17,55.86,57.59,59.24,57.67,60.02,21.61],"y0":1995},{"n":"Germany","s":[14.85,15.21,15.84,16.51,17.12,18.98,17.86,17.97,18.4,20.14,21.5,23.57,24.42,24.88,24.22,26.88,28.37,30.41,31.55,33.0,34.97,35.55,37.45,38.88,39.56,12.45],"y0":1995},{"n":"Greece","s":[10.71,9.78,10.59,11.36,12.61,13.57,14.68,14.92,14.79,14.27,15.94,17.28,null,null,null,null,null,null,20.11,24.27,26.11,28.07,30.16,33.07,34.01,7.41],"y0":1995},{"n":"India","s":[2.12,2.29,2.37,2.36,2.48,2.65,2.54,2.38,2.73,3.46,3.92,4.45,5.08,5.28,5.17,5.78,6.31,6.58,6.97,13.11,13.28,14.57,15.54,17.42,17.91,null],"y0":1995},{"n":"Indonesia","s":[4.32,5.03,5.18,4.61,4.73,5.06,5.15,5.03,4.47,5.32,5.0,4.87,5.51,6.23,6.32,7.0,7.65,8.04,8.8,9.44,10.41,11.52,14.04,15.81,16.11,4.05],"y0":1995},{"n":"Italy","s":[55.71,59.8,58.0,58.5,59.52,62.7,60.96,63.56,63.03,58.48,59.23,66.35,70.27,70.72,71.69,73.22,75.87,76.29,76.76,77.69,81.07,84.92,89.93,93.23,95.4,38.42],"y0":1995},{"n":"Japan","s":[3.35,3.84,4.22,4.11,4.44,4.76,4.77,5.24,5.21,6.14,6.73,7.33,8.35,8.35,6.79,8.61,6.22,8.36,10.36,13.41,19.74,24.04,28.69,31.19,31.88,4.12],"y0":1995},{"n":"S. Korea","s":[3.75,3.68,3.91,4.25,4.66,5.32,5.15,5.35,4.75,5.82,6.02,6.16,6.45,6.89,7.82,8.8,9.79,11.14,12.18,14.2,13.23,17.24,13.34,15.35,17.5,2.52],"y0":1995}];

const COLORS = {
  "Italy":    "#EA5E33",
  "Croatia":  "#F29A44",
  "Germany":  "#C49A45",
  "Greece":   "#8BAD72",
  "Japan":    "#3D7A5A",
  "Austria":  "#5B9E78",
  "S. Korea": "#6AB4C4",
  "Indonesia":"#A6C4A2",
  "India":    "#C4715A"
};

const W = 760, H = 440;
const margin = { top: 36, right: 110, bottom: 36, left: 52 };
const yearMin = 1995, yearMax = 2020;
const years = Array.from({length: 26}, (_, i) => 1995 + i);

// compute global value range
let valMin = Infinity, valMax = -Infinity;
data.forEach(s => s.s.forEach(v => { if (v !== null) { valMin = Math.min(valMin, v); valMax = Math.max(valMax, v); } }));
valMin = 0;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px;display:block;cursor:crosshair;` });
document.getElementById("chart").appendChild(svg);

// grid lines
[0, 20, 40, 60, 80, 100].forEach(v => {
  if (v > valMax) return;
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  svg.appendChild(mkEl("text", { x: margin.left - 6, y: yScale(v) + 3, "text-anchor": "end", fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" }, v + "M"));
});

// x-axis ticks
[1995, 2000, 2005, 2010, 2015, 2019, 2020].forEach(y => {
  svg.appendChild(mkEl("line", { x1: xScale(y), y1: H - margin.bottom, x2: xScale(y), y2: H - margin.bottom + 4, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  if ([1995, 2000, 2005, 2010, 2015, 2020].includes(y)) {
    svg.appendChild(mkEl("text", { x: xScale(y), y: H - margin.bottom + 13, "text-anchor": "middle", fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" }, y));
  }
});

// COVID annotation band
const covidX = xScale(2019.5);
svg.appendChild(mkEl("rect", { x: covidX, y: margin.top, width: xScale(2020) - covidX + 1, height: H - margin.top - margin.bottom, fill: "#EA5E33", opacity: "0.08" }));
svg.appendChild(mkEl("text", { x: xScale(2020) - 2, y: margin.top + 12, "text-anchor": "end", fill: "#EA5E33", "font-size": "8.5", "font-family": "JetBrains Mono, monospace", "font-weight": "500" }, "COVID-19"));

// Collision resolver
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
const groups = [];

// build label positions for right side
const labelItems = [];

data.forEach(series => {
  const color = COLORS[series.name] || COLORS[series.n] || "#7A786F";
  const pts = years.map((y, i) => ({ year: y, value: series.s[i] })).filter(p => p.value !== null);
  if (pts.length < 5) return;

  const g = mkEl("g");
  svg.appendChild(g);

  // build path segments (handle nulls)
  let pathD = "";
  let inSegment = false;
  years.forEach((y, i) => {
    const v = series.s[i];
    if (v === null) { inSegment = false; return; }
    const x = xScale(y), yy = yScale(v);
    pathD += (inSegment ? ` L ${x} ${yy}` : ` M ${x} ${yy}`);
    inSegment = true;
  });

  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
  g.appendChild(line);

  // invisible hit path
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", style: "cursor:pointer;" });
  g.appendChild(hit);

  // last non-null value for label
  const lastPt = pts[pts.length - 1];
  labelItems.push({ n: series.n, y: yScale(lastPt.value), color, lastVal: lastPt.value, lastYear: lastPt.year });

  groups.push({ g, line, hit, series: series, color, pts });
});

// resolve label collisions
const resolved = resolveCollisions(labelItems.map(l => ({ ...l })), 12);
resolved.forEach((item, idx) => {
  const orig = labelItems.find(l => l.n === item.n);
  const origY = yScale(orig.lastVal);
  // faint leader line if moved
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(mkEl("line", { x1: W - margin.right + 3, y1: origY, x2: W - margin.right + 6, y2: item.y, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  svg.appendChild(mkEl("text", {
    x: W - margin.right + 8, y: item.y + 3.5,
    fill: item.color, "font-size": "9", "font-weight": "600"
  }, item.n));
});

// interactivity
groups.forEach(({ g, line, hit, series: s, color, pts }) => {
  hit.addEventListener("mousemove", e => {
    // find nearest year
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
    const nearestPt = pts.reduce((best, p) => Math.abs(p.year - yr) < Math.abs(best.year - yr) ? p : best, pts[0]);

    tip.textContent = `${s.n}  ${nearestPt.year}: ${nearestPt.value.toFixed(1)}M arrivals`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";

    groups.forEach(({ line: l }) => l.setAttribute("opacity", "0.1"));
    line.setAttribute("opacity", "1");
    line.setAttribute("stroke-width", "2.8");
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach(({ line: l }) => { l.setAttribute("opacity", "1"); l.setAttribute("stroke-width", "1.8"); });
  });
});
</script>
</body></html>

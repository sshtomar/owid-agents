<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>The Aging World: Old-Age Dependency Ratios, 1990 vs 2023</h1>
<p class="subtitle">Number of people aged 65+ per 100 working-age people (15–64). Japan has tripled its ratio in three decades; South Korea and China are rapidly following.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Age Dependency Ratio, Old (SP.POP.DPND.OL)</p>
<script>
const data = [{"n":"Japan","year":1990,"a":17.4,"b":50.3},{"n":"Finland","year":1990,"a":19.9,"b":38.3},{"n":"Italy","year":1990,"a":21.8,"b":38.1},{"n":"Greece","year":1990,"a":20.4,"b":37.3},{"n":"Croatia","year":1990,"a":16.9,"b":36.2},{"n":"Germany","year":1990,"a":21.5,"b":36.0},{"n":"France","year":1990,"a":21.2,"b":35.4},{"n":"Bulgaria","year":1990,"a":19.8,"b":34.3},{"n":"Bosnia and Herzegovina","year":1990,"a":9.6,"b":33.2},{"n":"Estonia","year":1990,"a":17.6,"b":33.1},{"n":"Denmark","year":1990,"a":23.1,"b":32.4},{"n":"Czechia","year":1990,"a":19.0,"b":32.2},{"n":"Hungary","year":1990,"a":20.2,"b":32.2},{"n":"Hong Kong SAR, China","year":1990,"a":12.3,"b":32.0},{"n":"Canada","year":1990,"a":16.5,"b":29.6},{"n":"Australia","year":1990,"a":16.5,"b":26.9},{"n":"Korea, Rep.","year":1990,"a":7.1,"b":25.9},{"n":"China","year":1990,"a":8.1,"b":20.7},{"n":"Brazil","year":1990,"a":6.8,"b":15.3},{"n":"India","year":1990,"a":7.0,"b":10.2}];
function shortName(n) { return n.replace('Bosnia and Herzegovina','Bosnia & Herz.').replace('Korea, Rep.','Korea').replace('Hong Kong SAR, China','Hong Kong'); }

const W = 720, H = 600;
const pad = { left: 130, right: 140, top: 50, bottom: 20 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const allVals = data.flatMap(d => [d.a, d.b]);
const minV = 0, maxV = 55;
const scaleY = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
const xLeft = pad.left;
const xRight = W - pad.right;

// Grid lines
[0, 10, 20, 30, 40, 50].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: xLeft, y1: scaleY(v), x2: xRight, y2: scaleY(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: xLeft - 8, y: scaleY(v) + 3.5,
    "text-anchor": "end", fill: "#9A9890",
    "font-family": "JetBrains Mono, monospace", "font-size": "8"
  })).textContent = v;
});

// Axis lines
svg.appendChild(mkEl("line", { x1: xLeft, y1: pad.top, x2: xLeft, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.8" }));
svg.appendChild(mkEl("line", { x1: xRight, y1: pad.top, x2: xRight, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.8" }));

// Column headers
const hdr = mkEl("text", { x: xLeft, y: pad.top - 14, "text-anchor": "middle", fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-size": "10", "font-weight": "500" });
hdr.textContent = "1990";
svg.appendChild(hdr);
const hdr2 = mkEl("text", { x: xRight, y: pad.top - 14, "text-anchor": "middle", fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-size": "10", "font-weight": "500" });
hdr2.textContent = "2023";
svg.appendChild(hdr2);

// Color by change magnitude
function colorForChange(d) {
  const change = d.b - d.a;
  if (change > 30) return "#EA5E33";
  if (change > 20) return "#F29A44";
  if (change > 15) return "#C49A45";
  return "#8BAD72";
}

// Resolve label collisions
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // Clamp to chart bounds
  for (let i = 0; i < sorted.length; i++) {
    sorted[i].y = Math.max(pad.top + 4, Math.min(H - pad.bottom - 4, sorted[i].y));
  }
  return sorted;
}

// Prepare label positions
const leftLabels = data.map(d => ({ d, y: scaleY(d.a) }));
const rightLabels = data.map(d => ({ d, y: scaleY(d.b) }));
const resolvedLeft = resolveCollisions(leftLabels, 12);
const resolvedRight = resolveCollisions(rightLabels, 12);

const leftMap = new Map(resolvedLeft.map(l => [l.d.n, l.y]));
const rightMap = new Map(resolvedRight.map(l => [l.d.n, l.y]));

// Draw rows
const tip = document.getElementById("tip");
const groups = [];

data.forEach(d => {
  const color = colorForChange(d);
  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const y1 = scaleY(d.a), y2 = scaleY(d.b);

  // Connecting line
  const line = mkEl("line", {
    x1: xLeft, y1, x2: xRight, y2,
    stroke: color, "stroke-width": "1.5", opacity: "0.9"
  });
  g.appendChild(line);

  // Dots
  g.appendChild(mkEl("circle", { cx: xLeft, cy: y1, r: "3", fill: color }));
  g.appendChild(mkEl("circle", { cx: xRight, cy: y2, r: "3", fill: color }));

  // Hit area
  const hit = mkEl("line", {
    x1: xLeft, y1, x2: xRight, y2,
    stroke: "transparent", "stroke-width": "10"
  });
  g.appendChild(hit);

  // Left label (name + value)
  const lyL = leftMap.get(d.n);
  const leftTxt = mkEl("text", {
    x: xLeft - 8, y: lyL + 3.5,
    "text-anchor": "end", fill: "#2B2A27", "font-size": "9.5"
  });
  leftTxt.textContent = `${shortName(d.n)}  ${d.a}`;
  g.appendChild(leftTxt);

  // Right label (value + name)
  const lyR = rightMap.get(d.n);
  const rightTxt = mkEl("text", {
    x: xRight + 8, y: lyR + 3.5,
    "text-anchor": "start", fill: "#2B2A27", "font-size": "9.5"
  });
  rightTxt.textContent = `${d.b}  ${shortName(d.n)}`;
  g.appendChild(rightTxt);

  // Leader lines from actual endpoint to resolved label
  if (Math.abs(lyL - y1) > 2) {
    g.appendChild(mkEl("line", { x1: xLeft - 4, y1: y1, x2: xLeft - 6, y2: lyL, stroke: color, "stroke-width": "0.6", opacity: "0.5" }));
  }
  if (Math.abs(lyR - y2) > 2) {
    g.appendChild(mkEl("line", { x1: xRight + 4, y1: y2, x2: xRight + 6, y2: lyR, stroke: color, "stroke-width": "0.6", opacity: "0.5" }));
  }

  hit.addEventListener("mouseenter", e => {
    groups.forEach(gg => gg !== g && (gg.style.opacity = "0.12"));
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "2.5");
    const chg = (d.b - d.a).toFixed(1);
    tip.textContent = `${shortName(d.n)}: ${d.a} (1990) → ${d.b} (2023)  +${chg}`;
    tip.style.opacity = "1";
  });
  hit.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(gg => gg.style.opacity = "1");
    line.setAttribute("stroke-width", "1.5");
    tip.style.opacity = "0";
  });

  groups.push(g);
  svg.appendChild(g);
});

// Legend
const legendItems = [
  { color: "#EA5E33", label: "+30 or more" },
  { color: "#F29A44", label: "+20–30" },
  { color: "#C49A45", label: "+15–20" },
  { color: "#8BAD72", label: "below +15" },
];
const lx = xLeft, ly = 12;
legendItems.forEach((item, i) => {
  svg.appendChild(mkEl("rect", { x: lx + i * 110, y: ly, width: 10, height: 10, fill: item.color }));
  const t = mkEl("text", { x: lx + i * 110 + 14, y: ly + 9, fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" });
  t.textContent = item.label;
  svg.appendChild(t);
});
const legLabel = mkEl("text", { x: lx, y: ly - 3, fill: "#9A9890", "font-size": "8", "font-family": "JetBrains Mono, monospace" });
legLabel.textContent = "CHANGE IN RATIO";
svg.appendChild(legLabel);
</script>
</body></html>

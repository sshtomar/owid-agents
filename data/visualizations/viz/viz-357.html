<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  #tip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.12s; z-index: 10; }
</style>
</head><body>
<h1>International Tourist Arrivals, 1995–2020</h1>
<p class="subtitle">Inbound tourist arrivals (millions) for selected countries. COVID-19 triggered the largest single-year collapse in recorded tourism history — Hong Kong lost 94% of visitors in 2020.</p>
<div id="chart" style="position:relative;"></div>
<div id="tip"></div>
<p class="source">Source: World Bank — ST.INT.ARVL</p>
<script>
const data = [{"n":"China","pts":[{"y":1995,"v":46.39},{"y":1996,"v":51.13},{"y":1997,"v":57.59},{"y":1998,"v":63.48},{"y":1999,"v":72.8},{"y":2000,"v":83.44},{"y":2001,"v":89.01},{"y":2002,"v":97.91},{"y":2003,"v":91.66},{"y":2004,"v":109.04},{"y":2005,"v":120.29},{"y":2006,"v":124.94},{"y":2007,"v":131.87},{"y":2008,"v":130.03},{"y":2009,"v":126.48},{"y":2010,"v":133.76},{"y":2011,"v":135.42},{"y":2012,"v":132.41},{"y":2013,"v":129.08},{"y":2014,"v":128.5},{"y":2015,"v":133.82},{"y":2016,"v":141.77},{"y":2017,"v":153.26},{"y":2018,"v":158.61},{"y":2019,"v":162.54},{"y":2020,"v":30.4}]},{"n":"Italy","pts":[{"y":1995,"v":55.71},{"y":1996,"v":59.8},{"y":1997,"v":58.0},{"y":1998,"v":58.5},{"y":1999,"v":59.52},{"y":2000,"v":62.7},{"y":2001,"v":60.96},{"y":2002,"v":63.56},{"y":2003,"v":63.03},{"y":2004,"v":58.48},{"y":2005,"v":59.23},{"y":2006,"v":66.35},{"y":2007,"v":70.27},{"y":2008,"v":70.72},{"y":2009,"v":71.69},{"y":2010,"v":73.22},{"y":2011,"v":75.87},{"y":2012,"v":76.29},{"y":2013,"v":76.76},{"y":2014,"v":77.69},{"y":2015,"v":81.07},{"y":2016,"v":84.92},{"y":2017,"v":89.93},{"y":2018,"v":93.23},{"y":2019,"v":95.4},{"y":2020,"v":38.42}]},{"n":"Croatia","pts":[{"y":1995,"v":16.1},{"y":1996,"v":19.09},{"y":1997,"v":23.66},{"y":1998,"v":25.5},{"y":1999,"v":29.21},{"y":2000,"v":37.23},{"y":2001,"v":40.13},{"y":2002,"v":41.74},{"y":2003,"v":42.86},{"y":2004,"v":44.97},{"y":2005,"v":45.76},{"y":2006,"v":47.73},{"y":2007,"v":52.27},{"y":2008,"v":51.34},{"y":2009,"v":47.57},{"y":2010,"v":49.01},{"y":2011,"v":49.97},{"y":2012,"v":47.19},{"y":2013,"v":48.34},{"y":2014,"v":51.17},{"y":2015,"v":55.86},{"y":2016,"v":57.59},{"y":2017,"v":59.24},{"y":2018,"v":57.67},{"y":2019,"v":60.02},{"y":2020,"v":21.61}]},{"n":"Hong Kong SAR, China","pts":[{"y":1995,"v":10.2},{"y":1996,"v":12.97},{"y":1997,"v":11.27},{"y":1998,"v":10.16},{"y":1999,"v":11.33},{"y":2000,"v":13.06},{"y":2001,"v":13.72},{"y":2002,"v":16.57},{"y":2003,"v":15.54},{"y":2004,"v":21.81},{"y":2005,"v":23.36},{"y":2006,"v":25.25},{"y":2007,"v":28.17},{"y":2008,"v":29.51},{"y":2009,"v":29.59},{"y":2010,"v":36.03},{"y":2011,"v":41.92},{"y":2012,"v":48.62},{"y":2013,"v":54.3},{"y":2014,"v":60.84},{"y":2015,"v":59.31},{"y":2016,"v":56.66},{"y":2017,"v":58.47},{"y":2018,"v":65.15},{"y":2019,"v":55.91},{"y":2020,"v":3.57}]},{"n":"Germany","pts":[{"y":1995,"v":14.85},{"y":1996,"v":15.21},{"y":1997,"v":15.84},{"y":1998,"v":16.51},{"y":1999,"v":17.12},{"y":2000,"v":18.98},{"y":2001,"v":17.86},{"y":2002,"v":17.97},{"y":2003,"v":18.4},{"y":2004,"v":20.14},{"y":2005,"v":21.5},{"y":2006,"v":23.57},{"y":2007,"v":24.42},{"y":2008,"v":24.88},{"y":2009,"v":24.22},{"y":2010,"v":26.88},{"y":2011,"v":28.37},{"y":2012,"v":30.41},{"y":2013,"v":31.55},{"y":2014,"v":33.0},{"y":2015,"v":34.97},{"y":2016,"v":35.55},{"y":2017,"v":37.45},{"y":2018,"v":38.88},{"y":2019,"v":39.56},{"y":2020,"v":12.45}]},{"n":"Japan","pts":[{"y":1995,"v":3.35},{"y":1996,"v":3.84},{"y":1997,"v":4.22},{"y":1998,"v":4.11},{"y":1999,"v":4.44},{"y":2000,"v":4.76},{"y":2001,"v":4.77},{"y":2002,"v":5.24},{"y":2003,"v":5.21},{"y":2004,"v":6.14},{"y":2005,"v":6.73},{"y":2006,"v":7.33},{"y":2007,"v":8.35},{"y":2008,"v":8.35},{"y":2009,"v":6.79},{"y":2010,"v":8.61},{"y":2011,"v":6.22},{"y":2012,"v":8.36},{"y":2013,"v":10.36},{"y":2014,"v":13.41},{"y":2015,"v":19.74},{"y":2016,"v":24.04},{"y":2017,"v":28.69},{"y":2018,"v":31.19},{"y":2019,"v":31.88},{"y":2020,"v":4.12}]},{"n":"Korea","pts":[{"y":1995,"v":3.75},{"y":1996,"v":3.68},{"y":1997,"v":3.91},{"y":1998,"v":4.25},{"y":1999,"v":4.66},{"y":2000,"v":5.32},{"y":2001,"v":5.15},{"y":2002,"v":5.35},{"y":2003,"v":4.75},{"y":2004,"v":5.82},{"y":2005,"v":6.02},{"y":2006,"v":6.16},{"y":2007,"v":6.45},{"y":2008,"v":6.89},{"y":2009,"v":7.82},{"y":2010,"v":8.8},{"y":2011,"v":9.79},{"y":2012,"v":11.14},{"y":2013,"v":12.18},{"y":2014,"v":14.2},{"y":2015,"v":13.23},{"y":2016,"v":17.24},{"y":2017,"v":13.34},{"y":2018,"v":15.35},{"y":2019,"v":17.5},{"y":2020,"v":2.52}]}];

const COLORS = {"China":"#EA5E33","Italy":"#3D7A5A","Croatia":"#5B9E78","Hong Kong SAR, China":"#C49A45","Germany":"#4E88B4","Japan":"#9B6FB0","Korea":"#7A786F"};
const LABELS = {"Hong Kong SAR, China":"Hong Kong","Korea":"Korea"};

const W = 800, H = 420;
const M = {top:30, right:150, bottom:38, left:56};
const yearMin = 1995, yearMax = 2020, valMax = 170, valMin = 0;
const xS = y => M.left + (y - yearMin) / (yearMax - yearMin) * (W - M.left - M.right);
const yS = v => M.top + (valMax - Math.min(v, valMax)) / (valMax - valMin) * (H - M.top - M.bottom);

function mk(tag, a, t) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(a || {})) el.setAttribute(k, v);
  if (t !== undefined) el.textContent = t;
  return el;
}

const svg = mk("svg", {viewBox:`0 0 ${W} ${H}`, width:"100%", style:"display:block;max-width:800px"});
document.getElementById("chart").appendChild(svg);
const tip = document.getElementById("tip");

// Grid + y-axis labels
[0, 50, 100, 150].forEach(v => {
  svg.appendChild(mk("line", {x1:M.left, y1:yS(v), x2:W-M.right, y2:yS(v), stroke:"#E2E0D5", "stroke-width":"0.5"}));
  svg.appendChild(mk("text", {x:M.left-6, y:yS(v)+4, "text-anchor":"end", "font-size":"9", "font-family":"JetBrains Mono,monospace", fill:"#7A786F"}, v+"M"));
});
// X-axis labels
[1995,2000,2005,2010,2015,2020].forEach(y => {
  svg.appendChild(mk("line", {x1:xS(y), y1:M.top, x2:xS(y), y2:H-M.bottom+4, stroke:"#E2E0D5", "stroke-width":"0.5"}));
  svg.appendChild(mk("text", {x:xS(y), y:H-M.bottom+14, "text-anchor":"middle", "font-size":"9", "font-family":"JetBrains Mono,monospace", fill:"#7A786F"}, y));
});

// COVID annotation
const xCov = xS(2020);
svg.appendChild(mk("line", {x1:xCov, y1:M.top, x2:xCov, y2:H-M.bottom, stroke:"#EA5E33", "stroke-width":"1", "stroke-dasharray":"3,2", opacity:"0.6"}));
svg.appendChild(mk("text", {x:xCov-4, y:M.top+10, "text-anchor":"end", "font-size":"8", "font-family":"JetBrains Mono,monospace", fill:"#EA5E33"}, "COVID-19"));

function resolveCollisions(items, minGap) {
  const s = items.slice().sort((a,b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < s.length; i++) {
      const gap = s[i].y - s[i-1].y;
      if (gap < minGap) { const sh = (minGap-gap)/2; s[i-1].y -= sh; s[i].y += sh; moved = true; }
    }
    if (!moved) break;
  }
  const tB = M.top+4, bB = H-M.bottom-4;
  s.forEach(it => { it.y = Math.max(tB, Math.min(bB, it.y)); });
  return s;
}

// Build series groups
const groups = [];
data.forEach(series => {
  const color = COLORS[series.n] || '#999';
  const pts = series.pts;
  if (!pts.length) return;
  const pathD = pts.map((p,i) => `${i===0?'M':'L'} ${xS(p.y)} ${yS(p.v)}`).join(' ');
  const line = mk("path", {d:pathD, stroke:color, "stroke-width":"1.5", fill:"none", "stroke-linejoin":"round"});
  const hit = mk("path", {d:pathD, stroke:"transparent", "stroke-width":"14", fill:"none", cursor:"pointer"});
  const g = mk("g", {});
  g.appendChild(line); g.appendChild(hit);
  svg.appendChild(g);
  groups.push({g, line, hit, color, series});
});

// Endpoint labels
const labelItems = groups.map(({color, series}) => {
  const last = series.pts[series.pts.length-1];
  const label = LABELS[series.n] || series.n;
  return {series, color, origY: yS(last.v), y: yS(last.v), label:`${last.v.toFixed(1)}M  ${label}`};
});
const resolved = resolveCollisions(labelItems, 11);
resolved.forEach(item => {
  if (Math.abs(item.y - item.origY) > 2) {
    svg.appendChild(mk("line", {x1:W-M.right+4, y1:item.origY, x2:W-M.right+10, y2:item.y, stroke:item.color, "stroke-width":"0.5", opacity:"0.6"}));
  }
  svg.appendChild(mk("text", {x:W-M.right+14, y:item.y+4, "font-size":"9", "font-family":"Inter,sans-serif", fill:item.color, "font-weight":"500"}, item.label));
});

// Hover interactivity
groups.forEach(({g, line, hit, color, series}) => {
  hit.addEventListener("mousemove", e => {
    groups.forEach(h => {
      h.line.setAttribute("opacity", h.series.n === series.n ? "1" : "0.08");
      h.line.setAttribute("stroke-width", h.series.n === series.n ? "2.5" : "1.5");
    });
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = (mx - M.left) / (W - M.left - M.right);
    const yr = Math.round(ratio * (yearMax - yearMin) + yearMin);
    const closest = series.pts.reduce((a,b) => Math.abs(b.y-yr) < Math.abs(a.y-yr) ? b : a);
    const label = LABELS[series.n] || series.n;
    tip.textContent = `${label}  ${closest.y}: ${closest.v.toFixed(1)}M arrivals`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX+14)+"px";
    tip.style.top = (e.clientY-24)+"px";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(h => { h.line.setAttribute("opacity","1"); h.line.setAttribute("stroke-width","1.5"); });
    tip.style.opacity = "0";
  });
});
</script>
</body></html>

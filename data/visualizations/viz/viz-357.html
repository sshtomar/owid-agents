<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>The Aging Squeeze: Old-Age Dependency Ratios, 1960–2024</h1>
<p class="subtitle">Number of people aged 65+ per 100 working-age adults (15–64). Japan has gone from near-parity with developing nations to the highest ratio ever recorded for a major economy.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Old-Age Dependency Ratio (SP.POP.DPND.OL)</p>
<script>
const data = [{"n":"Japan","pts":[{"y":1960,"v":8.9},{"y":1965,"v":9.2},{"y":1970,"v":10.1},{"y":1975,"v":11.6},{"y":1980,"v":13.4},{"y":1985,"v":15.2},{"y":1990,"v":17.4},{"y":1995,"v":21.0},{"y":2000,"v":25.6},{"y":2005,"v":30.7},{"y":2010,"v":36.4},{"y":2015,"v":44.7},{"y":2020,"v":49.1},{"y":2024,"v":50.7}]},{"n":"South Korea","pts":[{"y":1960,"v":5.6},{"y":1965,"v":6.1},{"y":1970,"v":6.2},{"y":1975,"v":6.2},{"y":1980,"v":6.2},{"y":1985,"v":6.5},{"y":1990,"v":7.1},{"y":1995,"v":8.1},{"y":2000,"v":9.9},{"y":2005,"v":12.5},{"y":2010,"v":15.1},{"y":2015,"v":17.7},{"y":2020,"v":22.0},{"y":2024,"v":27.5}]},{"n":"Italy","pts":[{"y":1960,"v":14.5},{"y":1965,"v":15.5},{"y":1970,"v":17.2},{"y":1975,"v":19.1},{"y":1980,"v":20.5},{"y":1985,"v":19.5},{"y":1990,"v":21.8},{"y":1995,"v":24.9},{"y":2000,"v":27.0},{"y":2005,"v":29.6},{"y":2010,"v":31.2},{"y":2015,"v":34.3},{"y":2020,"v":36.6},{"y":2024,"v":38.8}]},{"n":"Germany","pts":[{"y":1960,"v":17.1},{"y":1965,"v":19.3},{"y":1970,"v":21.6},{"y":1975,"v":23.3},{"y":1980,"v":23.7},{"y":1985,"v":20.9},{"y":1990,"v":21.5},{"y":1995,"v":22.5},{"y":2000,"v":24.2},{"y":2005,"v":28.3},{"y":2010,"v":31.3},{"y":2015,"v":32.0},{"y":2020,"v":33.9},{"y":2024,"v":36.9}]},{"n":"France","pts":[{"y":1960,"v":18.6},{"y":1965,"v":19.4},{"y":1970,"v":20.6},{"y":1975,"v":21.5},{"y":1980,"v":21.9},{"y":1985,"v":19.6},{"y":1990,"v":21.2},{"y":1995,"v":23.1},{"y":2000,"v":24.6},{"y":2005,"v":25.3},{"y":2010,"v":25.9},{"y":2015,"v":30.0},{"y":2020,"v":33.6},{"y":2024,"v":36.1}]},{"n":"China","pts":[{"y":1960,"v":7.1},{"y":1965,"v":6.6},{"y":1970,"v":6.7},{"y":1975,"v":7.1},{"y":1980,"v":7.4},{"y":1985,"v":7.6},{"y":1990,"v":8.1},{"y":1995,"v":9.1},{"y":2000,"v":10.3},{"y":2005,"v":11.0},{"y":2010,"v":11.9},{"y":2015,"v":14.0},{"y":2020,"v":18.2},{"y":2024,"v":21.2}]},{"n":"India","pts":[{"y":1960,"v":5.9},{"y":1965,"v":6.5},{"y":1970,"v":6.7},{"y":1975,"v":6.9},{"y":1980,"v":7.0},{"y":1985,"v":7.0},{"y":1990,"v":7.0},{"y":1995,"v":7.2},{"y":2000,"v":7.3},{"y":2005,"v":7.6},{"y":2010,"v":7.8},{"y":2015,"v":8.3},{"y":2020,"v":9.5},{"y":2024,"v":10.5}]},{"n":"Brazil","pts":[{"y":1960,"v":4.7},{"y":1965,"v":5.1},{"y":1970,"v":5.4},{"y":1975,"v":5.8},{"y":1980,"v":6.1},{"y":1985,"v":6.3},{"y":1990,"v":6.8},{"y":1995,"v":7.4},{"y":2000,"v":7.9},{"y":2005,"v":8.6},{"y":2010,"v":9.7},{"y":2015,"v":11.4},{"y":2020,"v":13.8},{"y":2024,"v":15.9}]},{"n":"Ethiopia","pts":[{"y":1960,"v":5.1},{"y":1965,"v":5.0},{"y":1970,"v":5.3},{"y":1975,"v":5.4},{"y":1980,"v":5.5},{"y":1985,"v":5.3},{"y":1990,"v":5.4},{"y":1995,"v":5.3},{"y":2000,"v":5.3},{"y":2005,"v":5.3},{"y":2010,"v":5.3},{"y":2015,"v":5.4},{"y":2020,"v":5.4},{"y":2024,"v":5.6}]}];

const COLORS = ["#EA5E33","#F29A44","#C49A45","#5B9E78","#3D7A5A","#8BAD72","#A6C4A2","#B5A48C","#C2C0B5"];

const W = 720, H = 420;
const margin = {top: 30, right: 140, bottom: 30, left: 48};

const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("width","100%");
svg.style.maxWidth = W+"px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  if (text !== undefined) el.textContent = text;
  return el;
}

const yearMin = 1960, yearMax = 2024;
const valMin = 0, valMax = 55;
const xS = y => margin.left + (y - yearMin)/(yearMax - yearMin) * (W - margin.left - margin.right);
const yS = v => margin.top + (valMax - v)/(valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[0,10,20,30,40,50].forEach(v => {
  svg.appendChild(mkEl("line",{x1:margin.left,y1:yS(v),x2:W-margin.right,y2:yS(v),stroke:"#E2E0D5","stroke-width":"0.5"}));
  svg.appendChild(mkEl("text",{x:margin.left-4,y:yS(v)+4,"text-anchor":"end","font-family":"JetBrains Mono, monospace","font-size":"9","fill":"#7A786F"},v+"%"));
});

// X axis labels
[1960,1970,1980,1990,2000,2010,2020].forEach(y => {
  svg.appendChild(mkEl("text",{x:xS(y),y:H-margin.bottom+14,"text-anchor":"middle","font-family":"JetBrains Mono, monospace","font-size":"9","fill":"#7A786F"},y));
});

const tip = document.getElementById("tip");
function showTip(txt, e) { tip.textContent=txt; tip.style.opacity="1"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-20)+"px"; }
function hideTip() { tip.style.opacity="0"; }

const labelData = [];

data.forEach((series, si) => {
  const color = COLORS[si % COLORS.length];
  const g = mkEl("g",{});

  const pathD = series.pts.map((p,i) => `${i===0?"M":"L"} ${xS(p.y)} ${yS(p.v)}`).join(" ");
  g.appendChild(mkEl("path",{d:pathD,stroke:color,"stroke-width":"1.8",fill:"none","stroke-linejoin":"round"}));

  // Invisible hit path
  const hitPath = mkEl("path",{d:pathD,stroke:"transparent","stroke-width":"12",fill:"none",cursor:"pointer"});
  hitPath.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left)/(W - margin.left - margin.right)));
    const yearIdx = Math.round(ratio * (series.pts.length - 1));
    const p = series.pts[yearIdx];
    showTip(`${series.n} (${p.y}): ${p.v}%`, e);
    svg.querySelectorAll(".series-g").forEach(gg => gg.style.opacity="0.12");
    g.style.opacity="1";
    g.querySelector("path:not([stroke=transparent])")?.setAttribute("stroke-width","3");
  });
  hitPath.addEventListener("mouseleave", () => {
    hideTip();
    svg.querySelectorAll(".series-g").forEach(gg => { gg.style.opacity="1"; gg.querySelector("path:not([stroke=transparent])")?.setAttribute("stroke-width","1.8"); });
  });
  g.appendChild(hitPath);
  g.setAttribute("class","series-g");
  svg.appendChild(g);

  // Endpoint label
  const lastPt = series.pts[series.pts.length-1];
  labelData.push({n: series.n, v: lastPt.v, color, y: yS(lastPt.v)});
});

// Resolve label collisions
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a,b)=>a.y-b.y);
  for (let pass=0; pass<30; pass++) {
    let moved=false;
    for (let i=1; i<sorted.length; i++) {
      const gap=sorted[i].y-sorted[i-1].y;
      if (gap<minGap) { const sh=(minGap-gap)/2; sorted[i-1].y-=sh; sorted[i].y+=sh; moved=true; }
    }
    if (!moved) break;
  }
  return sorted;
}

const resolved = resolveCollisions(labelData.map(l=>({...l})), 13);
resolved.forEach(l => {
  // Clamp
  const cy = Math.max(margin.top+6, Math.min(H-margin.bottom-2, l.y));
  const origY = yS(l.v);
  // Leader line if shifted
  if (Math.abs(cy - origY) > 3) {
    svg.appendChild(mkEl("line",{x1:xS(yearMax)+3,y1:origY,x2:xS(yearMax)+8,y2:cy,stroke:"#C2C0B5","stroke-width":"0.5"}));
  }
  const t = mkEl("text",{x:xS(yearMax)+10,y:cy+3.5,"font-size":"9","fill":l.color,"font-weight":"500"},`${l.v}%  ${l.n}`);
  svg.appendChild(t);
});
</script>
</body></html>

v":2.9},{"y":2020,"v":2.42},{"y":2021,"v":0.98},{"y":2022,"v":1.97},{"y":2023,"v":0.23},{"y":2024,"v":0.22}]},{"n":"India","pts":[{"y":2000,"v":4.01},{"y":2001,"v":3.78},{"y":2002,"v":4.3},{"y":2003,"v":3.81},{"y":2004,"v":3.77},{"y":2005,"v":4.25},{"y":2006,"v":5.8},{"y":2007,"v":6.37},{"y":2008,"v":8.35},{"y":2009,"v":10.88},{"y":2010,"v":11.99},{"y":2011,"v":8.91},{"y":2012,"v":9.48},{"y":2013,"v":10.02},{"y":2014,"v":6.67},{"y":2015,"v":4.91},{"y":2016,"v":4.95},{"y":2017,"v":3.33},{"y":2018,"v":3.94},{"y":2019,"v":3.73},{"y":2020,"v":6.62},{"y":2021,"v":5.13},{"y":2022,"v":6.7},{"y":2023,"v":5.65},{"y":2024,"v":4.95}]},{"n":"France","pts":[{"y":2000,"v":1.68},{"y":2001,"v":1.63},{"y":2002,"v":1.92},{"y":2003,"v":2.1},{"y":2004,"v":2.14},{"y":2005,"v":1.75},{"y":2006,"v":1.68},{"y":2007,"v":1.49},{"y":2008,"v":2.81},{"y":2009,"v":0.09},{"y":2010,"v":1.53},{"y":2011,"v":2.11},{"y":2012,"v":1.95},{"y":2013,"v":0.86},{"y":2014,"v":0.51},{"y":2015,"v":0.04},{"y":2016,"v":0.18},{"y":2017,"v":1.03},{"y":2018,"v":1.85},{"y":2019,"v":1.11},{"y":2020,"v":0.48},{"y":2021,"v":1.64},{"y":2022,"v":5.22},{"y":2023,"v":4.88},{"y":2024,"v":2.0}]},{"n":"Ghana","pts":[{"y":2000,"v":40.24},{"y":2001,"v":41.51},{"y":2002,"v":9.36},{"y":2003,"v":29.77},{"y":2004,"v":18.04},{"y":2005,"v":15.44},{"y":2006,"v":11.68},{"y":2007,"v":10.73},{"y":2008,"v":16.49},{"y":2009,"v":19.25},{"y":2010,"v":10.73},{"y":2011,"v":8.73},{"y":2012,"v":11.19},{"y":2013,"v":11.67},{"y":2014,"v":15.49},{"y":2015,"v":17.15},{"y":2016,"v":17.45},{"y":2017,"v":12.37},{"y":2018,"v":7.81},{"y":2019,"v":7.14},{"y":2020,"v":9.89},{"y":2021,"v":9.97},{"y":2022,"v":31.26},{"y":2023,"v":38.11},{"y":2024,"v":22.85}]},{"n":"Australia","pts":[{"y":2000,"v":4.46},{"y":2001,"v":4.41},{"y":2002,"v":2.98},{"y":2003,"v":2.73},{"y":2004,"v":2.34},{"y":2005,"v":2.69},{"y":2006,"v":3.56},{"y":2007,"v":2.33},{"y":2008,"v":4.35},{"y":2009,"v":1.77},{"y":2010,"v":2.92},{"y":2011,"v":3.3},{"y":2012,"v":1.76},{"y":2013,"v":2.45},{"y":2014,"v":2.49},{"y":2015,"v":1.51},{"y":2016,"v":1.28},{"y":2017,"v":1.95},{"y":2018,"v":1.91},{"y":2019,"v":1.61},{"y":2020,"v":0.85},{"y":2021,"v":2.86},{"y":2022,"v":6.59},{"y":2023,"v":5.6},{"y":2024,"v":3.17}]},{"n":"South Korea","pts":[{"y":2000,"v":2.26},{"y":2001,"v":4.07},{"y":2002,"v":2.76},{"y":2003,"v":3.51},{"y":2004,"v":3.59},{"y":2005,"v":2.75},{"y":2006,"v":2.24},{"y":2007,"v":2.53},{"y":2008,"v":4.67},{"y":2009,"v":2.76},{"y":2010,"v":2.94},{"y":2011,"v":4.03},{"y":2012,"v":2.19},{"y":2013,"v":1.3},{"y":2014,"v":1.27},{"y":2015,"v":0.71},{"y":2016,"v":0.97},{"y":2017,"v":1.94},{"y":2018,"v":1.48},{"y":2019,"v":0.38},{"y":2020,"v":0.54},{"y":2021,"v":2.5},{"y":2022,"v":5.09},{"y":2023,"v":3.6},{"y":2024,"v":2.32}]},{"n":"Indonesia","pts":[{"y":2000,"v":3.69},{"y":2001,"v":11.5},{"y":2002,"v":11.9},{"y":2003,"v":6.76},{"y":2004,"v":6.06},{"y":2005,"v":10.45},{"y":2006,"v":13.11},{"y":2007,"v":6.41},{"y":2008,"v":10.23},{"y":2009,"v":4.39},{"y":2010,"v":5.13},{"y":2011,"v":5.36},{"y":2012,"v":4.28},{"y":2013,"v":6.41},{"y":2014,"v":6.39},{"y":2015,"v":6.36},{"y":2016,"v":3.53},{"y":2017,"v":3.81},{"y":2018,"v":3.2},{"y":2019,"v":3.03},{"y":2020,"v":1.92},{"y":2021,"v":1.56},{"y":2022,"v":4.21},{"y":2023,"v":3.67},{"y":2024,"v":2.18}]}];

const COLORS = [
  "#EA5E33","#F29A44","#3D7A5A","#5B9E78","#4472C4",
  "#8B6BB0","#C49A45","#C4715A","#2B7A9F","#7A3B2A"
];

const W = 800, H = 440;
const margin = { top: 36, right: 130, bottom: 36, left: 44 };

const allYears = data[0].pts.map(p => p.y);
const yearMin = 2000, yearMax = 2024;
const allVals = data.flatMap(d => d.pts.map(p => p.v));
const valMin = Math.min(...allVals) - 1;
const valMax = Math.max(...allVals) + 2;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

function mkEl(tag, attrs = {}) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = mkEl("svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

// Grid lines
[0, 5, 10, 15, 20, 30, 40].forEach(v => {
  if (v < valMax) {
    svg.appendChild(mkEl("line", {
      x1: margin.left, y1: yScale(v),
      x2: W - margin.right, y2: yScale(v),
      stroke: "#E2E0D5", "stroke-width": "0.5"
    }));
    const lbl = mkEl("text");
    lbl.textContent = v + "%";
    lbl.setAttribute("x", margin.left - 6);
    lbl.setAttribute("y", yScale(v) + 3);
    lbl.setAttribute("text-anchor", "end");
    lbl.setAttribute("font-family", "'JetBrains Mono', monospace");
    lbl.setAttribute("font-size", "8");
    lbl.setAttribute("fill", "#7A786F");
    svg.appendChild(lbl);
  }
});

// 2022 surge annotation band
svg.appendChild(mkEl("rect", {
  x: xScale(2021), y: margin.top,
  width: xScale(2023) - xScale(2021),
  height: H - margin.top - margin.bottom,
  fill: "#EA5E33", opacity: "0.05"
}));

// X-axis year labels
[2000, 2005, 2010, 2015, 2020, 2024].forEach(y => {
  const lbl = mkEl("text");
  lbl.textContent = y;
  lbl.setAttribute("x", xScale(y));
  lbl.setAttribute("y", H - margin.bottom + 14);
  lbl.setAttribute("text-anchor", "middle");
  lbl.setAttribute("font-family", "'JetBrains Mono', monospace");
  lbl.setAttribute("font-size", "8");
  lbl.setAttribute("fill", "#7A786F");
  svg.appendChild(lbl);
});

// Zero line
svg.appendChild(mkEl("line", {
  x1: margin.left, y1: yScale(0),
  x2: W - margin.right, y2: yScale(0),
  stroke: "#C2C0B5", "stroke-width": "0.8"
}));

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const groups = [];
const tip = document.getElementById("tip");

// Build end-label positions
const endLabels = data.map((series, i) => {
  const last = series.pts[series.pts.length - 1];
  return { n: series.n, y: yScale(last.v), v: last.v, i };
});

const resolved = resolveCollisions(endLabels, 11);
const labelMap = {};
resolved.forEach(item => { labelMap[item.i] = item.y; });

data.forEach((series, i) => {
  const color = COLORS[i % COLORS.length];
  const g = mkEl("g");
  g.style.opacity = "1";
  g.style.cursor = "pointer";

  // Path
  const pathD = series.pts.map((p, j) =>
    `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`
  ).join(" ");

  g.appendChild(mkEl("path", {
    d: pathD, stroke: color, "stroke-width": "1.5",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  }));

  // Invisible wide hit path
  const hitPath = mkEl("path", {
    d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none"
  });
  g.appendChild(hitPath);

  // Endpoint label
  const last = series.pts[series.pts.length - 1];
  const labelY = labelMap[i];
  const anchorX = xScale(last.y) + 6;

  // Leader line if label moved
  const actualY = yScale(last.v);
  if (Math.abs(labelY - actualY) > 2) {
    g.appendChild(mkEl("line", {
      x1: xScale(last.y) + 2, y1: actualY,
      x2: anchorX + 1, y2: labelY,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text");
  lbl.textContent = `${last.v.toFixed(1)}% ${series.n}`;
  lbl.setAttribute("x", anchorX + 2);
  lbl.setAttribute("y", labelY + 3);
  lbl.setAttribute("font-family", "'Inter', sans-serif");
  lbl.setAttribute("font-size", "8.5");
  lbl.setAttribute("font-weight", "500");
  lbl.setAttribute("fill", color);
  g.appendChild(lbl);

  // Hover
  hitPath.addEventListener("mousemove", e => {
    groups.forEach(gg => { gg.style.opacity = "0.1"; });
    g.style.opacity = "1";
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yIdx = Math.round(ratio * (series.pts.length - 1));
    const pt = series.pts[Math.min(yIdx, series.pts.length - 1)];
    tip.textContent = `${series.n} ${pt.y}: ${pt.v.toFixed(1)}%`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
  });
  hitPath.addEventListener("mouseleave", () => {
    groups.forEach(gg => { gg.style.opacity = "1"; });
    tip.style.opacity = "0";
  });

  svg.appendChild(g);
  groups.push(g);
});
</script>

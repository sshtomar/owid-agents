<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Inter", sans-serif; margin: 0; padding: 24px; background: #fafaf8; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; background: #1e293b; color: #f1f5f9;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: "JetBrains Mono", monospace;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 100;
    }
  </style>
</head>
<body>
  <h1>Population Growth Rate, 1980–2024</h1>
  <p class="subtitle">Annual % change. Sub-Saharan Africa holds above 2.4%; Japan and China have crossed into negative territory.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — SP.POP.GROW (UN Population Division)</p>
  <div id="tip"></div>
  <script>
    const data = [
      {"n":"Sub-Saharan Africa","pts":[{"y":1980,"v":2.93},{"y":1982,"v":3.08},{"y":1984,"v":2.86},{"y":1986,"v":2.89},{"y":1988,"v":2.84},{"y":1990,"v":2.78},{"y":1992,"v":2.70},{"y":1994,"v":2.66},{"y":1996,"v":2.68},{"y":1998,"v":2.66},{"y":2000,"v":2.66},{"y":2002,"v":2.69},{"y":2004,"v":2.72},{"y":2006,"v":2.73},{"y":2008,"v":2.77},{"y":2010,"v":2.76},{"y":2012,"v":2.73},{"y":2014,"v":2.71},{"y":2016,"v":2.65},{"y":2018,"v":2.65},{"y":2020,"v":2.57},{"y":2022,"v":2.48},{"y":2024,"v":2.44}]},
      {"n":"Ethiopia","pts":[{"y":1980,"v":0.55},{"y":1982,"v":3.88},{"y":1984,"v":2.60},{"y":1986,"v":2.96},{"y":1988,"v":3.90},{"y":1990,"v":3.70},{"y":1992,"v":4.21},{"y":1994,"v":3.48},{"y":1996,"v":3.30},{"y":1998,"v":3.14},{"y":2000,"v":3.07},{"y":2002,"v":3.04},{"y":2004,"v":2.99},{"y":2006,"v":2.94},{"y":2008,"v":2.89},{"y":2010,"v":2.84},{"y":2012,"v":2.80},{"y":2014,"v":2.68},{"y":2016,"v":2.71},{"y":2018,"v":2.70},{"y":2020,"v":2.71},{"y":2022,"v":2.62},{"y":2024,"v":2.58}]},
      {"n":"India","pts":[{"y":1980,"v":2.38},{"y":1982,"v":2.33},{"y":1984,"v":2.35},{"y":1986,"v":2.31},{"y":1988,"v":2.25},{"y":1990,"v":2.21},{"y":1992,"v":2.13},{"y":1994,"v":2.04},{"y":1996,"v":2.00},{"y":1998,"v":1.94},{"y":2000,"v":1.88},{"y":2002,"v":1.81},{"y":2004,"v":1.70},{"y":2006,"v":1.56},{"y":2008,"v":1.44},{"y":2010,"v":1.45},{"y":2012,"v":1.37},{"y":2014,"v":1.26},{"y":2016,"v":1.19},{"y":2018,"v":1.10},{"y":2020,"v":0.97},{"y":2022,"v":0.79},{"y":2024,"v":0.89}]},
      {"n":"Brazil","pts":[{"y":1980,"v":2.36},{"y":1982,"v":2.28},{"y":1984,"v":2.19},{"y":1986,"v":2.06},{"y":1988,"v":1.91},{"y":1990,"v":1.79},{"y":1992,"v":1.67},{"y":1994,"v":1.56},{"y":1996,"v":1.51},{"y":1998,"v":1.49},{"y":2000,"v":1.38},{"y":2002,"v":1.24},{"y":2004,"v":1.13},{"y":2006,"v":1.06},{"y":2008,"v":0.96},{"y":2010,"v":0.84},{"y":2012,"v":0.81},{"y":2014,"v":0.81},{"y":2016,"v":0.76},{"y":2018,"v":0.68},{"y":2020,"v":0.58},{"y":2022,"v":0.36},{"y":2024,"v":0.41}]},
      {"n":"Bangladesh","pts":[{"y":1980,"v":2.39},{"y":1982,"v":2.74},{"y":1984,"v":2.57},{"y":1986,"v":2.35},{"y":1988,"v":2.13},{"y":1990,"v":1.99},{"y":1992,"v":1.88},{"y":1994,"v":1.85},{"y":1996,"v":1.83},{"y":1998,"v":1.89},{"y":2000,"v":1.83},{"y":2002,"v":1.54},{"y":2004,"v":1.36},{"y":2006,"v":1.16},{"y":2008,"v":1.00},{"y":2010,"v":0.88},{"y":2012,"v":0.96},{"y":2014,"v":0.91},{"y":2016,"v":0.89},{"y":2018,"v":0.82},{"y":2020,"v":0.84},{"y":2022,"v":1.02},{"y":2024,"v":1.21}]},
      {"n":"China","pts":[{"y":1980,"v":1.25},{"y":1982,"v":1.47},{"y":1984,"v":1.31},{"y":1986,"v":1.49},{"y":1988,"v":1.61},{"y":1990,"v":1.47},{"y":1992,"v":1.23},{"y":1994,"v":1.13},{"y":1996,"v":1.05},{"y":1998,"v":0.96},{"y":2000,"v":0.79},{"y":2002,"v":0.67},{"y":2004,"v":0.59},{"y":2006,"v":0.56},{"y":2008,"v":0.51},{"y":2010,"v":0.48},{"y":2012,"v":0.68},{"y":2014,"v":0.63},{"y":2016,"v":0.57},{"y":2018,"v":0.47},{"y":2020,"v":0.24},{"y":2022,"v":-0.01},{"y":2024,"v":-0.12}]},
      {"n":"Germany","pts":[{"y":1980,"v":0.21},{"y":1982,"v":-0.10},{"y":1984,"v":-0.35},{"y":1986,"v":0.05},{"y":1988,"v":0.39},{"y":1990,"v":0.86},{"y":1992,"v":0.76},{"y":1994,"v":0.35},{"y":1996,"v":0.29},{"y":1998,"v":0.02},{"y":2000,"v":0.14},{"y":2002,"v":0.17},{"y":2004,"v":-0.02},{"y":2006,"v":-0.11},{"y":2008,"v":-0.19},{"y":2010,"v":-0.15},{"y":2012,"v":0.19},{"y":2014,"v":0.42},{"y":2016,"v":0.81},{"y":2018,"v":0.30},{"y":2020,"v":0.08},{"y":2022,"v":-0.02},{"y":2024,"v":0.27}]},
      {"n":"Japan","pts":[{"y":1980,"v":0.79},{"y":1982,"v":0.69},{"y":1984,"v":0.65},{"y":1986,"v":0.53},{"y":1988,"v":0.42},{"y":1990,"v":0.33},{"y":1992,"v":0.37},{"y":1994,"v":0.28},{"y":1996,"v":0.23},{"y":1998,"v":0.27},{"y":2000,"v":0.17},{"y":2002,"v":0.23},{"y":2004,"v":0.03},{"y":2006,"v":0.06},{"y":2008,"v":0.05},{"y":2010,"v":0.02},{"y":2012,"v":-0.16},{"y":2014,"v":-0.13},{"y":2016,"v":-0.05},{"y":2018,"v":-0.13},{"y":2020,"v":-0.29},{"y":2022,"v":-0.44},{"y":2024,"v":-0.44}]}
    ];

    const COLORS = {
      "Sub-Saharan Africa": "#9B7CC8",
      "Ethiopia":           "#EA5E33",
      "India":              "#F29A44",
      "Brazil":             "#C49A45",
      "Bangladesh":         "#8BAD72",
      "China":              "#3D7A5A",
      "Germany":            "#5B9E78",
      "Japan":              "#C4715A"
    };

    const W = 820, H = 440;
    const margin = { top: 30, right: 155, bottom: 40, left: 50 };
    const innerW = W - margin.left - margin.right;
    const innerH = H - margin.top - margin.bottom;
    const yearMin = 1980, yearMax = 2024;
    const valMin = -0.6, valMax = 4.4;

    function xScale(year) { return margin.left + (year - yearMin) / (yearMax - yearMin) * innerW; }
    function yScale(v) { return margin.top + (valMax - v) / (valMax - valMin) * innerH; }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");
    svg.style.maxWidth = "860px";
    svg.style.display = "block";

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    // Zero line (prominent)
    const zeroY = yScale(0);
    svg.appendChild(mkEl("line", { x1: margin.left, y1: zeroY, x2: W - margin.right, y2: zeroY, stroke: "#CBD5E1", "stroke-width": "1.2", "stroke-dasharray": "5,4" }));
    const zeroLbl = mkEl("text", { x: margin.left - 6, y: zeroY + 4, "text-anchor": "end", "font-size": "10", "font-family": "JetBrains Mono", fill: "#94a3b8" });
    zeroLbl.textContent = "0%";
    svg.appendChild(zeroLbl);

    // Grid lines
    [-0.5, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0].forEach(v => {
      const y = yScale(v);
      svg.appendChild(mkEl("line", { x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#e5e3dc", "stroke-width": "0.6" }));
      if (v !== 0) {
        const t = mkEl("text", { x: margin.left - 6, y: y + 4, "text-anchor": "end", "font-size": "10", "font-family": "JetBrains Mono", fill: "#7A786F" });
        t.textContent = v.toFixed(1) + "%";
        svg.appendChild(t);
      }
    });

    // X axis ticks
    [1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2024].forEach(yr => {
      const x = xScale(yr);
      svg.appendChild(mkEl("line", { x1: x, y1: margin.top, x2: x, y2: margin.top + innerH, stroke: "#e5e3dc", "stroke-width": "0.5", "stroke-dasharray": "3,3" }));
      svg.appendChild(mkEl("text", { x, y: margin.top + innerH + 16, "text-anchor": "middle", "font-size": "10", "font-family": "JetBrains Mono", fill: "#7A786F" })).textContent = yr;
    });

    const yLbl = mkEl("text", { x: 13, y: margin.top + innerH / 2, "text-anchor": "middle", "font-size": "10", fill: "#7A786F", transform: `rotate(-90, 13, ${margin.top + innerH / 2})` });
    yLbl.textContent = "Annual population growth (%)";
    svg.appendChild(yLbl);

    const endLabels = data.map(d => {
      const last = d.pts[d.pts.length - 1];
      return { name: d.n, y: yScale(last.v) };
    });
    const resolved = resolveCollisions(endLabels, 13);

    const groups = [];
    data.forEach(d => {
      const color = COLORS[d.n] || "#888";
      const g = mkEl("g", {});
      g.style.cursor = "pointer";

      const pathD = d.pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
      const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
      g.appendChild(line);

      const last = d.pts[d.pts.length - 1];
      g.appendChild(mkEl("circle", { cx: xScale(last.y), cy: yScale(last.v), r: "3", fill: color }));

      const labelInfo = resolved.find(r => r.name === d.n);
      const labelY = labelInfo ? labelInfo.y : yScale(last.v);
      const labelActualY = yScale(last.v);

      if (Math.abs(labelY - labelActualY) > 3) {
        g.appendChild(mkEl("line", { x1: xScale(last.y) + 6, y1: labelActualY, x2: W - margin.right + 6, y2: labelY, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
      }

      const lbl = mkEl("text", { x: W - margin.right + 8, y: labelY + 3.5, "font-size": "9.5", "font-family": "JetBrains Mono", fill: color });
      lbl.textContent = `${last.v.toFixed(2)}%  ${d.n}`;
      g.appendChild(lbl);

      const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
      g.appendChild(hit);

      groups.push({ g, line, lbl, series: d, color });
      svg.appendChild(g);
    });

    const tip = document.getElementById("tip");
    groups.forEach(({ g, line, lbl, series }) => {
      g.addEventListener("mouseenter", () => {
        groups.forEach(other => {
          other.line.setAttribute("opacity", other.series.n === series.n ? "1" : "0.1");
          other.lbl.setAttribute("opacity", other.series.n === series.n ? "1" : "0.15");
          other.line.setAttribute("stroke-width", other.series.n === series.n ? "2.5" : "1.8");
        });
      });
      g.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / innerW));
        const yr = yearMin + Math.round(ratio * (yearMax - yearMin) / 2) * 2;
        const pt = series.pts.find(p => p.y === yr) || series.pts[series.pts.length - 1];
        tip.textContent = `${series.n} ${pt.y}: ${pt.v.toFixed(2)}%`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      g.addEventListener("mouseleave", () => {
        groups.forEach(other => {
          other.line.setAttribute("opacity", "1");
          other.lbl.setAttribute("opacity", "1");
          other.line.setAttribute("stroke-width", "1.8");
        });
        tip.style.opacity = "0";
      });
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

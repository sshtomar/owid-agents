<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 580px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 16px; letter-spacing: 0.3px; text-transform: uppercase; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 10; }
</style></head><body>
<h1>China's Patent Surge</h1>
<p class="subtitle">Resident patent applications, 1985–2021. China filed 4,065 patents in 1985 and 1.43 million in 2021 — a 350× increase. By 2021, China alone accounted for 60% of all patent applications filed globally.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank IP.PAT.RESD</p>
<script>
const data = [
  {n:"China",  s:[4065,3494,3975,4780,4749,5832,7372,10022,12084,11191,10011,11628,12672,13751,15626,25346,30038,39806,56769,65786,93485,122318,153060,194579,229096,293066,415829,535313,704936,801135,968252,1204981,1245709,1393815,1243568,1344817,1426644]},
  {n:"Japan",  s:[274373,290202,311006,308908,317566,333230,335933,338019,332345,319938,334612,340101,350807,359381,360180,387364,386767,369458,358184,368416,367960,347060,333498,330110,295315,290081,287580,287013,271731,265959,258839,260244,260292,253630,245372,227348,222452]},
  {n:"Korea",  s:[2702,3640,4871,5696,7020,9082,13253,15951,21449,28554,59228,68405,67359,50596,55970,72831,73714,76570,90313,105250,122188,125476,128701,127114,127316,131805,138034,148136,159978,164073,167275,163424,159084,162561,171603,180477,186245]},
  {n:"Germany",s:[32202,32169,31597,31912,31171,30724,32256,33919,34752,36715,38103,42322,44438,46523,50029,51736,49989,47598,47818,48448,48367,48012,47853,49240,47859,47047,46986,46620,47353,48154,47384,48480,47785,46617,46632,42260,39822]},
  {n:"India",  s:[982,999,988,1033,1048,1147,1267,1248,1209,1588,1545,1661,1926,2247,2206,2206,2379,2693,3425,4014,4721,5686,6296,6425,7262,8853,8841,9553,10669,12040,12579,13199,14961,16289,19454,23141,26267]},
  {n:"France", s:[12050,12155,12695,12437,12592,12378,12597,12539,12638,12519,12419,12916,13252,13251,13592,13870,13499,13519,13511,14230,14327,14529,14722,14658,14100,14748,14655,14540,14690,14500,14306,14206,14415,14303,14103,12771,13386]}
];
const COLORS = ["#EA5E33","#4A90B8","#3D7A5A","#C49A45","#5B9E78","#F29A44"];
const Y0 = 1985, STEPS = 37;

const W = 820, H = 480;
const mg = { top: 30, right: 130, bottom: 36, left: 72 };
const plotW = W - mg.left - mg.right;
const plotH = H - mg.top - mg.bottom;

const vMin = 0, vMax = 1500000;
const yMin = Y0, yMax = Y0 + STEPS - 1;

const xScale = y => mg.left + (y - yMin) / (yMax - yMin) * plotW;
const yScale = v => mg.top + (vMax - v) / (vMax - vMin) * plotH;

function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(2) + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return n;
}

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";

[0, 300000, 600000, 900000, 1200000, 1500000].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: mg.left, y1: yScale(v), x2: W - mg.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  const t = mkEl("text", { x: mg.left - 6, y: yScale(v) + 3.5, "text-anchor": "end",
    "font-family": "'JetBrains Mono',monospace", "font-size": "9", fill: "#7A786F" });
  t.textContent = v === 0 ? "0" : (v / 1000000).toFixed(1) + "M";
  svg.appendChild(t);
});

[1985, 1990, 1995, 2000, 2005, 2010, 2015, 2021].forEach(y => {
  const x = xScale(y);
  svg.appendChild(mkEl("line", {
    x1: x, y1: mg.top + plotH, x2: x, y2: mg.top + plotH + 4,
    stroke: "#C2C0B5", "stroke-width": "0.5"
  }));
  const t = mkEl("text", { x, y: mg.top + plotH + 13, "text-anchor": "middle",
    "font-family": "'JetBrains Mono',monospace", "font-size": "9", fill: "#7A786F" });
  t.textContent = y;
  svg.appendChild(t);
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y = Math.max(mg.top, sorted[i - 1].y - shift);
        sorted[i].y = Math.min(mg.top + plotH, sorted[i].y + shift);
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const rows = [];
const endLabels = data.map((d, i) => ({
  i, n: d.n, y: yScale(d.s[d.s.length - 1] || 0), v: d.s[d.s.length - 1]
}));
resolveCollisions(endLabels, 11);

data.forEach((d, i) => {
  const col = COLORS[i];
  const g = mkEl("g", {});

  let pathD = "";
  d.s.forEach((v, j) => {
    if (v == null) return;
    const x = xScale(Y0 + j), y = yScale(v);
    pathD += (j === 0 || d.s[j-1] == null) ? `M ${x} ${y}` : ` L ${x} ${y}`;
  });

  const line = mkEl("path", { d: pathD, stroke: col, "stroke-width": i === 0 ? "2" : "1.5", fill: "none", "stroke-linejoin": "round" });
  g.appendChild(line);

  const lastV = d.s[STEPS - 1];
  if (lastV != null) {
    g.appendChild(mkEl("circle", { cx: xScale(Y0 + STEPS - 1), cy: yScale(lastV), r: "2.5", fill: col }));
  }

  const el = endLabels.find(l => l.i === i);
  if (el && el.v != null) {
    const lt = mkEl("text", { x: xScale(Y0 + STEPS - 1) + 6, y: el.y + 3.5,
      "text-anchor": "start", "font-size": "9", fill: col, "font-weight": "500" });
    lt.textContent = `${fmt(el.v)} ${d.n}`;
    g.appendChild(lt);
    if (Math.abs(el.y - yScale(el.v)) > 3) {
      g.appendChild(mkEl("line", { x1: xScale(Y0 + STEPS - 1) + 3, y1: el.y, x2: xScale(Y0 + STEPS - 1) + 2, y2: yScale(el.v),
        stroke: col, "stroke-width": "0.5", opacity: "0.5" }));
    }
  }

  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  svg.appendChild(g);
  rows.push({ g, line, d, i, col });
});

document.getElementById("chart").appendChild(svg);

const tip = document.getElementById("tip");
let activeIdx = -1;

function highlight(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  rows.forEach((row, i) => {
    if (idx === -1) { row.g.style.opacity = "1"; row.line.setAttribute("stroke-width", i === 0 ? "2" : "1.5"); }
    else if (i === idx) { row.g.style.opacity = "1"; row.line.setAttribute("stroke-width", "3"); }
    else { row.g.style.opacity = "0.12"; row.line.setAttribute("stroke-width", "1"); }
  });
}

svg.addEventListener("mousemove", e => {
  const rect = svg.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  const sy = (e.clientY - rect.top) / rect.height * H;
  const yearIdx = Math.max(0, Math.min(STEPS - 1, Math.round((sx - mg.left) / plotW * (STEPS - 1))));
  const year = Y0 + yearIdx;

  let best = -1, bestDist = 22;
  rows.forEach((row, i) => {
    const v = row.d.s[yearIdx];
    if (v == null) return;
    const dist = Math.abs(sy - yScale(v));
    if (dist < bestDist) { bestDist = dist; best = i; }
  });

  highlight(best);
  if (best >= 0) {
    const v = rows[best].d.s[yearIdx];
    if (v != null) {
      tip.textContent = `${rows[best].d.n}, ${year}: ${fmt(v)} patent applications`;
      tip.style.opacity = "1";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY - 22) + "px";
    }
  } else {
    tip.style.opacity = "0";
  }
});

svg.addEventListener("mouseleave", () => { highlight(-1); tip.style.opacity = "0"; });
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Energy Use per Capita, 1990–2023</h1>
<p class="subtitle">Kilograms of oil equivalent per person. Rich countries have plateaued or declined while China and South Korea have surged — and India and Bangladesh remain far below the global average.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — EG.USE.PCAP.KG.OE</p>
<script>
const data = [
  {"n":"Canada","s":[7642,7529,7617,7783,7971,7995,8071,8069,7963,8118,8225,8017,7943,8303,8371,8370,8427,8356,8098,7696,7661,7716,7638,7669,7780,7690,7945,8175,8162,8126,7495,7525,7575,7342],"y0":1990},
  {"n":"Australia","s":[5048,4925,4961,5171,5127,5138,5430,5498,5585,5645,5681,5486,5480,5616,5652,5624,5775,5854,5951,5844,5763,5699,5534,5533,5407,5319,5217,5162,5086,5232,5159,5006,4942,4928],"y0":1990},
  {"n":"Germany","s":[4422,4303,4191,4123,4089,4120,4247,4204,4178,4080,4094,4210,4109,4096,4132,4110,4236,4024,4082,3822,4030,3892,3913,3986,3794,3781,3765,3763,3659,3571,3349,3467,3262,2928],"y0":1990},
  {"n":"France","s":[3840,4039,3949,3997,3831,3976,4187,4044,4147,4118,4130,4240,4220,4297,4327,4314,4214,4142,4138,3938,4040,3951,3929,3926,3756,3799,3718,3705,3669,3606,3228,3470,3100,3136],"y0":1990},
  {"n":"Japan","s":[3538,3561,3626,3636,3824,3916,3990,4022,3938,3994,4067,3990,3993,3957,4085,4066,4064,4021,3867,3709,3900,3620,3537,3567,3446,3401,3371,3391,3343,3262,3047,3196,3130,3039],"y0":1990},
  {"n":"S. Korea","s":[2088,2260,2546,2825,2969,3234,3461,3675,3374,3666,3952,3923,4093,4138,4255,4325,4338,4488,4513,4558,4920,5115,5123,5108,5137,5239,5391,5468,5532,5335,5196,5514,5412,5337],"y0":1990},
  {"n":"China","s":[773,741,757,793,821,873,885,876,872,881,898,922,976,1105,1249,1370,1490,1595,1630,1729,1900,2027,2085,2137,2178,2175,2149,2216,2311,2398,2466,2624,2676,2851],"y0":1990},
  {"n":"Brazil","s":[942,943,937,945,980,999,1036,1072,1082,1091,1081,1087,1103,1108,1157,1174,1202,1260,1317,1262,1384,1390,1433,1487,1522,1482,1415,1432,1403,1416,1379,1430,1433,1481],"y0":1990},
  {"n":"India","s":[324,331,336,339,348,362,368,376,378,393,395,393,397,400,415,425,442,461,482,509,532,547,572,577,610,622,627,648,668,667,632,677,728,763],"y0":1990},
  {"n":"Bangladesh","s":[114,111,114,117,122,129,128,131,132,135,136,148,148,153,154,160,168,174,181,188,196,200,208,217,223,237,256,264,261,278,279,299,308,288],"y0":1990}
];

const COLORS = ["#EA5E33","#F29A44","#C49A45","#8BAD72","#3D7A5A","#5B9E78","#B34B3B","#A6C4A2","#C4715A","#F5D38A"];

const W = 760, H = 420;
const M = { top: 36, right: 120, bottom: 30, left: 56 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const Y0 = 1990, Y1 = 2023;
const VMIN = 0, VMAX = 9000;

const xS = y => M.left + (y - Y0) / (Y1 - Y0) * (W - M.left - M.right);
const yS = v => M.top + (VMAX - v) / (VMAX - VMIN) * (H - M.top - M.bottom);

// Grid
[0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000].forEach(v => {
  svg.appendChild(mkEl("line", { x1: M.left, y1: yS(v), x2: W - M.right, y2: yS(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  const t = mkEl("text", { x: M.left - 5, y: yS(v) + 3, "text-anchor": "end", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace", "font-size": "9" });
  t.textContent = (v / 1000).toFixed(0) + "k";
  svg.appendChild(t);
});

// X ticks
[1990, 1995, 2000, 2005, 2010, 2015, 2020].forEach(y => {
  const t = mkEl("text", { x: xS(y), y: H - M.bottom + 14, "text-anchor": "middle", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace", "font-size": "9" });
  t.textContent = y;
  svg.appendChild(t);
});

// Y label
const yl = mkEl("text", { x: 10, y: M.top + (H - M.top - M.bottom) / 2, "text-anchor": "middle", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace", "font-size": "8", transform: `rotate(-90,10,${M.top + (H - M.top - M.bottom) / 2})` });
yl.textContent = "KG OIL EQUIV. / PERSON";
svg.appendChild(yl);

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
function showTip(txt, e) { tip.textContent = txt; tip.style.opacity = "1"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 28) + "px"; }
function hideTip() { tip.style.opacity = "0"; }

const groups = [];
const labelTargets = [];

data.forEach((series, si) => {
  const color = COLORS[si % COLORS.length];
  const pts = series.s.map((v, i) => ({ year: series.y0 + i, value: v })).filter(p => p.value !== null);

  let pathD = "";
  let lastYear = null;
  pts.forEach(p => {
    const cmd = (lastYear === null || p.year !== lastYear + 1) ? "M" : "L";
    pathD += `${cmd} ${xS(p.year).toFixed(1)} ${yS(p.value).toFixed(1)} `;
    lastYear = p.year;
  });

  const g = mkEl("g", {});
  const ln = mkEl("path", { d: pathD.trim(), stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  const hit = mkEl("path", { d: pathD.trim(), stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(ln);
  g.appendChild(hit);

  const last = pts[pts.length - 1];
  labelTargets.push({ n: series.n, origY: yS(last.value), y: yS(last.value), color, val: last.value });

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left - M.left) / (W - M.left - M.right)));
    const yr = Math.round(Y0 + ratio * (Y1 - Y0));
    const idx = Math.max(0, Math.min(series.s.length - 1, yr - series.y0));
    const v = series.s[idx];
    showTip(`${series.n} (${yr}): ${v !== null ? v.toLocaleString() + " kg OE" : "N/A"}`, e);
    groups.forEach(row => {
      row.ln.setAttribute("opacity", row.g === g ? "1" : "0.07");
      row.ln.setAttribute("stroke-width", row.g === g ? "2.5" : "1.5");
    });
  });
  hit.addEventListener("mouseleave", () => {
    hideTip();
    groups.forEach(row => { row.ln.setAttribute("opacity", "1"); row.ln.setAttribute("stroke-width", "1.5"); });
  });

  groups.push({ g, ln });
  svg.appendChild(g);
});

const clampY = y => Math.max(M.top + 4, Math.min(H - M.bottom - 4, y));
const resolved = resolveCollisions(labelTargets, 12);
resolved.forEach(item => {
  const cy = clampY(item.y);
  if (Math.abs(cy - item.origY) > 2) {
    svg.appendChild(mkEl("line", { x1: W - M.right - 1, y1: item.origY, x2: W - M.right + 5, y2: cy, stroke: item.color, "stroke-width": "0.5", opacity: "0.4" }));
  }
  const t = mkEl("text", { x: W - M.right + 6, y: cy + 3, fill: item.color, "font-size": "9", "font-family": "'JetBrains Mono',monospace" });
  t.textContent = `${item.val.toLocaleString()}  ${item.n}`;
  svg.appendChild(t);
});
</script>
</body></html>

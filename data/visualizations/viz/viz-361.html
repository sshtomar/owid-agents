        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
        groups.forEach((grp, j) => {
          grp.style.opacity = j === i ? "1" : "0.08";
          grp.querySelector("path").setAttribute("stroke-width", j === i ? "2.5" : "1.5");
        });
      });
      hit.addEventListener("mouseleave", () => {
        tip.style.opacity = "0";
        groups.forEach(grp => {
          grp.style.opacity = "1";
          grp.querySelector("path").setAttribute("stroke-width", "1.5");
        });
      });
      g.appendChild(hit);
      groups.push(g);
      svg.appendChild(g);
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

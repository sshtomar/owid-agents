<!DOCTYPE html>
<html><head><meta charset="utf-8">

  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Cereal Yield, 1961–2022</h1>
<p class="subtitle">Kilograms of cereal harvested per hectare of land. The Green Revolution transformed food security — China's yield grew 5× since 1961, and even historically low-yield regions like Ethiopia doubled output.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Cereal Yield (kg per Hectare) (AG.YLD.CREL.KG)</p>
<script>
const data = [{"n":"Argentina","s":[1411,1605,1511,1695,1403,1557,1606,1313,1555,1775,1784,1610,2041,2046,1956,1907,2135,2424,2252,1874,2425,2443,2330,2582,2440,2582,2383,2528,2129,2251,2672,3029,2850,2809,2803,2759,3305,3696,3377,3448,3211,3237,3661,3679,4200,3700,4382,3938,3817,4981,4490,4138,4720,4617,4983,5105,5317,4663,5262,5140,5410,4822],"y0":1961},{"n":"Brazil","s":[1346,1382,1322,1256,1428,1321,1402,1350,1303,1409,1291,1300,1412,1456,1359,1445,1452,1210,1301,1576,1611,1545,1615,1677,1828,1665,1882,1859,2000,1755,1851,2142,2355,2285,2513,2422,2522,2580,2732,2643,3148,2845,3385,3132,2883,3210,3553,3831,3532,4041,4038,4584,4826,4640,5001,4182,5210,4806,5321,5255,4479,4908],"y0":1961},{"n":"China","s":[1193,1323,1491,1623,1746,1879,1936,1939,1900,2128,2174,2106,2276,2389,2480,2522,2487,2792,3032,2937,3082,3456,3716,3955,3820,3890,3973,3931,4015,4306,4231,4362,4562,4505,4659,4892,4813,4953,4945,4753,4800,4869,4871,5187,5225,5313,5321,5550,5450,5528,5710,5829,5898,5896,5985,6019,6111,6122,6265,6296,6318,6381],"y0":1961},{"n":"Ethiopia","s":[715,702,704,724,732,741,744,724,759,770,784,804,827,812,853,1064,1036,897,1124,1261,1191,1165,1336,1170,881,966,1153,1214,1172,1238,1308,1156,1312,974,1033,1213,1263,1140,1124,1116,1197,1353,1123,1162,1361,1563,1448,1426,1650,1760,1764,1940,2066,2228,2337,2327,2519,2522,2711,2713,2661,2691],"y0":1961},{"n":"France","s":[2276,2690,2769,2823,3106,2908,3477,3571,3532,3374,3876,4169,4408,4179,3697,3441,4051,4630,4516,4854,4729,5008,4950,5977,5743,5302,5706,6081,6099,6083,6536,6485,6513,6543,6456,7082,6890,7415,7260,7232,6729,7453,6125,7519,6965,6800,6521,7253,7412,7069,6919,7254,7085,7579,7590,5691,7307,6829,7492,6395,7171,6655],"y0":1961},{"n":"Germany","s":[2417,2962,2925,3121,2852,2878,3483,3620,3448,3180,3789,3770,3873,4179,3864,3496,3885,4285,4108,4228,4162,4568,4363,5037,5073,5085,4898,5174,5204,5411,5986,5336,5712,5826,6108,6282,6485,6330,6700,6453,7055,6252,5764,7355,6723,6487,6183,7119,7201,6685,6458,6965,7318,8050,7498,7182,7270,6179,6952,7133,6998,7126],"y0":1961},{"n":"India","s":[947,930,966,994,854,864,994,1037,1054,1135,1136,1108,1153,1074,1261,1199,1331,1370,1222,1350,1399,1346,1564,1564,1592,1585,1584,1776,1916,1891,1914,2035,2061,2128,2106,2047,2232,2190,2337,2287,2426,2226,2386,2337,2400,2449,2582,2644,2563,2666,2885,2998,2970,2991,2852,3013,3128,3301,3394,3391,3528,3564],"y0":1961},{"n":"Japan","s":[4174,4340,4224,4318,4398,4509,5137,5227,5072,5125,4917,5507,5748,5630,5933,5276,5932,5897,5706,4843,5207,5308,5300,5958,5847,5899,5684,5469,5674,5846,5416,5877,4429,6449,6003,6154,6062,5810,5999,6257,6107,6086,5451,5942,6154,5852,6062,6262,5920,5854,6011,6248,6282,6325,6317,6253,6284,6132,6296,6230,6417,6320],"y0":1961},{"n":"S. Korea","s":[3197,2794,2928,3249,3037,3537,3265,3191,3765,3720,3872,3885,4057,4077,4407,4860,5240,5668,5728,4056,5173,5417,5529,5716,5798,5876,5585,6142,6086,5853,5639,5938,5322,5872,5765,6403,6603,6031,6314,6380,6466,6017,5787,6427,6302,6300,6035,6630,6745,6202,6293,6136,6479,6618,6815,6793,6678,6607,6538,6212,6826,6612],"y0":1961}];

const COLORS = {
  "Germany":   "#EA5E33",
  "France":    "#F29A44",
  "S. Korea":  "#3D7A5A",
  "Japan":     "#5B9E78",
  "China":     "#C49A45",
  "Argentina": "#8BAD72",
  "Brazil":    "#A6C4A2",
  "India":     "#C4715A",
  "Ethiopia":  "#7A786F"
};

const W = 800, H = 460;
const margin = { top: 36, right: 110, bottom: 36, left: 60 };
const yearMin = 1961, yearMax = 2022;
const years = Array.from({length: 62}, (_, i) => 1961 + i);
const valMin = 0, valMax = 8500;

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px;display:block;cursor:crosshair;` });
document.getElementById("chart").appendChild(svg);

// grid lines
[0, 2000, 4000, 6000, 8000].forEach(v => {
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  svg.appendChild(mkEl("text", { x: margin.left - 6, y: yScale(v) + 3, "text-anchor": "end", fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" }, (v/1000).toFixed(0) + "k"));
});

// x-axis ticks
[1961, 1970, 1980, 1990, 2000, 2010, 2022].forEach(y => {
  svg.appendChild(mkEl("line", { x1: xScale(y), y1: H - margin.bottom, x2: xScale(y), y2: H - margin.bottom + 4, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  svg.appendChild(mkEl("text", { x: xScale(y), y: H - margin.bottom + 13, "text-anchor": "middle", fill: "#7A786F", "font-size": "9", "font-family": "JetBrains Mono, monospace" }, y));
});

// "Green Revolution" annotation
const grX = xScale(1966);
svg.appendChild(mkEl("line", { x1: grX, y1: margin.top, x2: grX, y2: H - margin.bottom, stroke: "#8BAD72", "stroke-dasharray": "3,4", "stroke-width": "0.7", opacity: "0.6" }));
svg.appendChild(mkEl("text", { x: grX + 3, y: margin.top + 10, fill: "#8BAD72", "font-size": "8", "font-family": "JetBrains Mono, monospace", opacity: "0.8" }, "Green Revolution"));

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) { const sh = (minGap - gap) / 2; sorted[i-1].y -= sh; sorted[i].y += sh; moved = true; }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
const groups = [];
const labelItems = [];

data.forEach(series => {
  const color = COLORS[series.n] || "#7A786F";
  const pts = years.map((y, i) => ({ year: y, value: series.s[i] })).filter(p => p.value !== null);

  let pathD = "";
  let inSeg = false;
  years.forEach((y, i) => {
    const v = series.s[i];
    if (v === null) { inSeg = false; return; }
    pathD += (inSeg ? ` L ${xScale(y)} ${yScale(v)}` : ` M ${xScale(y)} ${yScale(v)}`);
    inSeg = true;
  });

  const g = mkEl("g");
  svg.appendChild(g);

  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.7", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
  g.appendChild(line);
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", style: "cursor:pointer;" });
  g.appendChild(hit);

  const lastPt = pts[pts.length - 1];
  labelItems.push({ n: series.n, y: yScale(lastPt.value), color, lastVal: lastPt.value });
  groups.push({ g, line, hit, series, color, pts });
});

const resolved = resolveCollisions(labelItems.map(x => ({...x})), 12);
resolved.forEach(item => {
  const orig = labelItems.find(l => l.n === item.n);
  const origY = yScale(orig.lastVal);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(mkEl("line", { x1: W - margin.right + 3, y1: origY, x2: W - margin.right + 6, y2: item.y, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  svg.appendChild(mkEl("text", { x: W - margin.right + 8, y: item.y + 3.5, fill: item.color, "font-size": "9", "font-weight": "600" }, item.n));
});

groups.forEach(({ g, line, hit, series: s, color, pts }) => {
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
    const nearestPt = pts.reduce((best, p) => Math.abs(p.year - yr) < Math.abs(best.year - yr) ? p : best, pts[0]);
    tip.textContent = `${s.n}  ${nearestPt.year}: ${nearestPt.value.toLocaleString()} kg/ha`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
    groups.forEach(({ line: l }) => l.setAttribute("opacity", "0.1"));
    line.setAttribute("opacity", "1");
    line.setAttribute("stroke-width", "2.8");
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach(({ line: l }) => { l.setAttribute("opacity", "1"); l.setAttribute("stroke-width", "1.7"); });
  });
});
</script>
</body></html>

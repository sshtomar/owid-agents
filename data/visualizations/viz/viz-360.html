<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 580px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 16px; letter-spacing: 0.3px; text-transform: uppercase; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 10; }
</style></head><body>
<h1>The Factory Shift</h1>
<p class="subtitle">Manufacturing value added as % of GDP, 1995 vs 2022. Low-cost Asian economies captured manufacturing share while rich-country industry shrank. Korea stands out for maintaining high manufacturing across 27 years.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank NV.IND.MANF.ZS</p>
<script>
const data = [
  {n:"Cambodia",   a:9.1,  b:27.1, y:1995},
  {n:"Korea",      a:26.3, b:26.5, y:1995},
  {n:"Iran",       a:15.3, b:22.2, y:1995},
  {n:"Bangladesh", a:15.9, b:21.8, y:1995},
  {n:"Japan",      a:23.5, b:18.8, y:1995},
  {n:"Czechia",    a:21.4, b:19.4, y:1995},
  {n:"Indonesia",  a:24.1, b:18.3, y:1995},
  {n:"Germany",    a:20.2, b:18.3, y:1995},
  {n:"Austria",    a:18.5, b:16.7, y:1995},
  {n:"Hungary",    a:18.1, b:16.8, y:1995},
  {n:"Finland",    a:22.3, b:15.8, y:1995},
  {n:"India",      a:17.9, b:13.3, y:1995}
];

const W = 680, H = 560;
const pad = { left: 120, right: 130, top: 40, bottom: 30 };
const allVals = data.flatMap(d => [d.a, d.b]);
const vMin = Math.floor(Math.min(...allVals)) - 1;
const vMax = Math.ceil(Math.max(...allVals)) + 1;
const scale = v => pad.top + (vMax - v) / (vMax - vMin) * (H - pad.top - pad.bottom);
const x1 = pad.left + 4, x2 = W - pad.right - 4;

function colorForChange(d) {
  const ch = d.b - d.a;
  if (ch > 10) return "#3D7A5A";
  if (ch > 3) return "#5B9E78";
  if (ch > -2) return "#C49A45";
  if (ch > -5) return "#C4715A";
  return "#B34B3B";
}

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";

// Column headers
function hdr(x, txt) {
  const t = mkEl("text", { x, y: 22, "text-anchor": "middle",
    "font-family": "'JetBrains Mono',monospace", "font-size": "10", fill: "#7A786F",
    "letter-spacing": "0.5" });
  t.textContent = txt;
  svg.appendChild(t);
}
hdr(x1, "1995");
hdr(x2, "2022");

// Y axis grid
[10, 15, 20, 25, 30].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1, y1: scale(v), x2, y2: scale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5", "stroke-dasharray": "3,4"
  }));
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y = Math.max(pad.top, sorted[i - 1].y - shift);
        sorted[i].y = Math.min(H - pad.bottom, sorted[i].y + shift);
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const leftLabels = data.map(d => ({ n: d.n, y: scale(d.a), v: d.a, d }));
const rightLabels = data.map(d => ({ n: d.n, y: scale(d.b), v: d.b, d }));
resolveCollisions(leftLabels, 13);
resolveCollisions(rightLabels, 13);

const rows = [];

data.forEach((d, i) => {
  const col = colorForChange(d);
  const y1v = scale(d.a), y2v = scale(d.b);
  const g = mkEl("g", {});

  const line = mkEl("line", { x1, y1: y1v, x2, y2: y2v,
    stroke: col, "stroke-width": "1.5", opacity: "0.75" });
  g.appendChild(line);

  [{ x: x1, y: y1v }, { x: x2, y: y2v }].forEach(p => {
    g.appendChild(mkEl("circle", { cx: p.x, cy: p.y, r: "2.5", fill: col }));
  });

  const ll = leftLabels.find(l => l.n === d.n);
  const lt = mkEl("text", { x: x1 - 7, y: ll.y + 3.5, "text-anchor": "end",
    "font-size": "10", fill: "#2B2A27" });
  lt.textContent = `${d.n}  ${d.a.toFixed(1)}%`;
  g.appendChild(lt);
  if (Math.abs(ll.y - y1v) > 3) {
    g.appendChild(mkEl("line", { x1: x1 - 4, y1: ll.y, x2: x1 - 2, y2: y1v,
      stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const rl = rightLabels.find(l => l.n === d.n);
  const rt = mkEl("text", { x: x2 + 7, y: rl.y + 3.5, "text-anchor": "start",
    "font-size": "10", fill: "#2B2A27" });
  rt.textContent = `${d.b.toFixed(1)}%  ${d.n}`;
  g.appendChild(rt);
  if (Math.abs(rl.y - y2v) > 3) {
    g.appendChild(mkEl("line", { x1: x2 + 4, y1: rl.y, x2: x2 + 2, y2: y2v,
      stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const hit = mkEl("line", { x1, y1: y1v, x2, y2: y2v, stroke: "transparent", "stroke-width": "14" });
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  svg.appendChild(g);
  rows.push({ g, line, d, col, y1v, y2v });
});

// Legend
const legend = [
  { col: "#3D7A5A", label: "> +10pp (rising fast)" },
  { col: "#5B9E78", label: "+3 to +10pp" },
  { col: "#C49A45", label: "-2 to +3pp (stable)" },
  { col: "#C4715A", label: "-5 to -2pp" },
  { col: "#B34B3B", label: "< -5pp (declining)" },
];
legend.forEach((l, i) => {
  const lx = i * 130, ly = H - 8;
  svg.appendChild(mkEl("rect", { x: lx, y: ly - 6, width: 10, height: 3, fill: l.col, rx: "1" }));
  const t = mkEl("text", { x: lx + 14, y: ly, "font-size": "8.5", fill: "#7A786F",
    "font-family": "'JetBrains Mono',monospace" });
  t.textContent = l.label;
  svg.appendChild(t);
});

document.getElementById("chart").appendChild(svg);

const tip = document.getElementById("tip");
let activeIdx = -1;

function highlight(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  rows.forEach((row, i) => {
    if (idx === -1) { row.g.style.opacity = "1"; row.line.setAttribute("stroke-width", "1.5"); }
    else if (i === idx) { row.g.style.opacity = "1"; row.line.setAttribute("stroke-width", "3"); }
    else { row.g.style.opacity = "0.12"; row.line.setAttribute("stroke-width", "1"); }
  });
}

svg.addEventListener("mousemove", e => {
  const rect = svg.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  const sy = (e.clientY - rect.top) / rect.height * H;
  let best = -1, bestDist = 16;
  rows.forEach((row, i) => {
    const t = Math.max(0, Math.min(1, (sx - pad.left) / (W - pad.left - pad.right)));
    const lineY = row.y1v + (row.y2v - row.y1v) * t;
    const dist = Math.abs(sy - lineY);
    if (dist < bestDist) { bestDist = dist; best = i; }
  });

  highlight(best);
  if (best >= 0) {
    const d = rows[best].d;
    const ch = d.b - d.a;
    tip.textContent = `${d.n}: ${d.a.toFixed(1)}% (1995) → ${d.b.toFixed(1)}% (2022) ${ch > 0 ? "+" : ""}${ch.toFixed(1)}pp`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  } else {
    tip.style.opacity = "0";
  }
});

svg.addEventListener("mouseleave", () => { highlight(-1); tip.style.opacity = "0"; });
</script>
</body></html>

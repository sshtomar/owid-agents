<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Inter", sans-serif; margin: 0; padding: 24px; background: #fafaf8; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; background: #1e293b; color: #f1f5f9;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: "JetBrains Mono", monospace;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 100;
    }
  </style>
</head>
<body>
  <h1>Crude Death Rate, 1970–2024</h1>
  <p class="subtitle">Deaths per 1,000 people. Japan's rate has nearly doubled since 1980 as the population ages — even as medicine improves.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — SP.DYN.CDRT.IN (UN Population Division)</p>
  <div id="tip"></div>
  <script>
    const data = [
      {"n":"Japan","pts":[{"y":1970,"v":6.9},{"y":1972,"v":6.5},{"y":1974,"v":6.5},{"y":1976,"v":6.3},{"y":1978,"v":6.1},{"y":1980,"v":6.2},{"y":1982,"v":6.0},{"y":1984,"v":6.2},{"y":1986,"v":6.2},{"y":1988,"v":6.5},{"y":1990,"v":6.7},{"y":1992,"v":6.9},{"y":1994,"v":7.1},{"y":1996,"v":7.2},{"y":1998,"v":7.5},{"y":2000,"v":7.7},{"y":2002,"v":7.8},{"y":2004,"v":8.2},{"y":2006,"v":8.6},{"y":2008,"v":9.1},{"y":2010,"v":9.5},{"y":2012,"v":10.0},{"y":2014,"v":10.1},{"y":2016,"v":10.5},{"y":2018,"v":11.0},{"y":2020,"v":11.1},{"y":2022,"v":12.9},{"y":2024,"v":13.3}]},
      {"n":"Germany","pts":[{"y":1970,"v":12.5},{"y":1972,"v":12.3},{"y":1974,"v":12.1},{"y":1976,"v":12.3},{"y":1978,"v":12.2},{"y":1980,"v":12.2},{"y":1982,"v":12.0},{"y":1984,"v":11.8},{"y":1986,"v":11.9},{"y":1988,"v":11.5},{"y":1990,"v":11.6},{"y":1992,"v":11.0},{"y":1994,"v":10.9},{"y":1996,"v":10.8},{"y":1998,"v":10.4},{"y":2000,"v":10.2},{"y":2002,"v":10.2},{"y":2004,"v":9.9},{"y":2006,"v":10.0},{"y":2008,"v":10.3},{"y":2010,"v":10.5},{"y":2012,"v":10.8},{"y":2014,"v":10.7},{"y":2016,"v":11.1},{"y":2018,"v":11.5},{"y":2020,"v":11.9},{"y":2022,"v":12.8},{"y":2024,"v":12.1}]},
      {"n":"France","pts":[{"y":1970,"v":10.8},{"y":1972,"v":10.7},{"y":1974,"v":10.5},{"y":1976,"v":10.4},{"y":1978,"v":10.2},{"y":1980,"v":10.2},{"y":1982,"v":10.0},{"y":1984,"v":9.9},{"y":1986,"v":9.7},{"y":1988,"v":9.5},{"y":1990,"v":9.3},{"y":1992,"v":9.2},{"y":1994,"v":9.1},{"y":1996,"v":9.1},{"y":1998,"v":9.1},{"y":2000,"v":8.9},{"y":2002,"v":8.8},{"y":2004,"v":8.3},{"y":2006,"v":8.3},{"y":2008,"v":8.5},{"y":2010,"v":8.5},{"y":2012,"v":8.7},{"y":2014,"v":8.4},{"y":2016,"v":8.9},{"y":2018,"v":9.1},{"y":2020,"v":9.9},{"y":2022,"v":9.9},{"y":2024,"v":9.4}]},
      {"n":"China","pts":[{"y":1970,"v":7.6},{"y":1972,"v":7.6},{"y":1974,"v":7.3},{"y":1976,"v":7.3},{"y":1978,"v":6.3},{"y":1980,"v":6.3},{"y":1982,"v":6.6},{"y":1984,"v":6.8},{"y":1986,"v":6.9},{"y":1988,"v":6.6},{"y":1990,"v":6.7},{"y":1992,"v":6.6},{"y":1994,"v":6.5},{"y":1996,"v":6.6},{"y":1998,"v":6.5},{"y":2000,"v":6.5},{"y":2002,"v":6.4},{"y":2004,"v":6.4},{"y":2006,"v":6.8},{"y":2008,"v":7.1},{"y":2010,"v":7.1},{"y":2012,"v":7.1},{"y":2014,"v":7.1},{"y":2016,"v":7.0},{"y":2018,"v":7.1},{"y":2020,"v":7.1},{"y":2022,"v":7.4},{"y":2024,"v":7.8}]},
      {"n":"Brazil","pts":[{"y":1970,"v":10.5},{"y":1972,"v":10.0},{"y":1974,"v":9.7},{"y":1976,"v":9.3},{"y":1978,"v":8.9},{"y":1980,"v":8.6},{"y":1982,"v":8.2},{"y":1984,"v":7.9},{"y":1986,"v":7.5},{"y":1988,"v":7.2},{"y":1990,"v":7.0},{"y":1992,"v":6.8},{"y":1994,"v":6.6},{"y":1996,"v":6.5},{"y":1998,"v":6.4},{"y":2000,"v":6.3},{"y":2002,"v":6.1},{"y":2004,"v":6.0},{"y":2006,"v":5.8},{"y":2008,"v":5.8},{"y":2010,"v":5.8},{"y":2012,"v":5.9},{"y":2014,"v":6.0},{"y":2016,"v":6.2},{"y":2018,"v":6.3},{"y":2020,"v":7.5},{"y":2022,"v":7.5},{"y":2024,"v":7.1}]},
      {"n":"India","pts":[{"y":1970,"v":17.0},{"y":1972,"v":16.6},{"y":1974,"v":15.9},{"y":1976,"v":15.2},{"y":1978,"v":14.4},{"y":1980,"v":13.8},{"y":1982,"v":13.1},{"y":1984,"v":12.5},{"y":1986,"v":11.9},{"y":1988,"v":11.3},{"y":1990,"v":10.7},{"y":1992,"v":10.2},{"y":1994,"v":9.8},{"y":1996,"v":9.4},{"y":1998,"v":9.0},{"y":2000,"v":8.6},{"y":2002,"v":8.3},{"y":2004,"v":8.0},{"y":2006,"v":7.7},{"y":2008,"v":7.4},{"y":2010,"v":7.2},{"y":2012,"v":7.0},{"y":2014,"v":6.8},{"y":2016,"v":6.7},{"y":2018,"v":6.7},{"y":2020,"v":7.2},{"y":2022,"v":6.6},{"y":2024,"v":6.6}]},
      {"n":"Sub-Saharan Africa","pts":[{"y":1970,"v":20.7},{"y":1972,"v":20.4},{"y":1974,"v":19.7},{"y":1976,"v":18.9},{"y":1978,"v":18.3},{"y":1980,"v":17.7},{"y":1982,"v":17.2},{"y":1984,"v":17.8},{"y":1986,"v":17.1},{"y":1988,"v":16.8},{"y":1990,"v":16.2},{"y":1992,"v":16.3},{"y":1994,"v":17.1},{"y":1996,"v":15.4},{"y":1998,"v":15.3},{"y":2000,"v":14.3},{"y":2002,"v":13.8},{"y":2004,"v":13.1},{"y":2006,"v":12.4},{"y":2008,"v":11.6},{"y":2010,"v":10.9},{"y":2012,"v":10.3},{"y":2014,"v":9.9},{"y":2016,"v":9.5},{"y":2018,"v":8.9},{"y":2020,"v":8.7},{"y":2022,"v":8.5},{"y":2024,"v":8.0}]}
    ];

    const COLORS = {
      "Japan":             "#EA5E33",
      "Germany":           "#F29A44",
      "France":            "#C4715A",
      "China":             "#3D7A5A",
      "Brazil":            "#5B9E78",
      "India":             "#8BAD72",
      "Sub-Saharan Africa":"#9B7CC8"
    };

    const W = 820, H = 440;
    const margin = { top: 30, right: 155, bottom: 40, left: 50 };
    const innerW = W - margin.left - margin.right;
    const innerH = H - margin.top - margin.bottom;
    const yearMin = 1970, yearMax = 2024;
    const valMin = 4, valMax = 22;

    function xScale(year) { return margin.left + (year - yearMin) / (yearMax - yearMin) * innerW; }
    function yScale(v) { return margin.top + (valMax - v) / (valMax - valMin) * innerH; }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");
    svg.style.maxWidth = "860px";
    svg.style.display = "block";

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    // Grid lines
    [5, 8, 10, 12, 15, 18, 20].forEach(v => {
      const y = yScale(v);
      svg.appendChild(mkEl("line", { x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#e5e3dc", "stroke-width": "0.8" }));
      svg.appendChild(mkEl("text", { x: margin.left - 6, y: y + 4, "text-anchor": "end", "font-size": "10", "font-family": "JetBrains Mono", fill: "#7A786F" })).textContent = v;
    });

    // X axis ticks
    [1970, 1980, 1990, 2000, 2010, 2020, 2024].forEach(yr => {
      const x = xScale(yr);
      svg.appendChild(mkEl("line", { x1: x, y1: margin.top, x2: x, y2: margin.top + innerH, stroke: "#e5e3dc", "stroke-width": "0.5", "stroke-dasharray": "3,3" }));
      svg.appendChild(mkEl("text", { x, y: margin.top + innerH + 16, "text-anchor": "middle", "font-size": "10", "font-family": "JetBrains Mono", fill: "#7A786F" })).textContent = yr;
    });

    const yLbl = mkEl("text", { x: 13, y: margin.top + innerH / 2, "text-anchor": "middle", "font-size": "10", fill: "#7A786F", transform: `rotate(-90, 13, ${margin.top + innerH / 2})` });
    yLbl.textContent = "Deaths per 1,000 people";
    svg.appendChild(yLbl);

    const endLabels = data.map(d => {
      const last = d.pts[d.pts.length - 1];
      return { name: d.n, y: yScale(last.v) };
    });
    const resolved = resolveCollisions(endLabels, 13);

    const groups = [];
    data.forEach(d => {
      const color = COLORS[d.n] || "#888";
      const g = mkEl("g", {});
      g.style.cursor = "pointer";

      const pathD = d.pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
      const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
      g.appendChild(line);

      const last = d.pts[d.pts.length - 1];
      g.appendChild(mkEl("circle", { cx: xScale(last.y), cy: yScale(last.v), r: "3", fill: color }));

      const labelInfo = resolved.find(r => r.name === d.n);
      const labelY = labelInfo ? labelInfo.y : yScale(last.v);
      const labelActualY = yScale(last.v);

      if (Math.abs(labelY - labelActualY) > 3) {
        g.appendChild(mkEl("line", { x1: xScale(last.y) + 6, y1: labelActualY, x2: W - margin.right + 6, y2: labelY, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
      }

      const lbl = mkEl("text", { x: W - margin.right + 8, y: labelY + 3.5, "font-size": "9.5", "font-family": "JetBrains Mono", fill: color });
      lbl.textContent = `${last.v.toFixed(1)}  ${d.n}`;
      g.appendChild(lbl);

      const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
      g.appendChild(hit);

      groups.push({ g, line, lbl, series: d, color });
      svg.appendChild(g);
    });

    const tip = document.getElementById("tip");
    groups.forEach(({ g, line, lbl, series }) => {
      g.addEventListener("mouseenter", () => {
        groups.forEach(other => {
          other.line.setAttribute("opacity", other.series.n === series.n ? "1" : "0.1");
          other.lbl.setAttribute("opacity", other.series.n === series.n ? "1" : "0.15");
          other.line.setAttribute("stroke-width", other.series.n === series.n ? "2.5" : "1.8");
        });
      });
      g.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / innerW));
        const yr = yearMin + Math.round(ratio * (yearMax - yearMin) / 2) * 2;
        const pt = series.pts.find(p => p.y === yr) || series.pts[series.pts.length - 1];
        tip.textContent = `${series.n} ${pt.y}: ${pt.v.toFixed(1)} per 1,000`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      g.addEventListener("mouseleave", () => {
        groups.forEach(other => {
          other.line.setAttribute("opacity", "1");
          other.lbl.setAttribute("opacity", "1");
          other.line.setAttribute("stroke-width", "1.8");
        });
        tip.style.opacity = "0";
      });
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

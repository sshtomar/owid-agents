<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>DTP Immunization Coverage, 1980–2023</h1>
<p class="subtitle">% of children ages 12–23 months vaccinated against diphtheria, tetanus, and pertussis. Most countries have converged toward full coverage; Haiti and Afghanistan still lag.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — SH.IMM.IDPT</p>
<script>
const data = [
  {"n":"Haiti","s":[3,14,13,9,14,19,24,28,48,50,41,36,38,39,41,42,42,42,42,41,44,47,51,54,57,60,61,63,64,65,67,68,66,65,63,64,59,60,57,54,58,48,48,54],"y0":1980},
  {"n":"Afghanistan","s":[4,3,5,5,16,15,11,25,35,33,25,23,21,18,12,20,31,28,27,27,24,33,36,41,50,58,58,63,64,63,66,68,67,64,62,64,66,64,68,65,61,55,58,60],"y0":1980},
  {"n":"India","s":[6,6,12,14,16,18,20,30,40,50,70,57,56,61,67,71,66,62,61,59,58,59,59,61,63,65,65,64,70,74,79,82,82,83,85,87,88,89,90,91,85,85,93,91],"y0":1980},
  {"n":"Bolivia","s":[11,13,12,10,6,33,42,35,28,52,41,43,45,52,58,64,61,58,61,77,75,71,77,88,84,85,83,84,88,93,91,95,93,86,85,89,87,84,83,75,68,70,69,67],"y0":1980},
  {"n":"Bhutan","s":[6,13,15,16,28,41,53,63,70,76,96,91,86,79,86,87,87,87,86,90,92,88,86,95,89,95,95,95,96,93,91,95,97,97,99,99,98,98,97,97,95,98,98,99],"y0":1980},
  {"n":"Iran","s":[32,29,41,33,33,51,57,57,88,82,91,88,97,99,95,98,99,99,99,99,99,96,99,99,99,95,98,99,99,99,99,99,99,98,99,98,99,99,99,99,99,98,99,99],"y0":1980},
  {"n":"Jamaica","s":[24,39,34,51,58,60,74,81,82,85,86,85,84,91,93,90,92,90,86,89,93,98,97,94,96,99,94,91,90,90,94,92,96,93,92,91,99,93,97,96,96,90,98,99],"y0":1980},
  {"n":"Brazil","s":[37,47,56,60,68,66,58,58,58,56,66,78,71,75,74,81,77,79,93,94,98,98,99,99,99,99,99,99,99,99,99,99,95,97,93,96,89,83,87,70,77,68,77,90],"y0":1980},
  {"n":"Cuba","s":[67,68,99,99,86,91,99,87,98,96,92,99,94,99,99,99,90,99,99,95,95,98,99,72,88,89,89,93,95,96,96,97,99,99,99,99,99,99,99,99,99,99,99,99],"y0":1980},
  {"n":"Hungary","s":[99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99],"y0":1980},
  {"n":"Denmark","s":[88,88,87,86,86,90,89,88,87,89,90,90,91,88,89,90,77,92,99,99,97,97,98,96,95,93,93,87,88,89,90,91,94,94,94,93,94,98,97,97,97,97,97,97],"y0":1980},
  {"n":"Japan","s":[60,75,81,80,82,83,84,85,86,87,90,92,87,85,80,74,99,70,75,80,85,95,96,97,99,98,98,98,98,97,97,97,97,96,96,96,99,99,98,98,96,99,99,98],"y0":1980}
];

const COLORS = ["#B34B3B","#C4715A","#EA5E33","#F29A44","#F5D38A","#C49A45","#A6C4A2","#5B9E78","#8BAD72","#3D7A5A","#7A9EC4","#4A6FA5"];

const W = 760, H = 420;
const M = { top: 36, right: 118, bottom: 30, left: 44 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const Y0 = 1980, Y1 = 2023;
const VMIN = 0, VMAX = 104;

const xS = y => M.left + (y - Y0) / (Y1 - Y0) * (W - M.left - M.right);
const yS = v => M.top + (VMAX - v) / (VMAX - VMIN) * (H - M.top - M.bottom);

// Grid
[0, 20, 40, 60, 80, 100].forEach(v => {
  svg.appendChild(mkEl("line", { x1: M.left, y1: yS(v), x2: W - M.right, y2: yS(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  const t = mkEl("text", { x: M.left - 5, y: yS(v) + 3, "text-anchor": "end", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace", "font-size": "9" });
  t.textContent = v + "%";
  svg.appendChild(t);
});

// 100% reference line (dashed)
svg.appendChild(mkEl("line", { x1: M.left, y1: yS(100), x2: W - M.right, y2: yS(100), stroke: "#C2C0B5", "stroke-dasharray": "4,3", "stroke-width": "0.8" }));

// X ticks
[1980, 1990, 2000, 2010, 2020].forEach(y => {
  const t = mkEl("text", { x: xS(y), y: H - M.bottom + 14, "text-anchor": "middle", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace", "font-size": "9" });
  t.textContent = y;
  svg.appendChild(t);
});

// Y label
const yl = mkEl("text", { x: 10, y: M.top + (H - M.top - M.bottom) / 2, "text-anchor": "middle", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace", "font-size": "8", transform: `rotate(-90,10,${M.top + (H - M.top - M.bottom) / 2})` });
yl.textContent = "CHILDREN IMMUNIZED (%)";
svg.appendChild(yl);

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
function showTip(txt, e) { tip.textContent = txt; tip.style.opacity = "1"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 28) + "px"; }
function hideTip() { tip.style.opacity = "0"; }

const groups = [];
const labelTargets = [];

data.forEach((series, si) => {
  const color = COLORS[si % COLORS.length];
  const pts = series.s.map((v, i) => ({ year: series.y0 + i, value: v })).filter(p => p.value !== null);

  let pathD = "";
  let lastYear = null;
  pts.forEach(p => {
    const cmd = (lastYear === null || p.year !== lastYear + 1) ? "M" : "L";
    pathD += `${cmd} ${xS(p.year).toFixed(1)} ${yS(p.value).toFixed(1)} `;
    lastYear = p.year;
  });

  const g = mkEl("g", {});
  const ln = mkEl("path", { d: pathD.trim(), stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  const hit = mkEl("path", { d: pathD.trim(), stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(ln);
  g.appendChild(hit);

  const last = pts[pts.length - 1];
  labelTargets.push({ n: series.n, origY: yS(last.value), y: yS(last.value), color, val: last.value });

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left - M.left) / (W - M.left - M.right)));
    const yr = Math.round(Y0 + ratio * (Y1 - Y0));
    const idx = Math.max(0, Math.min(series.s.length - 1, yr - series.y0));
    const v = series.s[idx];
    showTip(`${series.n} (${yr}): ${v !== null ? v + "%" : "N/A"} immunized`, e);
    groups.forEach(row => {
      row.ln.setAttribute("opacity", row.g === g ? "1" : "0.07");
      row.ln.setAttribute("stroke-width", row.g === g ? "2.5" : "1.5");
    });
  });
  hit.addEventListener("mouseleave", () => {
    hideTip();
    groups.forEach(row => { row.ln.setAttribute("opacity", "1"); row.ln.setAttribute("stroke-width", "1.5"); });
  });

  groups.push({ g, ln });
  svg.appendChild(g);
});

const clampY = y => Math.max(M.top + 4, Math.min(H - M.bottom - 4, y));
const resolved = resolveCollisions(labelTargets, 12);
resolved.forEach(item => {
  const cy = clampY(item.y);
  if (Math.abs(cy - item.origY) > 2) {
    svg.appendChild(mkEl("line", { x1: W - M.right - 1, y1: item.origY, x2: W - M.right + 5, y2: cy, stroke: item.color, "stroke-width": "0.5", opacity: "0.4" }));
  }
  const t = mkEl("text", { x: W - M.right + 6, y: cy + 3, fill: item.color, "font-size": "9", "font-family": "'JetBrains Mono',monospace" });
  t.textContent = `${item.val}%  ${item.n}`;
  svg.appendChild(t);
});
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 560px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head>
<body>
<h1>China's Rise in Global Science</h1>
<p class="subtitle">Scientific and technical journal articles published per country, 1996–2022. China grew 26-fold in 26 years, from 34,000 articles to 886,000 — more than any other nation by a wide margin.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Scientific and Technical Journal Articles (IP.JRN.ARTC.SC)</p>
<script>
// Data exported from notebook -- do not modify
const data = [{"n":"China","s":[33621,37425,43775,45192,53285,70676,74940,87586,120909,165262,192021,212955,246970,284471,307848,320967,326401,351526,379466,401136,430350,464154,513575,608625,671731,756203,885962],"y0":1996,"step":1},{"n":"India","s":[18905,19348,19718,20838,21409,22533,23697,26124,28041,32138,37022,41304,46505,51851,58296,69056,75559,80195,88316,94794,104740,115045,123053,128580,145711,173096,200488],"y0":1996,"step":1},{"n":"Germany","s":[64230,68275,69448,67534,69739,71531,71323,72707,75360,83685,85557,88428,91146,94183,96129,99233,103761,104396,105532,106776,108937,109775,109110,110382,109198,117127,112301],"y0":1996,"step":1},{"n":"Japan","s":[88807,91890,92246,94195,96607,96103,98708,101128,103608,111936,112743,108598,106637,107477,107213,109048,107470,106968,103354,100597,101167,101854,101999,100156,100403,106310,102423],"y0":1996,"step":1},{"n":"Italy","s":[34244,35158,34128,34282,36210,37420,38986,42293,44324,47758,50511,53840,55718,57761,57849,59652,63136,66221,67444,69383,69301,70101,71038,73936,80142,85700,83237],"y0":1996,"step":1},{"n":"South Korea","s":[8867,11238,12158,14683,15875,18436,20151,23773,27626,32033,37086,41129,43712,45735,50065,53292,55712,56751,59379,61888,61915,62978,64793,67688,69090,72352,71998],"y0":1996,"step":1},{"n":"Canada","s":[34830,34295,33118,32494,34253,33653,36420,38377,42306,47389,50034,51357,53100,55233,56043,57031,59027,59396,59960,60588,60472,61098,62473,63285,64549,68648,66751],"y0":1996,"step":1},{"n":"France","s":[46611,49417,49672,49211,50007,50802,50708,52092,53583,57905,60693,61455,64067,66256,66841,68819,70407,71475,71223,70877,70242,69138,67118,66168,65601,67690,65198],"y0":1996,"step":1},{"n":"Brazil","s":[7646,9303,10498,11424,12800,13915,15816,17304,19381,21751,26768,28727,32726,35386,38170,40317,44295,45991,48188,49342,51745,55049,58874,62581,66901,69591,62660],"y0":1996,"step":1},{"n":"Australia","s":[20800,21728,21981,22207,23496,23970,24380,25664,27796,31769,33996,35801,37195,38979,41460,44900,46285,50403,52134,53537,54563,54672,55785,57313,57901,60308,58183],"y0":1996,"step":1},{"n":"Iran","s":[649,861,969,1181,1559,1910,2763,3896,5117,7046,9806,12669,16474,19982,24288,30244,30314,31025,33763,35452,40053,44578,46576,53364,56585,58049,58271],"y0":1996,"step":1}];

const W = 820, H = 510;
const margin = { top: 36, right: 148, bottom: 44, left: 72 };
const yearMin = 1996, yearMax = 2022;
const valMin = 0, valMax = 950000;

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const tip = document.getElementById("tip");
function showTip(txt, e) { tip.textContent = txt; tip.style.opacity = "1"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 28) + "px"; }
function hideTip() { tip.style.opacity = "0"; }

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

const xS = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yS = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

function fmtN(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(2) + "M";
  if (v >= 1000) return (v / 1000).toFixed(0) + "k";
  return v.toFixed(0);
}

// Grid lines
[200000, 400000, 600000, 800000].forEach(v => {
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yS(v), x2: W - margin.right, y2: yS(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  const t = mkEl("text", { x: margin.left - 6, y: yS(v) + 3.5, "text-anchor": "end", "font-size": "9", fill: "#7A786F", "font-family": "JetBrains Mono, monospace" });
  t.textContent = fmtN(v);
  svg.appendChild(t);
});

// X axis
[1996, 2000, 2004, 2008, 2012, 2016, 2020, 2022].forEach(y => {
  const t = mkEl("text", { x: xS(y), y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "9", fill: "#7A786F", "font-family": "JetBrains Mono, monospace" });
  t.textContent = y;
  svg.appendChild(t);
});

// Y axis label
const yTitle = mkEl("text", { x: 11, y: H / 2, "text-anchor": "middle", "font-size": "9", fill: "#7A786F", "font-family": "JetBrains Mono, monospace", transform: `rotate(-90, 11, ${H / 2})` });
yTitle.textContent = "articles per year";
svg.appendChild(yTitle);

svg.appendChild(mkEl("line", { x1: margin.left, y1: yS(0), x2: W - margin.right, y2: yS(0), stroke: "#C2C0B5", "stroke-width": "0.75" }));

const COLORS = ["#EA5E33","#F29A44","#C49A45","#5B9E78","#8BAD72","#3D7A5A","#A6C4A2","#C4715A","#B34B3B","#7A786F","#9A9890"];
const allGroups = [];

function resolveCollisions(items, minGap) {
  const s = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 50; pass++) {
    let moved = false;
    for (let i = 1; i < s.length; i++) {
      const gap = s[i].y - s[i-1].y;
      if (gap < minGap) { const sh = (minGap - gap) / 2; s[i-1].y -= sh; s[i].y += sh; moved = true; }
    }
    if (!moved) break;
  }
  return s;
}

const endLabels = [];

data.forEach((series, idx) => {
  const color = COLORS[idx % COLORS.length];
  const pts = series.s.map((v, i) => ({ y: series.y0 + i * series.step, v }));
  const validPts = pts.filter(p => p.v !== null);
  if (!validPts.length) return;

  let d = ""; let pen = false;
  for (const p of pts) {
    if (p.v === null) { pen = false; continue; }
    const x = xS(p.y).toFixed(1), yy = yS(p.v).toFixed(1);
    d += pen ? ` L${x},${yy}` : ` M${x},${yy}`;
    pen = true;
  }

  const line = mkEl("path", { d, stroke: color, "stroke-width": idx === 0 ? "2" : "1.5", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
  const hit = mkEl("path", { d, stroke: "transparent", "stroke-width": "12", fill: "none" });
  const g = mkEl("g");
  g.appendChild(line);
  g.appendChild(hit);
  svg.appendChild(g);
  allGroups.push({ g, line, defaultWidth: idx === 0 ? "2" : "1.5" });

  const lastValid = validPts[validPts.length - 1];
  endLabels.push({ y: yS(lastValid.v), origY: yS(lastValid.v), name: series.n, val: lastValid.v, color });

  hit.addEventListener("mousemove", e => {
    allGroups.forEach((gr, i) => {
      gr.line.setAttribute("stroke-width", i === idx ? "2.5" : "1");
      gr.g.style.opacity = i === idx ? "1" : "0.1";
    });
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const approxYear = yearMin + Math.round(ratio * (yearMax - yearMin));
    const pt = validPts.reduce((a, b) => Math.abs(b.y - approxYear) < Math.abs(a.y - approxYear) ? b : a);
    showTip(`${series.n} (${pt.y}): ${pt.v.toLocaleString()} articles`, e);
  });
  hit.addEventListener("mouseleave", () => {
    allGroups.forEach(gr => { gr.line.setAttribute("stroke-width", gr.defaultWidth); gr.g.style.opacity = "1"; });
    hideTip();
  });
});

const resolved = resolveCollisions(endLabels, 11);
const rightX = W - margin.right + 8;
resolved.forEach(item => {
  const cy = Math.max(margin.top + 4, Math.min(H - margin.bottom - 4, item.y));
  if (Math.abs(cy - item.origY) > 2) {
    svg.appendChild(mkEl("line", { x1: W - margin.right, y1: item.origY, x2: rightX - 2, y2: cy, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  const t = mkEl("text", { x: rightX, y: cy + 3.5, "font-size": "9", fill: item.color, "font-weight": "500", "font-family": "Inter, sans-serif" });
  t.textContent = `${fmtN(item.val)}  ${item.name}`;
  svg.appendChild(t);
});
</script>
</body></html>

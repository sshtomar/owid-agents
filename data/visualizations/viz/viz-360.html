<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: "Inter", -apple-system, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; max-width: 860px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; background: #1e293b; color: #f8fafc;
      padding: 6px 10px; border-radius: 4px; font-size: 12px;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap; z-index: 999;
    }
  </style>
</head>
<body>
  <h1>Air Quality: PM2.5 Pollution Exposure, 1990–2023</h1>
  <p class="subtitle">Mean annual PM2.5 exposure (µg/m³) — WHO safe limit is 5 µg/m³; Europe improves while South Asia worsens</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — PM2.5 Air Pollution, Mean Annual Exposure (EN.ATM.PM25.MC.M3)</p>
  <div id="tip"></div>
  <script>
    const series = [
      {"n":"Bangladesh","pts":[{"y":1990,"v":64.7},{"y":1992,"v":63.9},{"y":1995,"v":62.3},{"y":1998,"v":63.8},{"y":2001,"v":64.2},{"y":2004,"v":64.0},{"y":2007,"v":62.7},{"y":2010,"v":67.5},{"y":2013,"v":65.5},{"y":2016,"v":64.2},{"y":2019,"v":66.8},{"y":2022,"v":63.2},{"y":2023,"v":69.3}]},
      {"n":"Iraq","pts":[{"y":1990,"v":49.2},{"y":1992,"v":47.6},{"y":1995,"v":44.3},{"y":1998,"v":47.0},{"y":2001,"v":43.3},{"y":2004,"v":44.2},{"y":2007,"v":50.7},{"y":2010,"v":57.1},{"y":2013,"v":51.2},{"y":2016,"v":49.4},{"y":2019,"v":45.7},{"y":2022,"v":59.5},{"y":2023,"v":49.5}]},
      {"n":"India","pts":[{"y":1990,"v":51.2},{"y":1992,"v":50.1},{"y":1995,"v":48.0},{"y":1998,"v":49.9},{"y":2001,"v":50.5},{"y":2004,"v":50.8},{"y":2007,"v":49.5},{"y":2010,"v":51.7},{"y":2013,"v":52.3},{"y":2016,"v":54.4},{"y":2019,"v":53.6},{"y":2022,"v":50.7},{"y":2023,"v":54.1}]},
      {"n":"Iran","pts":[{"y":1990,"v":33.8},{"y":1992,"v":34.2},{"y":1995,"v":34.6},{"y":1998,"v":35.9},{"y":2001,"v":36.5},{"y":2004,"v":35.0},{"y":2007,"v":40.9},{"y":2010,"v":43.3},{"y":2013,"v":39.8},{"y":2016,"v":39.7},{"y":2019,"v":39.4},{"y":2022,"v":43.9},{"y":2023,"v":40.2}]},
      {"n":"China","pts":[{"y":1990,"v":43.1},{"y":1992,"v":43.1},{"y":1995,"v":42.9},{"y":1998,"v":44.4},{"y":2001,"v":45.7},{"y":2004,"v":45.3},{"y":2007,"v":51.7},{"y":2010,"v":49.0},{"y":2013,"v":51.7},{"y":2016,"v":45.3},{"y":2019,"v":37.2},{"y":2022,"v":31.9},{"y":2023,"v":32.0}]},
      {"n":"Indonesia","pts":[{"y":1990,"v":31.4},{"y":1992,"v":30.2},{"y":1995,"v":28.4},{"y":1998,"v":27.4},{"y":2001,"v":25.3},{"y":2004,"v":25.7},{"y":2007,"v":20.3},{"y":2010,"v":18.8},{"y":2013,"v":19.4},{"y":2016,"v":21.0},{"y":2019,"v":24.0},{"y":2022,"v":19.8},{"y":2023,"v":20.8}]},
      {"n":"Brazil","pts":[{"y":1990,"v":27.1},{"y":1992,"v":27.0},{"y":1995,"v":26.8},{"y":1998,"v":26.5},{"y":2001,"v":26.4},{"y":2004,"v":26.1},{"y":2007,"v":15.4},{"y":2010,"v":15.2},{"y":2013,"v":13.2},{"y":2016,"v":13.5},{"y":2019,"v":13.8},{"y":2022,"v":14.9},{"y":2023,"v":13.4}]},
      {"n":"Germany","pts":[{"y":1990,"v":22.4},{"y":1992,"v":21.9},{"y":1995,"v":21.2},{"y":1998,"v":19.7},{"y":2001,"v":17.6},{"y":2004,"v":16.7},{"y":2007,"v":14.9},{"y":2010,"v":15.8},{"y":2013,"v":13.6},{"y":2016,"v":11.8},{"y":2019,"v":10.0},{"y":2022,"v":9.6},{"y":2023,"v":8.8}]},
      {"n":"France","pts":[{"y":1990,"v":19.6},{"y":1992,"v":19.4},{"y":1995,"v":19.2},{"y":1998,"v":18.4},{"y":2001,"v":17.2},{"y":2004,"v":16.2},{"y":2007,"v":13.8},{"y":2010,"v":15.9},{"y":2013,"v":14.3},{"y":2016,"v":11.0},{"y":2019,"v":9.4},{"y":2022,"v":10.4},{"y":2023,"v":8.2}]},
      {"n":"Japan","pts":[{"y":1990,"v":12.6},{"y":1992,"v":12.6},{"y":1995,"v":12.6},{"y":1998,"v":12.6},{"y":2001,"v":12.4},{"y":2004,"v":11.6},{"y":2007,"v":14.9},{"y":2010,"v":12.8},{"y":2013,"v":13.0},{"y":2016,"v":12.3},{"y":2019,"v":12.0},{"y":2022,"v":12.4},{"y":2023,"v":11.5}]}
    ];

    // Color: high pollution = red/orange, declining = orange-green, already clean = teal
    const COLORS = {
      "Bangladesh": "#B34B3B",
      "Iraq":       "#C4715A",
      "India":      "#E05C2A",
      "Iran":       "#C49A45",
      "China":      "#8BAD72",
      "Indonesia":  "#5B9E78",
      "Brazil":     "#5B8FBD",
      "Germany":    "#3D7A5A",
      "France":     "#8870B8",
      "Japan":      "#7A786F"
    };

    const W = 820, H = 460;
    const margin = { top: 30, right: 130, bottom: 40, left: 55 };
    const yearMin = 1990, yearMax = 2023;
    const valMin = 0, valMax = 75;

    const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    const ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs, text) {
      const e = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text !== undefined) e.textContent = text;
      return e;
    }

    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "overflow:visible" });
    document.getElementById("chart").appendChild(svg);

    // WHO safe limit annotation band
    const safeY = yScale(5);
    svg.appendChild(el("rect", { x: margin.left, y: safeY, width: W - margin.left - margin.right, height: H - margin.bottom - safeY, fill: "#3D7A5A", opacity: "0.04" }));
    svg.appendChild(el("line", { x1: margin.left, y1: safeY, x2: W - margin.right, y2: safeY, stroke: "#3D7A5A", "stroke-dasharray": "4,3", "stroke-width": "0.8" }));
    svg.appendChild(el("text", { x: margin.left + 4, y: safeY - 4, fill: "#3D7A5A", "font-family": "JetBrains Mono", "font-size": "9" }, "WHO safe limit (5 µg/m³)"));

    // Grid
    [20, 40, 60].forEach(v => {
      const y = yScale(v);
      svg.appendChild(el("line", { x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#F0EDE4", "stroke-width": "1" }));
      svg.appendChild(el("text", { x: margin.left - 6, y: y + 4, "text-anchor": "end", fill: "#7A786F", "font-family": "JetBrains Mono", "font-size": "9" }, `${v}`));
    });

    // Y axis label
    svg.appendChild(el("text", { x: 12, y: (H / 2), "text-anchor": "middle", fill: "#7A786F", "font-family": "Inter", "font-size": "9", transform: `rotate(-90, 12, ${H/2})` }, "µg/m³"));

    // X axis
    [1990, 1995, 2000, 2005, 2010, 2015, 2020, 2023].forEach(y => {
      const x = xScale(y);
      svg.appendChild(el("line", { x1: x, y1: margin.top, x2: x, y2: H - margin.bottom, stroke: "#F0EDE4", "stroke-width": "1" }));
      svg.appendChild(el("text", { x, y: H - margin.bottom + 14, "text-anchor": "middle", fill: "#7A786F", "font-family": "JetBrains Mono", "font-size": "9" }, String(y)));
    });

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const lineEls = [];
    const hitEls = [];

    series.forEach(s => {
      const color = COLORS[s.n];
      const pathD = s.pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
      const g = el("g");
      const line = el("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round" });
      g.appendChild(line);
      const hit = el("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
      g.appendChild(hit);
      lineEls.push({ line, s, color });
      hitEls.push({ hit, s });
      svg.appendChild(g);
    });

    // Endpoint labels
    const endPoints = series.map(s => {
      const last = s.pts[s.pts.length - 1];
      return { y: yScale(last.v), s, label: `${last.v}  ${s.n}`, color: COLORS[s.n] };
    });

    const resolved = resolveCollisions(endPoints, 13);
    resolved.forEach(item => {
      const orig = endPoints.find(e => e.s === item.s);
      svg.appendChild(el("text", {
        x: W - margin.right + 8, y: item.y + 4, "text-anchor": "start",
        fill: item.color, "font-family": "JetBrains Mono", "font-size": "9", "font-weight": "500"
      }, item.label));
      if (Math.abs(item.y - orig.y) > 3) {
        svg.appendChild(el("line", { x1: W - margin.right + 5, y1: orig.y, x2: W - margin.right + 5, y2: item.y, stroke: "#D0CEC6", "stroke-width": "0.6" }));
      }
    });

    // Hover
    const tip = document.getElementById("tip");
    hitEls.forEach(({ hit, s }) => {
      hit.addEventListener("mousemove", e => {
        lineEls.forEach(o => o.line.setAttribute("opacity", o.s === s ? "1" : "0.1"));
        const rect = svg.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const ratio = (mx - margin.left) / (W - margin.left - margin.right);
        const ptIdx = Math.max(0, Math.min(s.pts.length - 1, Math.round(ratio * (s.pts.length - 1))));
        const p = s.pts[ptIdx];
        tip.textContent = `${s.n} (${p.y}): ${p.v} µg/m³`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        lineEls.forEach(o => o.line.setAttribute("opacity", "1"));
        tip.style.opacity = "0";
      });
    });
  </script>
</body>
</html>

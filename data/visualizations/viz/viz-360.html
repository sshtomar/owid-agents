,"v":-0.08},{"y":2019,"v":-0.14},{"y":2021,"v":-0.46},{"y":2023,"v":-0.49},{"y":2024,"v":-0.44}]},{"n":"S. Korea","pts":[{"y":1961,"v":2.97},{"y":1963,"v":2.78},{"y":1965,"v":2.54},{"y":1967,"v":2.34},{"y":1969,"v":2.26},{"y":1971,"v":1.97},{"y":1973,"v":1.77},{"y":1975,"v":1.68},{"y":1977,"v":1.56},{"y":1979,"v":1.52},{"y":1981,"v":1.56},{"y":1983,"v":1.47},{"y":1985,"v":0.98},{"y":1987,"v":0.99},{"y":1989,"v":0.99},{"y":1991,"v":0.99},{"y":1993,"v":1.02},{"y":1995,"v":1.01},{"y":1997,"v":0.94},{"y":1999,"v":0.71},{"y":2001,"v":0.77},{"y":2003,"v":0.52},{"y":2005,"v":0.21},{"y":2007,"v":0.51},{"y":2009,"v":0.51},{"y":2011,"v":0.77},{"y":2013,"v":0.46},{"y":2015,"v":0.53},{"y":2017,"v":0.28},{"y":2019,"v":0.35},{"y":2021,"v":-0.13},{"y":2023,"v":0.08},{"y":2024,"v":0.07}]},{"n":"Bulgaria","pts":[{"y":1961,"v":0.96},{"y":1963,"v":0.81},{"y":1965,"v":0.73},{"y":1967,"v":0.63},{"y":1969,"v":0.77},{"y":1971,"v":0.55},{"y":1973,"v":0.52},{"y":1975,"v":0.48},{"y":1977,"v":0.52},{"y":1979,"v":0.14},{"y":1981,"v":0.33},{"y":1983,"v":0.25},{"y":1987,"v":0.15},{"y":1989,"v":-1.17},{"y":1991,"v":-0.99},{"y":1993,"v":-0.8},{"y":1995,"v":-0.45},{"y":1997,"v":-0.61},{"y":1999,"v":-0.56},{"y":2001,"v":-1.99},{"y":2003,"v":-0.79},{"y":2005,"v":-0.75},{"y":2007,"v":-0.74},{"y":2009,"v":-0.64},{"y":2011,"v":-0.64},{"y":2013,"v":-2.02},{"y":2015,"v":-1.27},{"y":2017,"v":-1.32},{"y":2019,"v":-1.41},{"y":2021,"v":-0.66},{"y":2023,"v":-0.29},{"y":2024,"v":-0.08}]}];

const COLORS = ["#EA5E33","#F29A44","#5B9E78","#8BAD72","#3D7A5A","#C4715A","#C49A45","#B34B3B"];

const W = 760, H = 440;
const margin = { top: 30, right: 110, bottom: 36, left: 52 };

const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("width","100%");
svg.style.maxWidth = W+"px";
svg.style.display = "block";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  if (text !== undefined) el.textContent = text;
  return el;
}

const yearMin = 1961, yearMax = 2024;
const allVals = data.flatMap(s => s.pts.map(p => p.v));
const valMin = Math.floor(Math.min(...allVals)) - 0.5;
const valMax = Math.ceil(Math.max(...allVals)) + 0.3;

const xS = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yS = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Zero line
const y0 = yS(0);
svg.appendChild(mkEl("line",{x1:margin.left,y1:y0,x2:W-margin.right,y2:y0,stroke:"#C2C0B5","stroke-width":"0.8"}));
svg.appendChild(mkEl("text",{x:margin.left-5,y:y0+3,"text-anchor":"end","font-family":"JetBrains Mono,monospace","font-size":"8","fill":"#9A9890"},"0%"));

// Grid lines
[-2,-1,1,2,3,4,5].forEach(v => {
  if (v < valMin || v > valMax) return;
  svg.appendChild(mkEl("line",{x1:margin.left,y1:yS(v),x2:W-margin.right,y2:yS(v),stroke:"#E2E0D5","stroke-width":"0.4"}));
  svg.appendChild(mkEl("text",{x:margin.left-5,y:yS(v)+3,"text-anchor":"end","font-family":"JetBrains Mono,monospace","font-size":"8","fill":"#9A9890"},v+"%"));
});

// Negative band
svg.appendChild(mkEl("rect",{x:margin.left,y:yS(valMin > -3 ? valMin : -3),width:W-margin.left-margin.right,height:y0-yS(valMin > -3 ? valMin : -3),fill:"#EA5E33",opacity:"0.04"}));

// X axis
[1961,1970,1980,1990,2000,2010,2020,2024].forEach(y => {
  svg.appendChild(mkEl("line",{x1:xS(y),y1:H-margin.bottom,x2:xS(y),y2:H-margin.bottom+4,stroke:"#C2C0B5","stroke-width":"0.7"}));
  svg.appendChild(mkEl("text",{x:xS(y),y:H-margin.bottom+13,"text-anchor":"middle","font-family":"JetBrains Mono,monospace","font-size":"8","fill":"#7A786F"},y));
});

svg.appendChild(mkEl("text",{x:10,y:H/2,"text-anchor":"middle","font-family":"JetBrains Mono,monospace","font-size":"8","fill":"#7A786F",transform:`rotate(-90,10,${H/2})`},"ANNUAL GROWTH (%)"));

const tip = document.getElementById("tip");
function showTip(html, e){ tip.innerHTML = html; tip.style.opacity="1"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-20)+"px"; }
function hideTip(){ tip.style.opacity="0"; }

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a,b) => a.y - b.y);
  for (let pass = 0; pass < 20; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const groups = [];

data.forEach((series, si) => {
  const color = COLORS[si % COLORS.length];
  const pts = series.pts;
  if (pts.length === 0) return;

  const pathD = pts.map((p,i) => `${i===0?"M":"L"} ${xS(p.y).toFixed(1)} ${yS(p.v).toFixed(1)}`).join(" ");
  const g = mkEl("g",{});
  const path = mkEl("path",{d:pathD,stroke:color,"stroke-width":"1.5",fill:"none","stroke-linejoin":"round","stroke-linecap":"round"});
  g.appendChild(path);
  const hit = mkEl("path",{d:pathD,stroke:"transparent","stroke-width":"12",fill:"none","cursor":"pointer"});
  g.appendChild(hit);

  const lastPt = pts[pts.length - 1];
  groups.push({ g, path, hit, color, series, lastPt });
  svg.appendChild(g);
});

const labelItems = groups.map(({series, lastPt}) => ({
  name: series.n,
  y: yS(lastPt.v),
  v: lastPt.v
}));
const resolved = resolveCollisions(labelItems, 11);
const yMap = {};
resolved.forEach(r => { yMap[r.name] = r.y; });

groups.forEach(({g, series, lastPt, color, path, hit}) => {
  const lx = xS(lastPt.y);
  const ly = yMap[series.n];
  const origY = yS(lastPt.v);

  if (Math.abs(ly - origY) > 2) {
    g.appendChild(mkEl("line",{x1:lx+3,y1:origY,x2:lx+8,y2:ly,stroke:color,"stroke-width":"0.5",opacity:"0.5"}));
  }
  g.appendChild(mkEl("text",{x:lx+10,y:ly+3,"font-size":"8.5","font-weight":"500","fill":color},series.n));

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let closest = series.pts[0], minD = Infinity;
    series.pts.forEach(p => {
      const d = Math.abs(xS(p.y) - mx);
      if (d < minD) { minD = d; closest = p; }
    });
    showTip(`<b>${series.n}</b> ${closest.y}: <b>${closest.v > 0 ? '+' : ''}${closest.v}%</b>`, e);
    groups.forEach(({g: og, path: op}) => { og.style.opacity = og === g ? "1" : "0.1"; });
    path.setAttribute("stroke-width","2.5");
  });
  hit.addEventListener("mouseleave", () => {
    hideTip();
    groups.forEach(({g: og, path: op}) => { og.style.opacity = "1"; op.setAttribute("stroke-width","1.5"); });
  });
});

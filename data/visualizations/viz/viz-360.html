// Replace nulls with interpolated or skip
const data = rawData.map(d => ({...d, s: d.s.map(v => v === null ? undefined : v)}));

const COLS = 6;
const cellW = 130, cellH = 58;
const tip = document.getElementById("tip");

data.forEach((series, idx) => {
  const cell = document.createElement("div");
  cell.className = "cell";

  const nameDiv = document.createElement("div");
  nameDiv.className = "cell-name";
  nameDiv.textContent = series.n;
  cell.appendChild(nameDiv);

  const dpr = window.devicePixelRatio || 1;
  const canvas = document.createElement("canvas");
  canvas.width = cellW * dpr;
  canvas.height = cellH * dpr;
  canvas.style.width = cellW + "px";
  canvas.style.height = cellH + "px";
  cell.appendChild(canvas);

  const validPts = series.s.map((v,i) => v !== undefined ? {i, v, y: series.y0 + i} : null).filter(Boolean);
  if (!validPts.length) return;

  const minV = Math.min(...validPts.map(p => p.v));
  const maxV = Math.max(...validPts.map(p => p.v));
  const range = maxV - minV || 0.1;

  // Color line based on direction: green if ending lower (good = slower growth), red if high growth still
  const lastV = validPts[validPts.length-1].v;
  const firstV = validPts[0].v;
  const lineColor = lastV > 2.5 ? "#EA5E33" : lastV < 0 ? "#3D7A5A" : "#F29A44";

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // Zero line
  const zeroY = cellH - ((0 - minV)/range) * (cellH - 6) - 3;
  if (minV < 0 && maxV > 0) {
    ctx.strokeStyle = "#C2C0B5";
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2,2]);
    ctx.beginPath();
    ctx.moveTo(0, zeroY);
    ctx.lineTo(cellW, zeroY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw sparkline
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1.3;
  ctx.lineJoin = "round";
  ctx.beginPath();
  validPts.forEach((p, j) => {
    const x = (p.i / (series.s.length - 1)) * cellW;
    const y = cellH - ((p.v - minV) / range) * (cellH - 6) - 3;
    j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Start / end labels
  ctx.fillStyle = "#7A786F";
  ctx.font = `7px JetBrains Mono, monospace`;
  ctx.textAlign = "left";
  ctx.fillText(firstV.toFixed(1) + "%", 1, cellH - 1);
  ctx.textAlign = "right";
  ctx.fillText(lastV.toFixed(1) + "%", cellW - 1, cellH - 1);

  document.getElementById("grid").appendChild(cell);

  // Crosshair interaction
  cell.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, mx / cellW));
    const idx2 = Math.round(ratio * (series.s.length - 1));
    const v = series.s[idx2];
    if (v !== undefined) {
      const y = series.y0 + idx2;
      tip.textContent = `${series.n}  ${y}: ${v.toFixed(2)}%`;
      tip.style.opacity = "1";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY - 22) + "px";
    }
  });
  cell.addEventListener("mouseleave", () => { tip.style.opacity = "0"; });
});

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap');
    body { font-family: "Inter", -apple-system, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 8px; }
    #tip {
      position: fixed; pointer-events: none; background: rgba(15,23,42,0.92);
      color: #f8fafc; font-size: 12px; padding: 6px 10px; border-radius: 5px;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 99;
      font-family: "JetBrains Mono", monospace;
    }
  </style>
</head>
<body>
  <h1>Adjusted Net Savings (% of GNI), 1990–2021</h1>
  <p class="subtitle">True wealth creation after accounting for natural resource depletion and pollution damage. Negative = depleting national wealth.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — Adjusted net savings including particulate emission damage (NY.ADJ.SVNG.GN.ZS)</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"Congo","s":[-30.94,-31.42,-15.1,-33.59,-26.97,-97.4,-94.62,-68.8,-57.95,-54.8,-49.62,-58.54,-52.46,-32.11,-54.47,-34.35,-25.16,-28.17,-19.9,-12.05,-3.55,-13.53,3.99,13.03,15.37,3.65,-13.52,null,null,-19.11,-33.47],"y0":1990},{"n":"Kazakhstan","s":[-14.03,-11.14,-10.3,null,-18.1,-23.65,-11.7,-9.55,-8.26,-10.55,-10.48,-5.1,3.98,2.92,4.88,7.12,9.96,9.0,9.09,10.98,10.36,6.24,7.15,5.73,6.28,7.92,-0.2],"y0":1995},{"n":"Brazil","s":[7.4,7.87,8.93,9.56,9.69,5.59,6.01,4.66,4.01,0.31,1.25,0.33,1.53,2.6,5.64,5.04,6.14,7.38,6.54,3.05,3.35,2.49,-0.52,0.1,-2.06,-4.18,-5.24,-3.64,-4.7,-5.01,-1.49,-0.25],"y0":1990},{"n":"Japan","s":[14.23,13.39,11.48,9.58,10.23,8.8,7.36,7.8,8.6,8.57,8.34,8.53,5.86,1.67,3.82,3.12,2.94,3.23,3.45,6.05,6.81,7.32,6.82,6.63,4.73,3.55],"y0":1996},{"n":"Germany","s":[11.77,11.27,10.97,9.42,9.78,10.24,9.47,9.7,10.02,9.3,8.97,8.74,8.74,7.93,10.51,10.2,12.58,14.63,13.21,9.69,11.49,13.6,12.41,11.93,13.21,13.74,14.01,14.45,15.08,14.66,13.18,14.52],"y0":1990},{"n":"Denmark","s":[12.5,9.88,12.15,11.84,11.56,12.79,13.25,14.11,13.97,14.16,14.56,15.4,14.43,14.01,14.62,15.13,16.09,14.97,13.4,10.81,13.24,14.28,12.78,16.18,17.43,17.81,18.6,19.77,18.31,18.46,18.55,20.43],"y0":1990},{"n":"China","s":[14.54,17.86,20.84,20.8,22.42,21.05,20.77,22.09,20.39,17.82,16.11,18.07,19.94,22.79,23.97,23.55,25.01,26.67,26.02,27.06,25.81,21.59,22.48,20.91,20.89,19.17,18.19,18.81,17.36,15.99,15.3,16.33],"y0":1990},{"n":"Bangladesh","s":[11.24,11.06,10.47,9.74,11.32,11.13,12.33,13.74,15.43,16.13,17.21,17.71,19.72,19.78,21.0,21.78,23.45,24.7,25.58,26.93,26.77,26.32,28.47,28.12,26.7,25.84,27.17,25.37,25.37,33.2,33.86,32.18],"y0":1990},{"n":"India","s":[7.11,6.59,8.44,9.45,12.07,13.09,13.35,13.63,13.3,13.4,13.03,13.01,14.57,17.46,19.77,20.71,22.71,23.35,21.0,22.02,22.89,21.01,21.26,20.32,19.71,19.48,18.43,19.36,18.48,16.77,14.44,15.41],"y0":1990},{"n":"Ghana","s":[-4.51,-2.11,-8.38,-4.63,-2.08,-3.59,-3.6,-10.67,-2.85,-6.76,-6.01,1.65,-1.11,-0.34,5.59,2.73,4.03,-7.82,-9.27,-4.06,-9.7,-11.05,-9.6,2.7,2.5,5.45,5.03,1.92,7.24,4.8,13.88,3.78],"y0":1990}];

    const COLORS = {
      "Congo": "#B34B3B", "Kazakhstan": "#C4715A",
      "Brazil": "#F29A44", "Japan": "#8B5E3C",
      "Germany": "#5B9E78", "Denmark": "#3D7A5A",
      "China": "#2E6DA4", "Bangladesh": "#A259C4",
      "India": "#6B8E5A", "Ghana": "#C49A45"
    };

    const W = 800, H = 490;
    const margin = {top: 36, right: 106, bottom: 36, left: 54};

    // Data range: Congo goes to -97, Bangladesh to +34
    const yearMin = 1990, yearMax = 2021;
    const valMin = -50, valMax = 38;

    const xS = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yS = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    const ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs, txt) {
      const e = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
      if (txt != null) e.textContent = txt;
      return e;
    }

    const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:800px;display:block;"});

    // Y gridlines
    [-40, -20, 0, 10, 20, 30].forEach(v => {
      if (v < valMin || v > valMax) return;
      const y = yS(v);
      const isBold = v === 0;
      svg.appendChild(el("line", {x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: isBold ? "#94a3b8" : "#e2e8f0", "stroke-width": isBold ? "1" : "0.5"}));
      svg.appendChild(el("text", {x: margin.left - 6, y: y + 4, "text-anchor": "end", "font-size": "10", "font-family": "JetBrains Mono", fill: "#94a3b8"}, v + "%"}));
    });

    // "Zero savings" label
    svg.appendChild(el("text", {x: margin.left + 4, y: yS(0) - 3, "font-size": "8.5", "font-family": "JetBrains Mono", fill: "#94a3b8"}, "0% (break-even)"));

    // X axis labels
    [1990, 1995, 2000, 2005, 2010, 2015, 2021].forEach(yr => {
      svg.appendChild(el("text", {x: xS(yr), y: H - 4, "text-anchor": "middle", "font-size": "10", "font-family": "JetBrains Mono", fill: "#94a3b8"}, yr));
    });

    // Congo 1995 spike annotation
    const congoSpike = {x: xS(1995), y: yS(-97.4)};
    svg.appendChild(el("text", {x: congoSpike.x - 2, y: H - margin.bottom + 10, "text-anchor": "middle", "font-size": "8", "font-family": "Inter", fill: "#B34B3B", opacity: "0.8"}, "Congo -97% (1995)"));

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i-1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i-1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const tip = document.getElementById("tip");
    function showTip(t, e) { tip.textContent = t; tip.style.opacity = "1"; tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY-20)+"px"; }
    function hideTip() { tip.style.opacity = "0"; }

    const groups = [];

    data.forEach((d, i) => {
      const pts = [];
      d.s.forEach((v, j) => {
        if (v != null) {
          // Clamp Congo's extreme spike for rendering
          const vClamped = Math.max(valMin, v);
          pts.push({year: d.y0 + j, v, vClamped});
        }
      });
      if (!pts.length) return;

      const pathD = pts.map((p, j) => `${j===0?"M":"L"} ${xS(p.year).toFixed(1)} ${yS(p.vClamped).toFixed(1)}`).join(" ");
      const col = COLORS[d.n] || "#64748b";

      const g = el("g", {});
      const line = el("path", {d: pathD, stroke: col, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round"});
      const hit = el("path", {d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer"});

      const lastPt = pts[pts.length - 1];

      hit.addEventListener("mouseenter", e => {
        groups.forEach((gg, ii) => gg.g.setAttribute("opacity", ii === i ? "1" : "0.1"));
        groups[i].line.setAttribute("stroke-width", "3");
        showTip(`${d.n}: ${lastPt.v.toFixed(1)}% adjusted savings (${lastPt.year})`, e);
      });
      hit.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const nearest = pts.reduce((a, b) => Math.abs(b.year - yr) < Math.abs(a.year - yr) ? b : a);
        showTip(`${d.n}: ${nearest.v.toFixed(1)}% (${nearest.year})`, e);
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(gg => gg.g.setAttribute("opacity", "1"));
        groups[i].line.setAttribute("stroke-width", "1.5");
        hideTip();
      });

      g.appendChild(line); g.appendChild(hit);
      svg.appendChild(g);
      groups.push({g, line, endY: yS(Math.max(valMin, lastPt.v)), name: d.n, val: lastPt.v, col});
    });

    // Endpoint labels with collision resolution
    const labelItems = groups.map(g => ({y: g.endY, name: g.name, val: g.val, col: g.col}));
    resolveCollisions(labelItems, 12).forEach(item => {
      const orig = groups.find(g => g.name === item.name).endY;
      const lx = W - margin.right + 4;
      if (Math.abs(orig - item.y) > 3) {
        svg.appendChild(el("line", {x1: W - margin.right, y1: orig, x2: lx, y2: item.y, stroke: item.col, "stroke-width": "0.5", opacity: "0.5"}));
      }
      const sign = item.val > 0 ? "+" : "";
      svg.appendChild(el("text", {x: lx + 2, y: item.y + 3.5, "font-size": "9", "font-family": "JetBrains Mono", fill: item.col}, `${sign}${item.val.toFixed(0)}% ${item.name}`));
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

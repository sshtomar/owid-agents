<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Aging Societies — Old-Age Dependency Ratio, 1960–2024</h1>
<p class="subtitle">Number of people aged 65+ per 100 working-age adults (15–64), for the ten most aged nations. Japan stands apart, with over 50 elderly dependents per 100 workers.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — SP.POP.DPND.OL</p>
<script>
const data = [
  {"n":"Japan","pts":[{"y":1960,"v":8.9},{"y":1965,"v":9.2},{"y":1970,"v":10.1},{"y":1975,"v":11.6},{"y":1980,"v":13.4},{"y":1985,"v":15.2},{"y":1990,"v":17.4},{"y":1995,"v":21.0},{"y":2000,"v":25.6},{"y":2005,"v":30.7},{"y":2010,"v":36.4},{"y":2015,"v":44.7},{"y":2020,"v":49.1},{"y":2024,"v":50.7}]},
  {"n":"Finland","pts":[{"y":1960,"v":11.7},{"y":1965,"v":12.4},{"y":1970,"v":13.8},{"y":1975,"v":15.7},{"y":1980,"v":17.7},{"y":1985,"v":18.3},{"y":1990,"v":19.9},{"y":1995,"v":21.3},{"y":2000,"v":22.3},{"y":2005,"v":23.9},{"y":2010,"v":26.1},{"y":2015,"v":31.9},{"y":2020,"v":36.4},{"y":2024,"v":38.9}]},
  {"n":"Italy","pts":[{"y":1960,"v":14.5},{"y":1965,"v":15.5},{"y":1970,"v":17.2},{"y":1975,"v":19.1},{"y":1980,"v":20.5},{"y":1985,"v":19.5},{"y":1990,"v":21.8},{"y":1995,"v":24.9},{"y":2000,"v":27.0},{"y":2005,"v":29.6},{"y":2010,"v":31.2},{"y":2015,"v":34.3},{"y":2020,"v":36.6},{"y":2024,"v":38.8}]},
  {"n":"Greece","pts":[{"y":1960,"v":10.9},{"y":1965,"v":13.1},{"y":1970,"v":16.4},{"y":1975,"v":18.6},{"y":1980,"v":20.0},{"y":1985,"v":19.7},{"y":1990,"v":20.4},{"y":1995,"v":23.1},{"y":2000,"v":25.4},{"y":2005,"v":27.5},{"y":2010,"v":28.9},{"y":2015,"v":32.7},{"y":2020,"v":35.3},{"y":2024,"v":38.1}]},
  {"n":"Croatia","pts":[{"y":1960,"v":11.1},{"y":1965,"v":12.3},{"y":1970,"v":14.0},{"y":1975,"v":15.9},{"y":1980,"v":17.1},{"y":1985,"v":15.5},{"y":1990,"v":16.9},{"y":1995,"v":20.0},{"y":2000,"v":23.7},{"y":2005,"v":26.2},{"y":2010,"v":26.8},{"y":2015,"v":29.1},{"y":2020,"v":33.9},{"y":2024,"v":36.9}]},
  {"n":"Germany","pts":[{"y":1960,"v":17.1},{"y":1965,"v":19.3},{"y":1970,"v":21.6},{"y":1975,"v":23.3},{"y":1980,"v":23.7},{"y":1985,"v":20.9},{"y":1990,"v":21.5},{"y":1995,"v":22.5},{"y":2000,"v":24.2},{"y":2005,"v":28.3},{"y":2010,"v":31.3},{"y":2015,"v":32.0},{"y":2020,"v":33.9},{"y":2024,"v":36.9}]},
  {"n":"France","pts":[{"y":1960,"v":18.6},{"y":1965,"v":19.4},{"y":1970,"v":20.6},{"y":1975,"v":21.5},{"y":1980,"v":21.9},{"y":1985,"v":19.6},{"y":1990,"v":21.2},{"y":1995,"v":23.1},{"y":2000,"v":24.6},{"y":2005,"v":25.3},{"y":2010,"v":25.9},{"y":2015,"v":30.0},{"y":2020,"v":33.6},{"y":2024,"v":36.1}]},
  {"n":"Bulgaria","pts":[{"y":1960,"v":11.2},{"y":1965,"v":12.4},{"y":1970,"v":14.2},{"y":1975,"v":16.3},{"y":1980,"v":17.9},{"y":1985,"v":17.0},{"y":1990,"v":19.8},{"y":1995,"v":22.5},{"y":2000,"v":24.5},{"y":2005,"v":25.1},{"y":2010,"v":26.5},{"y":2015,"v":30.7},{"y":2020,"v":33.9},{"y":2024,"v":34.7}]},
  {"n":"Bosnia and Herzegovina","pts":[{"y":1960,"v":5.9},{"y":1965,"v":6.5},{"y":1970,"v":7.7},{"y":1975,"v":8.6},{"y":1980,"v":9.3},{"y":1985,"v":8.5},{"y":1990,"v":9.6},{"y":1995,"v":14.1},{"y":2000,"v":15.9},{"y":2005,"v":19.4},{"y":2010,"v":21.8},{"y":2015,"v":25.2},{"y":2020,"v":30.6},{"y":2024,"v":34.3}]},
  {"n":"Estonia","pts":[{"y":1960,"v":16.2},{"y":1965,"v":17.1},{"y":1970,"v":18.4},{"y":1975,"v":19.8},{"y":1980,"v":20.9},{"y":1985,"v":19.9},{"y":1990,"v":21.2},{"y":1995,"v":22.5},{"y":2000,"v":23.5},{"y":2005,"v":23.8},{"y":2010,"v":25.4},{"y":2015,"v":28.3},{"y":2020,"v":31.4},{"y":2024,"v":33.8}]}
];

const W = 800, H = 460;
const margin = { top: 30, right: 130, bottom: 40, left: 52 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const yearMin = 1960, yearMax = 2024;
const valMin = 0, valMax = 58;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid
[10, 20, 30, 40, 50].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3.5,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "8.5", "text-anchor": "end"
  })).textContent = v;
});

// X-axis labels
[1960, 1970, 1980, 1990, 2000, 2010, 2024].forEach(y => {
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "9", "text-anchor": "middle"
  })).textContent = y;
  svg.appendChild(mkEl("line", {
    x1: xScale(y), y1: yScale(0) + 2, x2: xScale(y), y2: yScale(0) + 5,
    stroke: "#C2C0B5", "stroke-width": "0.7"
  }));
});

// Y-axis label
const yLbl = mkEl("text", {
  x: 10, y: margin.top + (H - margin.top - margin.bottom) / 2,
  fill: "#7A786F", "font-family": "JetBrains Mono, monospace",
  "font-size": "9", "text-anchor": "middle",
  transform: `rotate(-90, 10, ${margin.top + (H - margin.top - margin.bottom) / 2})`
});
yLbl.textContent = "older adults per 100 working-age";
svg.appendChild(yLbl);

const COLORS = ["#EA5E33","#F29A44","#C49A45","#5B9E78","#3D7A5A","#A6C4A2","#B34B3B","#7A786F","#4A7A9B","#8B5E9B"];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
const groups = [];

const endpointLabels = data.map((series, idx) => {
  const last = series.pts[series.pts.length - 1];
  return { series, idx, y: yScale(last.v) };
});
const resolved = resolveCollisions(endpointLabels, 12);
const labelMap = new Map(resolved.map(l => [l.series.n, l.y]));

data.forEach((series, idx) => {
  const color = COLORS[idx % COLORS.length];
  const pts = series.pts;

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");

  const line = mkEl("path", {
    d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round"
  });

  const hitPath = mkEl("path", {
    d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none"
  });

  const last = pts[pts.length - 1];
  const lyEnd = labelMap.get(series.n);
  const yEnd = yScale(last.v);

  if (Math.abs(lyEnd - yEnd) > 2) {
    g.appendChild(mkEl("line", {
      x1: W - margin.right + 2, y1: yEnd,
      x2: W - margin.right + 4, y2: lyEnd,
      stroke: color, "stroke-width": "0.6", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text", {
    x: W - margin.right + 8, y: lyEnd + 3.5,
    fill: "#2B2A27", "font-size": "9.5"
  });
  lbl.textContent = `${last.v.toFixed(1)}  ${series.n}`;

  g.appendChild(line);
  g.appendChild(lbl);
  g.appendChild(hitPath);

  g.addEventListener("mouseenter", e => {
    groups.forEach(og => { og.style.opacity = "0.1"; });
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "2.5");
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const yr = yearMin + (mx - margin.left) / (W - margin.left - margin.right) * (yearMax - yearMin);
    const nearest = pts.reduce((best, p) => Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best);
    tip.textContent = `${series.n} ${nearest.y}: ${nearest.v.toFixed(1)}`;
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mouseleave", () => {
    groups.forEach(og => { og.style.opacity = "1"; });
    line.setAttribute("stroke-width", "1.5");
    tip.style.opacity = "0";
  });

  groups.push(g);
  svg.appendChild(g);
});
</script>
</body></html>

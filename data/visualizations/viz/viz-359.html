<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Crude Death Rate by World Region, 1960–2024</h1>
<p class="subtitle">Deaths per 1,000 people. Sub-Saharan Africa's sharp decline reflects gains against infectious disease and child mortality. Europe's uptick in recent years reflects population aging.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Death Rate, Crude (SP.DYN.CDRT.IN)</p>
<script>
const raw = [
  {"n":"Sub-Saharan Africa","s":[23.31,22.02,20.71,19.43,17.73,17.47,16.18,15.45,14.33,12.77,10.9,9.67,8.73],"y0":1960,"step":5},
  {"n":"South Asia","s":[19.59,19.28,17.47,15.56,13.87,12.3,10.84,9.61,8.55,7.68,7.03,6.62,7.09],"y0":1960,"step":5},
  {"n":"East Asia & Pacific","s":[20.88,10.73,8.66,8.31,7.09,7.09,6.87,6.77,6.64,6.69,7.11,7.15,7.39],"y0":1960,"step":5},
  {"n":"Latin America & Caribbean","s":[13.2,11.65,10.57,9.15,8.27,7.54,6.88,6.41,6.12,5.93,6.15,6.09,7.67],"y0":1960,"step":5},
  {"n":"Europe & Central Asia","s":[10.13,9.94,10.2,10.34,10.53,10.46,10.2,11.0,10.73,10.75,10.13,10.07,11.24],"y0":1960,"step":5},
  {"n":"North America","s":[9.35,9.23,9.29,8.65,8.63,8.53,8.47,8.64,8.36,8.19,7.91,8.34,10.05],"y0":1960,"step":5}
];

const COLORS = [
  "#EA5E33","#F29A44","#5B9E78","#3D7A5A","#C49A45","#8BAD72"
];

const W = 780, H = 420;
const margin = { top: 30, right: 168, bottom: 40, left: 52 };
const plotW = W - margin.left - margin.right;
const plotH = H - margin.top - margin.bottom;

const yearMin = 1960, yearMax = 2024;
const valMin = 0, valMax = 26;

function xScale(y) { return margin.left + (y - yearMin) / (yearMax - yearMin) * plotW; }
function yScale(v) { return margin.top + (valMax - v) / (valMax - valMin) * plotH; }

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  const lo = margin.top + 4, hi = H - margin.bottom - 4;
  sorted.forEach(item => { item.y = Math.max(lo, Math.min(hi, item.y)); });
  return sorted;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

// Grid lines
[0,5,10,15,20,25].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v),
    x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3.5,
    "text-anchor": "end",
    "font-size": "9", fill: "#7A786F",
    "font-family": "JetBrains Mono, monospace"
  }, v.toString()));
});

// X axis ticks
[1960, 1970, 1980, 1990, 2000, 2010, 2020].forEach(y => {
  svg.appendChild(mkEl("line", {
    x1: xScale(y), y1: H - margin.bottom,
    x2: xScale(y), y2: H - margin.bottom + 4,
    stroke: "#C2C0B5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    "text-anchor": "middle",
    "font-size": "9", fill: "#7A786F",
    "font-family": "JetBrains Mono, monospace"
  }, y.toString()));
});

// Y axis label
svg.appendChild(mkEl("text", {
  x: margin.left - 6, y: margin.top - 10,
  "text-anchor": "end",
  "font-size": "9", fill: "#7A786F",
  "font-family": "JetBrains Mono, monospace"
}, "per 1,000"));

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 26) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

const groups = [];
const endLabels = [];

raw.forEach((series, idx) => {
  const color = COLORS[idx % COLORS.length];
  const pts = series.s.map((v, i) => ({
    year: series.y0 + i * series.step,
    value: v
  })).filter(p => p.value !== null);

  const pathD = pts.map((p, i) =>
    `${i === 0 ? "M" : "L"} ${xScale(p.year)} ${yScale(p.value)}`
  ).join(" ");

  const g = mkEl("g", {});
  const line = mkEl("path", {
    d: pathD, stroke: color,
    "stroke-width": "1.8", fill: "none",
    "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  const hitPath = mkEl("path", {
    d: pathD, stroke: "transparent",
    "stroke-width": "12", fill: "none"
  });
  const lastPt = pts[pts.length - 1];

  g.appendChild(line);
  g.appendChild(hitPath);
  svg.appendChild(g);
  groups.push(g);
  endLabels.push({ idx, y: yScale(lastPt.value), lastX: xScale(lastPt.year), lastPt, color, series });

  hitPath.addEventListener("mousemove", e => {
    groups.forEach((gg, i) => {
      gg.querySelectorAll("path:first-child").forEach(l => {
        l.setAttribute("opacity", i === idx ? "1" : "0.08");
        l.setAttribute("stroke-width", i === idx ? "2.8" : "1.8");
      });
    });
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / plotW));
    const rawYear = yearMin + ratio * (yearMax - yearMin);
    const nearestPt = pts.reduce((best, p) => Math.abs(p.year - rawYear) < Math.abs(best.year - rawYear) ? p : best, pts[0]);
    showTip(`${series.n} ${nearestPt.year}: ${nearestPt.value.toFixed(1)} per 1,000`, e);
  });
  hitPath.addEventListener("mouseleave", () => {
    groups.forEach(gg => {
      gg.querySelectorAll("path:first-child").forEach(l => {
        l.setAttribute("opacity", "1");
        l.setAttribute("stroke-width", "1.8");
      });
    });
    hideTip();
  });
});

// Endpoint labels with collision resolution
const resolved = resolveCollisions(endLabels, 13);
resolved.forEach(({ idx, y, lastX, lastPt, color, series }) => {
  const origY = yScale(lastPt.value);
  if (Math.abs(y - origY) > 2) {
    svg.appendChild(mkEl("line", {
      x1: lastX + 4, y1: origY, x2: lastX + 10, y2: y,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
  svg.appendChild(mkEl("text", {
    x: lastX + 13, y: y + 3.5,
    "font-size": "9.5", fill: "#2B2A27",
    "font-family": "Inter, sans-serif", "font-weight": "500"
  }, `${lastPt.value.toFixed(1)}  ${series.n}`));
});
</script>
</body></html>

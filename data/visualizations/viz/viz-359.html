<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 16px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 8px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #0f172a; color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 4px;
      transition: opacity 0.1s; white-space: nowrap; z-index: 10;
    }
  </style>
</head>
<body>
  <h1>The Demographic Transition in Population Growth</h1>
  <p class="subtitle">Annual population growth rate (%), 1961–2024 — selected countries</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — Population Growth, Annual % (SP.POP.GROW)</p>
  <div id="tip"></div>
  <script>
    // Data exported from catalog: wb--SP-POP-GROW
    const data = [{"n":"Ethiopia","s":[2.45,2.52,2.58,2.63,2.69,2.61,2.64,2.76,2.75,2.76,2.73,2.67,2.66,2.59,2.44,2.52,1.93,1.7,1.48,0.55,2.51,3.88,2.79,2.6,2.82,2.96,3.41,3.9,3.84,3.7,4.33,4.21,3.52,3.48,3.4,3.3,3.21,3.14,3.12,3.07,3.03,3.04,3.02,2.99,2.97,2.94,2.93,2.89,2.84,2.84,2.84,2.8,2.72,2.68,2.68,2.71,2.73,2.7,2.69,2.71,2.67,2.62,2.6,2.58],"y0":1961},{"n":"India","s":[2.4,2.37,2.35,2.34,2.25,2.14,2.15,2.15,2.11,2.22,2.22,2.2,2.25,2.3,2.36,2.35,2.36,2.3,2.33,2.38,2.35,2.33,2.34,2.35,2.33,2.31,2.28,2.25,2.23,2.21,2.17,2.13,2.1,2.04,2.01,2.0,1.97,1.94,1.9,1.88,1.87,1.81,1.73,1.7,1.63,1.56,1.51,1.44,1.45,1.45,1.42,1.37,1.33,1.26,1.19,1.19,1.16,1.1,1.04,0.97,0.82,0.79,0.88,0.89],"y0":1961},{"n":"Indonesia","s":[2.79,2.81,2.83,2.86,2.53,2.37,2.6,2.71,2.76,2.75,2.71,2.66,2.63,2.57,2.53,2.49,2.46,2.44,2.42,2.39,2.35,2.31,2.28,2.23,2.14,2.02,1.94,1.91,1.87,1.81,1.77,1.73,1.7,1.69,1.66,1.65,1.63,1.58,1.5,1.43,1.39,1.36,1.32,1.27,1.28,1.33,1.32,1.3,1.27,1.26,1.28,1.29,1.24,1.18,1.12,1.07,1.02,0.97,0.94,0.85,0.7,0.75,0.84,0.81],"y0":1961},{"n":"Brazil","s":[3.02,2.98,2.95,2.89,2.82,2.73,2.64,2.56,2.51,2.47,2.45,2.43,2.42,2.4,2.38,2.38,2.39,2.39,2.38,2.36,2.33,2.28,2.23,2.19,2.13,2.06,1.98,1.91,1.84,1.79,1.72,1.67,1.62,1.56,1.54,1.51,1.49,1.49,1.46,1.38,1.3,1.24,1.18,1.13,1.1,1.06,1.01,0.96,0.9,0.84,0.81,0.81,0.81,0.81,0.79,0.76,0.73,0.68,0.65,0.58,0.43,0.36,0.4,0.41],"y0":1961},{"n":"China","s":[-1.02,0.82,2.46,2.32,2.38,2.79,2.57,2.61,2.74,2.76,2.75,2.46,2.28,2.07,1.77,1.55,1.36,1.34,1.33,1.25,1.28,1.47,1.44,1.31,1.36,1.49,1.6,1.61,1.53,1.47,1.36,1.23,1.15,1.13,1.09,1.05,1.02,0.96,0.87,0.79,0.73,0.67,0.62,0.59,0.59,0.56,0.52,0.51,0.5,0.48,0.55,0.68,0.67,0.63,0.58,0.57,0.61,0.47,0.35,0.24,0.09,-0.01,-0.1,-0.12],"y0":1961},{"n":"Germany","s":[0.77,0.88,0.93,0.81,0.85,0.83,0.46,0.44,0.79,0.33,0.18,0.48,0.31,0.04,-0.37,-0.43,-0.23,-0.09,0.04,0.21,0.15,-0.1,-0.26,-0.35,-0.22,0.05,0.15,0.39,0.77,0.86,0.73,0.76,0.66,0.35,0.29,0.29,0.15,0.02,0.06,0.14,0.17,0.17,0.06,-0.02,-0.06,-0.11,-0.13,-0.19,-0.25,-0.15,-1.85,0.19,0.27,0.42,0.87,0.81,0.37,0.3,0.23,0.08,0.04,-0.02,0.13,0.27],"y0":1961},{"n":"Japan","s":[0.9,0.93,1.01,1.04,1.08,0.91,1.03,1.13,1.19,1.15,2.19,1.4,1.41,1.33,1.27,1.07,0.97,0.91,0.85,0.79,0.73,0.69,0.7,0.65,0.63,0.53,0.48,0.42,0.4,0.33,0.39,0.37,0.32,0.28,0.23,0.23,0.24,0.27,0.18,0.17,0.24,0.23,0.21,0.03,0.01,0.06,0.11,0.05,-0.01,0.02,-0.19,-0.16,-0.14,-0.13,-0.11,-0.05,-0.08,-0.13,-0.14,-0.29,-0.46,-0.44,-0.49,-0.44],"y0":1961}];

    const COLORS = ["#EA5E33","#F29A44","#C49A45","#3D7A5A","#C93A1E","#2B6CB0","#7B55AA"];

    const W = 760, H = 440;
    const margin = {top: 30, right: 90, bottom: 36, left: 46};
    const innerW = W - margin.left - margin.right;
    const innerH = H - margin.top - margin.bottom;

    const yearMin = 1961, yearMax = 2024;
    const valMin = -1, valMax = 4.5;

    const xScale = yr => margin.left + (yr - yearMin) / (yearMax - yearMin) * innerW;
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * innerH;

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = mkEl("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:760px;display:block;"});

    // Zero line
    svg.appendChild(mkEl("line", {
      x1: margin.left, y1: yScale(0), x2: W - margin.right, y2: yScale(0),
      stroke: "#64748b", "stroke-width": "0.8", "stroke-dasharray": "4,3"
    }));
    const zeroLbl = mkEl("text", {x: margin.left - 6, y: yScale(0) + 4, "text-anchor": "end", "font-size": "9", fill: "#64748b", "font-family": "monospace"});
    zeroLbl.textContent = "0%";
    svg.appendChild(zeroLbl);

    // Gridlines
    [-1, 1, 2, 3, 4].forEach(v => {
      svg.appendChild(mkEl("line", {
        x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
        stroke: "#E8E5DC", "stroke-width": "0.8"
      }));
      const lbl = mkEl("text", {x: margin.left - 6, y: yScale(v) + 4, "text-anchor": "end", "font-size": "10", fill: "#94a3b8", "font-family": "monospace"});
      lbl.textContent = v + "%";
      svg.appendChild(lbl);
    });

    // X axis ticks
    [1961, 1970, 1980, 1990, 2000, 2010, 2020, 2024].forEach(yr => {
      const x = xScale(yr);
      svg.appendChild(mkEl("line", {x1: x, y1: margin.top, x2: x, y2: H - margin.bottom + 4, stroke: "#E8E5DC", "stroke-width": "0.8"}));
      const lbl = mkEl("text", {x, y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "10", fill: "#94a3b8", "font-family": "monospace"});
      lbl.textContent = yr;
      svg.appendChild(lbl);
    });

    const tip = document.getElementById("tip");
    const groups = [];

    const labelItems = data.map((row, i) => {
      const pts = row.s.map((v, j) => ({year: row.y0 + j, value: v})).filter(p => p.value !== null);
      const last = pts[pts.length - 1];
      return {y: yScale(last.value), name: row.n, color: COLORS[i]};
    });
    const resolved = resolveCollisions(labelItems, 13);

    data.forEach((row, i) => {
      const color = COLORS[i];
      const pts = row.s.map((v, j) => ({year: row.y0 + j, value: v})).filter(p => p.value !== null);
      if (pts.length < 2) return;

      const g = mkEl("g", {});
      const pathD = pts.map((p, pi) => `${pi === 0 ? "M" : "L"}${xScale(p.year).toFixed(1)},${yScale(p.value).toFixed(1)}`).join(" ");

      const line = mkEl("path", {d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round"});
      g.appendChild(line);

      const hit = mkEl("path", {d: pathD, stroke: "transparent", "stroke-width": "14", fill: "none", style: "cursor:pointer"});
      g.appendChild(hit);

      const last = pts[pts.length - 1];
      g.appendChild(mkEl("circle", {cx: xScale(last.year), cy: yScale(last.value), r: "3", fill: color}));

      const labelEntry = resolved.find(r => r.name === row.n);
      const labelY = labelEntry ? Math.max(margin.top + 10, Math.min(H - margin.bottom - 10, labelEntry.y)) : yScale(last.value);
      const labelX = xScale(last.year) + 8;

      if (Math.abs(labelY - yScale(last.value)) > 4) {
        g.appendChild(mkEl("line", {x1: xScale(last.year) + 4, y1: yScale(last.value), x2: labelX, y2: labelY, stroke: color, "stroke-width": "0.6", opacity: "0.5"}));
      }

      const lbl = mkEl("text", {x: labelX, y: labelY + 4, "font-size": "9.5", fill: color, "font-family": "monospace", "font-weight": "600"});
      lbl.textContent = `${last.value.toFixed(2)}%  ${row.n}`;
      g.appendChild(lbl);

      svg.appendChild(g);
      groups.push({g, line, hit, row, pts, color, lbl});
    });

    groups.forEach(({line, hit, row, pts, lbl}, idx) => {
      hit.addEventListener("mousemove", e => {
        groups.forEach(({line: l, lbl: lb}, j) => {
          l.setAttribute("stroke-width", j === idx ? "3" : "1.8");
          l.setAttribute("opacity", j === idx ? "1" : "0.1");
          lb.setAttribute("opacity", j === idx ? "1" : "0.15");
        });
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / innerW));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const ptAtYr = pts.find(p => p.year === yr);
        const val = ptAtYr ? ptAtYr.value.toFixed(2) + "%" : "—";
        tip.textContent = `${row.n} (${yr}): ${val} growth rate`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(({line: l, lbl: lb}) => {
          l.setAttribute("stroke-width", "1.8");
          l.setAttribute("opacity", "1");
          lb.setAttribute("opacity", "1");
        });
        tip.style.opacity = "0";
      });
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

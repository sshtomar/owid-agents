<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #0f172a; color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 4px; white-space: nowrap;
      transition: opacity 0.1s; z-index: 100; font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <h1>International Tourism Arrivals</h1>
  <p class="subtitle">Visitor arrivals (millions) — France leads but China and Japan surged before the 2020 collapse</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank (ST.INT.ARVL), 1995–2020</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"France","pts":[{"y":1996,"v":148.26},{"y":1997,"v":157.55},{"y":2004,"v":190.28},{"y":2005,"v":185.83},{"y":2006,"v":193.88},{"y":2007,"v":193.32},{"y":2008,"v":193.57},{"y":2009,"v":192.37},{"y":2010,"v":189.83},{"y":2011,"v":196.59},{"y":2012,"v":197.52},{"y":2013,"v":204.41},{"y":2014,"v":206.6},{"y":2015,"v":203.3},{"y":2016,"v":203.04},{"y":2017,"v":207.27},{"y":2018,"v":212.0},{"y":2019,"v":217.88},{"y":2020,"v":117.11}]},{"n":"China","pts":[{"y":1995,"v":46.39},{"y":1996,"v":51.13},{"y":1997,"v":57.59},{"y":1998,"v":63.48},{"y":1999,"v":72.8},{"y":2000,"v":83.44},{"y":2001,"v":89.01},{"y":2002,"v":97.91},{"y":2003,"v":91.66},{"y":2004,"v":109.04},{"y":2005,"v":120.29},{"y":2006,"v":124.94},{"y":2007,"v":131.87},{"y":2008,"v":130.03},{"y":2009,"v":126.48},{"y":2010,"v":133.76},{"y":2011,"v":135.42},{"y":2012,"v":132.41},{"y":2013,"v":129.08},{"y":2014,"v":128.5},{"y":2015,"v":133.82},{"y":2016,"v":141.77},{"y":2017,"v":153.26},{"y":2018,"v":158.61},{"y":2019,"v":162.54},{"y":2020,"v":30.4}]},{"n":"Italy","pts":[{"y":1995,"v":55.71},{"y":1996,"v":59.8},{"y":1997,"v":58.0},{"y":1998,"v":58.5},{"y":1999,"v":59.52},{"y":2000,"v":62.7},{"y":2001,"v":60.96},{"y":2002,"v":63.56},{"y":2003,"v":63.03},{"y":2004,"v":58.48},{"y":2005,"v":59.23},{"y":2006,"v":66.35},{"y":2007,"v":70.27},{"y":2008,"v":70.72},{"y":2009,"v":71.69},{"y":2010,"v":73.22},{"y":2011,"v":75.87},{"y":2012,"v":76.29},{"y":2013,"v":76.76},{"y":2014,"v":77.69},{"y":2015,"v":81.07},{"y":2016,"v":84.92},{"y":2017,"v":89.93},{"y":2018,"v":93.23},{"y":2019,"v":95.4},{"y":2020,"v":38.42}]},{"n":"Germany","pts":[{"y":1995,"v":14.85},{"y":1996,"v":15.21},{"y":1997,"v":15.84},{"y":1998,"v":16.51},{"y":1999,"v":17.12},{"y":2000,"v":18.98},{"y":2001,"v":17.86},{"y":2002,"v":17.97},{"y":2003,"v":18.4},{"y":2004,"v":20.14},{"y":2005,"v":21.5},{"y":2006,"v":23.57},{"y":2007,"v":24.42},{"y":2008,"v":24.88},{"y":2009,"v":24.22},{"y":2010,"v":26.88},{"y":2011,"v":28.37},{"y":2012,"v":30.41},{"y":2013,"v":31.55},{"y":2014,"v":33.0},{"y":2015,"v":34.97},{"y":2016,"v":35.55},{"y":2017,"v":37.45},{"y":2018,"v":38.88},{"y":2019,"v":39.56},{"y":2020,"v":12.45}]},{"n":"Japan","pts":[{"y":1995,"v":3.35},{"y":1996,"v":3.84},{"y":1997,"v":4.22},{"y":1998,"v":4.11},{"y":1999,"v":4.44},{"y":2000,"v":4.76},{"y":2001,"v":4.77},{"y":2002,"v":5.24},{"y":2003,"v":5.21},{"y":2004,"v":6.14},{"y":2005,"v":6.73},{"y":2006,"v":7.33},{"y":2007,"v":8.35},{"y":2008,"v":8.35},{"y":2009,"v":6.79},{"y":2010,"v":8.61},{"y":2011,"v":6.22},{"y":2012,"v":8.36},{"y":2013,"v":10.36},{"y":2014,"v":13.41},{"y":2015,"v":19.74},{"y":2016,"v":24.04},{"y":2017,"v":28.69},{"y":2018,"v":31.19},{"y":2019,"v":31.88},{"y":2020,"v":4.12}]}];

    const COLORS = { "France": "#1D3557", "China": "#E63946", "Italy": "#2A9D8F", "Germany": "#F4A261", "Japan": "#6A4C93" };

    const W = 820, H = 460;
    const M = { top: 36, right: 120, bottom: 36, left: 52 };

    const allPts = data.flatMap(s => s.pts);
    const yearMin = 1995, yearMax = 2020;
    const valMax = 240, valMin = 0;

    const xS = y => M.left + (y - yearMin) / (yearMax - yearMin) * (W - M.left - M.right);
    const yS = v => M.top + (valMax - v) / (valMax - valMin) * (H - M.top - M.bottom);

    function mkEl(tag, attrs, text) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text != null) el.textContent = text;
      return el;
    }

    const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:820px;display:block" });

    // Grid
    [0, 50, 100, 150, 200].forEach(v => {
      svg.appendChild(mkEl("line", { x1: M.left, y1: yS(v), x2: W - M.right, y2: yS(v), stroke: "#e2e8f0", "stroke-width": "1" }));
      svg.appendChild(mkEl("text", { x: M.left - 6, y: yS(v) + 4, "text-anchor": "end", fill: "#94a3b8", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, v + "M"));
    });

    // X ticks
    [1995, 2000, 2005, 2010, 2015, 2020].forEach(y => {
      svg.appendChild(mkEl("line", { x1: xS(y), y1: M.top, x2: xS(y), y2: H - M.bottom, stroke: "#f1f5f9", "stroke-width": "1" }));
      svg.appendChild(mkEl("text", { x: xS(y), y: H - M.bottom + 14, "text-anchor": "middle", fill: "#94a3b8", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, y));
    });

    // COVID annotation
    svg.appendChild(mkEl("rect", {
      x: xS(2019.8), y: M.top,
      width: xS(2020) - xS(2019.8) + W - M.right - xS(2020),
      height: H - M.top - M.bottom,
      fill: "#E63946", opacity: "0.04"
    }));
    svg.appendChild(mkEl("text", {
      x: xS(2020) - 2, y: M.top + 14,
      "text-anchor": "end", fill: "#E63946",
      "font-size": "9", "font-family": "Inter, sans-serif", opacity: "0.7"
    }, "COVID-19"));

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      for (const item of sorted) {
        item.y = Math.max(M.top + 6, Math.min(H - M.bottom - 6, item.y));
      }
      return sorted;
    }

    const endLabels = data.map(s => {
      const last = s.pts[s.pts.length - 1];
      return { s, y: yS(last.v) };
    });
    const resolved = resolveCollisions(endLabels, 13);

    const tip = document.getElementById("tip");
    const groups = [];

    data.forEach(s => {
      const color = COLORS[s.n] || "#888";
      const g = mkEl("g", {});

      const pathD = s.pts.map((p, i) => `${i === 0 ? "M" : "L"}${xS(p.y).toFixed(1)},${yS(p.v).toFixed(1)}`).join(" ");
      const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "2", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
      g.appendChild(line);

      const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "14", fill: "none", cursor: "pointer" });
      g.appendChild(hit);

      const labelEntry = resolved.find(e => e.s === s);
      const labelY = labelEntry ? labelEntry.y : yS(s.pts[s.pts.length - 1].v);
      const last = s.pts[s.pts.length - 1];
      const actualY = yS(last.v);

      if (Math.abs(actualY - labelY) > 3) {
        svg.appendChild(mkEl("line", {
          x1: W - M.right + 2, y1: actualY,
          x2: W - M.right + 6, y2: labelY,
          stroke: color, "stroke-width": "0.8", opacity: "0.4"
        }));
      }

      svg.appendChild(mkEl("text", {
        x: W - M.right + 8, y: labelY + 3.5,
        fill: color, "font-size": "9.5", "font-family": "JetBrains Mono, monospace", "font-weight": "500"
      }, `${last.v}M  ${s.n}`));

      hit.addEventListener("mousemove", e => {
        groups.forEach(gg => gg.setAttribute("opacity", "0.1"));
        g.setAttribute("opacity", "1");
        line.setAttribute("stroke-width", "3");
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - M.left) / (W - M.left - M.right)));
        const hoverYear = yearMin + ratio * (yearMax - yearMin);
        const closest = s.pts.reduce((a, b) => Math.abs(b.y - hoverYear) < Math.abs(a.y - hoverYear) ? b : a);
        tip.textContent = `${s.n}: ${closest.v}M arrivals (${closest.y})`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(gg => gg.setAttribute("opacity", "1"));
        line.setAttribute("stroke-width", "2");
        tip.style.opacity = "0";
      });

      groups.push(g);
    });

    groups.forEach(g => svg.appendChild(g));
    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

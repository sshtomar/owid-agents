<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }

  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }

<h1>Energy Use Per Capita, 2000–2022</h1>
<p class="subtitle">Total primary energy consumption per person in kg of oil equivalent. Iceland's geothermal-powered industry sits 50× above Bangladesh. China has nearly tripled its per-capita use since 2000.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — EG.USE.PCAP.KG.OE (IEA data)</p>
<script>
const data = [{"n":"Iceland","pts":[{"y":2000,"v":11405},{"y":2001,"v":10925},{"y":2002,"v":11168},{"y":2003,"v":11093},{"y":2004,"v":10893},{"y":2005,"v":10877},{"y":2006,"v":13184},{"y":2007,"v":15188},{"y":2008,"v":17341},{"y":2009,"v":17937},{"y":2010,"v":17025},{"y":2011,"v":18162},{"y":2012,"v":17634},{"y":2013,"v":18213},{"y":2014,"v":17947},{"y":2015,"v":16911},{"y":2016,"v":15701},{"y":2017,"v":16235},{"y":2018,"v":17347},{"y":2019,"v":16701},{"y":2020,"v":16084},{"y":2021,"v":15780},{"y":2022,"v":15807}]},{"n":"Canada","pts":[{"y":2000,"v":8225},{"y":2001,"v":8017},{"y":2002,"v":7943},{"y":2003,"v":8303},{"y":2004,"v":8371},{"y":2005,"v":8370},{"y":2006,"v":8427},{"y":2007,"v":8356},{"y":2008,"v":8098},{"y":2009,"v":7696},{"y":2010,"v":7661},{"y":2011,"v":7716},{"y":2012,"v":7638},{"y":2013,"v":7669},{"y":2014,"v":7780},{"y":2015,"v":7690},{"y":2016,"v":7945},{"y":2017,"v":8175},{"y":2018,"v":8162},{"y":2019,"v":8126},{"y":2020,"v":7495},{"y":2021,"v":7525},{"y":2022,"v":7575}]},{"n":"South Korea","pts":[{"y":2000,"v":3952},{"y":2001,"v":3923},{"y":2002,"v":4093},{"y":2003,"v":4138},{"y":2004,"v":4255},{"y":2005,"v":4325},{"y":2006,"v":4338},{"y":2007,"v":4488},{"y":2008,"v":4513},{"y":2009,"v":4558},{"y":2010,"v":4920},{"y":2011,"v":5115},{"y":2012,"v":5123},{"y":2013,"v":5108},{"y":2014,"v":5137},{"y":2015,"v":5239},{"y":2016,"v":5391},{"y":2017,"v":5468},{"y":2018,"v":5532},{"y":2019,"v":5335},{"y":2020,"v":5196},{"y":2021,"v":5514},{"y":2022,"v":5412}]},{"n":"Australia","pts":[{"y":2000,"v":5681},{"y":2001,"v":5486},{"y":2002,"v":5480},{"y":2003,"v":5616},{"y":2004,"v":5652},{"y":2005,"v":5624},{"y":2006,"v":5775},{"y":2007,"v":5854},{"y":2008,"v":5951},{"y":2009,"v":5844},{"y":2010,"v":5763},{"y":2011,"v":5699},{"y":2012,"v":5534},{"y":2013,"v":5533},{"y":2014,"v":5407},{"y":2015,"v":5319},{"y":2016,"v":5217},{"y":2017,"v":5162},{"y":2018,"v":5086},{"y":2019,"v":5232},{"y":2020,"v":5159},{"y":2021,"v":5006},{"y":2022,"v":4942}]},{"n":"Germany","pts":[{"y":2000,"v":4094},{"y":2001,"v":4210},{"y":2002,"v":4109},{"y":2003,"v":4096},{"y":2004,"v":4132},{"y":2005,"v":4110},{"y":2006,"v":4236},{"y":2007,"v":4024},{"y":2008,"v":4082},{"y":2009,"v":3822},{"y":2010,"v":4030},{"y":2011,"v":3892},{"y":2012,"v":3913},{"y":2013,"v":3986},{"y":2014,"v":3794},{"y":2015,"v":3781},{"y":2016,"v":3765},{"y":2017,"v":3763},{"y":2018,"v":3659},{"y":2019,"v":3571},{"y":2020,"v":3349},{"y":2021,"v":3467},{"y":2022,"v":3262}]},{"n":"France","pts":[{"y":2000,"v":4130},{"y":2001,"v":4240},{"y":2002,"v":4220},{"y":2003,"v":4297},{"y":2004,"v":4327},{"y":2005,"v":4314},{"y":2006,"v":4214},{"y":2007,"v":4142},{"y":2008,"v":4138},{"y":2009,"v":3938},{"y":2010,"v":4040},{"y":2011,"v":3951},{"y":2012,"v":3929},{"y":2013,"v":3926},{"y":2014,"v":3756},{"y":2015,"v":3799},{"y":2016,"v":3718},{"y":2017,"v":3705},{"y":2018,"v":3669},{"y":2019,"v":3606},{"y":2020,"v":3228},{"y":2021,"v":3470},{"y":2022,"v":3100}]},{"n":"Japan","pts":[{"y":2000,"v":4067},{"y":2001,"v":3990},{"y":2002,"v":3993},{"y":2003,"v":3957},{"y":2004,"v":4085},{"y":2005,"v":4066},{"y":2006,"v":4064},{"y":2007,"v":4021},{"y":2008,"v":3867},{"y":2009,"v":3709},{"y":2010,"v":3900},{"y":2011,"v":3620},{"y":2012,"v":3537},{"y":2013,"v":3567},{"y":2014,"v":3446},{"y":2015,"v":3401},{"y":2016,"v":3371},{"y":2017,"v":3391},{"y":2018,"v":3343},{"y":2019,"v":3262},{"y":2020,"v":3047},{"y":2021,"v":3196},{"y":2022,"v":3130}]},{"n":"Iran","pts":[{"y":2000,"v":1852},{"y":2001,"v":1979},{"y":2002,"v":2031},{"y":2003,"v":2075},{"y":2004,"v":2215},{"y":2005,"v":2405},{"y":2006,"v":2460},{"y":2007,"v":2561},{"y":2008,"v":2711},{"y":2009,"v":2672},{"y":2010,"v":2640},{"y":2011,"v":2659},{"y":2012,"v":2741},{"y":2013,"v":2759},{"y":2014,"v":2884},{"y":2015,"v":2737},{"y":2016,"v":2861},{"y":2017,"v":3027},{"y":2018,"v":2921},{"y":2019,"v":3178},{"y":2020,"v":3257},{"y":2021,"v":3357},{"y":2022,"v":3288}]},{"n":"China","pts":[{"y":2000,"v":898},{"y":2001,"v":922},{"y":2002,"v":976},{"y":2003,"v":1105},{"y":2004,"v":1249},{"y":2005,"v":1370},{"y":2006,"v":1490},{"y":2007,"v":1595},{"y":2008,"v":1630},{"y":2009,"v":1729},{"y":2010,"v":1900},{"y":2011,"v":2027},{"y":2012,"v":2085},{"y":2013,"v":2137},{"y":2014,"v":2178},{"y":2015,"v":2175},{"y":2016,"v":2149},{"y":2017,"v":2216},{"y":2018,"v":2311},{"y":2019,"v":2398},{"y":2020,"v":2466},{"y":2021,"v":2624},{"y":2022,"v":2676}]},{"n":"Brazil","pts":[{"y":2000,"v":1081},{"y":2001,"v":1087},{"y":2002,"v":1103},{"y":2003,"v":1108},{"y":2004,"v":1157},{"y":2005,"v":1174},{"y":2006,"v":1202},{"y":2007,"v":1260},{"y":2008,"v":1317},{"y":2009,"v":1262},{"y":2010,"v":1384},{"y":2011,"v":1390},{"y":2012,"v":1433},{"y":2013,"v":1487},{"y":2014,"v":1522},{"y":2015,"v":1482},{"y":2016,"v":1415},{"y":2017,"v":1432},{"y":2018,"v":1403},{"y":2019,"v":1416},{"y":2020,"v":1379},{"y":2021,"v":1430},{"y":2022,"v":1433}]},{"n":"India","pts":[{"y":2000,"v":395},{"y":2001,"v":393},{"y":2002,"v":397},{"y":2003,"v":400},{"y":2004,"v":415},{"y":2005,"v":425},{"y":2006,"v":442},{"y":2007,"v":461},{"y":2008,"v":482},{"y":2009,"v":509},{"y":2010,"v":532},{"y":2011,"v":547},{"y":2012,"v":572},{"y":2013,"v":577},{"y":2014,"v":610},{"y":2015,"v":622},{"y":2016,"v":627},{"y":2017,"v":648},{"y":2018,"v":668},{"y":2019,"v":667},{"y":2020,"v":632},{"y":2021,"v":677},{"y":2022,"v":728}]},{"n":"Bangladesh","pts":[{"y":2000,"v":136},{"y":2001,"v":148},{"y":2002,"v":148},{"y":2003,"v":153},{"y":2004,"v":154},{"y":2005,"v":160},{"y":2006,"v":168},{"y":2007,"v":174},{"y":2008,"v":181},{"y":2009,"v":188},{"y":2010,"v":196},{"y":2011,"v":200},{"y":2012,"v":208},{"y":2013,"v":217},{"y":2014,"v":223},{"y":2015,"v":237},{"y":2016,"v":256},{"y":2017,"v":264},{"y":2018,"v":261},{"y":2019,"v":278},{"y":2020,"v":279},{"y":2021,"v":299},{"y":2022,"v":308}]}];

const W = 820, H = 500;
const margin = { top: 30, right: 130, bottom: 36, left: 60 };
const innerW = W - margin.left - margin.right;
const innerH = H - margin.top - margin.bottom;

const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("width","100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

const yearMin = 2000, yearMax = 2022;
const valMin = 0, valMax = 19000;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * innerW;
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * innerH;

// Country colors
const palette = [
  "#EA5E33","#F29A44","#5B9E78","#3D7A5A","#C49A45",
  "#C4715A","#A6C4A2","#8BAD72","#7A786F","#4A4845",
  "#B34B3B","#2B2A27"
];

// Grid lines
[0,4000,8000,12000,16000].forEach(v=>{
  const y = yScale(v);
  svg.appendChild(mkEl("line",{x1:margin.left,y1:y,x2:W-margin.right,y2:y,stroke:"#E2E0D5","stroke-width":"0.5"}));
  const t = mkEl("text",{x:margin.left-6,y:y+3,"text-anchor":"end","font-size":"8","font-family":"JetBrains Mono,monospace",fill:"#9A9890"});
  t.textContent = v === 0 ? "0" : (v/1000)+"k";
  svg.appendChild(t);
});

// Y-axis label
const ylab = mkEl("text",{x:10,y:margin.top+innerH/2,"text-anchor":"middle","font-size":"8","font-family":"JetBrains Mono,monospace",fill:"#9A9890","transform":`rotate(-90,10,${margin.top+innerH/2})`});
ylab.textContent = "KG OIL EQUIVALENT / PERSON";
svg.appendChild(ylab);

// X-axis ticks
[2000,2005,2010,2015,2022].forEach(yr=>{
  const x = xScale(yr);
  svg.appendChild(mkEl("line",{x1:x,y1:H-margin.bottom,x2:x,y2:H-margin.bottom+4,stroke:"#C2C0B5","stroke-width":"0.8"}));
  const t = mkEl("text",{x,y:H-margin.bottom+13,"text-anchor":"middle","font-size":"8","font-family":"JetBrains Mono,monospace",fill:"#9A9890"});
  t.textContent = yr;
  svg.appendChild(t);
});

// Collision resolution for endpoint labels
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a,b)=>a.y-b.y);
  for (let pass=0;pass<30;pass++) {
    let moved=false;
    for (let i=1;i<sorted.length;i++) {
      const gap=sorted[i].y-sorted[i-1].y;
      if(gap<minGap){ const sh=(minGap-gap)/2; sorted[i-1].y-=sh; sorted[i].y+=sh; moved=true; }
    }
    if(!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
function showTip(t,e){tip.textContent=t;tip.style.opacity="1";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-20)+"px";}
function hideTip(){tip.style.opacity="0";}

const endLabels = [];

data.forEach((series, si) => {
  const col = palette[si % palette.length];
  const pts = series.pts;

  const pathD = pts.map((p,i)=>`${i===0?"M":"L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");

  const g = mkEl("g",{cursor:"crosshair"});

  const line = mkEl("path",{d:pathD,stroke:col,"stroke-width":"1.5",fill:"none","stroke-linejoin":"round","stroke-linecap":"round"});
  line.setAttribute("data-series","1");
  const hit = mkEl("path",{d:pathD,stroke:"transparent","stroke-width":"12",fill:"none"});

  hit.addEventListener("mouseover",e=>{
    showTip(series.n,e);
    svg.querySelectorAll("path[data-series]").forEach(el=>el.setAttribute("stroke-opacity","0.08"));
    line.setAttribute("stroke-opacity","1");
    line.setAttribute("stroke-width","2.5");
  });
  hit.addEventListener("mousemove",e=>{
    tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-20)+"px";
    // find nearest year
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0,Math.min(1,(mx-margin.left)/innerW));
    const yearIdx = Math.round(ratio*(pts.length-1));
    const p = pts[yearIdx] || pts[pts.length-1];
    showTip(`${series.n} (${p.y}): ${p.v.toLocaleString()} kgoe`,e);
  });
  hit.addEventListener("mouseout",()=>{
    hideTip();
    svg.querySelectorAll("path[data-series]").forEach(el=>{ el.setAttribute("stroke-opacity","1"); el.setAttribute("stroke-width","1.5"); });
  });

  const lastPt = pts[pts.length-1];
  endLabels.push({y:yScale(lastPt.v), orig:yScale(lastPt.v), name:series.n, v:lastPt.v, col});

  g.appendChild(line);
  g.appendChild(hit);
  svg.appendChild(g);
});

// Endpoint labels with collision resolution
const resolved = resolveCollisions(endLabels, 11);
const xEnd = W - margin.right + 6;

resolved.forEach(l=>{
  const t = mkEl("text",{x:xEnd,y:l.y+3.5,"text-anchor":"start","font-size":"9","font-family":"Inter,sans-serif",fill:l.col});
  t.textContent = l.name;
  svg.appendChild(t);
  // Leader line if displaced
  if (Math.abs(l.y - l.orig) > 2) {
    svg.appendChild(mkEl("line",{x1:W-margin.right,y1:l.orig,x2:xEnd-2,y2:l.y,stroke:l.col,"stroke-width":"0.5","stroke-opacity":"0.5"}));
  }
});
</script>
</body></html>

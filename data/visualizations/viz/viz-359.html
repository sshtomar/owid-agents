const W = 800, H = 440;
const margin = { top: 36, right: 130, bottom: 36, left: 44 };

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);

  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  const top = margin.top - 2, bot = H - margin.bottom + 4;
  sorted.forEach(item => { item.y = Math.max(top, Math.min(bot, item.y)); });
  return sorted;
}

});

  }));

  const hitPath = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });

  const last = series.pts[series.pts.length - 1];

  const actualY = yScale(last.v);

    g.appendChild(mkEl("line", {
      x1: anchorX, y1: actualY, x2: anchorX + 1, y2: labelY,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
  const lbl = mkEl("text"); lbl.textContent = `${last.v.toFixed(1)}% ${series.n}`;
  lbl.setAttribute("x", anchorX + 3); lbl.setAttribute("y", labelY + 3);
  lbl.setAttribute("font-family", "'Inter', sans-serif");
  lbl.setAttribute("font-size", "8.5"); lbl.setAttribute("font-weight", "500");
  lbl.setAttribute("fill", color);
  g.appendChild(lbl);

  hitPath.addEventListener("mousemove", e => {
    groups.forEach(gg => { gg.style.opacity = "0.1"; });
    g.style.opacity = "1";
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yIdx = Math.round(ratio * (series.pts.length - 1));
    const pt = series.pts[Math.min(yIdx, series.pts.length - 1)];
    tip.textContent = `${series.n} ${pt.y}: ${pt.v.toFixed(1)}%`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
  });
  hitPath.addEventListener("mouseleave", () => {
    groups.forEach(gg => { gg.style.opacity = "1"; });
    tip.style.opacity = "0";
  });

  svg.appendChild(g);
  groups.push(g);
});

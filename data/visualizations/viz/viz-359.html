<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap');
    body { font-family: "Inter", -apple-system, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 8px; }
    #tip {
      position: fixed; pointer-events: none; background: rgba(15,23,42,0.92);
      color: #f8fafc; font-size: 12px; padding: 6px 10px; border-radius: 5px;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 99;
      font-family: "JetBrains Mono", monospace;
    }
  </style>
</head>
<body>
  <h1>Age Dependency Ratio, 1960–2024</h1>
  <p class="subtitle">Dependents (young + old) per 100 working-age people. Africa stays high; East Asia fell sharply then reversed; Europe slowly climbs.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — Age dependency ratio (SP.POP.DPND)</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"Chad","s":[81.7,82.5,83.4,84.3,84.9,85.2,85.5,85.9,86.4,86.9,87.6,88.3,89.2,90.2,91.3,92.5,93.9,95.4,96.9,97.9,101.6,105.3,101.3,98.0,100.8,103.7,103.3,102.2,101.6,101.3,102.3,101.9,100.9,103.3,105.6,104.4,103.7,105.0,105.9,106.1,106.6,107.3,107.6,106.8,105.2,104.4,104.4,104.5,104.2,104.0,104.0,103.8,103.4,102.9,102.4,102.4,102.3,101.8,101.2,100.7,100.1,98.9,97.9,95.4,92.9],"y0":1960},{"n":"Burundi","s":[93.4,93.6,93.9,94.9,94.9,94.4,93.7,93.0,92.7,92.8,93.0,92.9,95.2,97.2,96.3,96.1,96.3,96.2,95.7,96.3,94.6,93.6,95.0,96.2,97.6,99.3,101.3,102.5,103.7,105.2,106.3,107.1,106.5,115.5,116.0,106.9,108.9,110.1,107.7,104.7,102.7,100.5,98.4,96.4,94.2,92.7,91.9,91.4,90.6,89.9,90.0,91.0,92.2,93.4,94.6,97.1,99.9,101.1,100.5,99.0,97.6,96.0,94.1,91.8,89.5],"y0":1960},{"n":"Iran","s":[91.0,92.7,94.0,95.0,95.2,94.7,94.2,93.8,93.5,93.1,92.5,91.7,90.7,89.5,88.2,87.0,86.3,85.9,85.9,86.1,86.7,85.3,84.2,85.1,86.1,87.1,87.8,88.5,89.3,89.9,89.9,89.3,88.7,88.8,87.7,84.2,80.1,75.4,70.3,65.3,60.6,56.3,52.8,49.8,47.1,44.8,43.0,41.6,40.8,40.3,40.1,40.1,40.3,40.6,41.2,42.0,42.9,43.7,44.3,44.8,44.9,44.8,44.6,44.4,44.3],"y0":1960},{"n":"Brazil","s":[87.7,88.3,88.8,89.0,88.9,88.5,87.9,87.1,86.1,85.0,83.9,82.6,81.4,80.1,78.9,77.6,76.4,75.2,74.1,73.1,72.2,71.5,70.9,70.4,69.9,69.3,68.8,68.1,67.3,66.5,65.6,64.6,63.5,62.3,61.1,59.9,58.6,57.4,56.2,55.1,53.9,52.8,51.8,50.8,49.8,49.0,48.3,47.6,46.9,46.3,45.7,45.2,44.6,44.2,43.8,43.6,43.4,43.4,43.4,43.5,43.6,43.6,43.8,44.0,44.3],"y0":1960},{"n":"China","s":[79.5,78.0,77.9,79.7,81.5,82.2,82.3,81.5,80.8,80.6,80.2,79.8,79.1,78.5,78.7,79.2,79.5,78.3,74.7,71.0,68.0,65.5,63.5,61.3,58.7,56.5,54.7,53.5,52.6,51.9,51.8,51.7,51.5,51.2,50.9,50.3,49.6,48.7,47.8,47.0,46.1,45.0,43.5,42.1,40.7,39.2,38.2,37.7,37.4,37.3,37.2,37.4,37.7,38.2,38.9,39.6,40.4,41.5,42.5,43.4,44.1,44.5,44.7,44.7,44.2],"y0":1960},{"n":"Korea, Rep.","s":[80.0,81.6,83.4,85.1,86.5,87.3,87.7,87.4,86.5,85.3,83.5,81.7,80.1,78.0,75.6,72.8,69.8,67.1,64.7,62.7,60.9,59.4,58.0,56.5,54.6,52.5,50.5,48.6,47.0,45.6,44.3,43.3,42.6,42.0,41.4,40.6,39.9,39.3,38.9,38.8,39.0,39.3,39.4,39.5,39.5,39.4,39.1,38.8,38.4,38.0,37.7,37.3,36.8,36.5,36.5,36.5,36.5,36.8,37.3,37.9,38.8,39.8,40.6,41.5,42.5],"y0":1960},{"n":"Japan","s":[55.2,53.8,51.4,49.0,47.1,45.8,44.6,43.8,43.6,43.5,43.5,43.8,44.5,45.3,46.0,46.6,47.1,47.5,47.9,48.1,48.2,48.3,48.4,47.9,47.6,47.1,46.4,45.5,44.6,43.8,43.2,42.9,42.9,42.9,43.1,43.5,44.0,44.6,45.2,45.9,46.7,47.6,48.5,49.3,50.3,51.6,53.0,54.4,55.7,56.8,57.4,58.6,60.5,62.6,64.5,66.0,67.3,68.3,69.0,69.5,69.9,70.3,70.2,70.1,70.1],"y0":1960},{"n":"Germany","s":[48.7,50.1,51.4,52.5,53.6,54.6,55.5,56.7,57.6,58.0,58.3,58.5,58.4,58.0,57.6,57.0,56.2,55.3,54.3,53.1,51.6,49.8,47.8,46.0,44.6,44.0,43.8,43.8,44.1,44.4,44.8,45.3,45.5,45.8,46.1,46.3,46.4,46.5,46.6,46.8,47.3,47.8,48.2,48.7,49.3,50.0,50.8,51.5,51.8,52.2,52.1,51.7,51.6,51.6,51.8,52.1,52.6,53.3,53.9,54.5,55.3,56.2,57.2,58.0,59.0],"y0":1960},{"n":"Italy","s":[52.7,52.9,52.7,52.5,52.6,52.9,53.4,53.9,54.5,55.1,55.6,56.1,56.5,56.9,57.3,57.4,57.3,57.1,56.7,56.1,55.0,53.6,52.1,50.5,49.0,48.1,47.5,47.0,46.6,46.2,45.8,45.1,44.7,45.0,45.9,46.3,46.1,46.6,47.0,47.5,48.1,48.7,49.3,49.9,50.3,50.9,51.6,51.9,52.0,52.3,52.7,53.1,53.8,54.4,55.1,55.6,55.9,56.1,56.3,56.6,56.8,56.9,57.0,57.1,57.5],"y0":1960}];

    const COLORS = {
      "Chad": "#C4715A", "Burundi": "#B34B3B",
      "Iran": "#F29A44", "Brazil": "#C49A45",
      "China": "#3D7A5A", "Korea, Rep.": "#5B9E78",
      "Japan": "#2E6DA4", "Germany": "#6B8E5A", "Italy": "#8B5E3C"
    };

    const W = 800, H = 500;
    const margin = {top: 36, right: 106, bottom: 36, left: 48};

    const yearMin = 1960, yearMax = 2024;
    const valMin = 30, valMax = 120;

    const xS = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yS = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    const ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs, txt) {
      const e = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
      if (txt != null) e.textContent = txt;
      return e;
    }

    const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:800px;display:block;"});

    // Y gridlines
    [30, 50, 70, 90, 110].forEach(v => {
      const y = yS(v);
      svg.appendChild(el("line", {x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#e2e8f0", "stroke-width": "0.5"}));
      svg.appendChild(el("text", {x: margin.left - 6, y: y + 4, "text-anchor": "end", "font-size": "10", "font-family": "JetBrains Mono", fill: "#94a3b8"}, v + "%"));
    });

    // X axis labels
    [1960, 1970, 1980, 1990, 2000, 2010, 2020].forEach(yr => {
      svg.appendChild(el("text", {x: xS(yr), y: H - 4, "text-anchor": "middle", "font-size": "10", "font-family": "JetBrains Mono", fill: "#94a3b8"}, yr));
    });

    // Dashed line at 100% (more dependents than workers)
    svg.appendChild(el("line", {x1: margin.left, y1: yS(100), x2: W - margin.right, y2: yS(100), stroke: "#C4715A", "stroke-dasharray": "4,3", "stroke-width": "0.7", opacity: "0.5"}));
    svg.appendChild(el("text", {x: W - margin.right + 4, y: yS(100) + 4, "font-size": "8.5", "font-family": "JetBrains Mono", fill: "#C4715A", opacity: "0.7"}, "100%"));

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i-1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i-1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const tip = document.getElementById("tip");
    function showTip(t, e) { tip.textContent = t; tip.style.opacity = "1"; tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY-20)+"px"; }
    function hideTip() { tip.style.opacity = "0"; }

    const groups = [];

    data.forEach((d, i) => {
      const pts = [];
      d.s.forEach((v, j) => { if (v != null) pts.push({year: d.y0 + j, v}); });
      if (!pts.length) return;

      const pathD = pts.map((p, j) => `${j===0?"M":"L"} ${xS(p.year).toFixed(1)} ${yS(p.v).toFixed(1)}`).join(" ");
      const col = COLORS[d.n] || "#64748b";

      const g = el("g", {});
      const line = el("path", {d: pathD, stroke: col, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round"});
      const hit = el("path", {d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer"});

      const lastPt = pts[pts.length - 1];

      hit.addEventListener("mouseenter", e => {
        groups.forEach((gg, ii) => gg.g.setAttribute("opacity", ii === i ? "1" : "0.1"));
        groups[i].line.setAttribute("stroke-width", "3");
        showTip(`${d.n}: ${lastPt.v.toFixed(0)}% (${lastPt.year})`, e);
      });
      hit.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const nearest = pts.reduce((a, b) => Math.abs(b.year - yr) < Math.abs(a.year - yr) ? b : a);
        showTip(`${d.n}: ${nearest.v.toFixed(0)}% dependency ratio (${nearest.year})`, e);
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(gg => gg.g.setAttribute("opacity", "1"));
        groups[i].line.setAttribute("stroke-width", "1.5");
        hideTip();
      });

      g.appendChild(line); g.appendChild(hit);
      svg.appendChild(g);
      const lastPtActual = pts[pts.length - 1];
      groups.push({g, line, endY: yS(lastPtActual.v), name: d.n, val: lastPtActual.v, col, lastYear: lastPtActual.year});
    });

    // Endpoint labels with collision resolution
    const labelItems = groups.map(g => ({y: g.endY, name: g.name, val: g.val, col: g.col}));
    resolveCollisions(labelItems, 12).forEach(item => {
      const orig = groups.find(g => g.name === item.name).endY;
      const lx = W - margin.right + 4;
      if (Math.abs(orig - item.y) > 3) {
        svg.appendChild(el("line", {x1: W - margin.right, y1: orig, x2: lx, y2: item.y, stroke: item.col, "stroke-width": "0.5", opacity: "0.5"}));
      }
      svg.appendChild(el("text", {x: lx + 2, y: item.y + 3.5, "font-size": "9", "font-family": "JetBrains Mono", fill: item.col}, `${item.val.toFixed(0)}% ${item.name}`));
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

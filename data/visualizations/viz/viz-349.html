<h1>Health Spending as Share of GDP, 2000–2024</h1>
<p class="subtitle">Current health expenditure as % of GDP for 11 countries spanning high, middle, and low income levels. South Korea more than doubled its share; India's has barely moved.</p>

<p class="source">Source: World Bank — Current Health Expenditure % GDP (SH.XPD.CHEX.GD.ZS)</p>
<script>
const data = [{"n":"Germany","pts":[{"y":2000,"v":9.76},{"y":2001,"v":9.78},{"y":2002,"v":10.03},{"y":2003,"v":10.22},{"y":2004,"v":9.97},{"y":2005,"v":10.11},{"y":2006,"v":9.96},{"y":2007,"v":9.83},{"y":2008,"v":10.03},{"y":2009,"v":10.97},{"y":2010,"v":10.83},{"y":2011,"v":10.52},{"y":2012,"v":10.59},{"y":2013,"v":10.74},{"y":2014,"v":10.77},{"y":2015,"v":10.92},{"y":2016,"v":10.97},{"y":2017,"v":11.05},{"y":2018,"v":11.18},{"y":2019,"v":11.43},{"y":2020,"v":12.47},{"y":2021,"v":12.72},{"y":2022,"v":12.45},{"y":2023,"v":11.74},{"y":2024,"v":12.27}]},{"n":"France","pts":[{"y":2000,"v":9.62},{"y":2001,"v":9.76},{"y":2002,"v":10.08},{"y":2003,"v":10.13},{"y":2004,"v":10.21},{"y":2005,"v":10.24},{"y":2006,"v":10.4},{"y":2007,"v":10.33},{"y":2008,"v":10.51},{"y":2009,"v":11.29},{"y":2010,"v":11.22},{"y":2011,"v":11.18},{"y":2012,"v":11.34},{"y":2013,"v":11.38},{"y":2014,"v":11.58},{"y":2015,"v":11.5},{"y":2016,"v":11.57},{"y":2017,"v":11.45},{"y":2018,"v":11.31},{"y":2019,"v":11.17},{"y":2020,"v":12.13},{"y":2021,"v":12.25},{"y":2022,"v":11.83},{"y":2023,"v":11.52},{"y":2024,"v":11.54}]},{"n":"Japan","pts":[{"y":2000,"v":7.03},{"y":2001,"v":7.24},{"y":2002,"v":7.35},{"y":2003,"v":7.49},{"y":2004,"v":7.54},{"y":2005,"v":7.66},{"y":2006,"v":7.69},{"y":2007,"v":7.78},{"y":2008,"v":8.09},{"y":2009,"v":8.96},{"y":2010,"v":9.06},{"y":2011,"v":10.49},{"y":2012,"v":10.67},{"y":2013,"v":10.67},{"y":2014,"v":10.73},{"y":2015,"v":10.75},{"y":2016,"v":10.66},{"y":2017,"v":10.66},{"y":2018,"v":10.74},{"y":2019,"v":10.97},{"y":2020,"v":11.45},{"y":2021,"v":12.08},{"y":2022,"v":12.32},{"y":2023,"v":10.74}]},{"n":"Australia","pts":[{"y":2000,"v":7.59},{"y":2001,"v":7.67},{"y":2002,"v":7.87},{"y":2003,"v":7.88},{"y":2004,"v":8.08},{"y":2005,"v":7.96},{"y":2006,"v":7.97},{"y":2007,"v":8.05},{"y":2008,"v":8.25},{"y":2009,"v":8.54},{"y":2010,"v":8.42},{"y":2011,"v":8.53},{"y":2012,"v":8.67},{"y":2013,"v":8.75},{"y":2014,"v":9.83},{"y":2015,"v":10.14},{"y":2016,"v":10.09},{"y":2017,"v":10. 06},{"y":2016,"v":5.07},{"y":2017,"v":5.35},{"y":2018,"v":4.75},{"y":2019,"v":4.6},{"y":2020,"v":4.15},{"y":2021,"v":4.61},{"y":2022,"v":4.72},{"y":2023,"v":4.88}]},{"n":"India","pts":[{"y":2000,"v":4.11},{"y":2001,"v":4.34},{"y":2002,"v":4.31},{"y":2003,"v":4.08},{"y":2004,"v":4.03},{"y":2005,"v":3.86},{"y":2006,"v":3.67},{"y":2007,"v":3.58},{"y":2008,"v":3.59},{"y":2009,"v":3.55},{"y":2010,"v":3.34},{"y":2011,"v":3.25},{"y":2012,"v":3.33},{"y":2013,"v":3.75},{"y":2014,"v":3.62},{"y":2015,"v":3.6},{"y":2016,"v":3.5},{"y":2017,"v":2.94},{"y":2018,"v":2.86},{"y":2019,"v":2.95},{"y":2020,"v":3.34},{"y":2021,"v":3.35},{"y":2022,"v":3.4},{"y":2023,"v":3.34}]},{"n":"Ethiopia","pts":[{"y":2000,"v":4.37},{"y":2001,"v":4.72},{"y":2002,"v":4.71},{"y":2003,"v":4.9},{"y":2004,"v":4.31},{"y":2005,"v":4.1},{"y":2006,"v":4.46},{"y":2007,"v":5.0},{"y":2008,"v":4.28},{"y":2009,"v":4.65},{"y":2010,"v":5.47},{"y":2011,"v":4.47},{"y":2012,"v":4.54},{"y":2013,"v":4.08},{"y":2014,"v":4.03},{"y":2015,"v":3.82},{"y":2016,"v":3.6},{"y":2017,"v":3.45},{"y":2018,"v":3.3},{"y":2019,"v":3.24},{"y":2020,"v":3.48},{"y":2021,"v":3.21},{"y":2022,"v":2.85},{"y":2023,"v":2.8}]},{"n":"Ghana","pts":[{"y":2000,"v":1.66},{"y":2001,"v":1.87},{"y":2002,"v":1.95},{"y":2003,"v":2.15},{"y":2004,"v":2.37},{"y":2005,"v":3.27},{"y":2006,"v":3.67},{"y":2007,"v":3.71},{"y":2008,"v":3.73},{"y":2009,"v":4.18},{"y":2010,"v":4.52},{"y":2011,"v":4.46},{"y":2012,"v":3.93},{"y":2013,"v":4.59},{"y":2014,"v":4.02},{"y":2015,"v":4.54},{"y":2016,"v":3.39},{"y":2017,"v":2.69},{"y":2018,"v":2.43},{"y":2019,"v":3.25},{"y":2020,"v":4.43},{"y":2021,"v":3.86},{"y":2022,"v":3.67},{"y":2023,"v":2.95}]}];

const W = 760, H = 460;
const margin = { top: 30, right: 130, bottom: 40, left: 50 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 28) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

const yearMin = 2000, yearMax = 2024;
const allVals = data.flatMap(d => d.pts.map(p => p.v));
const valMin = 0, valMax = Math.ceil(Math.max(...allVals)) + 0.5;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[2, 4, 6, 8, 10, 12].forEach(v => {
  if (v <= valMax) {
    svg.appendChild(mkEl("line", {
      x1: margin.left, y1: yScale(v),
      x2: W - margin.right, y2: yScale(v),
      stroke: "#E2E0D5", "stroke-width": "0.5"
    }));
    const t = mkEl("text", {
      x: margin.left - 6, y: yScale(v) + 3.5,
      "text-anchor": "end",
      "font-family": "'JetBrains Mono', monospace",
      "font-size": "9", fill: "#9A9890"
    });
    t.textContent = v + "%";
    svg.appendChild(t);
  }
});

// X-axis ticks
[2000, 2005, 2010, 2015, 2020, 2024].forEach(yr => {
  const x = xScale(yr);
  svg.appendChild(mkEl("line", {
    x1: x, y1: H - margin.bottom + 3,
    x2: x, y2: H - margin.bottom,
    stroke: "#C2C0B5", "stroke-width": "0.8"
  }));
  const t = mkEl("text", {
    x, y: H - margin.bottom + 14,
    "text-anchor": "middle",
    "font-family": "'JetBrains Mono', monospace",
    "font-size": "9", fill: "#7A786F"
  });
  t.textContent = yr;
  svg.appendChild(t);
});

// 2020 COVID spike annotation
svg.appendChild(mkEl("line", {
  x1: xScale(2020), y1: margin.top,
  x2: xScale(2020), y2: H - margin.bottom,
  stroke: "#C2C0B5", "stroke-dasharray": "4,3", "stroke-width": "0.7"
}));

const annT = mkEl("text", {
  x: xScale(2020) + 3, y: margin.top + 10,
  "font-size": "8", fill: "#9A9890",
  "font-family": "'JetBrains Mono', monospace"
});
annT.textContent = "COVID-19";
svg.appendChild(annT);

// Color palette for 11 countries
const palette = [
  "#EA5E33","#F29A44","#5B9E78","#3D7A5A",
  "#C4715A","#8BAD72","#A6C4A2","#C49A45",
  "#7A786F","#B34B3B","#F5D38A"
];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  const chartTop = margin.top + 4;
  const chartBot = H - margin.bottom - 4;
  for (const item of sorted) {
    item.y = Math.max(chartTop, Math.min(chartBot, item.y));
  }
  return sorted;
}

const groups = [];
const endLabels = [];

data.forEach((series, i) => {
  const color = palette[i % palette.length];
  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const points = series.pts;
  const pathD = points.map((p, j) =>
    `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`
  ).join(" ");

  const path = mkEl("path", {
    d: pathD, stroke: color,
    "stroke-width": "1.5", fill: "none",
    "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  const hit = mkEl("path", {
    d: pathD, stroke: "transparent",
    "stroke-width": "12", fill: "none"
  });

  g.appendChild(path);
  g.appendChild(hit);
  svg.appendChild(g);

  const lastPt = points[points.length - 1];
  const shortName = series.n.replace(", Rep.", "").replace(", Arab Rep.", "")
    .replace(", Islamic Rep.", "");
  endLabels.push({ n: series.n, short: shortName, y: yScale(lastPt.v), v: lastPt.v, color });
  groups.push({ g, series, path, hit, color });
});

// Resolve label collisions
const resolved = resolveCollisions(endLabels.map(l => ({ ...l })), 12);
const labelMap = new Map(resolved.map(l => [l.n, l]));

// Draw endpoint dots and labels
data.forEach((series, i) => {
  const color = palette[i % palette.length];
  const lastPt = series.pts[series.pts.length - 1];
  const lbl = labelMap.get(series.n);

  svg.appendChild(mkEl("circle", {
    cx: xScale(lastPt.y), cy: yScale(lastPt.v), r: "2.5", fill: color
  }));

  const t = mkEl("text", {
    x: xScale(lastPt.y) + 8, y: lbl.y + 3.5,
    "text-anchor": "start", "font-size": "9", fill: "#2B2A27"
  });
  t.textContent = `${lbl.v}%  ${lbl.short}`;
  svg.appendChild(t);

  if (Math.abs(lbl.y - yScale(lastPt.v)) > 3) {
    svg.appendChild(mkEl("line", {
      x1: xScale(lastPt.y) + 4, y1: lbl.y,
      x2: xScale(lastPt.y) + 4, y2: yScale(lastPt.v),
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
});

// Interactivity
groups.forEach(({ g, series, path, hit, color }) => {
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / (rect.width / W);
    const year = Math.round(yearMin + (mx - margin.left) / (W - margin.left - margin.right) * (yearMax - yearMin));
    const clamped = Math.max(yearMin, Math.min(yearMax, year));
    const pt = series.pts.find(p => p.y === clamped) || series.pts[series.pts.length - 1];
    if (pt) showTip(`${series.n} (${pt.y}): ${pt.v}%`, e);

    groups.forEach(other => {
      if (other.series.n !== series.n) {
        other.path.style.opacity = "0.1";
      } else {
        other.path.setAttribute("stroke-width", "2.5");
      }
    });
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(other => {
      other.path.style.opacity = "1";
      other.path.setAttribute("stroke-width", "1.5");
    });
    hideTip();
  });
});

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .subtitle { font-size: 12px; color: #7A786F; margin: 0 0 20px; line-height: 1.5; }
  #chart { width: 100%; max-width: 820px; }
  #tip { position: fixed; background: #2B2A27; color: #F6F5EE; font-family: 'Inter', sans-serif;
         font-size: 11px; padding: 6px 10px; border-radius: 4px; pointer-events: none;
         opacity: 0; transition: opacity 0.1s; z-index: 10; white-space: nowrap; }
  .source { font-size: 10px; color: #A6A49C; margin-top: 8px; }
</style>
</head>
<body>
<h1>Men Are Marrying Later Across the World</h1>
<p class="subtitle">Singulate mean age at first marriage for men (years), selected countries. European and East Asian men now typically marry in their early to mid-30s.</p>
<div id="chart"></div>
<div id="tip"></div>
<p class="source">Source: World Bank, SP.DYN.SMAM.MA</p>
<script>
const data = [{"n":"South Korea","pts":[{"y":1970,"v":27.2},{"y":1975,"v":27.4},{"y":1980,"v":27.3},{"y":1985,"v":27.8},{"y":1990,"v":28.5},{"y":1995,"v":29.3},{"y":2000,"v":30.3},{"y":2005,"v":32.0},{"y":2010,"v":33.2},{"y":2015,"v":33.9}]},{"n":"Italy","pts":[{"y":1971,"v":27.2},{"y":1981,"v":27.1},{"y":1991,"v":29.3},{"y":1999,"v":31.5},{"y":2003,"v":32.7},{"y":2008,"v":32.0},{"y":2012,"v":34.3},{"y":2015,"v":34.6},{"y":2018,"v":35.3}]},{"n":"Germany","pts":[{"y":1987,"v":29.0},{"y":1993,"v":30.0},{"y":2001,"v":32.6},{"y":2006,"v":33.6},{"y":2012,"v":34.2},{"y":2016,"v":33.8},{"y":2018,"v":33.9}]},{"n":"France","pts":[{"y":1970,"v":25.2},{"y":1975,"v":25.3},{"y":1980,"v":25.1},{"y":1985,"v":26.6},{"y":1990,"v":29.8},{"y":1999,"v":32.2},{"y":2005,"v":33.0},{"y":2013,"v":33.7}]},{"n":"Japan","pts":[{"y":1970,"v":27.5},{"y":1975,"v":27.6},{"y":1980,"v":28.7},{"y":1985,"v":29.6},{"y":1990,"v":30.3},{"y":1995,"v":30.7},{"y":2000,"v":30.8},{"y":2005,"v":31.1},{"y":2010,"v":31.2},{"y":2015,"v":30.5}]},{"n":"China","pts":[{"y":1990,"v":23.8},{"y":1995,"v":24.2},{"y":2000,"v":25.1},{"y":2005,"v":25.6},{"y":2010,"v":26.5},{"y":2016,"v":27.1}]},{"n":"India","pts":[{"y":1971,"v":22.7},{"y":1981,"v":23.4},{"y":1991,"v":24.0},{"y":2001,"v":24.8},{"y":2011,"v":24.9},{"y":2016,"v":26.0}]},{"n":"Bangladesh","pts":[{"y":1974,"v":24.0},{"y":1981,"v":23.9},{"y":1991,"v":24.9},{"y":2001,"v":25.3},{"y":2007,"v":25.6},{"y":2011,"v":25.2}]},{"n":"Brazil","pts":[{"y":1960,"v":26.0},{"y":1970,"v":26.2},{"y":1980,"v":25.5},{"y":1991,"v":25.8},{"y":2000,"v":26.2},{"y":2010,"v":26.8}]},{"n":"Colombia","pts":[{"y":1973,"v":26.3},{"y":1985,"v":26.1},{"y":1993,"v":26.0},{"y":2000,"v":27.0},{"y":2010,"v":26.8},{"y":2015,"v":26.2}]},{"n":"Ghana","pts":[{"y":1960,"v":26.2},{"y":1970,"v":26.8},{"y":1998,"v":26.6},{"y":2005,"v":27.7},{"y":2010,"v":28.6},{"y":2014,"v":27.8}]},{"n":"Ethiopia","pts":[{"y":1967,"v":26.2},{"y":1981,"v":23.8},{"y":1994,"v":25.6},{"y":2005,"v":25.7},{"y":2011,"v":25.7},{"y":2016,"v":25.8}]}];

const W = 820, H = 480;
const margin = {top: 36, right: 150, bottom: 36, left: 52};
const yearMin = 1960, yearMax = 2020;
const valMin = 20, valMax = 38;

const palette = [
  "#EA5E33","#3D7A5A","#3D6FA8","#C49A45","#7A5A9A",
  "#5B9E78","#9A4A7A","#C4715A","#A87A3D","#8BAD72","#5A8A8A","#8A6A3D"
];

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

const svg = mkEl("svg", {viewBox:`0 0 ${W} ${H}`, width:"100%", style:"max-width:820px;display:block;"});
svg.appendChild(mkEl("rect", {x:0, y:0, width:W, height:H, fill:"#F6F5EE"}));

// Grid lines
for (let v = 20; v <= 38; v += 2) {
  const ty = yScale(v);
  svg.appendChild(mkEl("line", {x1:margin.left, y1:ty, x2:W-margin.right, y2:ty,
    stroke: v % 5 === 0 ? "#D8D6CF" : "#ECEAE3", "stroke-width":"0.6"}));
  if (v % 4 === 0) {
    const t = mkEl("text", {x:margin.left-8, y:ty+4, "text-anchor":"end",
      "font-family":"JetBrains Mono, monospace","font-size":"9",fill:"#7A786F"});
    t.textContent = v;
    svg.appendChild(t);
  }
}

// X axis ticks
for (let yr = 1960; yr <= 2020; yr += 10) {
  const tx = xScale(yr);
  svg.appendChild(mkEl("line", {x1:tx, y1:H-margin.bottom, x2:tx, y2:H-margin.bottom+4,
    stroke:"#C2C0B5","stroke-width":"0.7"}));
  const t = mkEl("text", {x:tx, y:H-margin.bottom+14, "text-anchor":"middle",
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:"#7A786F"});
  t.textContent = yr;
  svg.appendChild(t);
}

// Y axis label
const yLabel = mkEl("text", {
  x: 12, y: (margin.top + H - margin.bottom) / 2,
  "text-anchor": "middle", transform: `rotate(-90,12,${(margin.top + H - margin.bottom) / 2})`,
  "font-family": "Inter, sans-serif", "font-size": "10", fill: "#7A786F"
});
yLabel.textContent = "Age (years)";
svg.appendChild(yLabel);

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const endLabels = [];
const groups = [];

data.forEach((series, i) => {
  const color = palette[i % palette.length];
  const pts = series.pts;
  const pathD = pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
  const g = mkEl("g", {});
  const line = mkEl("path", {d:pathD, stroke:color, "stroke-width":"1.5", fill:"none",
    "stroke-linejoin":"round", "stroke-linecap":"round"});
  const hit = mkEl("path", {d:pathD, stroke:"transparent", "stroke-width":"14", fill:"none", style:"cursor:pointer"});
  g.appendChild(line);
  g.appendChild(hit);
  const lastPt = pts[pts.length - 1];
  endLabels.push({i, y: yScale(lastPt.v), val: lastPt.v, name: series.n, color, lastY: lastPt.y});
  groups.push({g, line, hit, series, color, pts});
  svg.appendChild(g);
});

const resolved = resolveCollisions(endLabels, 12);
const labelX = W - margin.right + 8;

resolved.forEach(item => {
  const series = data[item.i];
  const lastPt = series.pts[series.pts.length - 1];
  const origY = yScale(lastPt.v);
  svg.appendChild(mkEl("circle", {cx: xScale(lastPt.y), cy: origY, r:"3", fill:item.color}));
  if (Math.abs(item.y - origY) > 2) {
    svg.appendChild(mkEl("line", {
      x1: xScale(lastPt.y)+2, y1:origY, x2:labelX-2, y2:item.y,
      stroke:item.color,"stroke-width":"0.5",opacity:"0.5"
    }));
  }
  const t = mkEl("text", {x:labelX, y:item.y+4,
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:item.color});
  t.textContent = `${item.val}  ${item.name}`;
  svg.appendChild(t);
});

const tip = document.getElementById("tip");
groups.forEach(({g, line, hit, series, color, pts}) => {
  hit.addEventListener("mouseover", () => {
    groups.forEach(o => { o.line.style.opacity = "0.1"; });
    line.style.opacity = "1";
    line.style.strokeWidth = "3";
  });
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const targetYear = yearMin + ratio * (yearMax - yearMin);
    let closest = pts[0];
    for (const p of pts) {
      if (Math.abs(p.y - targetYear) < Math.abs(closest.y - targetYear)) closest = p;
    }
    tip.textContent = `${series.n}: married at age ${closest.v} (${closest.y})`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
  });
  hit.addEventListener("mouseout", () => {
    groups.forEach(o => { o.line.style.opacity = "1"; o.line.style.strokeWidth = "1.5"; });
    tip.style.opacity = "0";
  });
});

document.getElementById("chart").appendChild(svg);
</script>
</body>
</html>

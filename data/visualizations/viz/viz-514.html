<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 560px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Family Planning Access: ~2000 vs ~2022</h1>
<p class="subtitle">Women aged 15–49 whose need for family planning is satisfied with modern methods (%). Sub-Saharan Africa made dramatic gains — Ethiopia rose from 15% to 61% — while some countries stalled or reversed.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: WHO Global Health Observatory — SDGFPALL</p>
<script>
// Data from catalog: who--SDGFPALL
const data = [{"n":"Ethiopia","a":15.3,"b":60.6},{"n":"Benin","a":17.1,"b":36.8},{"n":"Burkina Faso","a":25.8,"b":64.3},{"n":"Nigeria","a":32.0,"b":41.9},{"n":"Cambodia","a":33.1,"b":59.5},{"n":"Ghana","a":33.8,"b":49.0},{"n":"Madagascar","a":34.8,"b":64.7},{"n":"Uganda","a":35.4,"b":61.9},{"n":"Mozambique","a":42.3,"b":52.1},{"n":"Philippines","a":46.5,"b":58.2},{"n":"Kenya","a":47.5,"b":79.3},{"n":"Nepal","a":52.8,"b":55.1},{"n":"Jordan","a":58.3,"b":54.2},{"n":"Vietnam","a":66.6,"b":72.0},{"n":"El Salvador","a":80.1,"b":73.1},{"n":"Jamaica","a":82.0,"b":78.7}];

const W = 700, H = 580;
const pad = { left: 140, right: 150, top: 44, bottom: 24 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const vals = data.flatMap(d => [d.a, d.b]);
const minV = 10, maxV = 90;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const xL = pad.left, xR = W - pad.right;

function colorFor(d) {
  const change = d.b - d.a;
  if (change > 30) return "#3D7A5A";
  if (change > 15) return "#5B9E78";
  if (change > 5)  return "#8BAD72";
  if (change >= 0) return "#C49A45";
  return "#C4715A";
}

// Column headers
[["~2000", xL], ["~2022", xR]].forEach(([yr, x]) => {
  svg.appendChild(mkEl("text", {
    x, y: pad.top - 18,
    "text-anchor": "middle",
    "font-family": "JetBrains Mono, monospace",
    "font-size": "10", fill: "#7A786F", "font-weight": "500"
  })).textContent = yr;
});

// Axis lines
[xL, xR].forEach(x => {
  svg.appendChild(mkEl("line", {
    x1: x, y1: pad.top - 8, x2: x, y2: H - pad.bottom,
    stroke: "#C2C0B5", "stroke-width": "1"
  }));
});

// Tick marks
[20, 40, 60, 80].forEach(v => {
  const y = scale(v);
  svg.appendChild(mkEl("line", {
    x1: xL - 3, y1: y, x2: xL + 3, y2: y,
    stroke: "#C2C0B5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: xL - 8, y: y + 3,
    "text-anchor": "end",
    "font-family": "JetBrains Mono, monospace",
    "font-size": "7.5", fill: "#9A9890"
  })).textContent = v + "%";
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  sorted.forEach(item => {
    item.y = Math.max(pad.top, Math.min(H - pad.bottom, item.y));
  });
  return sorted;
}

const groups = [];
data.forEach(d => {
  const color = colorFor(d);
  const ya = scale(d.a), yb = scale(d.b);
  const g = mkEl("g", {});

  g.appendChild(mkEl("line", { x1: xL, y1: ya, x2: xR, y2: yb, stroke: color, "stroke-width": "1.5" }));
  g.appendChild(mkEl("circle", { cx: xL, cy: ya, r: "3", fill: color }));
  g.appendChild(mkEl("circle", { cx: xR, cy: yb, r: "3", fill: color }));
  g.appendChild(mkEl("line", {
    x1: xL, y1: ya, x2: xR, y2: yb,
    stroke: "transparent", "stroke-width": "12", cursor: "pointer"
  }));

  groups.push({ g, d, color, ya, yb });
  svg.appendChild(g);
});

// Left labels
const leftItems = groups.map(({d, ya}) => ({ n: d.n, v: d.a, y: ya }));
const leftResolved = resolveCollisions(leftItems, 12);
leftResolved.forEach(item => {
  const orig = groups.find(g => g.d.n === item.n);
  if (!orig) return;
  if (Math.abs(item.y - orig.ya) > 2) {
    svg.appendChild(mkEl("line", {
      x1: xL - 2, y1: orig.ya, x2: xL - 4, y2: item.y,
      stroke: orig.color, "stroke-width": "0.5", opacity: "0.6"
    }));
  }
  const lbl = mkEl("text", { x: xL - 8, y: item.y + 3.5, "text-anchor": "end", "font-size": "9", "font-weight": "500", fill: orig.color });
  lbl.textContent = `${item.n}  ${item.v.toFixed(0)}%`;
  svg.appendChild(lbl);
});

// Right labels
const rightItems = groups.map(({d, yb}) => ({ n: d.n, v: d.b, y: yb }));
const rightResolved = resolveCollisions(rightItems, 12);
rightResolved.forEach(item => {
  const orig = groups.find(g => g.d.n === item.n);
  if (!orig) return;
  if (Math.abs(item.y - orig.yb) > 2) {
    svg.appendChild(mkEl("line", {
      x1: xR + 2, y1: orig.yb, x2: xR + 4, y2: item.y,
      stroke: orig.color, "stroke-width": "0.5", opacity: "0.6"
    }));
  }
  const lbl = mkEl("text", { x: xR + 8, y: item.y + 3.5, "font-size": "9", "font-weight": "500", fill: orig.color });
  lbl.textContent = `${item.v.toFixed(0)}%  ${item.n}`;
  svg.appendChild(lbl);
});

// Interactivity
const tip = document.getElementById("tip");
groups.forEach(({g, d, color}) => {
  const hit = g.children[3];
  hit.addEventListener("mouseenter", e => {
    const change = d.b - d.a;
    const sign = change >= 0 ? "+" : "";
    tip.textContent = `${d.n}: ${d.a.toFixed(1)}% → ${d.b.toFixed(1)}% (${sign}${change.toFixed(1)} pp)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
    groups.forEach(other => {
      other.g.style.opacity = other.d.n === d.n ? "1" : "0.1";
      if (other.d.n === d.n) other.g.children[0].setAttribute("stroke-width", "3");
    });
  });
  hit.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach(other => {
      other.g.style.opacity = "1";
      other.g.children[0].setAttribute("stroke-width", "1.5");
    });
  });
});
</script>
</body></html>

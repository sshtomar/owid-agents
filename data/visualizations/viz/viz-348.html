<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0; padding: 24px;
      background: #faf9f7;
      color: #0f172a;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: #1e293b; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 4px; }
    .note { font-size: 12px; color: #94a3b8; margin: 0 0 20px; font-style: italic; }
    #chart { width: 100%; max-width: 820px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; background: #1e293b; color: #f8fafc;
      font-size: 12px; padding: 6px 10px; border-radius: 5px;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap; z-index: 10;
    }
  </style>
</head>
<body>
  <h1>The Scientific Output Explosion, 1996–2022</h1>
  <p class="subtitle">Scientific and technical journal articles published per year — China's output grew 27x, reshaping global research</p>
  <p class="note">Hover a line to isolate it</p>
  <svg id="chart" viewBox="0 0 820 480" width="100%"></svg>
  <p class="source">Source: World Bank — Scientific and Technical Journal Articles (IP.JRN.ARTC.SC)</p>
  <div id="tip"></div>
  <script>
    // Data from wb--IP-JRN-ARTC-SC
    // Annual values 1996-2022 for selected countries
    const raw = {
      "China":       [33621,36170,39774,43985,49988,57393,65598,84984,110687,149843,193516,247938,298872,330760,363840,396613,424928,449718,479050,524060,596610,745710,898949],
      "India":       [18905,19740,21264,23000,25107,26812,28553,30760,35088,40897,46688,56098,63990,67350,79610,86870,96590,107780,122250,142030,165090,185380,207390],
      "Germany":     [64230,65210,66390,67570,68210,70350,71780,73560,76290,80040,88730,96770,98170,98930,100750,103900,107220,109460,109390,111180,114820,113480,113976],
      "Japan":       [88807,90380,91750,93050,95020,96580,98080,99580,103950,106540,108030,108640,108150,109010,107480,108560,106590,104560,103600,103050,100070,102770,103723],
      "Korea, Rep.": [8867,9870,11010,12580,14270,16280,18380,21250,24920,29480,35510,42470,49490,53220,57750,61870,63170,65940,66690,68480,71290,74200,76936],
      "France":      [46611,47320,48200,49010,49700,51640,53040,55010,57140,59520,63290,67040,68340,68700,68600,70390,71920,73330,74040,73960,67480,65090,65888],
      "Italy":       [34244,35270,37060,38420,39640,42380,44970,47620,50660,53790,57600,62470,63560,64600,66440,69000,72390,75060,78250,81530,85850,87190,90586],
      "Canada":      [34830,35310,35810,36560,37450,39270,41250,43220,46120,48880,53400,57460,57640,58030,58670,59830,60900,62760,62360,62770,66350,67460,69052],
      "Brazil":      [7646,8750,10300,12080,13900,16170,18860,22200,26020,29510,35030,40870,44360,47520,50210,51830,54310,57510,58900,60420,61850,64340,67031],
      "Iran":        [649,750,920,1200,1520,1870,2560,3590,5240,8440,14320,20670,24630,27290,31840,35530,39770,42650,47380,54700,56430,58760,60940],
      "Indonesia":   [304,370,460,560,690,820,990,1170,1430,1680,2090,2700,4090,5960,7250,8880,10640,13470,17900,22730,28120,31190,31947],
      "Australia":   [20800,21540,22420,23280,24350,26040,28010,30060,32490,35100,38660,42280,44100,46010,47850,50550,53470,56670,58220,60320,62830,61500,62305]
    };

    const years = Array.from({length: 27}, (_, i) => 1996 + i);

    const COLOR_MAP = {
      "China": "#C0392B",
      "India": "#E67E22",
      "Germany": "#3498DB",
      "Japan": "#2980B9",
      "Korea, Rep.": "#1ABC9C",
      "France": "#8E44AD",
      "Italy": "#27AE60",
      "Canada": "#34495E",
      "Brazil": "#E74C3C",
      "Iran": "#D35400",
      "Indonesia": "#16A085",
      "Australia": "#7F8C8D"
    };

    const W = 820, H = 480;
    const margin = {top: 30, right: 130, bottom: 40, left: 70};
    const NS = "http://www.w3.org/2000/svg";

    const names = Object.keys(raw);
    const allVals = names.flatMap(n => raw[n]);
    const yMin = 0;
    const yMax = 950000;

    const xScale = yr => margin.left + (yr - 1996) / (2022 - 1996) * (W - margin.left - margin.right);
    const yScale = v => margin.top + (yMax - v) / (yMax - yMin) * (H - margin.top - margin.bottom);

    function mkEl(tag, attrs, text) {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text !== undefined) el.textContent = text;
      return el;
    }

    const svg = document.getElementById("chart");

    // Y axis grid
    const gridTicks = [0, 100, 200, 300, 400, 500, 600, 700, 800, 900];
    for (const v of gridTicks) {
      const y = yScale(v * 1000);
      if (y < margin.top - 2) continue;
      const color = v === 0 ? "#CBD5E1" : "#E2E8F0";
      const w = v === 0 ? "0.8" : "0.5";
      svg.appendChild(mkEl("line", {x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: color, "stroke-width": w}));
      svg.appendChild(mkEl("text", {x: margin.left - 6, y: y + 4, "text-anchor": "end", "font-size": "10", fill: "#94A3B8", "font-family": "JetBrains Mono, monospace"}, v === 0 ? "0" : v + "k"}));
    }

    // X axis
    [1996, 2000, 2005, 2010, 2015, 2020, 2022].forEach(yr => {
      const x = xScale(yr);
      svg.appendChild(mkEl("line", {x1: x, y1: H - margin.bottom, x2: x, y2: H - margin.bottom + 4, stroke: "#CBD5E1", "stroke-width": "0.8"}));
      svg.appendChild(mkEl("text", {x, y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "10", fill: "#94A3B8", "font-family": "JetBrains Mono, monospace"}, yr}));
    });

    // Collision resolution
    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i-1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i-1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      for (const item of sorted) {
        item.y = Math.max(margin.top + 6, Math.min(H - margin.bottom - 4, item.y));
      }
      return sorted;
    }

    const labelItems = names.map(n => {
      const lastVal = raw[n][raw[n].length - 1];
      return {n, y: yScale(lastVal), rawY: yScale(lastVal), val: lastVal};
    });
    const resolvedLabels = resolveCollisions(labelItems, 13);

    const groups = [];
    for (const n of names) {
      const color = COLOR_MAP[n];
      const vals = raw[n];
      const pts = vals.map((v, i) => ({year: 1996 + i, value: v}));
      const g = mkEl("g", {class: "series"});

      const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.year).toFixed(1)} ${yScale(p.value).toFixed(1)}`).join(" ");

      const isChina = n === "China";
      g.appendChild(mkEl("path", {d: pathD, stroke: color, "stroke-width": isChina ? "2.5" : "1.5", fill: "none", "stroke-linejoin": "round"}));

      const hit = mkEl("path", {d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer"});
      g.appendChild(hit);

      const lastX = xScale(2022);
      const rawY = labelItems.find(l => l.n === n).rawY;
      const labelY = resolvedLabels.find(l => l.n === n).y;

      if (Math.abs(labelY - rawY) > 2) {
        g.appendChild(mkEl("line", {x1: lastX + 3, y1: rawY, x2: lastX + 10, y2: labelY, stroke: color, "stroke-width": "0.6", opacity: "0.5"}));
      }

      const displayName = n === "Korea, Rep." ? "Korea" : n === "Iran, Islamic Rep." ? "Iran" : n;
      const labelVal = vals[vals.length - 1];
      const labelText = labelVal > 100000
        ? `${Math.round(labelVal / 1000)}k  ${displayName}`
        : `${Math.round(labelVal / 1000)}k  ${displayName}`;

      g.appendChild(mkEl("text", {
        x: lastX + 13,
        y: labelY + 4,
        "font-size": "9.5",
        fill: color,
        "font-family": "JetBrains Mono, monospace",
        "font-weight": isChina ? "600" : "400"
      }, `${Math.round(labelVal/1000)}k  ${displayName}`));

      groups.push({g, n, color, pts});
      svg.appendChild(g);
    }

    const tip = document.getElementById("tip");
    for (let i = 0; i < groups.length; i++) {
      const {g, n, color, pts} = groups[i];
      const hitEl = g.children[1];

      hitEl.addEventListener("mousemove", e => {
        const svgRect = svg.getBoundingClientRect();
        const mx = e.clientX - svgRect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const idx = Math.min(pts.length - 1, Math.round(ratio * (pts.length - 1)));
        const pt = pts[idx];
        tip.textContent = `${n} ${pt.year}: ${pt.value.toLocaleString()} articles`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
        for (let j = 0; j < groups.length; j++) {
          groups[j].g.style.opacity = j === i ? "1" : "0.08";
        }
        hitEl.parentElement.querySelector("path").setAttribute("stroke-width", "3");
      });

      hitEl.addEventListener("mouseleave", () => {
        tip.style.opacity = "0";
        for (const {g: gg, n: nn} of groups) {
          gg.style.opacity = "1";
          gg.querySelector("path").setAttribute("stroke-width", nn === "China" ? "2.5" : "1.5");
        }
      });
    }
  </script>
</body>
</html>

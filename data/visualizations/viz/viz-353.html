<!DOCTYPE html>

<style>

<h1>Homicide in the Americas: Trajectories Since 1990</h1>
<p class="subtitle">Intentional homicides per 100,000 people, 1990–2023. Colombia peaked at 86 in 1991 and has since fallen below 25. Ecuador surged from under 6 to 46 in just three years. Japan and Germany stay below 1.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank VC.IHR.PSRC.P5</p>
<script>

:22.6},{"y":2021,"v":25.6},{"y":2022,"v":24.9},{"y":2023,"v":24.9}]},{"n":"Ecuador","pts":[{"y":1990,"v":8.5},{"y":1991,"v":10.8},{"y":1992,"v":8.6},{"y":1993,"v":8.3},{"y":1994,"v":10.0},{"y":1995,"v":11.8},{"y":1996,"v":12.4},{"y":1997,"v":10.9},{"y":1998,"v":13.4},{"y":1999,"v":13.5},{"y":2000,"v":14.4},{"y":2001,"v":12.8},{"y":2002,"v":14.5},{"y":2007,"v":15.9},{"y":2008,"v":17.9},{"y":2009,"v":17.7},{"y":2010,"v":17.4},{"y":2011,"v":15.3},{"y":2012,"v":12.3},{"y":2013,"v":10.9},{"y":2014,"v":8.2},{"y":2015,"v":6.5},{"y":2016,"v":5.8},{"y":2017,"v":5.8},{"y":2018,"v":5.8},{"y":2019,"v":6.8},{"y":2020,"v":7.8},{"y":2021,"v":14.1},{"y":2022,"v":27.4},{"y":2023,"v":45.7}]},{"n":"Guatemala","pts":[{"y":1992,"v":28.0},{"y":1993,"v":33.0},{"y":1994,"v":32.2},{"y":1995,"v":31.6},{"y":1996,"v":34.2},{"y":1997,"v":36.8},{"y":1998,"v":29.7},{"y":1999,"v":23.2},{"y":2000,"v":24.8},{"y":2001,"v":27.0},{"y":2002,"v":29.6},{"y":2003,"v":33.8},{"y":2004,"v":35.2},{"y":2005,"v":40.8},{"y":2006,"v":44.0},{"y":2007,"v":42.3},{"y":2008,"v":45.2},{"y":2009,"v":45.7},{"y":2010,"v":41.1},{"y":2011,"v":38.4},{"y":2012,"v":34.2},{"y":2013,"v":33.5},{"y":2014,"v":33.5},{"y":2017,"v":32.8},{"y":2018,"v":28.9},{"y":2019,"v":25.9},{"y":2020,"v":18.2},{"y":2021,"v":20.2},{"y":2022,"v":22.0},{"y":2023,"v":23.4}]},{"n":"Brazil","pts":[{"y":1990,"v":19.6},{"y":1991,"v":18.6},{"y":1992,"v":16.8},{"y":1993,"v":17.9},{"y":1994,"v":18.7},{"y":1995,"v":21.0},{"y":1996,"v":23.7},{"y":1997,"v":24.3},{"y":1998,"v":24.8},{"y":1999,"v":25.0},{"y":2000,"v":26.1},{"y":2001,"v":27.2},{"y":2002,"v":27.8},{"y":2003,"v":28.3},{"y":2004,"v":26.5},{"y":2005,"v":25.8},{"y":2006,"v":26.3},{"y":2007,"v":25.3},{"y":2008,"v":26.3},{"y":2009,"v":26.8},{"y":2010,"v":27.0},{"y":2011,"v":26.7},{"y":2012,"v":28.6},{"y":2013,"v":28.6},{"y":2014,"v":29.9},{"y":2015,"v":28.9},{"y":2016,"v":30.1},{"y":2017,"v":31.2},{"y":2018,"v":27.2},{"y":2019,"v":21.2},{"y":2020,"v":21.8},{"y":2021,"v":20.5},{"y":2022,"v":20.1},{"y":2023,"v":19.3}]},{"n":"Japan","pts":[{"y":1990,"v":0.5},{"y":1995,"v":0.6},{"y":2000,"v":0.5},{"y":2005,"v":0.5},{"y":2010,"v":0.4},{"y":2015,"v":0.3},{"y":2020,"v":0.3},{"y":2023,"v":0.2}]},{"n":"Germany","pts":[{"y":1990,"v":1.2},{"y":1995,"v":2.5},{"y":2000,"v":1.7},{"y":2005,"v":1.3},{"y":2010,"v":1.0},{"y":2015,"v":0.8},{"y":2020,"v":0.9},{"y":2023,"v":0.9}]}];

const W = 800, H = 460;
const margin = { top: 30, right: 120, bottom: 34, left: 44 };
const yearMin = 1990, yearMax = 2023;
const valMin = 0, valMax = 90;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 20; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) { const shift = (minGap - gap) / 2; sorted[i-1].y -= shift; sorted[i].y += shift; moved = true; }
    }
    if (!moved) break;
  }
  return sorted;
}

const colorMap = {
  "Jamaica":   "#EA5E33",
  "Honduras":  "#C4715A",
  "Colombia":  "#F29A44",
  "Ecuador":   "#B34B3B",
  "Guatemala": "#F5D38A",
  "Brazil":    "#C49A45",
  "Japan":     "#A6C4A2",
  "Germany":   "#8BAD72",
};

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

// Grid lines
[10, 20, 30, 40, 50, 60, 70, 80].forEach(v => {
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  const t = mkEl("text", { x: margin.left - 4, y: yScale(v) + 3, "text-anchor": "end", "font-size": "9", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace" });
  t.textContent = v;
  svg.appendChild(t);
});

// X axis ticks
[1990, 1995, 2000, 2005, 2010, 2015, 2020, 2023].forEach(y => {
  const x = xScale(y);
  svg.appendChild(mkEl("line", { x1: x, y1: H - margin.bottom, x2: x, y2: H - margin.bottom + 4, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  const t = mkEl("text", { x, y: H - margin.bottom + 12, "text-anchor": "middle", "font-size": "9", fill: "#7A786F", "font-family": "'JetBrains Mono',monospace" });
  t.textContent = y;
  svg.appendChild(t);
});

// Reference line: WHO threshold for epidemic level
svg.appendChild(mkEl("line", { x1: margin.left, y1: yScale(10), x2: W - margin.right, y2: yScale(10), stroke: "#C2C0B5", "stroke-dasharray": "4,3", "stroke-width": "0.8" }));
const refT = mkEl("text", { x: margin.left + 4, y: yScale(10) - 4, "font-size": "8.5", fill: "#9A9890", "font-family": "'JetBrains Mono',monospace" });
refT.textContent = "10 per 100k — crisis threshold";
svg.appendChild(refT);

const endLabels = series.map(s => {
  const last = s.pts[s.pts.length - 1];
  return { n: s.n, y: yScale(last.v), v: last.v };
});
resolveCollisions(endLabels, 12);

const rows = [];
series.forEach((s, si) => {
  const col = colorMap[s.n] || "#A6C4A2";
  const g = mkEl("g", {});

  const pathD = s.pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
  const line = mkEl("path", { d: pathD, stroke: col, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  g.appendChild(line);

  const el = endLabels.find(l => l.n === s.n);
  const last = s.pts[s.pts.length - 1];
  const labelY = el.y;
  const dataY = yScale(last.v);

  if (Math.abs(labelY - dataY) > 4) {
    g.appendChild(mkEl("line", { x1: xScale(last.y) + 3, y1: dataY, x2: xScale(last.y) + 6, y2: labelY, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const lt = mkEl("text", { x: xScale(last.y) + 8, y: labelY + 3.5, "text-anchor": "start", "font-size": "10", fill: "#2B2A27" });
  lt.textContent = `${last.v.toFixed(0)}  ${s.n}`;
  g.appendChild(lt);

  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  svg.appendChild(g);
  rows.push({ g, line, s, col });
});

const tip = document.getElementById("tip");
let activeIdx = -1;

function highlight(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  rows.forEach((row, i) => {
    if (idx === -1) { row.g.style.opacity = "1"; row.line.setAttribute("stroke-width", "1.5"); }
    else if (i === idx) { row.g.style.opacity = "1"; row.line.setAttribute("stroke-width", "2.5"); }
    else { row.g.style.opacity = "0.1"; }
  });
}

svg.addEventListener("mousemove", e => {
  const rect = svg.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * W;
  const my = (e.clientY - rect.top) / rect.height * H;
  const year = yearMin + (mx - margin.left) / (W - margin.left - margin.right) * (yearMax - yearMin);

  let best = -1, bestDist = 16;
  rows.forEach((row, i) => {
    const pts = row.s.pts;
    const yrIdx = pts.reduce((bi, p, pi) => Math.abs(p.y - year) < Math.abs(pts[bi].y - year) ? pi : bi, 0);
    const lineY = yScale(pts[yrIdx].v);
    const dist = Math.abs(my - lineY);
    if (dist < bestDist) { bestDist = dist; best = i; }
  });

  highlight(best);
  if (best >= 0) {
    const s = rows[best].s;
    const pts = s.pts;
    const yrIdx = pts.reduce((bi, p, pi) => Math.abs(p.y - year) < Math.abs(pts[bi].y - year) ? pi : bi, 0);
    tip.textContent = `${s.n} (${pts[yrIdx].y}): ${pts[yrIdx].v.toFixed(1)} per 100k`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  } else { tip.style.opacity = "0"; }
});
svg.addEventListener("mouseleave", () => { highlight(-1); tip.style.opacity = "0"; });
</script>

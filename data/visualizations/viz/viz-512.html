const W = 820, H = 500;
const margin = { top: 36, right: 130, bottom: 36, left: 52 };
const yearMin = 2000, yearMax = 2024;
const valMin = 0, valMax = 20;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

function mkEl(tag, attrs) {

  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

    stroke: "#C2C0B5", "stroke-width": "0.5"
  }));
});

function colorFor(d) {
  const pct = parseFloat(d.pct);
  if (d.n === "China") return "#EA5E33";
  if (pct > 100) return "#F29A44";
  if (pct > 20) return "#C49A45";
  return "#A6C4A2";
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  sorted.forEach(item => {
    item.y = Math.max(margin.top + 4, Math.min(H - margin.bottom - 4, item.y));
  });
  return sorted;
}

const tip = document.getElementById("tip");
const rows = [];

data.forEach(d => {

  const g = svg.appendChild(mkEl("g", {}));

  g.appendChild(mkEl("path", {
    d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round"
  }));

  // Endpoint dot
  const last = pts[pts.length - 1];
  g.appendChild(mkEl("circle", { cx: xScale(last.y), cy: yScale(last.v), r: "2.5", fill: color }));

  // Leader line if label is offset
  const ly = labelPos.get(d.n);
  if (Math.abs(ly - yScale(last.v)) > 3) {
    g.appendChild(mkEl("line", {
      x1: W - margin.right + 2, y1: yScale(last.v),
      x2: W - margin.right + 6, y2: ly,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }

  // Endpoint label
  const lbl = g.appendChild(mkEl("text", {
    x: W - margin.right + 8, y: ly + 3.5,
    "text-anchor": "start", "font-size": "9", "font-family": "Inter, sans-serif",
    fill: "#2B2A27", "font-weight": "500"
  }));
  lbl.textContent = `${last.v}  ${d.n}`;

  // Hit area
  const hit = g.appendChild(mkEl("path", {
    d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none"
  }));

  rows.push({ g, d });

  hit.addEventListener("mouseenter", () => {
    rows.forEach(r => {
      r.g.querySelectorAll("path:first-child, circle").forEach(el => {
        el.style.opacity = r.d.n === d.n ? "1" : "0.08";
      });
      r.g.querySelectorAll("text").forEach(el => {
        el.style.opacity = r.d.n === d.n ? "1" : "0.15";
      });
    });
  });
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yearIdx = Math.round(ratio * (pts.length - 1));
    const pt = pts[Math.max(0, Math.min(pts.length - 1, yearIdx))];
    tip.textContent = `${d.n} · ${pt.y}: ${pt.v} MWh/capita`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 28) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    rows.forEach(r => {
      r.g.querySelectorAll("path:first-child, circle, text, line").forEach(el => el.style.opacity = "1");
    });
    tip.style.opacity = "0";
  });
});

const W = 820, H = 480;
const margin = {top: 36, right: 140, bottom: 36, left: 56};
const yearMin = 1975, yearMax = 2024;
const valMin = 0, valMax = 220;

const palette = [
  "#EA5E33","#3D7A5A","#3D6FA8","#C49A45","#7A5A9A","#9A4A7A",
  "#5B9E78","#C4715A","#8BAD72","#A87A3D"
];

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

const svg = mkEl("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:820px;display:block;"});
svg.appendChild(mkEl("rect", {x:0, y:0, width:W, height:H, fill:"#F6F5EE"}));

// Grid lines
for (let v = 0; v <= 200; v += 50) {
  const ty = yScale(v);
  svg.appendChild(mkEl("line", {x1: margin.left, y1: ty, x2: W - margin.right, y2: ty,
    stroke: "#E2E0D5", "stroke-width": "0.7"}));
  const t = mkEl("text", {x: margin.left - 8, y: ty + 4, "text-anchor": "end",
    "font-family": "JetBrains Mono, monospace", "font-size": "9", fill: "#7A786F"});
  t.textContent = v + "%";
  svg.appendChild(t);
}

// 100% reference line
svg.appendChild(mkEl("line", {
  x1: margin.left, y1: yScale(100), x2: W - margin.right, y2: yScale(100),
  stroke: "#C2C0B5", "stroke-dasharray": "4,3", "stroke-width": "1"
}));
const rl = mkEl("text", {x: margin.left + 4, y: yScale(100) - 5,
  "font-family": "JetBrains Mono, monospace", "font-size": "9", fill: "#A6A49C"});
rl.textContent = "100% of GDP";
svg.appendChild(rl);

// Financial crisis markers
for (const [yr, label] of [[2000,"Dot-com bust"],[2008,"Financial crisis"]]) {
  const cx = xScale(yr);
  svg.appendChild(mkEl("line", {x1:cx, y1:margin.top, x2:cx, y2:H-margin.bottom,
    stroke:"#C2C0B5","stroke-dasharray":"3,4","stroke-width":"0.7"}));
  const ct = mkEl("text", {x:cx+3, y:margin.top+10,
    "font-family":"JetBrains Mono, monospace","font-size":"8",fill:"#A6A49C","writing-mode":"horizontal"});
  ct.textContent = label;
  svg.appendChild(ct);
}

// X axis ticks
for (let yr = 1980; yr <= 2020; yr += 10) {
  const tx = xScale(yr);
  svg.appendChild(mkEl("line", {x1:tx, y1:H-margin.bottom, x2:tx, y2:H-margin.bottom+4, stroke:"#C2C0B5","stroke-width":"0.7"}));
  const t = mkEl("text", {x:tx, y:H-margin.bottom+14, "text-anchor":"middle",
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:"#7A786F"});
  t.textContent = yr;
  svg.appendChild(t);
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const endLabels = [];
const groups = [];

data.forEach((series, i) => {
  const color = palette[i % palette.length];
  const pts = series.pts;
  const pathD = pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
  const g = mkEl("g", {});
  const line = mkEl("path", {d:pathD, stroke:color, "stroke-width":"1.5", fill:"none", "stroke-linejoin":"round"});
  const hit = mkEl("path", {d:pathD, stroke:"transparent", "stroke-width":"12", fill:"none", style:"cursor:pointer"});
  g.appendChild(line);
  g.appendChild(hit);
  const lastPt = pts[pts.length - 1];
  endLabels.push({i, y: yScale(lastPt.v), val: lastPt.v, name: series.n, color, lastY: lastPt.y});
  groups.push({g, line, hit, series, color, pts});
  svg.appendChild(g);
});

const resolved = resolveCollisions(endLabels, 12);
const labelX = W - margin.right + 8;

resolved.forEach(item => {
  const series = data[item.i];
  const lastPt = series.pts[series.pts.length - 1];
  const origY = yScale(lastPt.v);
  if (Math.abs(item.y - origY) > 2) {
    svg.appendChild(mkEl("line", {
      x1: xScale(lastPt.y) + 2, y1: origY, x2: labelX - 2, y2: item.y,
      stroke: item.color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
  svg.appendChild(mkEl("circle", {cx: xScale(lastPt.y), cy: origY, r: "3", fill: item.color}));
  const t = mkEl("text", {x: labelX, y: item.y + 4,
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:item.color});
  t.textContent = `${item.val}%  ${item.name}`;
  svg.appendChild(t);
});

const tip = document.getElementById("tip");

groups.forEach(({g, line, hit, series, color, pts}) => {
  hit.addEventListener("mouseover", () => {
    groups.forEach(o => { o.line.style.opacity = "0.1"; });
    line.style.opacity = "1";
    line.style.strokeWidth = "3";
  });
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const targetYear = yearMin + ratio * (yearMax - yearMin);
    let closest = pts[0];
    for (const p of pts) {
      if (Math.abs(p.y - targetYear) < Math.abs(closest.y - targetYear)) closest = p;
    }
    tip.textContent = `${series.n}: ${closest.v}% of GDP (${closest.y})`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
  });
  hit.addEventListener("mouseout", () => {
    groups.forEach(o => { o.line.style.opacity = "1"; o.line.style.strokeWidth = "1.5"; });
    tip.style.opacity = "0";
  });
});

document.getElementById("chart").appendChild(svg);

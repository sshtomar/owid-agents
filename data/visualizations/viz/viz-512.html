<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 560px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Gas Power on the Rise, 2000–2024</h1>
<p class="subtitle">Electricity generation from natural gas (TWh). The US leads by a wide margin and keeps growing; China surged from almost nothing; Iran and Egypt expanded steadily.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: Ember — Yearly Electricity Data (ember--GEN-GAS)</p>
<script>
const data = [
  {"n":"USA","s":[615.0,639.1,691.0,649.9,710.1,761.0,816.4,896.6,883.0,921.0,987.7,1013.7,1225.9,1124.8,1126.6,1333.5,1378.3,1296.4,1469.1,1585.8,1624.2,1579.2,1687.1,1806.1,1869.9],"y0":2000},
  {"n":"Russia","s":[370.4,376.7,384.8,406.8,422.6,440.1,455.2,489.1,494.4,469.8,520.5,521.3,526.1,530.0,534.9,529.8,521.8,516.3,523.7,512.3,465.9,513.4,531.6,533.4,545.8],"y0":2000},
  {"n":"Japan","s":[258.5,256.5,252.8,273.1,257.9,253.1,280.0,296.9,324.8,324.7,326.1,379.8,435.5,423.6,450.9,417.5,458.4,464.1,445.6,416.9,409.4,385.8,378.8,347.0,346.2],"y0":2000},
  {"n":"Iran","s":[81.6,89.5,98.0,109.8,114.6,124.6,125.1,138.8,135.1,149.4,173.8,142.3,156.3,137.7,192,206.6,225.3,252.5,266.3,244.5,268.2,302.2,313.4,322.0,340.1],"y0":2000},
  {"n":"China","s":[5.8,4.9,4.2,5.2,7.5,12.1,23.8,33.9,34.6,56.6,77.7,108.8,110.2,116.4,133.3,166.9,188.3,203.2,215.5,232.5,252.5,287.1,275.6,297.8,320.7],"y0":2000},
  {"n":"Saudi Arabia","s":[63.8,76.7,86.5,91.4,98.7,107.9,104.5,102.7,100.7,94.1,111.4,115.6,131.5,138.8,152.5,165.3,188.6,222.7,226.7,223.5,231.6,242.1,247.8,265.5,288.0],"y0":2000},
  {"n":"Mexico","s":[40.3,50.9,69.6,80.6,92.4,86.5,116.1,128.8,131.3,138.2,147.1,153.5,154.6,165.8,173.7,185.6,192.8,197.7,215.8,208.4,209.3,195.7,203.2,219.2,221.7],"y0":2000},
  {"n":"Egypt","s":[42.2,48.5,57.5,64.0,74.5,76.8,83.1,89.2,94.9,98.7,110.1,117.5,126.6,123.2,124.6,129.8,138.5,151.9,167.2,171.8,166.9,179.4,183.1,179.4,193.0],"y0":2000},
  {"n":"S. Korea","s":[29.7,33.7,42.9,45.5,63.2,64.5,74.8,84.4,81.7,71.4,104.3,115.3,128.9,143.8,130.8,122.0,130.5,135.2,163.3,155.4,162.5,181.2,174.7,169.6,178.3],"y0":2000},
  {"n":"Thailand","s":[61.1,71.2,78.9,85.7,90.3,94.5,94.4,98.2,104.5,106.3,118.4,108.3,119.4,119.2,120.3,128.5,126.2,121.0,116.3,121.8,113.9,113.1,114.6,129.4,136.4],"y0":2000}
];

const W = 820, H = 500;
const margin = { top: 36, right: 130, bottom: 36, left: 58 };
const yearMin = 2000, yearMax = 2024;
const valMin = 0, valMax = 2000;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - Math.min(v, valMax)) / (valMax - valMin) * (H - margin.top - margin.bottom);

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  const top = margin.top + 4, bot = H - margin.bottom - 4;
  for (const item of sorted) item.y = Math.max(top, Math.min(bot, item.y));
  return sorted;
}

const palette = ["#EA5E33","#C4715A","#C49A45","#F29A44","#3D7A5A","#5B9E78","#8BAD72","#A6C4A2","#9A9890","#7A786F"];
const colorMap = {};
data.forEach((d, i) => { colorMap[d.n] = palette[i % palette.length]; });

[500, 1000, 1500, 2000].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  const t = mkEl("text", { x: margin.left - 6, y: yScale(v) + 3.5, "text-anchor": "end", "font-size": "8", "font-family": "'JetBrains Mono', monospace", fill: "#9A9890" });
  t.textContent = v >= 1000 ? (v/1000).toFixed(0) + "k TWh" : v;
  svg.appendChild(t);
});

[2000, 2005, 2010, 2015, 2020, 2024].forEach(y => {
  svg.appendChild(mkEl("line", {
    x1: xScale(y), y1: H - margin.bottom, x2: xScale(y), y2: H - margin.bottom + 4,
    stroke: "#C2C0B5", "stroke-width": "0.8"
  }));
  const t = mkEl("text", { x: xScale(y), y: H - margin.bottom + 12, "text-anchor": "middle", "font-size": "8", "font-family": "'JetBrains Mono', monospace", fill: "#7A786F" });
  t.textContent = y;
  svg.appendChild(t);
});

// Note: USA truncated at 2000 axis max
const note = mkEl("text", { x: W - margin.right - 4, y: yScale(2000) - 4, "text-anchor": "end", "font-size": "8", "font-family": "'JetBrains Mono', monospace", fill: "#9A9890" });
note.textContent = "↑ USA: 1,870 TWh";
svg.appendChild(note);

const tip = document.getElementById("tip");
function showTip(text, e) { tip.textContent = text; tip.style.opacity = "1"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 24) + "px"; }
function hideTip() { tip.style.opacity = "0"; }

const rows = [];

data.forEach(d => {
  const color = colorMap[d.n];
  const pts = d.s.map((v, i) => ({ year: d.y0 + i, value: v }));
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.year)} ${yScale(p.value)}`).join(" ");
  const g = mkEl("g");
  svg.appendChild(g);

  g.appendChild(mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" }));
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer" });
  g.appendChild(hit);
  rows.push({ g, d, color });

  const lastVal = d.s[d.s.length - 1];
  const firstVal = d.s[0];
  const pct = ((lastVal - firstVal) / firstVal * 100).toFixed(0);
  const sign = pct >= 0 ? "+" : "";
  hit.addEventListener("mouseenter", e => {
    showTip(`${d.n}: ${lastVal.toFixed(0)} TWh in 2024  (${sign}${pct}% since 2000)`, e);
    rows.forEach(r => r.g.style.opacity = r.d === d ? "1" : "0.1");
  });
  hit.addEventListener("mousemove", e => { tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 24) + "px"; });
  hit.addEventListener("mouseleave", () => { hideTip(); rows.forEach(r => r.g.style.opacity = "1"); });
});

const endLabels = data.map(d => {
  const lastVal = d.s[d.s.length - 1];
  return { name: d.n, val: lastVal, y: yScale(Math.min(lastVal, valMax)), color: colorMap[d.n] };
});

resolveCollisions(endLabels, 11).forEach(item => {
  const origY = yScale(Math.min(item.val, valMax));
  if (Math.abs(item.y - origY) > 2) {
    svg.appendChild(mkEl("line", {
      x1: W - margin.right + 4, y1: origY, x2: W - margin.right + 4, y2: item.y,
      stroke: item.color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
  const t = mkEl("text", { x: W - margin.right + 8, y: item.y + 3.5, "text-anchor": "start", "font-size": "9", fill: "#2B2A27" });
  t.textContent = `${item.val.toFixed(0)}  ${item.name}`;
  svg.appendChild(t);
});
</script>
</body></html>

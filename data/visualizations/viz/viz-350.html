<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 28px 32px;
      background: #1a1a2e;
      color: #e8e6e3;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px;
      color: #e8e6e3;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 12px;
      color: #8a8882;
      margin: 0 0 24px;
      max-width: 580px;
      line-height: 1.5;
    }
    #chart { position: relative; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: #12122a;
      border: 1px solid #4ecdc4;
      color: #e8e6e3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 7px 11px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 100;
    }
    .source {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #5a5855;
      margin-top: 16px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>Who Is Least Physically Active?</h1>
  <p class="subtitle">Prevalence of insufficient physical activity among adults (age-standardized, %), 2021. Higher values mean more adults fail to meet recommended activity levels.</p>
  <div id="chart"></div>
  <div class="tooltip" id="tip"></div>
  <p class="source">Source: WHO Global Health Observatory — NCD_PAA</p>

  <script>
    // Data from WHO GHO NCD_PAA, year 2021, age-standardized
    const data = [
      {"n":"Cyprus","v":40.9},{"n":"Oman","v":40.4},{"n":"Malta","v":38.3},
      {"n":"Malaysia","v":37.4},{"n":"Greece","v":37.1},{"n":"Grenada","v":35.4},
      {"n":"Uzbekistan","v":35.3},{"n":"Egypt","v":33.6},{"n":"Uruguay","v":33.6},
      {"n":"Pakistan","v":33.3},{"n":"Paraguay","v":31.6},{"n":"Honduras","v":30.3},
      {"n":"Hungary","v":30.1},{"n":"Belgium","v":29.4},{"n":"Haiti","v":27.9},
      {"n":"Colombia","v":27.7},{"n":"Thailand","v":27.4},{"n":"Czech Rep.","v":24.1},
      {"n":"Georgia","v":23.5},{"n":"Bosnia","v":23.4},{"n":"Spain","v":22.6},
      {"n":"Cabo Verde","v":22.0},{"n":"Cameroon","v":21.5},{"n":"Indonesia","v":21.0},
      {"n":"Dominica","v":20.9},{"n":"Austria","v":20.3},{"n":"N. Macedonia","v":20.2},
      {"n":"Benin","v":20.1},{"n":"Slovenia","v":19.6},{"n":"China","v":19.4},
      {"n":"Russia","v":17.7},{"n":"C. African Rep.","v":16.5},{"n":"Eritrea","v":16.1},
      {"n":"Fiji","v":15.7},{"n":"Estonia","v":15.2},{"n":"Burkina Faso","v":14.3},
      {"n":"Zambia","v":14.2},{"n":"Solomon Islands","v":13.3},{"n":"Cambodia","v":13.2},
      {"n":"Denmark","v":12.6},{"n":"Congo","v":12.4},{"n":"Netherlands","v":11.1},
      {"n":"Kenya","v":9.5},{"n":"Bhutan","v":8.8},{"n":"Finland","v":8.6},
      {"n":"Nepal","v":6.6}
    ];

    const W = 680;
    const barH = 15;
    const barGap = 5;
    const rowH = barH + barGap;
    const padLeft = 130;
    const padRight = 55;
    const padTop = 8;
    const padBottom = 28;
    const H = padTop + data.length * rowH + padBottom;
    const innerW = W - padLeft - padRight;
    const maxV = 45;

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");
    svg.style.maxWidth = W + "px";
    svg.style.display = "block";

    // Color scale by quartile
    function barColor(v) {
      if (v >= 35) return "#e05c3a";
      if (v >= 25) return "#f0934a";
      if (v >= 15) return "#4ecdc4";
      return "#6ab5b0";
    }

    // Grid lines
    const gridVals = [0, 10, 20, 30, 40];
    gridVals.forEach(gv => {
      const x = padLeft + (gv / maxV) * innerW;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x);
      line.setAttribute("y1", padTop);
      line.setAttribute("x2", x);
      line.setAttribute("y2", H - padBottom + 4);
      line.setAttribute("stroke", gv === 0 ? "#4a4855" : "#2a2840");
      line.setAttribute("stroke-width", gv === 0 ? "1.5" : "1");
      svg.appendChild(line);

      // Axis tick labels
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", x);
      t.setAttribute("y", H - padBottom + 16);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("font-size", "9");
      t.setAttribute("font-family", "'JetBrains Mono', monospace");
      t.setAttribute("fill", "#5a5855");
      t.textContent = gv + "%";
      svg.appendChild(t);
    });

    const bars = [];

    data.forEach((d, i) => {
      const y = padTop + i * rowH;
      const bw = (d.v / maxV) * innerW;
      const col = barColor(d.v);

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.style.cursor = "pointer";

      // Country label
      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", padLeft - 6);
      label.setAttribute("y", y + barH / 2 + 4);
      label.setAttribute("text-anchor", "end");
      label.setAttribute("font-size", "10");
      label.setAttribute("font-family", "'Inter', sans-serif");
      label.setAttribute("fill", "#c8c6c3");
      label.textContent = d.n;
      g.appendChild(label);

      // Bar
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", padLeft);
      rect.setAttribute("y", y);
      rect.setAttribute("width", bw);
      rect.setAttribute("height", barH);
      rect.setAttribute("fill", col);
      rect.setAttribute("rx", "2");
      g.appendChild(rect);

      // Value label
      const vLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
      vLabel.setAttribute("x", padLeft + bw + 5);
      vLabel.setAttribute("y", y + barH / 2 + 4);
      vLabel.setAttribute("text-anchor", "start");
      vLabel.setAttribute("font-size", "9");
      vLabel.setAttribute("font-family", "'JetBrains Mono', monospace");
      vLabel.setAttribute("fill", "#6a6865");
      vLabel.textContent = d.v.toFixed(1);
      g.appendChild(vLabel);

      svg.appendChild(g);
      bars.push({ g, rect, label, vLabel, d });
    });

    document.getElementById("chart").appendChild(svg);

    // Interactivity
    const tip = document.getElementById("tip");
    let activeIdx = -1;

    function highlight(idx) {
      if (idx === activeIdx) return;
      activeIdx = idx;
      bars.forEach((b, i) => {
        if (idx === -1) {
          b.g.style.opacity = "1";
        } else if (i === idx) {
          b.g.style.opacity = "1";
          b.rect.setAttribute("stroke", "#e8e6e3");
          b.rect.setAttribute("stroke-width", "1");
        } else {
          b.g.style.opacity = "0.18";
        }
        if (idx !== -1 && i !== idx) {
          b.rect.removeAttribute("stroke");
          b.rect.removeAttribute("stroke-width");
        } else if (idx === -1) {
          b.rect.removeAttribute("stroke");
          b.rect.removeAttribute("stroke-width");
        }
      });
    }

    bars.forEach((b, i) => {
      b.g.addEventListener("mouseenter", e => {
        highlight(i);
        tip.textContent = `${b.d.n}: ${b.d.v.toFixed(1)}% of adults insufficiently active`;
        tip.style.opacity = "1";
      });
      b.g.addEventListener("mousemove", e => {
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      b.g.addEventListener("mouseleave", () => {
        highlight(-1);
        tip.style.opacity = "0";
      });
    });

    // Legend
    const legendItems = [
      { col: "#e05c3a", label: ">= 35% (very high)" },
      { col: "#f0934a", label: "25-34%" },
      { col: "#4ecdc4", label: "15-24%" },
      { col: "#6ab5b0", label: "< 15%" }
    ];
    const legendSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    legendSvg.setAttribute("width", "100%");
    legendSvg.setAttribute("viewBox", `0 0 ${W} 20`);
    legendSvg.style.maxWidth = W + "px";
    legendSvg.style.display = "block";
    legendSvg.style.marginTop = "6px";

    legendItems.forEach((item, idx) => {
      const x = idx * 160;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", padLeft + x);
      r.setAttribute("y", 4);
      r.setAttribute("width", 10);
      r.setAttribute("height", 10);
      r.setAttribute("fill", item.col);
      r.setAttribute("rx", "2");
      legendSvg.appendChild(r);
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", padLeft + x + 14);
      t.setAttribute("y", 13);
      t.setAttribute("font-size", "9");
      t.setAttribute("font-family", "'JetBrains Mono', monospace");
      t.setAttribute("fill", "#5a5855");
      t.textContent = item.label;
      legendSvg.appendChild(t);
    });

    document.getElementById("chart").appendChild(legendSvg);
  </script>
</body>
</html>

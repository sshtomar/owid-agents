<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 560px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Hydropower: Who Grew and Who Stalled, 2000 vs 2024</h1>
<p class="subtitle">Electricity generation from hydropower (TWh). China multiplied its hydro output sixfold in 25 years. Vietnam and Ethiopia built from near zero. Canada and the US have barely moved.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: Ember — Yearly Electricity Data (ember--GEN-HYDRO)</p>
<script>
const data = [
  {"n":"China","a":222.4,"b":1354.2},
  {"n":"Brazil","a":304.4,"b":413.2},
  {"n":"Canada","a":356.8,"b":343.2},
  {"n":"USA","a":270.0,"b":237.0},
  {"n":"Russia","a":164.1,"b":210.5},
  {"n":"India","a":77.0,"b":156.5},
  {"n":"Norway","a":141.8,"b":139.6},
  {"n":"Vietnam","a":14.6,"b":88.7},
  {"n":"Japan","a":84.5,"b":79.5},
  {"n":"Turkey","a":30.9,"b":74.6},
  {"n":"Venezuela","a":62.9,"b":73.0},
  {"n":"France","a":64.8,"b":71.1},
  {"n":"Sweden","a":78.6,"b":64.6},
  {"n":"Ethiopia","a":1.6,"b":24.4},
  {"n":"Tajikistan","a":14.0,"b":21.0}
];

const W = 700, H = 580;
const pad = { left: 130, right: 140, top: 44, bottom: 28 };

// Exclude China from the main scale to avoid compression; show with note
const dataMain = data.filter(d => d.n !== "China");
const maxVal = 430;
const minVal = 0;

const scale = v => pad.top + (maxVal - Math.min(v, maxVal)) / (maxVal - minVal) * (H - pad.top - pad.bottom);
const xL = pad.left, xR = W - pad.right;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  const top = pad.top + 4, bot = H - pad.bottom - 4;
  for (const item of sorted) item.y = Math.max(top, Math.min(bot, item.y));
  return sorted;
}

function colorForChange(d) {
  const pct = (d.b - d.a) / Math.max(d.a, 1) * 100;
  if (pct > 300) return "#EA5E33";
  if (pct > 100) return "#F29A44";
  if (pct > 30) return "#C49A45";
  if (pct > 5) return "#F5D38A";
  if (pct > -5) return "#9A9890";
  return "#5B9E78";
}

// Axes
svg.appendChild(mkEl("line", { x1: xL, y1: pad.top, x2: xL, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "1" }));
svg.appendChild(mkEl("line", { x1: xR, y1: pad.top, x2: xR, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "1" }));

[{x: xL, label: "2000"}, {x: xR, label: "2024"}].forEach(({x, label}) => {
  const t = mkEl("text", { x, y: pad.top - 14, "text-anchor": "middle", "font-family": "'JetBrains Mono', monospace", "font-size": "10", fill: "#7A786F" });
  t.textContent = label;
  svg.appendChild(t);
});

[100, 200, 300, 400].forEach(v => {
  svg.appendChild(mkEl("line", { x1: xL, y1: scale(v), x2: xR, y2: scale(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  const t = mkEl("text", { x: xL - 6, y: scale(v) + 3.5, "text-anchor": "end", "font-size": "7.5", "font-family": "'JetBrains Mono', monospace", fill: "#9A9890" });
  t.textContent = v + " TWh";
  svg.appendChild(t);
});

const tip = document.getElementById("tip");
function showTip(text, e) { tip.textContent = text; tip.style.opacity = "1"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 24) + "px"; }
function hideTip() { tip.style.opacity = "0"; }

const rows = [];

dataMain.forEach(d => {
  const color = colorForChange(d);
  const yA = scale(d.a), yB = scale(Math.min(d.b, maxVal));
  const g = mkEl("g");
  svg.appendChild(g);

  g.appendChild(mkEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: color, "stroke-width": "1.4", opacity: "0.9" }));
  g.appendChild(mkEl("circle", { cx: xL, cy: yA, r: "3", fill: color }));
  g.appendChild(mkEl("circle", { cx: xR, cy: yB, r: "3", fill: color }));

  const hit = mkEl("line", { x1: xL - 10, y1: yA, x2: xR + 10, y2: yB, stroke: "transparent", "stroke-width": "14", cursor: "pointer" });
  g.appendChild(hit);
  rows.push({ g, d });

  const pct = ((d.b - d.a) / Math.max(d.a, 1) * 100).toFixed(0);
  const sign = pct >= 0 ? "+" : "";
  hit.addEventListener("mouseenter", e => {
    showTip(`${d.n}: ${d.a} TWh → ${d.b} TWh  (${sign}${pct}%)`, e);
    rows.forEach(r => r.g.style.opacity = r.d === d ? "1" : "0.1");
  });
  hit.addEventListener("mousemove", e => { tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY - 24) + "px"; });
  hit.addEventListener("mouseleave", () => { hideTip(); rows.forEach(r => r.g.style.opacity = "1"); });
});

// China note at top
const chinaColor = "#EA5E33";
const chinaNote1 = mkEl("text", { x: xL + 8, y: pad.top - 4, "font-size": "9", fill: chinaColor, "font-weight": "600" });
chinaNote1.textContent = "★ China: 222 → 1,354 TWh (+509%)  [off scale]";
svg.appendChild(chinaNote1);

// Labels
resolveCollisions(dataMain.map(d => ({ name: d.n, val: d.a, y: scale(d.a), color: colorForChange(d) })), 13).forEach(item => {
  const origY = scale(item.val);
  if (Math.abs(item.y - origY) > 1.5) {
    svg.appendChild(mkEl("line", { x1: xL - 5, y1: origY, x2: xL - 5, y2: item.y, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  const t = mkEl("text", { x: xL - 8, y: item.y + 3.5, "text-anchor": "end", "font-size": "9", fill: "#2B2A27" });
  t.textContent = `${item.name}  ${item.val}`;
  svg.appendChild(t);
});

resolveCollisions(dataMain.map(d => ({ name: d.n, val: d.b, y: scale(Math.min(d.b, maxVal)), color: colorForChange(d) })), 13).forEach(item => {
  const origY = scale(Math.min(item.val, maxVal));
  if (Math.abs(item.y - origY) > 1.5) {
    svg.appendChild(mkEl("line", { x1: xR + 5, y1: origY, x2: xR + 5, y2: item.y, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  const t = mkEl("text", { x: xR + 8, y: item.y + 3.5, "text-anchor": "start", "font-size": "9", fill: "#2B2A27" });
  t.textContent = `${item.val}  ${item.name}`;
  svg.appendChild(t);
});

const legendY = H - 10;
const legendItems = [
  { color: "#EA5E33", label: ">300% growth" },
  { color: "#F29A44", label: "100–300%" },
  { color: "#C49A45", label: "30–100%" },
  { color: "#9A9890", label: "Stable" },
  { color: "#5B9E78", label: "Declining" }
];
let lx = pad.left;
legendItems.forEach(item => {
  svg.appendChild(mkEl("rect", { x: lx, y: legendY - 7, width: 8, height: 8, fill: item.color }));
  const t = mkEl("text", { x: lx + 11, y: legendY, "font-size": "8", fill: "#7A786F" });
  t.textContent = item.label;
  svg.appendChild(t);
  lx += 85;
});
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Hydroelectric Power's Grip — and Release</h1>
<p class="subtitle">Hydro electricity as % of total electricity generation, 2000 vs. most recent year. Countries that once ran almost entirely on rivers have diversified sharply as economies grew and drought risk mounted.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank EG.ELC.HYRO.ZS</p>
<script>
const data = [
  {"n":"Bhutan","a":100.0,"b":100.0},
  {"n":"Cameroon","a":98.9,"b":74.7},
  {"n":"Colombia","a":74.4,"b":64.8},
  {"n":"D.R. Congo","a":99.9,"b":99.5},
  {"n":"Albania","a":96.1,"b":96.7},
  {"n":"Ethiopia","a":98.3,"b":96.5},
  {"n":"Georgia","a":78.9,"b":75.5},
  {"n":"Iceland","a":82.7,"b":70.3},
  {"n":"Costa Rica","a":82.2,"b":69.3},
  {"n":"Ecuador","a":71.7,"b":71.7},
  {"n":"Angola","a":63.1,"b":71.5},
  {"n":"Austria","a":70.6,"b":59.4},
  {"n":"Brazil","a":87.2,"b":60.2},
  {"n":"Canada","a":59.1,"b":57.0},
  {"n":"Ghana","a":91.5,"b":37.9}
];

const W = 700, H = 580;
const pad = { left: 120, right: 140, top: 50, bottom: 40 };
const minV = 30, maxV = 105;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// Year headers
const hdr = (x, txt) => {
  const t = mkEl("text", { x, y: 28, "text-anchor": "middle", "font-family": "'JetBrains Mono', monospace", "font-size": "10", fill: "#7A786F", "letter-spacing": "0.5" });
  t.textContent = txt; svg.appendChild(t);
};
hdr(pad.left, "2000");
hdr(W - pad.right, "2022/23");

// Color by decline magnitude (positive change = cool, big decline = warm)
const colorFor = d => {
  const drop = d.a - d.b;
  if (drop > 25) return "#EA5E33";
  if (drop > 10) return "#F29A44";
  if (drop > 3)  return "#F5D38A";
  return "#A6C4A2";
};

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // clamp to chart bounds
  for (const item of sorted) {
    item.y = Math.max(pad.top + 6, Math.min(H - pad.bottom - 6, item.y));
  }
  return sorted;
}

const x1 = pad.left + 4, x2 = W - pad.right - 4;

const leftLabels  = data.map(d => ({ n: d.n, y: scale(d.a), origY: scale(d.a), d }));
const rightLabels = data.map(d => ({ n: d.n, y: scale(d.b), origY: scale(d.b), d }));
resolveCollisions(leftLabels, 13);
resolveCollisions(rightLabels, 13);

const rows = [];

data.forEach((d, i) => {
  const y1pos = scale(d.a), y2pos = scale(d.b);
  const col = colorFor(d);
  const g = mkEl("g", {});

  const line = mkEl("line", { x1, y1: y1pos, x2, y2: y2pos, stroke: col, "stroke-width": "1.5", opacity: "0.75" });
  g.appendChild(line);

  [{ x: x1, y: y1pos }, { x: x2, y: y2pos }].forEach(p => {
    g.appendChild(mkEl("circle", { cx: p.x, cy: p.y, r: "2.5", fill: col }));
  });

  const ll = leftLabels.find(l => l.n === d.n);
  const lt = mkEl("text", { x: x1 - 8, y: ll.y + 3.5, "text-anchor": "end", "font-size": "10", fill: "#2B2A27" });
  lt.textContent = `${d.n}  ${d.a.toFixed(0)}%`;
  g.appendChild(lt);

  // Leader line if label moved
  if (Math.abs(ll.y - ll.origY) > 3) {
    g.appendChild(mkEl("line", { x1: x1 - 6, y1: ll.origY, x2: x1 - 6, y2: ll.y, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const rl = rightLabels.find(l => l.n === d.n);
  const rt = mkEl("text", { x: x2 + 8, y: rl.y + 3.5, "text-anchor": "start", "font-size": "10", fill: "#2B2A27" });
  rt.textContent = `${d.b.toFixed(0)}%  ${d.n}`;
  g.appendChild(rt);

  if (Math.abs(rl.y - rl.origY) > 3) {
    g.appendChild(mkEl("line", { x1: x2 + 6, y1: rl.origY, x2: x2 + 6, y2: rl.y, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const hit = mkEl("line", { x1, y1: y1pos, x2, y2: y2pos, stroke: "transparent", "stroke-width": "14" });
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  svg.appendChild(g);
  rows.push({ g, line, d, col, y1: y1pos, y2: y2pos });
});

// Legend
const legend = [
  { col: "#EA5E33", label: ">25 pp decline" },
  { col: "#F29A44", label: "10-25 pp decline" },
  { col: "#F5D38A", label: "3-10 pp decline" },
  { col: "#A6C4A2", label: "stable / gained" },
];
legend.forEach((l, i) => {
  const lx = i * 145 + 4;
  const ly = H - 8;
  svg.appendChild(mkEl("rect", { x: lx, y: ly - 6, width: 12, height: 3, fill: l.col, rx: 1 }));
  const lt = mkEl("text", { x: lx + 16, y: ly, "font-size": "9", fill: "#7A786F", "font-family": "'JetBrains Mono', monospace" });
  lt.textContent = l.label;
  svg.appendChild(lt);
});

document.getElementById("chart").appendChild(svg);

const tip = document.getElementById("tip");
let activeIdx = -1;

function highlight(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  rows.forEach((row, i) => {
    if (idx === -1) {
      row.g.style.opacity = "1";
      row.line.setAttribute("stroke-width", "1.5");
    } else if (i === idx) {
      row.g.style.opacity = "1";
      row.line.setAttribute("stroke-width", "3");
    } else {
      row.g.style.opacity = "0.15";
      row.line.setAttribute("stroke-width", "1");
    }
  });
}

svg.addEventListener("mousemove", e => {
  const rect = svg.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  const sy = (e.clientY - rect.top) / rect.height * H;

  let best = -1, bestDist = 20;
  rows.forEach((row, i) => {
    const t = Math.max(0, Math.min(1, (sx - x1) / (x2 - x1)));
    const lineY = row.y1 + (row.y2 - row.y1) * t;
    if (Math.abs(sy - lineY) < bestDist) { bestDist = Math.abs(sy - lineY); best = i; }
  });

  highlight(best);

  if (best >= 0) {
    const d = rows[best].d;
    const diff = (d.b - d.a).toFixed(1);
    const sign = d.b >= d.a ? "+" : "";
    tip.textContent = `${d.n}: ${d.a.toFixed(0)}% → ${d.b.toFixed(0)}% (${sign}${diff} pp)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  } else {
    tip.style.opacity = "0";
  }
});

svg.addEventListener("mouseleave", () => { highlight(-1); tip.style.opacity = "0"; });
</script>
</body></html>

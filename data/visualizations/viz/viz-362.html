<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Terrestrial Protected Areas — Top 20 Countries</h1>
<p class="subtitle">Share of total land area designated as protected, comparing 2013 to 2024. Countries are ranked by their 2024 protection level.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — ER.LND.PTLD.ZS</p>
<script>
const data = [
  {"n":"Bhutan","a":28.8,"b":51.6},
  {"n":"Bulgaria","a":45.2,"b":44.3},
  {"n":"Hong Kong SAR, China","a":42.1,"b":42.0},
  {"n":"Greenland","a":41.2,"b":41.9},
  {"n":"Brunei","a":46.9,"b":39.9},
  {"n":"Cambodia","a":26.3,"b":39.8},
  {"n":"Germany","a":37.9,"b":39.3},
  {"n":"Armenia","a":23.3,"b":38.9},
  {"n":"Cyprus","a":20.6,"b":38.6},
  {"n":"Croatia","a":13.8,"b":38.4},
  {"n":"Guinea","a":30.7,"b":37.6},
  {"n":"Belize","a":36.8,"b":37.3},
  {"n":"Congo","a":36.4,"b":36.8},
  {"n":"Greece","a":35.1,"b":35.0},
  {"n":"Bahamas","a":13.3,"b":34.6},
  {"n":"Comoros","a":10.2,"b":33.7},
  {"n":"Bolivia","a":21.4,"b":30.9},
  {"n":"Brazil","a":26.4,"b":30.6},
  {"n":"Benin","a":29.6,"b":29.7},
  {"n":"Austria","a":24.0,"b":29.6}
];

const W = 700, H = 580;
const pad = { left: 130, right: 140, top: 48, bottom: 20 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const allVals = data.flatMap(d => [d.a, d.b]);
const minV = Math.floor(Math.min(...allVals)) - 2;
const maxV = Math.ceil(Math.max(...allVals)) + 2;
const scaleY = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const xA = pad.left;
const xB = W - pad.right;

// Grid lines
[10, 20, 30, 40, 50].forEach(v => {
  if (v < minV || v > maxV) return;
  svg.appendChild(mkEl("line", {
    x1: xA, y1: scaleY(v), x2: xB, y2: scaleY(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: xA - 8, y: scaleY(v) + 3.5,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace",
    "font-size": "8", "text-anchor": "end"
  })).textContent = v + "%";
});

// Column headers
const hdr = mkEl("text", {
  x: xA, y: pad.top - 20,
  fill: "#7A786F", "font-family": "JetBrains Mono, monospace",
  "font-size": "10", "text-anchor": "middle"
});
hdr.textContent = "2013";
svg.appendChild(hdr);

const hdr2 = mkEl("text", {
  x: xB, y: pad.top - 20,
  fill: "#7A786F", "font-family": "JetBrains Mono, monospace",
  "font-size": "10", "text-anchor": "middle"
});
hdr2.textContent = "2024";
svg.appendChild(hdr2);

// Axis tick marks
svg.appendChild(mkEl("line", { x1: xA, y1: scaleY(minV+1), x2: xA, y2: scaleY(maxV-1), stroke: "#E2E0D5", "stroke-width": "1" }));
svg.appendChild(mkEl("line", { x1: xB, y1: scaleY(minV+1), x2: xB, y2: scaleY(maxV-1), stroke: "#E2E0D5", "stroke-width": "1" }));

// Resolve label collisions
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

// Clamp to chart area
const CLAMP_MIN = pad.top;
const CLAMP_MAX = H - pad.bottom - 4;

function clampLabels(items) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let i = 0; i < sorted.length; i++) {
    sorted[i].y = Math.max(CLAMP_MIN, Math.min(CLAMP_MAX, sorted[i].y));
  }
  return resolveCollisions(sorted, 13);
}

// Color by change direction/magnitude
function colorForChange(change) {
  if (change > 20) return "#EA5E33";
  if (change > 10) return "#F29A44";
  if (change > 3) return "#C49A45";
  if (change >= 0) return "#A6C4A2";
  return "#B34B3B";
}

const tip = document.getElementById("tip");

// Build left/right label sets
const leftLabels = data.map(d => ({ d, y: scaleY(d.a), orig: scaleY(d.a) }));
const rightLabels = data.map(d => ({ d, y: scaleY(d.b), orig: scaleY(d.b) }));
const leftResolved = clampLabels(leftLabels);
const rightResolved = clampLabels(rightLabels);

// Map name -> resolved y positions
const leftMap = new Map(leftResolved.map(l => [l.d.n, l.y]));
const rightMap = new Map(rightResolved.map(l => [l.d.n, l.y]));

const groups = [];
data.forEach(d => {
  const change = d.b - d.a;
  const color = colorForChange(change);
  const yA = scaleY(d.a);
  const yB = scaleY(d.b);

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  // Invisible hit area
  const hit = mkEl("line", {
    x1: xA, y1: yA, x2: xB, y2: yB,
    stroke: "transparent", "stroke-width": "12"
  });

  const line = mkEl("line", {
    x1: xA, y1: yA, x2: xB, y2: yB,
    stroke: color, "stroke-width": "1.5",
    "stroke-linecap": "round"
  });

  // Dots
  const dotA = mkEl("circle", { cx: xA, cy: yA, r: "2.5", fill: color });
  const dotB = mkEl("circle", { cx: xB, cy: yB, r: "2.5", fill: color });

  // Left label (right-aligned)
  const lyA = leftMap.get(d.n);
  const leftLbl = mkEl("text", {
    x: xA - 8, y: lyA + 3.5,
    fill: "#2B2A27", "font-size": "9.5",
    "text-anchor": "end"
  });
  leftLbl.textContent = `${d.n}  ${d.a.toFixed(1)}`;

  // Faint leader line if label moved
  if (Math.abs(lyA - yA) > 2) {
    const leader = mkEl("line", {
      x1: xA - 5, y1: yA, x2: xA - 5, y2: lyA,
      stroke: color, "stroke-width": "0.5", opacity: "0.4"
    });
    g.appendChild(leader);
  }

  // Right label (left-aligned)
  const lyB = rightMap.get(d.n);
  const rightLbl = mkEl("text", {
    x: xB + 8, y: lyB + 3.5,
    fill: "#2B2A27", "font-size": "9.5",
    "text-anchor": "start"
  });
  const signStr = change >= 0 ? `+${change.toFixed(1)}` : change.toFixed(1);
  rightLbl.textContent = `${d.b.toFixed(1)}  ${d.n}`;

  if (Math.abs(lyB - yB) > 2) {
    const leader = mkEl("line", {
      x1: xB + 5, y1: yB, x2: xB + 5, y2: lyB,
      stroke: color, "stroke-width": "0.5", opacity: "0.4"
    });
    g.appendChild(leader);
  }

  g.appendChild(line);
  g.appendChild(dotA);
  g.appendChild(dotB);
  g.appendChild(leftLbl);
  g.appendChild(rightLbl);
  g.appendChild(hit);

  g.addEventListener("mouseenter", e => {
    groups.forEach(og => { og.style.opacity = "0.12"; });
    g.style.opacity = "1";
    const dir = change >= 0 ? "+" : "";
    tip.textContent = `${d.n}: ${d.a.toFixed(1)}% → ${d.b.toFixed(1)}% (${dir}${change.toFixed(1)} pp)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mouseleave", () => {
    groups.forEach(og => { og.style.opacity = "1"; });
    tip.style.opacity = "0";
  });

  groups.push(g);
  svg.appendChild(g);
});

// Legend
const legendX = xA + 10, legendY = H - 4;
const legendItems = [
  { color: "#EA5E33", label: ">20 pp gain" },
  { color: "#F29A44", label: "10–20 pp gain" },
  { color: "#C49A45", label: "3–10 pp gain" },
  { color: "#A6C4A2", label: "<3 pp gain" },
  { color: "#B34B3B", label: "declined" }
];
legendItems.forEach((li, i) => {
  const lx = legendX + i * 110;
  svg.appendChild(mkEl("rect", { x: lx, y: legendY - 8, width: 8, height: 8, fill: li.color, rx: "1" }));
  const lt = mkEl("text", { x: lx + 11, y: legendY, fill: "#7A786F", "font-size": "8.5", "font-family": "JetBrains Mono, monospace" });
  lt.textContent = li.label;
  svg.appendChild(lt);
});
</script>
</body></html>

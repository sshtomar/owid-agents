<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Hydroelectric Share of Electricity, 1990–2024</h1>
<p class="subtitle">Electricity from hydroelectric sources as a share of total electricity production. Brazil, Cameroon, and Costa Rica show substantial declines as they diversify their grids.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — EG.ELC.HYRO.ZS</p>
<script>
const data = [
  {"n":"DR Congo","pts":[{"y":1990,"v":99.6},{"y":1993,"v":99.7},{"y":1996,"v":99.7},{"y":1999,"v":99.5},{"y":2002,"v":99.9},{"y":2005,"v":99.9},{"y":2008,"v":98.7},{"y":2011,"v":98.9},{"y":2014,"v":99.6},{"y":2017,"v":99.6},{"y":2020,"v":99.6},{"y":2023,"v":99.5},{"y":2024,"v":98.5}]},
  {"n":"Ethiopia","pts":[{"y":1990,"v":88.4},{"y":1993,"v":91.3},{"y":1996,"v":94.2},{"y":1999,"v":97.6},{"y":2002,"v":99.0},{"y":2005,"v":99.6},{"y":2008,"v":87.3},{"y":2011,"v":98.8},{"y":2014,"v":94.6},{"y":2017,"v":95.6},{"y":2020,"v":94.4},{"y":2023,"v":96.4},{"y":2024,"v":97.1}]},
  {"n":"Albania","pts":[{"y":1990,"v":86.4},{"y":1993,"v":93.9},{"y":1996,"v":95.7},{"y":1999,"v":97.3},{"y":2002,"v":94.0},{"y":2005,"v":98.7},{"y":2008,"v":100.0},{"y":2011,"v":98.6},{"y":2014,"v":100.0},{"y":2017,"v":100.0},{"y":2020,"v":99.4},{"y":2023,"v":96.7},{"y":2024,"v":90.5}]},
  {"n":"Cameroon","pts":[{"y":1990,"v":98.5},{"y":1993,"v":98.9},{"y":1996,"v":98.9},{"y":1999,"v":98.8},{"y":2002,"v":96.4},{"y":2005,"v":94.2},{"y":2008,"v":74.5},{"y":2011,"v":74.3},{"y":2014,"v":63.2},{"y":2017,"v":67.1},{"y":2020,"v":69.3},{"y":2023,"v":79.7},{"y":2024,"v":85.3}]},
  {"n":"Georgia","pts":[{"y":1990,"v":55.2},{"y":1993,"v":63.1},{"y":1996,"v":83.5},{"y":1999,"v":83.8},{"y":2002,"v":93.2},{"y":2005,"v":85.8},{"y":2008,"v":84.7},{"y":2011,"v":77.4},{"y":2014,"v":80.4},{"y":2017,"v":79.9},{"y":2020,"v":73.9},{"y":2023,"v":75.5},{"y":2024,"v":79.7}]},
  {"n":"Angola","pts":[{"y":1990,"v":86.2},{"y":1993,"v":93.7},{"y":1996,"v":90.0},{"y":1999,"v":67.0},{"y":2002,"v":64.8},{"y":2005,"v":84.3},{"y":2008,"v":77.7},{"y":2011,"v":70.9},{"y":2014,"v":52.5},{"y":2017,"v":71.3},{"y":2020,"v":74.9},{"y":2023,"v":71.5},{"y":2024,"v":73.1}]},
  {"n":"Brazil","pts":[{"y":1990,"v":92.8},{"y":1993,"v":93.3},{"y":1996,"v":91.2},{"y":1999,"v":87.5},{"y":2002,"v":82.8},{"y":2005,"v":83.7},{"y":2008,"v":79.8},{"y":2011,"v":80.6},{"y":2014,"v":62.6},{"y":2017,"v":62.3},{"y":2020,"v":63.0},{"y":2023,"v":60.2},{"y":2024,"v":56.1}]},
  {"n":"Costa Rica","pts":[{"y":1990,"v":97.5},{"y":1993,"v":80.0},{"y":1996,"v":79.4},{"y":1999,"v":83.1},{"y":2002,"v":79.3},{"y":2005,"v":79.5},{"y":2008,"v":78.0},{"y":2011,"v":72.6},{"y":2014,"v":65.7},{"y":2017,"v":76.4},{"y":2020,"v":70.7},{"y":2023,"v":68.3},{"y":2024,"v":65.7}]},
  {"n":"Ecuador","pts":[{"y":1990,"v":78.5},{"y":1993,"v":78.4},{"y":1996,"v":67.9},{"y":1999,"v":69.6},{"y":2002,"v":63.3},{"y":2005,"v":51.3},{"y":2008,"v":60.7},{"y":2011,"v":54.0},{"y":2014,"v":47.1},{"y":2017,"v":71.7},{"y":2020,"v":77.9},{"y":2023,"v":71.7},{"y":2024,"v":65.8}]},
  {"n":"Austria","pts":[{"y":1990,"v":64.6},{"y":1993,"v":72.0},{"y":1996,"v":64.7},{"y":1999,"v":68.5},{"y":2002,"v":67.2},{"y":2005,"v":59.0},{"y":2008,"v":60.8},{"y":2011,"v":57.4},{"y":2014,"v":68.5},{"y":2017,"v":59.1},{"y":2020,"v":62.5},{"y":2023,"v":59.4},{"y":2024,"v":59.9}]}
];

const W = 800, H = 460;
const margin = { top: 30, right: 130, bottom: 40, left: 50 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const yearMin = 1990, yearMax = 2024;
const valMin = 40, valMax = 105;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid
[50, 60, 70, 80, 90, 100].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3.5,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "8.5", "text-anchor": "end"
  })).textContent = v + "%";
});

// X-axis
[1990, 1995, 2000, 2005, 2010, 2015, 2020, 2024].forEach(y => {
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "9", "text-anchor": "middle"
  })).textContent = y;
  svg.appendChild(mkEl("line", {
    x1: xScale(y), y1: yScale(valMin) + 2, x2: xScale(y), y2: yScale(valMin) + 5,
    stroke: "#C2C0B5", "stroke-width": "0.7"
  }));
});

const COLORS = ["#EA5E33","#F29A44","#C49A45","#5B9E78","#3D7A5A","#A6C4A2","#4A7A9B","#B34B3B","#8B5E9B","#7A786F"];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
const groups = [];

const endpointLabels = data.map((series, idx) => {
  const last = series.pts[series.pts.length - 1];
  return { series, idx, y: yScale(last.v) };
});
const resolved = resolveCollisions(endpointLabels, 12);
const labelMap = new Map(resolved.map(l => [l.series.n, l.y]));

data.forEach((series, idx) => {
  const color = COLORS[idx % COLORS.length];
  const pts = series.pts;

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  const hitPath = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });

  const last = pts[pts.length - 1];
  const lyEnd = labelMap.get(series.n);
  const yEnd = yScale(last.v);

  if (Math.abs(lyEnd - yEnd) > 2) {
    g.appendChild(mkEl("line", {
      x1: W - margin.right + 2, y1: yEnd,
      x2: W - margin.right + 4, y2: lyEnd,
      stroke: color, "stroke-width": "0.6", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text", { x: W - margin.right + 8, y: lyEnd + 3.5, fill: "#2B2A27", "font-size": "9.5" });
  lbl.textContent = `${last.v.toFixed(0)}%  ${series.n}`;

  g.appendChild(line);
  g.appendChild(lbl);
  g.appendChild(hitPath);

  g.addEventListener("mouseenter", e => {
    groups.forEach(og => { og.style.opacity = "0.1"; });
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "2.5");
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const yr = yearMin + (mx - margin.left) / (W - margin.left - margin.right) * (yearMax - yearMin);
    const nearest = pts.reduce((best, p) => Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best);
    tip.textContent = `${series.n} ${nearest.y}: ${nearest.v.toFixed(1)}%`;
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mouseleave", () => {
    groups.forEach(og => { og.style.opacity = "1"; });
    line.setAttribute("stroke-width", "1.5");
    tip.style.opacity = "0";
  });

  groups.push(g);
  svg.appendChild(g);
});
</script>
</body></html>

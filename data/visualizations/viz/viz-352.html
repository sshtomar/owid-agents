function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

    line.setAttribute("stroke-width", "2.5");
  });
  hit.addEventListener("mouseleave", () => {
    hideTip();
    groups.forEach(gg => { gg.style.opacity = "1"; });
    line.setAttribute("stroke-width", "1.6");
  });

  svg.appendChild(g);
  groups.push(g);
});

// Endpoint labels
const labelItems = data.map(series => {
  const last = series.pts[series.pts.length - 1];
  return { n: series.n, val: last.v, y: yScale(last.v), color: palette[series.n] || "#7A786F" };
});
const resolved = resolveCollisions(labelItems, 11);
// Clamp to chart bounds
resolved.forEach(item => {
  item.y = Math.max(margin.top + 4, Math.min(H - margin.bottom - 4, item.y));
});

resolved.forEach(item => {
  const lbl = mkEl("text", {
    x: W - margin.right + 6, y: item.y + 3,
    "font-size": "9", fill: item.color,
    "text-anchor": "start", "font-weight": "500",
    "font-family": "Inter, sans-serif"
  });
  lbl.textContent = `${item.val.toFixed(1)}  ${item.n}`;
  svg.appendChild(lbl);
});

</script>
</body></html>

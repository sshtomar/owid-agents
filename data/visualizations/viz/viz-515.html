<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .subtitle { font-size: 12px; color: #7A786F; margin: 0 0 20px; line-height: 1.5; }
  #chart { width: 100%; max-width: 820px; }
  #tip { position: fixed; background: #2B2A27; color: #F6F5EE; font-family: 'Inter', sans-serif;
         font-size: 11px; padding: 6px 10px; border-radius: 4px; pointer-events: none;
         opacity: 0; transition: opacity 0.1s; z-index: 10; white-space: nowrap; }
  .source { font-size: 10px; color: #A6A49C; margin-top: 8px; }
</style>
</head>
<body>
<h1>ATMs per 100,000 Adults, 2004–2023</h1>
<p class="subtitle">Automated teller machine density. Wealthy nations are past peak ATM density as mobile and digital payments replace physical cash machines; emerging economies still growing.</p>
<div id="chart"></div>
<div id="tip"></div>
<p class="source">Source: World Bank, FB.ATM.TOTL.P5</p>
<script>
const data = [{"n":"Japan","s":[124.2,123.8,124.1,125.1,125.5,132.8,131.0,128.6,127.8,128.2,127.4,127.4,127.4,127.2,126.8,123.5,121.0,116.6,113.1,109.8],"y0":2004},{"n":"Germany","s":[null,null,null,107.1,109.9,112.4,116.9,121.2,118.6,118.3,123.4,122.3,82.5,81.2,null,81.4,79.4,77.0,73.0,70.9],"y0":2004},{"n":"France","s":[85.6,92.9,92.2,99.9,101.6,104.2,106.2,109.3,109.4,108.9,108.1,107.1,104.5,102.0,97.8,95.8,93.0,89.0,84.3,77.6],"y0":2004},{"n":"Australia","s":[140.9,148.0,156.6,155.4,157.9,154.4,168.8,170.4,164.6,161.2,165.3,163.9,167.6,159.9,145.5,135.7,128.7,122.5,117.7,111.4],"y0":2004},{"n":"Canada","s":[185.2,198.4,206.5,212.0,217.9,216.4,218.4,207.7,203.5,221.3,222.4,222.1,224.7,229.2,220.5,214.3,210.4,212.5,206.0,188.4],"y0":2004},{"n":"South Korea","s":[209.4,213.2,219.2,235.1,242.6,247.9,266.3,281.8,288.7,288.7,280.9,275.8,271.1,271.9,266.3,263.3,258.2,256.9,252.6,244.5],"y0":2004},{"n":"Brazil","s":[105.5,109.1,107.7,110.0,112.6,115.2,119.1,117.5,116.7,119.9,119.4,116.5,113.7,109.5,108.3,117.7,116.1,111.9,113.5,100.7],"y0":2004},{"n":"India","s":[null,2.3,2.7,3.4,4.3,5.3,7.2,8.8,10.9,12.8,17.6,19.5,21.0,21.8,21.4,20.7,21.2,21.2,24.6,24.8],"y0":2004},{"n":"China","s":[null,null,9.6,12.0,15.6,19.8,24.9,30.4,37.6,46.7,54.9,76.9,81.5,84.3,97.0,95.3,87.6,81.4,76.6,71.9],"y0":2004},{"n":"Indonesia","s":[8.3,9.0,10.2,11.1,12.7,13.7,12.6,16.0,34.8,41.0,48.1,51.9,53.4,54.3,53.8,53.0,51.3,48.0,47.3,45.5],"y0":2004},{"n":"Kenya","s":[1.7,1.6,3.0,4.8,6.0,7.3,8.9,9.1,9.5,9.7,9.9,10.0,9.4,9.7,9.5,8.0,7.6,7.0,6.8,6.6],"y0":2004},{"n":"Ghana","s":[null,null,null,null,3.9,3.9,4.0,4.1,5.5,8.2,8.2,10.3,11.3,11.6,11.9,11.5,11.8,11.8,11.4,11.2],"y0":2004}];

const W = 820, H = 480;
const margin = {top: 36, right: 170, bottom: 36, left: 56};
const yearMin = 2004, yearMax = 2023;
const valMin = 0, valMax = 320;

const palette = [
  "#EA5E33","#3D7A5A","#3D6FA8","#C49A45","#7A5A9A","#9A4A7A",
  "#5B9E78","#C4715A","#8BAD72","#A87A3D","#5A8A8A","#8A6A3D"
];

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

const svg = mkEl("svg", {viewBox:`0 0 ${W} ${H}`, width:"100%", style:"max-width:820px;display:block;"});
svg.appendChild(mkEl("rect", {x:0, y:0, width:W, height:H, fill:"#F6F5EE"}));

// Grid lines
for (let v = 0; v <= 300; v += 50) {
  const ty = yScale(v);
  svg.appendChild(mkEl("line", {x1:margin.left, y1:ty, x2:W-margin.right, y2:ty,
    stroke:"#E2E0D5","stroke-width":"0.6"}));
  const t = mkEl("text", {x:margin.left-8, y:ty+4, "text-anchor":"end",
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:"#7A786F"});
  t.textContent = v;
  svg.appendChild(t);
}

// X axis ticks
for (let yr = 2004; yr <= 2023; yr += 4) {
  const tx = xScale(yr);
  svg.appendChild(mkEl("line", {x1:tx, y1:H-margin.bottom, x2:tx, y2:H-margin.bottom+4,
    stroke:"#C2C0B5","stroke-width":"0.7"}));
  const t = mkEl("text", {x:tx, y:H-margin.bottom+14, "text-anchor":"middle",
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:"#7A786F"});
  t.textContent = yr;
  svg.appendChild(t);
}

// Y axis label
const yLabel = mkEl("text", {
  x:12, y:(margin.top + H - margin.bottom)/2, "text-anchor":"middle",
  transform:`rotate(-90,12,${(margin.top+H-margin.bottom)/2})`,
  "font-family":"Inter, sans-serif","font-size":"10",fill:"#7A786F"
});
yLabel.textContent = "ATMs per 100,000 adults";
svg.appendChild(yLabel);

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const endLabels = [];
const groups = [];

data.forEach((series, i) => {
  const color = palette[i % palette.length];
  const pts = [];
  series.s.forEach((v, j) => {
    if (v !== null) pts.push({y: series.y0 + j, v});
  });
  if (pts.length < 2) return;

  const segments = [];
  let seg = [];
  series.s.forEach((v, j) => {
    if (v !== null) {
      seg.push({y: series.y0 + j, v});
    } else {
      if (seg.length > 1) segments.push(seg);
      else if (seg.length === 1) segments.push(seg);
      seg = [];
    }
  });
  if (seg.length > 0) segments.push(seg);

  const g = mkEl("g", {});
  const allPaths = [];
  segments.forEach(seg => {
    if (seg.length < 2) return;
    const pathD = seg.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
    const line = mkEl("path", {d:pathD, stroke:color,"stroke-width":"1.5",fill:"none","stroke-linejoin":"round"});
    g.appendChild(line);
    allPaths.push(line);
  });

  // Single wide invisible hit path over full data range
  const fullD = pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
  const hit = mkEl("path", {d:fullD, stroke:"transparent","stroke-width":"14",fill:"none",style:"cursor:pointer"});
  g.appendChild(hit);

  const lastPt = pts[pts.length - 1];
  endLabels.push({i, y: yScale(lastPt.v), val: lastPt.v, name: series.n, color, lastY: lastPt.y});
  groups.push({g, allPaths, hit, series, color, pts});
  svg.appendChild(g);
});

const resolved = resolveCollisions(endLabels, 12);
const labelX = W - margin.right + 8;

resolved.forEach(item => {
  const series = data[item.i];
  const pts = [];
  series.s.forEach((v, j) => { if (v !== null) pts.push({y: series.y0 + j, v}); });
  const lastPt = pts[pts.length - 1];
  const origY = yScale(lastPt.v);
  svg.appendChild(mkEl("circle", {cx:xScale(lastPt.y), cy:origY, r:"3", fill:item.color}));
  if (Math.abs(item.y - origY) > 2) {
    svg.appendChild(mkEl("line", {
      x1:xScale(lastPt.y)+2, y1:origY, x2:labelX-2, y2:item.y,
      stroke:item.color,"stroke-width":"0.5",opacity:"0.5"
    }));
  }
  const t = mkEl("text", {x:labelX, y:item.y+4,
    "font-family":"JetBrains Mono, monospace","font-size":"9",fill:item.color});
  t.textContent = `${item.val}  ${item.name}`;
  svg.appendChild(t);
});

const tip = document.getElementById("tip");
groups.forEach(({g, allPaths, hit, series, color, pts}) => {
  hit.addEventListener("mouseover", () => {
    groups.forEach(o => o.allPaths.forEach(p => { p.style.opacity = "0.1"; }));
    allPaths.forEach(p => { p.style.opacity = "1"; p.style.strokeWidth = "3"; });
  });
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const targetYear = yearMin + ratio * (yearMax - yearMin);
    let closest = pts[0];
    for (const p of pts) {
      if (Math.abs(p.y - targetYear) < Math.abs(closest.y - targetYear)) closest = p;
    }
    const peakVal = Math.max(...pts.map(p => p.v));
    const peakYr = pts.find(p => p.v === peakVal).y;
    const trend = closest.v < peakVal * 0.95 && peakYr < 2022 ? ` (peak: ${peakVal} in ${peakYr})` : "";
    tip.textContent = `${series.n}: ${closest.v} ATMs/100k adults (${closest.y})${trend}`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
  });
  hit.addEventListener("mouseout", () => {
    groups.forEach(o => o.allPaths.forEach(p => { p.style.opacity = "1"; p.style.strokeWidth = "1.5"; }));
    tip.style.opacity = "0";
  });
});

document.getElementById("chart").appendChild(svg);
</script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Adult Female Mortality Rate, 1960–2024</h1>
<p class="subtitle">Deaths per 1,000 adult women. Every country shown has seen dramatic progress — yet in 2024, a woman in Gambia is still 9× more likely to die prematurely than one in South Korea. Hover to highlight a country.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank, WHO model-based estimates</p>
<script>
const data = [{"n":"Japan","pts":[{"y":1960,"v":149.0},{"y":1964,"v":123.8},{"y":1968,"v":108.5},{"y":1972,"v":94.1},{"y":1976,"v":80.0},{"y":1980,"v":69.1},{"y":1984,"v":61.8},{"y":1988,"v":56.1},{"y":1992,"v":52.5},{"y":1996,"v":49.3},{"y":2000,"v":47.7},{"y":2004,"v":45.4},{"y":2008,"v":42.7},{"y":2012,"v":39.8},{"y":2016,"v":37.0},{"y":2020,"v":35.6},{"y":2024,"v":36.6}]},{"n":"South Korea","pts":[{"y":1960,"v":300.1},{"y":1964,"v":300.8},{"y":1968,"v":214.7},{"y":1972,"v":194.5},{"y":1976,"v":171.9},{"y":1980,"v":172.7},{"y":1984,"v":135.7},{"y":1988,"v":113.2},{"y":1992,"v":96.6},{"y":1996,"v":80.6},{"y":2000,"v":64.2},{"y":2004,"v":54.2},{"y":2008,"v":41.6},{"y":2012,"v":31.4},{"y":2016,"v":24.2},{"y":2020,"v":33.5},{"y":2024,"v":20.5}]},{"n":"China","pts":[{"y":1960,"v":480.2},{"y":1964,"v":302.0},{"y":1968,"v":269.7},{"y":1972,"v":232.5},{"y":1976,"v":205.6},{"y":1980,"v":172.3},{"y":1984,"v":151.0},{"y":1988,"v":131.1},{"y":1992,"v":115.0},{"y":1996,"v":96.2},{"y":2000,"v":86.7},{"y":2004,"v":78.7},{"y":2008,"v":74.3},{"y":2012,"v":65.9},{"y":2016,"v":60.9},{"y":2020,"v":55.9},{"y":2024,"v":56.0}]},{"n":"Iran","pts":[{"y":1960,"v":408.1},{"y":1964,"v":382.5},{"y":1968,"v":361.2},{"y":1972,"v":316.2},{"y":1976,"v":269.5},{"y":1980,"v":232.4},{"y":1984,"v":198.8},{"y":1988,"v":171.1},{"y":1992,"v":145.6},{"y":1996,"v":127.0},{"y":2000,"v":109.0},{"y":2004,"v":94.7},{"y":2008,"v":84.7},{"y":2012,"v":76.4},{"y":2016,"v":67.3},{"y":2020,"v":79.1},{"y":2024,"v":56.4}]},{"n":"India","pts":[{"y":1960,"v":386.4},{"y":1964,"v":374.5},{"y":1968,"v":359.8},{"y":1972,"v":343.4},{"y":1976,"v":316.3},{"y":1980,"v":280.4},{"y":1984,"v":246.8},{"y":1988,"v":224.0},{"y":1992,"v":211.7},{"y":1996,"v":202.6},{"y":2000,"v":187.2},{"y":2004,"v":167.5},{"y":2008,"v":150.5},{"y":2012,"v":143.8},{"y":2016,"v":140.3},{"y":2020,"v":139.4},{"y":2024,"v":120.9}]},{"n":"Bangladesh","pts":[{"y":1960,"v":364.4},{"y":1964,"v":337.7},{"y":1968,"v":319.1},{"y":1972,"v":303.3},{"y":1976,"v":290.3},{"y":1980,"v":276.9},{"y":1984,"v":267.9},{"y":1988,"v":271.4},{"y":1992,"v":276.7},{"y":1996,"v":250.9},{"y":2000,"v":210.2},{"y":2004,"v":174.9},{"y":2008,"v":151.1},{"y":2012,"v":136.1},{"y":2016,"v":125.3},{"y":2020,"v":121.4},{"y":2024,"v":101.5}]},{"n":"Ethiopia","pts":[{"y":1960,"v":378.6},{"y":1964,"v":370.6},{"y":1968,"v":363.2},{"y":1972,"v":376.3},{"y":1976,"v":372.7},{"y":1980,"v":357.8},{"y":1984,"v":426.8},{"y":1988,"v":372.1},{"y":1992,"v":380.2},{"y":1996,"v":378.2},{"y":2000,"v":366.1},{"y":2004,"v":333.0},{"y":2008,"v":273.6},{"y":2012,"v":226.4},{"y":2016,"v":188.6},{"y":2020,"v":162.5},{"y":2024,"v":145.9}]},{"n":"Brazil","pts":[{"y":1960,"v":276.9},{"y":1964,"v":262.0},{"y":1968,"v":246.9},{"y":1972,"v":232.4},{"y":1976,"v":216.9},{"y":1980,"v":201.4},{"y":1984,"v":185.2},{"y":1988,"v":168.2},{"y":1992,"v":144.7},{"y":1996,"v":134.7},{"y":2000,"v":122.9},{"y":2004,"v":110.2},{"y":2008,"v":101.6},{"y":2012,"v":94.6},{"y":2016,"v":89.5},{"y":2020,"v":93.2},{"y":2024,"v":83.4}]},{"n":"Gambia","pts":[{"y":1960,"v":461.2},{"y":1964,"v":444.9},{"y":1968,"v":430.0},{"y":1972,"v":413.4},{"y":1976,"v":391.7},{"y":1980,"v":376.4},{"y":1984,"v":353.5},{"y":1988,"v":328.1},{"y":1992,"v":304.5},{"y":1996,"v":278.2},{"y":2000,"v":262.5},{"y":2004,"v":256.5},{"y":2008,"v":250.3},{"y":2012,"v":241.4},{"y":2016,"v":226.0},{"y":2020,"v":211.9},{"y":2024,"v":193.6}]},{"n":"Ghana","pts":[{"y":1960,"v":333.6},{"y":1964,"v":320.1},{"y":1968,"v":307.2},{"y":1972,"v":296.1},{"y":1976,"v":285.8},{"y":1980,"v":273.9},{"y":1984,"v":260.8},{"y":1988,"v":247.5},{"y":1992,"v":234.1},{"y":1996,"v":220.5},{"y":2000,"v":205.5},{"y":2004,"v":218.5},{"y":2008,"v":209.9},{"y":2012,"v":205.6},{"y":2016,"v":200.4},{"y":2020,"v":196.0},{"y":2024,"v":190.3}]}];

const tip = document.getElementById("tip");
function showTip(text, e) { tip.textContent = text; tip.style.opacity = "1"; tip.style.left = (e.clientX+14)+"px"; tip.style.top = (e.clientY-24)+"px"; }
function hideTip() { tip.style.opacity = "0"; }

const W = 800, H = 480;
const margin = { top: 36, right: 110, bottom: 36, left: 52 };
const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const yearMin = 1960, yearMax = 2024;
const valMin = 0, valMax = 500;
const chartW = W - margin.left - margin.right;
const chartH = H - margin.top - margin.bottom;
function xScale(yr) { return margin.left + (yr - yearMin) / (yearMax - yearMin) * chartW; }
function yScale(v) { return margin.top + (valMax - v) / (valMax - valMin) * chartH; }

// Grid lines
[100, 200, 300, 400].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3.5,
    "text-anchor": "end", "font-size": "9", fill: "#9A9890",
    "font-family": "'JetBrains Mono', monospace"
  })).textContent = v;
});

// Year axis
[1960, 1980, 2000, 2020].forEach(yr => {
  svg.appendChild(mkEl("text", {
    x: xScale(yr), y: H - margin.bottom + 14,
    "text-anchor": "middle", "font-size": "9", fill: "#9A9890",
    "font-family": "'JetBrains Mono', monospace"
  })).textContent = yr;
});

// Y-axis label
const yLabel = mkEl("text", {
  x: 12, y: H / 2,
  "text-anchor": "middle", "font-size": "9", fill: "#7A786F",
  "font-family": "'JetBrains Mono', monospace",
  transform: `rotate(-90, 12, ${H/2})`
});
yLabel.textContent = "Deaths per 1,000 adult women";
svg.appendChild(yLabel);

const palette = [
  "#3D7A5A","#5B9E78","#EA5E33","#F29A44","#C49A45",
  "#8BAD72","#A6C4A2","#C4715A","#B34B3B","#7A786F"
];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const allSeries = [];
data.forEach((series, si) => {
  const col = palette[si % palette.length];
  const pts = series.pts;
  const pathParts = pts.map((p, i) => `${i===0?"M":"L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");

  const g = mkEl("g", {});
  const line = mkEl("path", { d: pathParts, stroke: col, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  g.appendChild(line);

  // Invisible hit area
  const hit = mkEl("path", { d: pathParts, stroke: "transparent", "stroke-width": "10", fill: "none" });
  g.appendChild(hit);

  const lastPt = pts[pts.length - 1];
  allSeries.push({ g, line, col, n: series.n, lastPt, si });
  svg.appendChild(g);

  hit.addEventListener("mouseenter", e => {
    allSeries.forEach(s => s.si !== si && s.line.setAttribute("opacity", "0.1"));
    line.setAttribute("stroke-width", "2.5");
    showTip(`${series.n}: ${lastPt.v} per 1,000 (2024)`, e);
  });
  hit.addEventListener("mousemove", e => {
    const svgRect = svg.getBoundingClientRect();
    const mx = (e.clientX - svgRect.left) / svgRect.width * W;
    const ratio = (mx - margin.left) / chartW;
    const yearIdx = Math.round(ratio * (pts.length - 1));
    const idx = Math.max(0, Math.min(pts.length - 1, yearIdx));
    showTip(`${series.n} ${pts[idx].y}: ${pts[idx].v} per 1,000`, e);
  });
  hit.addEventListener("mouseleave", () => {
    allSeries.forEach(s => { s.line.setAttribute("opacity", "1"); s.line.setAttribute("stroke-width", "1.5"); });
    hideTip();
  });
});

// Endpoint labels with collision resolution
const labelItems = allSeries.map(s => ({
  n: s.n, v: s.lastPt.v, col: s.col,
  y: yScale(s.lastPt.v)
}));
const resolved = resolveCollisions(labelItems, 12);
resolved.forEach(item => {
  const actualY = yScale(item.v);
  const labelX = W - margin.right + 6;

  if (Math.abs(item.y - actualY) > 3) {
    svg.appendChild(mkEl("line", {
      x1: W - margin.right + 2, y1: actualY,
      x2: labelX - 1, y2: item.y,
      stroke: item.col, "stroke-width": "0.5", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text", {
    x: labelX, y: item.y + 3.5,
    "font-size": "9.5", fill: item.col, "font-weight": "500"
  });
  lbl.textContent = item.n;
  svg.appendChild(lbl);
});
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Terrestrial Protected Areas: 2013 vs. 2024</h1>
<p class="subtitle">Percentage of total land area under protected status. Countries like Bhutan, Croatia, and Japan have dramatically expanded nature reserves over the decade; others have reversed course.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — ER.LND.PTLD.ZS (WDPA / IUCN)</p>
<script>
const data = [{"n":"Bhutan","a":28.8,"b":51.6},{"n":"Cambodia","a":26.3,"b":39.8},{"n":"Armenia","a":23.3,"b":38.9},{"n":"Cyprus","a":20.6,"b":38.6},{"n":"Croatia","a":13.8,"b":38.4},{"n":"Bahamas","a":13.3,"b":34.6},{"n":"Comoros","a":10.2,"b":33.7},{"n":"Bolivia","a":21.4,"b":30.9},{"n":"Japan","a":16.4,"b":29.5},{"n":"Israel","a":19.9,"b":27.6},{"n":"Albania","a":10.1,"b":23.6},{"n":"Georgia","a":7.8,"b":22.8},{"n":"Azerbaijan","a":11.8,"b":22.1},{"n":"Equatorial Guinea","a":23.3,"b":19},{"n":"Cabo Verde","a":2.5,"b":17.6},{"n":"Colombia","a":23.1,"b":17},{"n":"Belgium","a":22.9,"b":16.3},{"n":"Bahrain","a":17.8,"b":11.7},{"n":"Haiti","a":0.3,"b":8.6},{"n":"Eritrea","a":4.9,"b":0}];

const W = 700, H = 580;
const pad = { left: 130, right: 140, top: 50, bottom: 30 };
const innerH = H - pad.top - pad.bottom;
const innerW = W - pad.left - pad.right;

const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.setAttribute("width","100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

const allVals = data.flatMap(d=>[d.a,d.b]);
const minV = 0, maxV = 55;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * innerH;

const xLeft = pad.left;
const xRight = W - pad.right;

function colorFor(d) {
  const chg = d.b - d.a;
  if (chg > 18) return "#EA5E33";
  if (chg > 10) return "#F29A44";
  if (chg > 2)  return "#C49A45";
  if (chg > -2) return "#A6C4A2";
  return "#5B9E78"; // decliners in green (still might be ok) or use cool blue
}
function colorDecline(d) {
  const chg = d.b - d.a;
  if (chg < -8)  return "#B34B3B";
  if (chg < -3)  return "#C4715A";
  if (chg < 0)   return "#C49A45";
  if (chg < 5)   return "#A6C4A2";
  if (chg < 12)  return "#C49A45";
  if (chg < 18)  return "#F29A44";
  return "#EA5E33";
}

// Column headers
function txt(x,y,content,anchor,size,weight,color) {
  const t = mkEl("text",{x,y,"text-anchor":anchor,"font-size":size,"font-weight":weight||400,fill:color||"#7A786F","font-family":"JetBrains Mono,monospace"});
  t.textContent = content;
  svg.appendChild(t);
}
txt(xLeft, pad.top-14,"2013","middle","10","500","#9A9890");
txt(xRight, pad.top-14,"2024","middle","10","500","#9A9890");

// Grid lines
[0,10,20,30,40,50].forEach(v=>{
  const y = scale(v);
  svg.appendChild(mkEl("line",{x1:xLeft,y1:y,x2:xRight,y2:y,stroke:"#E2E0D5","stroke-width":"0.4","stroke-dasharray":"3,3"}));
});

// Build label sets for collision resolution
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a,b)=>a.y-b.y);
  for (let pass=0; pass<30; pass++) {
    let moved=false;
    for (let i=1;i<sorted.length;i++) {
      const gap=sorted[i].y-sorted[i-1].y;
      if (gap<minGap) {
        const shift=(minGap-gap)/2;
        sorted[i-1].y-=shift;
        sorted[i].y+=shift;
        moved=true;
      }
    }
    if(!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
function showTip(t,e){tip.textContent=t;tip.style.opacity="1";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-20)+"px";}
function hideTip(){tip.style.opacity="0";}

// Left labels: use before values
const leftLabels = data.map(d=>({y:scale(d.a), orig:scale(d.a), name:d.n, va:d.a, vb:d.b}));
const rightLabels = data.map(d=>({y:scale(d.b), orig:scale(d.b), name:d.n, va:d.a, vb:d.b}));

const resolvedLeft = resolveCollisions(leftLabels, 13);
const resolvedRight = resolveCollisions(rightLabels, 13);

const leftMap = {};
resolvedLeft.forEach(l=>leftMap[l.name]=l.y);
const rightMap = {};
resolvedRight.forEach(l=>rightMap[l.name]=l.y);

// Draw lines and hit areas
data.forEach(d=>{
  const ya = scale(d.a), yb = scale(d.b);
  const col = colorDecline(d);
  const chg = d.b - d.a;

  const g = mkEl("g",{cursor:"crosshair"});

  const line = mkEl("line",{x1:xLeft,y1:ya,x2:xRight,y2:yb,stroke:col,"stroke-width":"1.5","stroke-opacity":"0.8"});
  const dotA = mkEl("circle",{cx:xLeft,cy:ya,r:"3",fill:col});
  const dotB = mkEl("circle",{cx:xRight,cy:yb,r:"3",fill:col});
  const hit = mkEl("line",{x1:xLeft,y1:ya,x2:xRight,y2:yb,stroke:"transparent","stroke-width":"12"});

  hit.addEventListener("mouseover",e=>{
    showTip(`${d.n}: ${d.a}% → ${d.b}% (${chg>=0?"+":""}${chg.toFixed(1)}pp)`,e);
    svg.querySelectorAll("line[data-row]").forEach(el=>el.setAttribute("stroke-opacity","0.08"));
    svg.querySelectorAll("circle[data-row]").forEach(el=>el.setAttribute("opacity","0.08"));
    line.setAttribute("stroke-opacity","1");
    line.setAttribute("stroke-width","2.5");
    dotA.setAttribute("opacity","1");
    dotB.setAttribute("opacity","1");
  });
  hit.addEventListener("mousemove",e=>{tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-20)+"px";});
  hit.addEventListener("mouseout",()=>{
    hideTip();
    svg.querySelectorAll("line[data-row]").forEach(el=>el.setAttribute("stroke-opacity","0.8"));
    svg.querySelectorAll("circle[data-row]").forEach(el=>el.setAttribute("opacity","1"));
    line.setAttribute("stroke-width","1.5");
  });

  line.setAttribute("data-row","1");
  dotA.setAttribute("data-row","1");
  dotB.setAttribute("data-row","1");

  // Leader lines for labels if displaced
  const lyA = leftMap[d.n], lyB = rightMap[d.n];
  if (Math.abs(lyA - ya) > 2) {
    g.appendChild(mkEl("line",{x1:xLeft-3,y1:ya,x2:xLeft-18,y2:lyA,stroke:col,"stroke-width":"0.5","stroke-opacity":"0.4"}));
  }
  if (Math.abs(lyB - yb) > 2) {
    g.appendChild(mkEl("line",{x1:xRight+3,y1:yb,x2:xRight+18,y2:lyB,stroke:col,"stroke-width":"0.5","stroke-opacity":"0.4"}));
  }

  g.appendChild(line);
  g.appendChild(dotA);
  g.appendChild(dotB);
  g.appendChild(hit);
  svg.appendChild(g);
});

// Left labels
resolvedLeft.forEach(l=>{
  const t = mkEl("text",{x:xLeft-6,y:l.y+3.5,"text-anchor":"end","font-size":"9","font-family":"Inter,sans-serif",fill:"#4A4845"});
  t.textContent = `${l.name}  ${l.va}%`;
  svg.appendChild(t);
});

// Right labels
resolvedRight.forEach(l=>{
  const t = mkEl("text",{x:xRight+6,y:l.y+3.5,"text-anchor":"start","font-size":"9","font-family":"Inter,sans-serif",fill:"#4A4845"});
  t.textContent = `${l.vb}%  ${l.name}`;
  svg.appendChild(t);
});

// Y-axis ticks
[0,10,20,30,40,50].forEach(v=>{
  const y = scale(v);
  const t = mkEl("text",{x:xLeft-1,y:y+3,"text-anchor":"end","font-size":"7.5","font-family":"JetBrains Mono,monospace",fill:"#C2C0B5"});
  t.textContent = v+"%";
  svg.appendChild(t);
});
</script>
</body></html>

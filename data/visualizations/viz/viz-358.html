<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>The Aging World: Old-Age Dependency Ratio, 1960–2024</h1>
<p class="subtitle">Number of people aged 65+ per 100 working-age adults (ages 15–64). Japan's ratio has nearly sextupled since 1960; India and Indonesia remain young.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Age dependency ratio, old (% of working-age population)</p>
<script>
const data = [{"n":"Japan","s":[8.9,9.2,10.1,11.6,13.4,15.2,17.4,21.0,25.6,30.7,36.4,44.7,49.1],"y0":1960,"step":5},{"n":"Germany","s":[17.1,19.3,21.6,23.3,23.7,20.9,21.5,22.5,24.2,28.3,31.3,32.0,33.9],"y0":1960,"step":5},{"n":"Italy","s":[14.5,15.5,17.2,19.1,20.5,19.5,21.8,24.9,27.0,29.6,31.2,34.3,36.6],"y0":1960,"step":5},{"n":"France","s":[18.6,19.4,20.6,21.5,21.9,19.6,21.2,23.1,24.6,25.3,25.9,30.0,33.6],"y0":1960,"step":5},{"n":"South Korea","s":[5.6,6.1,6.2,6.2,6.2,6.5,7.1,8.1,9.9,12.5,15.1,17.7,22.0],"y0":1960,"step":5},{"n":"China","s":[7.1,6.6,6.7,7.1,7.4,7.6,8.1,9.1,10.3,11.0,11.9,14.0,18.2],"y0":1960,"step":5},{"n":"Brazil","s":[4.7,5.1,5.4,5.8,6.1,6.3,6.8,7.4,7.9,8.6,9.7,11.4,13.8],"y0":1960,"step":5},{"n":"India","s":[5.9,6.5,6.7,6.9,7.0,7.0,7.0,7.2,7.3,7.6,7.8,8.3,9.5],"y0":1960,"step":5},{"n":"Indonesia","s":[4.2,5.0,5.7,6.3,6.6,6.6,6.7,7.2,7.8,8.5,8.9,9.1,9.8],"y0":1960,"step":5}];

const COLORS = {
  "Japan": "#EA5E33",
  "Germany": "#F29A44",
  "Italy": "#C49A45",
  "France": "#8BAD72",
  "South Korea": "#5B9E78",
  "China": "#3D7A5A",
  "Brazil": "#7A786F",
  "India": "#A6C4A2",
  "Indonesia": "#C2C0B5"
};

const W = 800, H = 460;
const margin = { top: 30, right: 130, bottom: 40, left: 50 };

data.forEach(d => {
  d.points = d.s.map((v, i) => ({ year: d.y0 + i * d.step, value: v }));
});

const yearMin = 1960, yearMax = 2025;
const valMin = 0;
const valMax = 55;

const xScale = year => margin.left + (year - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = val => margin.top + (valMax - val) / (valMax - valMin) * (H - margin.top - margin.bottom);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

// Grid lines and y-axis labels
[0, 10, 20, 30, 40, 50].forEach(v => {
  svg.appendChild(mkEl("line", {x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"}));
  const t = mkEl("text", {x: margin.left - 6, y: yScale(v) + 3.5, "text-anchor": "end",
    fill: "#7A786F", "font-family": "'JetBrains Mono', monospace", "font-size": "9"});
  t.textContent = v;
  svg.appendChild(t);
});

// X-axis labels
[1960, 1970, 1980, 1990, 2000, 2010, 2020].forEach(yr => {
  const t = mkEl("text", {x: xScale(yr), y: H - 8, "text-anchor": "middle",
    fill: "#7A786F", "font-family": "'JetBrains Mono', monospace", "font-size": "9"});
  t.textContent = yr;
  svg.appendChild(t);
});

// Y-axis title
const yTitle = mkEl("text", {x: 10, y: margin.top + (H - margin.top - margin.bottom) / 2,
  "text-anchor": "middle", transform: `rotate(-90, 10, ${margin.top + (H - margin.top - margin.bottom) / 2})`,
  fill: "#7A786F", "font-size": "9"});
yTitle.textContent = "Elderly dependents per 100 working-age adults";
svg.appendChild(yTitle);

// Endpoint label positions
const endPoints = data.map(d => ({
  d,
  y: yScale(d.points[d.points.length - 1].value)
}));
resolveCollisions(endPoints, 12);
const endMap = new Map(endPoints.map(it => [it.d.n, it.y]));

const tip = document.getElementById("tip");
const groups = [];

data.forEach(d => {
  const color = COLORS[d.n] || "#888";
  const pts = d.points;
  const g = mkEl("g", {});
  svg.appendChild(g);
  groups.push({ g, d });

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.year)} ${yScale(p.value)}`).join(" ");

  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  g.appendChild(line);

  // Endpoint dot
  const lastPt = pts[pts.length - 1];
  g.appendChild(mkEl("circle", { cx: xScale(lastPt.year), cy: yScale(lastPt.value), r: "3", fill: color }));

  // Leader line if label displaced
  const labelY = endMap.get(d.n);
  const actualY = yScale(lastPt.value);
  if (Math.abs(labelY - actualY) > 1) {
    g.appendChild(mkEl("line", {x1: xScale(lastPt.year) + 4, y1: actualY,
      x2: xScale(lastPt.year) + 4, y2: labelY,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"}));
  }

  // Label
  const t = mkEl("text", { x: xScale(lastPt.year) + 8, y: labelY + 3.5,
    fill: color, "font-size": "9", "font-weight": "600" });
  t.textContent = `${lastPt.value.toFixed(1)}  ${d.n}`;
  g.appendChild(t);

  // Invisible wide hit path
  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(hit);

  hit.addEventListener("mouseenter", e => {
    groups.forEach(({ g: g2 }) => g2.style.opacity = "0.1");
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "3");
  });
  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const yearIdx = Math.round(ratio * (pts.length - 1));
    const pt = pts[yearIdx];
    tip.textContent = `${d.n} (${pt.year}): ${pt.value.toFixed(1)}`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(({ g: g2 }) => g2.style.opacity = "1");
    line.setAttribute("stroke-width", "1.5");
    tip.style.opacity = "0";
  });
});
</script>
</body></html>

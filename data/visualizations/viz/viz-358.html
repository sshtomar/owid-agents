<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Scientific and Technical Journal Articles, 1996–2023</h1>
<p class="subtitle">Annual count (thousands) of scientific publications by country. China has grown from 34K to 933K articles — a 28-fold increase in under three decades.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — IP.JRN.ARTC.SC</p>
<script>
const data = [{"n":"China","s":[33.6,37.4,43.8,45.2,53.3,70.7,74.9,87.6,120.9,165.3,192.0,213.0,247.0,284.5,307.8,321.0,326.4,351.5,379.5,401.1,430.3,464.2,513.6,608.6,671.7,756.2,886.0,932.7],"y0":1996,"step":1},{"n":"India","s":[18.9,19.3,19.7,20.8,21.4,22.5,23.7,26.1,28.0,32.1,37.0,41.3,46.5,51.9,58.3,69.1,75.6,80.2,88.3,94.8,104.7,115.0,123.1,128.6,145.7,173.1,200.5,228.2],"y0":1996,"step":1},{"n":"Germany","s":[64.2,68.3,69.4,67.5,69.7,71.5,71.3,72.7,75.4,83.7,85.6,88.4,91.1,94.2,96.1,99.2,103.8,104.4,105.5,106.8,108.9,109.8,109.1,110.4,109.2,117.1,112.3,108.8],"y0":1996,"step":1},{"n":"Japan","s":[88.8,91.9,92.2,94.2,96.6,96.1,98.7,101.1,103.6,111.9,112.7,108.6,106.6,107.5,107.2,109.0,107.5,107.0,103.4,100.6,101.2,101.9,102.0,100.2,100.4,106.3,102.4,96.5],"y0":1996,"step":1},{"n":"Italy","s":[34.2,35.2,34.1,34.3,36.2,37.4,39.0,42.3,44.3,47.8,50.5,53.8,55.7,57.8,57.8,59.7,63.1,66.2,67.4,69.4,69.3,70.1,71.0,73.9,80.1,85.7,83.2,82.8],"y0":1996,"step":1},{"n":"South Korea","s":[8.9,11.2,12.2,14.7,15.9,18.4,20.2,23.8,27.6,32.0,37.1,41.1,43.7,45.7,50.1,53.3,55.7,56.8,59.4,61.9,61.9,63.0,64.8,67.7,69.1,72.4,72.0,71.7],"y0":1996,"step":1},{"n":"Canada","s":[34.8,34.3,33.1,32.5,34.3,33.7,36.4,38.4,42.3,47.4,50.0,51.4,53.1,55.2,56.0,57.0,59.0,59.4,60.0,60.6,60.5,61.1,62.5,63.3,64.5,68.6,66.8,63.7],"y0":1996,"step":1},{"n":"France","s":[46.6,49.4,49.7,49.2,50.0,50.8,50.7,52.1,53.6,57.9,60.7,61.5,64.1,66.3,66.8,68.8,70.4,71.5,71.2,70.9,70.2,69.1,67.1,66.2,65.6,67.7,65.2,62.2],"y0":1996,"step":1},{"n":"Brazil","s":[7.6,9.3,10.5,11.4,12.8,13.9,15.8,17.3,19.4,21.8,26.8,28.7,32.7,35.4,38.2,40.3,44.3,46.0,48.2,49.3,51.7,55.0,58.9,62.6,66.9,69.6,62.7,58.3],"y0":1996,"step":1},{"n":"Iran","s":[0.6,0.9,1.0,1.2,1.6,1.9,2.8,3.9,5.1,7.0,9.8,12.7,16.5,20.0,24.3,30.2,30.3,31.0,33.8,35.5,40.1,44.6,46.6,53.4,56.6,58.0,58.3,55.1],"y0":1996,"step":1}];

const W = 760, H = 460;
const margin = { top: 40, right: 130, bottom: 36, left: 58 };

// China gets accent; India gets accent-mid; rest get graded muted colors
const colors = ["#EA5E33","#F29A44","#8BAD72","#5B9E78","#A6C4A2","#C49A45","#C4715A","#B34B3B","#7A786F","#9A9890"];

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const tip = document.getElementById("tip");

const valMin = 0, valMax = 960;
const yearMin = 1996, yearMax = 2023;
const xS = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yS = v => margin.top + (valMax - Math.min(valMax, Math.max(0, v))) / valMax * (H - margin.top - margin.bottom);

// Grid lines
[0, 200, 400, 600, 800].forEach(v => {
  svg.appendChild(mkEl("line", { x1: margin.left, y1: yS(v), x2: W - margin.right, y2: yS(v), stroke: "#E2E0D5", "stroke-width": "0.5" }));
  svg.appendChild(mkEl("text", { x: margin.left - 6, y: yS(v) + 3.5, "text-anchor": "end", "font-size": "9", "font-family": "'JetBrains Mono', monospace", fill: "#7A786F" })).textContent = v + "K";
});

[2000, 2005, 2010, 2015, 2020].forEach(y => {
  svg.appendChild(mkEl("text", { x: xS(y), y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "9", "font-family": "'JetBrains Mono', monospace", fill: "#7A786F" })).textContent = y;
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const groups = [];

data.forEach((series, si) => {
  const color = colors[si];
  const pts = series.s.map((v, i) => ({ year: series.y0 + i, value: v }));
  const g = mkEl("g", {});

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xS(p.year)} ${yS(p.value)}`).join(" ");
  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": si === 0 ? "2.5" : "1.5", fill: "none", "stroke-linejoin": "round" });
  g.appendChild(line);

  const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
  g.appendChild(hit);

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const idx = Math.round(ratio * (pts.length - 1));
    const pt = pts[idx];
    if (!pt) return;
    tip.textContent = `${series.n} · ${pt.year}: ${pt.value.toFixed(1)}K articles`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 24) + "px";
    groups.forEach((gg, gi) => { gg.g.style.opacity = gi === si ? "1" : "0.1"; });
    line.setAttribute("stroke-width", "3");
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach((gg, gi) => { gg.g.style.opacity = "1"; gg.line.setAttribute("stroke-width", gi === 0 ? "2.5" : "1.5"); });
  });

  const endPt = pts[pts.length - 1];
  groups.push({ g, line, endY: yS(endPt.value), name: series.n, val: endPt.value });
  svg.appendChild(g);
});

const labelItems = groups.map(gg => ({ ...gg, y: gg.endY }));
resolveCollisions(labelItems, 11);

const rightX = W - margin.right + 8;
labelItems.forEach((item, i) => {
  const origY = item.endY;
  const clampedY = Math.max(margin.top + 5, Math.min(H - margin.bottom - 5, item.y));
  if (Math.abs(clampedY - origY) > 2) {
    item.g.appendChild(mkEl("line", { x1: W - margin.right, y1: origY, x2: rightX + 2, y2: clampedY, stroke: "#C2C0B5", "stroke-width": "0.7" }));
  }
  const t = mkEl("text", { x: rightX, y: clampedY + 3.5, "font-size": "9", "font-family": "'Inter', sans-serif", "font-weight": "500", fill: "#2B2A27" });
  t.textContent = `${item.val.toFixed(0)}K  ${item.name}`;
  item.g.appendChild(t);
});
</script>
</body></html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Inter", sans-serif; margin: 0; padding: 24px; background: #fafaf8; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; background: #1e293b; color: #f1f5f9;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: "JetBrains Mono", monospace;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 100;
    }
  </style>
</head>
<body>
  <h1>Manufacturing Value Added (% of GDP), 2000–2024</h1>
  <p class="subtitle">Rich nations deindustrialize while parts of developing Asia hold steady or rise. Hover a line to isolate it.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — NV.IND.MANF.ZS (National Accounts)</p>
  <div id="tip"></div>
  <script>
    const data = [
      {"n":"South Korea","pts":[{"y":2000,"v":26.6},{"y":2001,"v":25.1},{"y":2002,"v":24.8},{"y":2003,"v":24.4},{"y":2004,"v":26.4},{"y":2005,"v":26.1},{"y":2006,"v":25.7},{"y":2007,"v":25.9},{"y":2008,"v":26.1},{"y":2009,"v":26.3},{"y":2010,"v":28.1},{"y":2011,"v":29.0},{"y":2012,"v":28.7},{"y":2013,"v":28.9},{"y":2014,"v":28.3},{"y":2015,"v":27.8},{"y":2016,"v":27.5},{"y":2017,"v":28.0},{"y":2018,"v":27.8},{"y":2019,"v":26.4},{"y":2020,"v":25.7},{"y":2021,"v":26.2},{"y":2022,"v":26.5},{"y":2023,"v":25.5},{"y":2024,"v":26.6}]},
      {"n":"China","pts":[{"y":2004,"v":31.5},{"y":2005,"v":31.7},{"y":2006,"v":32.0},{"y":2007,"v":31.9},{"y":2008,"v":31.6},{"y":2009,"v":31.1},{"y":2010,"v":31.1},{"y":2011,"v":31.6},{"y":2012,"v":31.0},{"y":2013,"v":30.1},{"y":2014,"v":29.8},{"y":2015,"v":28.4},{"y":2016,"v":27.5},{"y":2017,"v":27.6},{"y":2018,"v":27.3},{"y":2019,"v":26.3},{"y":2020,"v":25.6},{"y":2021,"v":26.6},{"y":2022,"v":26.0},{"y":2023,"v":25.0},{"y":2024,"v":24.8}]},
      {"n":"Germany","pts":[{"y":2000,"v":20.3},{"y":2001,"v":20.1},{"y":2002,"v":19.5},{"y":2003,"v":19.6},{"y":2004,"v":19.8},{"y":2005,"v":19.8},{"y":2006,"v":20.3},{"y":2007,"v":20.5},{"y":2008,"v":19.8},{"y":2009,"v":17.3},{"y":2010,"v":19.4},{"y":2011,"v":20.1},{"y":2012,"v":20.0},{"y":2013,"v":19.8},{"y":2014,"v":20.1},{"y":2015,"v":20.1},{"y":2016,"v":20.4},{"y":2017,"v":20.1},{"y":2018,"v":19.8},{"y":2019,"v":19.3},{"y":2020,"v":18.5},{"y":2021,"v":18.6},{"y":2022,"v":18.3},{"y":2023,"v":18.9},{"y":2024,"v":18.0}]},
      {"n":"Japan","pts":[{"y":2000,"v":22.2},{"y":2001,"v":21.1},{"y":2002,"v":20.6},{"y":2003,"v":20.7},{"y":2004,"v":21.0},{"y":2005,"v":21.1},{"y":2006,"v":21.1},{"y":2007,"v":21.7},{"y":2008,"v":21.3},{"y":2009,"v":19.1},{"y":2010,"v":20.9},{"y":2011,"v":19.7},{"y":2012,"v":19.7},{"y":2013,"v":19.2},{"y":2014,"v":19.4},{"y":2015,"v":20.1},{"y":2016,"v":20.0},{"y":2017,"v":20.1},{"y":2018,"v":20.3},{"y":2019,"v":20.1},{"y":2020,"v":19.8},{"y":2021,"v":19.7},{"y":2022,"v":18.8},{"y":2023,"v":19.5},{"y":2024,"v":18.8}]},
      {"n":"Indonesia","pts":[{"y":2000,"v":22.7},{"y":2001,"v":30.8},{"y":2002,"v":32.0},{"y":2003,"v":28.3},{"y":2004,"v":28.1},{"y":2005,"v":27.4},{"y":2006,"v":27.5},{"y":2007,"v":27.0},{"y":2008,"v":27.8},{"y":2009,"v":26.4},{"y":2010,"v":22.0},{"y":2011,"v":21.8},{"y":2012,"v":21.5},{"y":2013,"v":21.0},{"y":2014,"v":21.1},{"y":2015,"v":21.0},{"y":2016,"v":20.5},{"y":2017,"v":20.2},{"y":2018,"v":19.9},{"y":2019,"v":19.7},{"y":2020,"v":19.9},{"y":2021,"v":19.2},{"y":2022,"v":18.3},{"y":2023,"v":18.7},{"y":2024,"v":19.0}]},
      {"n":"Bangladesh","pts":[{"y":2000,"v":14.0},{"y":2001,"v":14.2},{"y":2002,"v":14.3},{"y":2003,"v":14.1},{"y":2004,"v":14.4},{"y":2005,"v":14.7},{"y":2006,"v":15.3},{"y":2007,"v":15.9},{"y":2008,"v":16.1},{"y":2009,"v":16.5},{"y":2010,"v":16.1},{"y":2011,"v":16.0},{"y":2012,"v":15.9},{"y":2013,"v":16.4},{"y":2014,"v":16.6},{"y":2015,"v":16.8},{"y":2016,"v":20.3},{"y":2017,"v":20.1},{"y":2018,"v":20.8},{"y":2019,"v":21.2},{"y":2020,"v":20.6},{"y":2021,"v":21.2},{"y":2022,"v":21.8},{"y":2023,"v":22.3},{"y":2024,"v":21.9}]},
      {"n":"India","pts":[{"y":2000,"v":15.9},{"y":2001,"v":15.3},{"y":2002,"v":15.6},{"y":2003,"v":15.6},{"y":2004,"v":15.8},{"y":2005,"v":16.0},{"y":2006,"v":17.3},{"y":2007,"v":16.9},{"y":2008,"v":17.1},{"y":2009,"v":17.1},{"y":2010,"v":17.0},{"y":2011,"v":16.1},{"y":2012,"v":15.8},{"y":2013,"v":15.3},{"y":2014,"v":15.1},{"y":2015,"v":15.6},{"y":2016,"v":15.2},{"y":2017,"v":15.0},{"y":2018,"v":14.9},{"y":2019,"v":13.5},{"y":2020,"v":14.1},{"y":2021,"v":14.4},{"y":2022,"v":13.3},{"y":2023,"v":13.3},{"y":2024,"v":13.1}]},
      {"n":"France","pts":[{"y":2000,"v":14.4},{"y":2001,"v":13.9},{"y":2002,"v":13.5},{"y":2003,"v":13.0},{"y":2004,"v":12.6},{"y":2005,"v":12.1},{"y":2006,"v":11.6},{"y":2007,"v":11.6},{"y":2008,"v":11.1},{"y":2009,"v":10.5},{"y":2010,"v":10.3},{"y":2011,"v":10.3},{"y":2012,"v":10.2},{"y":2013,"v":10.3},{"y":2014,"v":10.2},{"y":2015,"v":10.3},{"y":2016,"v":10.2},{"y":2017,"v":10.0},{"y":2018,"v":9.9},{"y":2019,"v":9.9},{"y":2020,"v":9.2},{"y":2021,"v":9.1},{"y":2022,"v":9.3},{"y":2023,"v":9.8},{"y":2024,"v":9.6}]},
      {"n":"Australia","pts":[{"y":2000,"v":11.4},{"y":2001,"v":10.8},{"y":2002,"v":10.4},{"y":2003,"v":10.7},{"y":2004,"v":10.8},{"y":2005,"v":10.2},{"y":2006,"v":9.7},{"y":2007,"v":9.1},{"y":2008,"v":9.0},{"y":2009,"v":8.3},{"y":2010,"v":7.9},{"y":2011,"v":7.3},{"y":2012,"v":6.9},{"y":2013,"v":6.5},{"y":2014,"v":6.2},{"y":2015,"v":6.2},{"y":2016,"v":5.9},{"y":2017,"v":5.6},{"y":2018,"v":5.6},{"y":2019,"v":5.5},{"y":2020,"v":5.5},{"y":2021,"v":5.4},{"y":2022,"v":5.3},{"y":2023,"v":5.3},{"y":2024,"v":5.4}]}
    ];

    const COLORS = {
      "South Korea": "#EA5E33",
      "China": "#F29A44",
      "Germany": "#3D7A5A",
      "Japan": "#5B9E78",
      "Indonesia": "#8BAD72",
      "Bangladesh": "#4A90D9",
      "India": "#7B61C4",
      "France": "#C4715A",
      "Australia": "#B0926A",
    };

    const W = 820, H = 480;
    const margin = { top: 36, right: 130, bottom: 36, left: 48 };

    const allYears = data.flatMap(d => d.pts.map(p => p.y));
    const allVals = data.flatMap(d => d.pts.map(p => p.v));
    const yearMin = Math.min(...allYears), yearMax = Math.max(...allYears);
    const valMin = 0, valMax = 36;

    const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    function mkEl(tag, attrs, text) {
      const ns = "http://www.w3.org/2000/svg";
      const el = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i-1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i-1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      const topB = margin.top, botB = H - margin.bottom;
      sorted.forEach(item => { item.y = Math.max(topB, Math.min(botB, item.y)); });
      return sorted;
    }

    const svg = mkEl("svg", { width: "100%", viewBox: `0 0 ${W} ${H}`, style: "display:block;max-width:820px" });
    const tip = document.getElementById("tip");

    // Grid lines
    [0, 10, 20, 30].forEach(v => {
      svg.appendChild(mkEl("line", { x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v), stroke: "#EEF0F2", "stroke-width": "0.7" }));
      svg.appendChild(mkEl("text", {
        x: margin.left - 6, y: yScale(v) + 4,
        "text-anchor": "end", "font-size": "9", fill: "#94A3B8", "font-family": "JetBrains Mono, monospace"
      }, v + "%"));
    });

    // X axis ticks
    [2000, 2005, 2010, 2015, 2020, 2024].forEach(y => {
      svg.appendChild(mkEl("text", {
        x: xScale(y), y: H - margin.bottom + 14,
        "text-anchor": "middle", "font-size": "9", fill: "#94A3B8", "font-family": "JetBrains Mono, monospace"
      }, y));
    });

    // Title annotation
    svg.appendChild(mkEl("text", {
      x: margin.left + 8, y: margin.top - 10,
      "font-size": "10", fill: "#94A3B8", "font-family": "Inter, sans-serif"
    }, "% of GDP"));

    // Endpoint label positions
    const endLabels = data.map(d => {
      const last = d.pts[d.pts.length - 1];
      return { n: d.n, val: last.v, y: yScale(last.v) };
    });
    const resolved = resolveCollisions(endLabels.map(e => ({ ...e })), 12);
    const resolvedMap = {};
    resolved.forEach(r => { resolvedMap[r.n] = r.y; });

    // Draw lines
    data.forEach((d, i) => {
      const color = COLORS[d.n] || "#999";
      const pts = d.pts;

      const pathD = pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");

      const line = mkEl("path", {
        d: pathD, stroke: color, "stroke-width": "1.7", fill: "none",
        "stroke-linejoin": "round", "stroke-linecap": "round", class: "vis-line"
      });

      const hit = mkEl("path", {
        d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer"
      });

      hit.addEventListener("mouseover", e => {
        svg.querySelectorAll(".vis-line").forEach((el, j) => {
          el.style.opacity = j === i ? "1" : "0.08";
          el.style.strokeWidth = j === i ? "2.5" : "1.7";
        });
        const mx = e.clientX - svg.getBoundingClientRect().left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const idxRaw = ratio * (pts.length - 1);
        const idx = Math.round(idxRaw);
        const p = pts[Math.max(0, Math.min(pts.length - 1, idx))];
        tip.textContent = `${d.n} ${p.y}: ${p.v}% of GDP`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      hit.addEventListener("mousemove", e => {
        const mx = e.clientX - svg.getBoundingClientRect().left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const idx = Math.round(ratio * (pts.length - 1));
        const p = pts[Math.max(0, Math.min(pts.length - 1, idx))];
        tip.textContent = `${d.n} ${p.y}: ${p.v}% of GDP`;
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      hit.addEventListener("mouseout", () => {
        svg.querySelectorAll(".vis-line").forEach(el => {
          el.style.opacity = "1"; el.style.strokeWidth = "1.7";
        });
        tip.style.opacity = "0";
      });

      svg.appendChild(line);
      svg.appendChild(hit);

      // Endpoint label
      const last = pts[pts.length - 1];
      const labelY = resolvedMap[d.n] || yScale(last.v);
      const origY = yScale(last.v);
      if (Math.abs(labelY - origY) > 3) {
        svg.appendChild(mkEl("line", {
          x1: xScale(last.y) + 4, y1: origY,
          x2: xScale(last.y) + 10, y2: labelY,
          stroke: color, "stroke-width": "0.7", opacity: "0.5"
        }));
      }
      svg.appendChild(mkEl("text", {
        x: xScale(last.y) + 12, y: labelY + 4,
        "text-anchor": "start", "font-size": "10", fill: color, "font-family": "JetBrains Mono, monospace"
      }, `${last.v}%  ${d.n}`));
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

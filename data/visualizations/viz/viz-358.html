<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: "Inter", -apple-system, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; max-width: 860px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; background: #1e293b; color: #f8fafc;
      padding: 6px 10px; border-radius: 4px; font-size: 12px;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap; z-index: 999;
    }
  </style>
</head>
<body>
  <h1>The Diverging World: Old-Age Dependency, 1960–2024</h1>
  <p class="subtitle">Elderly dependants per 100 working-age people — aging rich nations vs. young populations in the Global South</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — Age Dependency Ratio, Old (SP.POP.DPND.OL)</p>
  <div id="tip"></div>
  <script>
    const series = [
      {"n":"Japan","pts":[{"y":1960,"v":8.9},{"y":1965,"v":9.2},{"y":1970,"v":10.1},{"y":1975,"v":11.6},{"y":1980,"v":13.4},{"y":1985,"v":15.2},{"y":1990,"v":17.4},{"y":1995,"v":21.0},{"y":2000,"v":25.6},{"y":2005,"v":30.7},{"y":2010,"v":36.4},{"y":2015,"v":44.7},{"y":2020,"v":49.1},{"y":2024,"v":50.7}]},
      {"n":"Italy","pts":[{"y":1960,"v":14.5},{"y":1965,"v":15.5},{"y":1970,"v":17.2},{"y":1975,"v":19.1},{"y":1980,"v":20.5},{"y":1985,"v":19.5},{"y":1990,"v":21.8},{"y":1995,"v":24.9},{"y":2000,"v":27.0},{"y":2005,"v":29.6},{"y":2010,"v":31.2},{"y":2015,"v":34.3},{"y":2020,"v":36.6},{"y":2024,"v":38.8}]},
      {"n":"Germany","pts":[{"y":1960,"v":17.1},{"y":1965,"v":19.3},{"y":1970,"v":21.6},{"y":1975,"v":23.3},{"y":1980,"v":23.7},{"y":1985,"v":20.9},{"y":1990,"v":21.5},{"y":1995,"v":22.5},{"y":2000,"v":24.2},{"y":2005,"v":28.3},{"y":2010,"v":31.3},{"y":2015,"v":32.0},{"y":2020,"v":33.9},{"y":2024,"v":36.9}]},
      {"n":"France","pts":[{"y":1960,"v":18.6},{"y":1965,"v":19.4},{"y":1970,"v":20.6},{"y":1975,"v":21.5},{"y":1980,"v":21.9},{"y":1985,"v":19.6},{"y":1990,"v":21.2},{"y":1995,"v":23.1},{"y":2000,"v":24.6},{"y":2005,"v":25.3},{"y":2010,"v":25.9},{"y":2015,"v":30.0},{"y":2020,"v":33.6},{"y":2024,"v":36.1}]},
      {"n":"South Korea","pts":[{"y":1960,"v":5.6},{"y":1965,"v":6.1},{"y":1970,"v":6.2},{"y":1975,"v":6.2},{"y":1980,"v":6.2},{"y":1985,"v":6.5},{"y":1990,"v":7.1},{"y":1995,"v":8.1},{"y":2000,"v":9.9},{"y":2005,"v":12.5},{"y":2010,"v":15.1},{"y":2015,"v":17.7},{"y":2020,"v":22.0},{"y":2024,"v":27.5}]},
      {"n":"China","pts":[{"y":1960,"v":7.1},{"y":1965,"v":6.6},{"y":1970,"v":6.7},{"y":1975,"v":7.1},{"y":1980,"v":7.4},{"y":1985,"v":7.6},{"y":1990,"v":8.1},{"y":1995,"v":9.1},{"y":2000,"v":10.3},{"y":2005,"v":11.0},{"y":2010,"v":11.9},{"y":2015,"v":14.0},{"y":2020,"v":18.2},{"y":2024,"v":21.2}]},
      {"n":"Brazil","pts":[{"y":1960,"v":4.7},{"y":1965,"v":5.1},{"y":1970,"v":5.4},{"y":1975,"v":5.8},{"y":1980,"v":6.1},{"y":1985,"v":6.3},{"y":1990,"v":6.8},{"y":1995,"v":7.4},{"y":2000,"v":7.9},{"y":2005,"v":8.6},{"y":2010,"v":9.7},{"y":2015,"v":11.4},{"y":2020,"v":13.8},{"y":2024,"v":15.9}]},
      {"n":"India","pts":[{"y":1960,"v":5.9},{"y":1965,"v":6.5},{"y":1970,"v":6.7},{"y":1975,"v":6.9},{"y":1980,"v":7.0},{"y":1985,"v":7.0},{"y":1990,"v":7.0},{"y":1995,"v":7.2},{"y":2000,"v":7.3},{"y":2005,"v":7.6},{"y":2010,"v":7.8},{"y":2015,"v":8.3},{"y":2020,"v":9.5},{"y":2024,"v":10.5}]},
      {"n":"Angola","pts":[{"y":1960,"v":5.7},{"y":1965,"v":5.8},{"y":1970,"v":5.6},{"y":1975,"v":5.0},{"y":1980,"v":4.4},{"y":1985,"v":4.2},{"y":1990,"v":4.3},{"y":1995,"v":4.8},{"y":2000,"v":5.2},{"y":2005,"v":5.3},{"y":2010,"v":5.2},{"y":2015,"v":5.2},{"y":2020,"v":5.2},{"y":2024,"v":5.4}]},
      {"n":"Ethiopia","pts":[{"y":1960,"v":5.1},{"y":1965,"v":5.0},{"y":1970,"v":5.3},{"y":1975,"v":5.4},{"y":1980,"v":5.5},{"y":1985,"v":5.3},{"y":1990,"v":5.4},{"y":1995,"v":5.3},{"y":2000,"v":5.3},{"y":2005,"v":5.3},{"y":2010,"v":5.3},{"y":2015,"v":5.4},{"y":2020,"v":5.4},{"y":2024,"v":5.6}]}
    ];

    const COLORS = ["#E05C2A","#F29A44","#C49A45","#8BAD72","#5B9E78","#3D7A5A","#5B8FBD","#8870B8","#B45FA0","#7A786F"];

    const W = 820, H = 460;
    const margin = { top: 30, right: 130, bottom: 40, left: 55 };

    const yearMin = 1960, yearMax = 2024;
    const valMin = 0, valMax = 55;

    const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    const ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs, text) {
      const e = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text !== undefined) e.textContent = text;
      return e;
    }

    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "overflow:visible" });
    document.getElementById("chart").appendChild(svg);

    // Grid lines & x-axis labels
    [1960, 1970, 1980, 1990, 2000, 2010, 2020, 2024].forEach(y => {
      const x = xScale(y);
      svg.appendChild(el("line", { x1: x, y1: margin.top, x2: x, y2: H - margin.bottom, stroke: "#F0EDE4", "stroke-width": "1" }));
      svg.appendChild(el("text", { x, y: H - margin.bottom + 14, "text-anchor": "middle", fill: "#7A786F", "font-family": "JetBrains Mono", "font-size": "9" }, String(y)));
    });

    // Y-axis
    [10, 20, 30, 40, 50].forEach(v => {
      const y = yScale(v);
      svg.appendChild(el("line", { x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#F0EDE4", "stroke-width": "1" }));
      svg.appendChild(el("text", { x: margin.left - 6, y: y + 4, "text-anchor": "end", fill: "#7A786F", "font-family": "JetBrains Mono", "font-size": "9" }, `${v}%`));
    });

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const lineEls = [];
    const hitEls = [];

    series.forEach((s, idx) => {
      const color = COLORS[idx];
      const pts = s.pts.filter(p => p.y >= yearMin && p.y <= yearMax);
      const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");

      const g = el("g");

      const line = el("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round" });
      g.appendChild(line);

      const hit = el("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });
      g.appendChild(hit);

      lineEls.push({ line, s, color });
      hitEls.push({ hit, idx });

      svg.appendChild(g);
    });

    // Endpoint labels on right
    const endPoints = series.map((s, idx) => {
      const last = s.pts[s.pts.length - 1];
      return { y: yScale(last.v), idx, label: `${last.v}%  ${s.n}`, color: COLORS[idx] };
    });

    const resolved = resolveCollisions(endPoints, 13);
    resolved.forEach(item => {
      const orig = endPoints.find(e => e.idx === item.idx);
      svg.appendChild(el("text", {
        x: W - margin.right + 8,
        y: item.y + 4,
        "text-anchor": "start",
        fill: item.color,
        "font-family": "JetBrains Mono",
        "font-size": "9",
        "font-weight": "500"
      }, item.label));
      if (Math.abs(item.y - orig.y) > 3) {
        svg.appendChild(el("line", { x1: W - margin.right + 5, y1: orig.y, x2: W - margin.right + 5, y2: item.y, stroke: "#D0CEC6", "stroke-width": "0.6" }));
      }
    });

    // Hover
    const tip = document.getElementById("tip");
    hitEls.forEach(({ hit, idx }) => {
      const s = series[idx];
      const color = COLORS[idx];
      hit.addEventListener("mousemove", e => {
        lineEls.forEach(o => o.line.setAttribute("opacity", o.s === s ? "1" : "0.1"));
        const rect = svg.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const ratio = (mx - margin.left) / (W - margin.left - margin.right);
        const ptIdx = Math.max(0, Math.min(s.pts.length - 1, Math.round(ratio * (s.pts.length - 1))));
        const p = s.pts[ptIdx];
        tip.textContent = `${s.n} (${p.y}): ${p.v}%`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        lineEls.forEach(o => o.line.setAttribute("opacity", "1"));
        tip.style.opacity = "0";
      });
    });
  </script>
</body>
</html>

// Collision resolution for endpoint labels
function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const labelItems = groups.map((g, i) => {
  const last = g.d.pts[g.d.pts.length - 1];
  const lbl = g.g.querySelector('text');
  return { y: yScale(last.v), lbl, g: g.g, origY: yScale(last.v), name: g.d.n };
});
const resolved = resolveCollisions(labelItems, 13);
resolved.forEach(item => {
  item.lbl.setAttribute('y', item.y + 3.5);
  // Leader line if moved more than 3px
  if (Math.abs(item.y - item.origY) > 3) {
    const last = item.g.querySelector('path');
    const lastPt = groups.find(g => g.g === item.g).d.pts.slice(-1)[0];
    const leader = mkEl('line', { x1: xScale(lastPt.y), y1: item.origY, x2: xScale(lastPt.y), y2: item.y, stroke: '#C2C0B5', 'stroke-width': '0.6' });
    item.g.appendChild(leader);
  }
});

// Hover interactivity
groups.forEach(({ g, line, color, d }) => {
  const hit = g.querySelectorAll('path')[1];
  hit.addEventListener('mouseenter', () => {
    groups.forEach(other => {
      if (other.g !== g) {
        other.line.setAttribute('opacity', '0.08');
        other.g.querySelectorAll('text').forEach(t => t.setAttribute('opacity', '0.15'));
      }
    });
    line.setAttribute('stroke-width', '2.5');
  });
  hit.addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const ratio = (mx - margin.left) / (W - margin.left - margin.right);
    const year = Math.round(yearMin + ratio * (yearMax - yearMin));
    const pt = d.pts.find(p => p.y === year) || d.pts.reduce((a, b) => Math.abs(b.y - year) < Math.abs(a.y - year) ? b : a);
    showTip(`${d.n} ${pt.y}: ${pt.v.toFixed(1)}%`, e);
  });
  hit.addEventListener('mouseleave', () => {
    groups.forEach(other => {
      other.line.setAttribute('opacity', '1');
      other.g.querySelectorAll('text').forEach(t => t.setAttribute('opacity', '1'));
    });
    line.setAttribute('stroke-width', '1.5');
    hideTip();
  });
});

// Annotation: capped values note
const note = mkEl('text', { x: xScale(1984), y: yScale(100) - 5, 'font-size': '8', fill: '#9A9890', 'font-family': 'JetBrains Mono' });
note.textContent = '▲ values above 100% are capped here';
svg.appendChild(note);
</script>
</body></html>

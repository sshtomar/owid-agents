<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Anemia Among Non-Pregnant Women, 2000 vs 2022</h1>
<p class="subtitle">Share of women ages 15–49 with anemia (%). Sub-Saharan Africa carries the heaviest burden; most countries improved, but Afghanistan and India worsened significantly.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Prevalence of Anemia Among Non-Pregnant Women (SH.ANM.NPRG.ZS)</p>
<script>
const data = [{"n":"Gabon","a":64.2,"b":60.1},{"n":"India","a":50.1,"b":53.4},{"n":"Cote d'Ivoire","a":54.8,"b":50.2},{"n":"Benin","a":58.5,"b":48.5},{"n":"Congo, Rep.","a":56.7,"b":46.8},{"n":"Afghanistan","a":30.3,"b":45.9},{"n":"Chad","a":56.3,"b":45.6},{"n":"Gambia, The","a":59.8,"b":45.6},{"n":"Burkina Faso","a":55.6,"b":43.2},{"n":"Congo, Dem. Rep.","a":54.6,"b":39.0},{"n":"Ghana","a":46.4,"b":35.3},{"n":"Germany","a":8.7,"b":13.2},{"n":"Finland","a":8.3,"b":12.9},{"n":"Costa Rica","a":14.9,"b":12.7},{"n":"France","a":7.5,"b":12.3},{"n":"Australia","a":7.9,"b":10.3},{"n":"Guatemala","a":21.1,"b":9.3}];

const W = 700, H = 560;
const pad = { left: 130, right: 140, top: 50, bottom: 20 };
const minV = 0, maxV = 70;

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

function scale(v) {
  return pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
}

function colorForChange(d) {
  const change = d.b - d.a;
  if (change > 10) return "#B34B3B";
  if (change > 3) return "#C4715A";
  if (change > -5) return "#C49A45";
  if (change > -15) return "#8BAD72";
  return "#3D7A5A";
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px;display:block;` });
document.getElementById("chart").appendChild(svg);

const xL = pad.left, xR = W - pad.right;

// column headers
svg.appendChild(mkEl("text", { x: xL, y: pad.top - 18, "text-anchor": "middle", fill: "#7A786F", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, "2000"));
svg.appendChild(mkEl("text", { x: xR, y: pad.top - 18, "text-anchor": "middle", fill: "#7A786F", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, "2022"));

// axis lines
svg.appendChild(mkEl("line", { x1: xL, y1: pad.top - 10, x2: xL, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.8" }));
svg.appendChild(mkEl("line", { x1: xR, y1: pad.top - 10, x2: xR, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.8" }));

// horizontal reference line at 20%
const refY = scale(20);
svg.appendChild(mkEl("line", { x1: xL, y1: refY, x2: xR, y2: refY, stroke: "#E2E0D5", "stroke-dasharray": "4,3", "stroke-width": "0.6" }));
svg.appendChild(mkEl("text", { x: xL + 4, y: refY - 3, fill: "#9A9890", "font-size": "8", "font-family": "JetBrains Mono, monospace" }, "20% threshold (WHO moderate concern)"));

// legend
const legendItems = [
  { color: "#B34B3B", label: "> 10pp worse" },
  { color: "#C4715A", label: "3–10pp worse" },
  { color: "#C49A45", label: "±3pp stable" },
  { color: "#8BAD72", label: "5–15pp better" },
  { color: "#3D7A5A", label: "> 15pp better" },
];
legendItems.forEach((li, i) => {
  const lx = xL + i * 120;
  svg.appendChild(mkEl("rect", { x: lx, y: 8, width: 8, height: 8, fill: li.color, rx: "1" }));
  svg.appendChild(mkEl("text", { x: lx + 11, y: 16, fill: "#7A786F", "font-size": "8.5", "font-family": "Inter, sans-serif" }, li.label));
});

const tip = document.getElementById("tip");
const groups = [];

// left label items (anchored to 'a' value)
const leftItems = data.map(d => ({ n: d.n, y: scale(d.a), origY: scale(d.a), color: colorForChange(d), d }));
const rightItems = data.map(d => ({ n: d.n, y: scale(d.b), origY: scale(d.b), color: colorForChange(d), d }));

const resolvedL = resolveCollisions(leftItems.map(x => ({ ...x })), 13);
const resolvedR = resolveCollisions(rightItems.map(x => ({ ...x })), 13);

// draw connecting lines first (behind labels)
data.forEach(d => {
  const color = colorForChange(d);
  const yA = scale(d.a), yB = scale(d.b);

  const g = mkEl("g");
  svg.appendChild(g);

  const line = mkEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: color, "stroke-width": "1.4", opacity: "0.85" });
  g.appendChild(line);

  // endpoint dots
  g.appendChild(mkEl("circle", { cx: xL, cy: yA, r: "3", fill: color }));
  g.appendChild(mkEl("circle", { cx: xR, cy: yB, r: "3", fill: color }));

  // hit area
  const hit = mkEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: "transparent", "stroke-width": "14", style: "cursor:pointer;" });
  g.appendChild(hit);

  groups.push({ g, line, d, color });

  hit.addEventListener("mousemove", e => {
    const dir = d.b > d.a ? "+" : "";
    tip.textContent = `${d.n}  2000: ${d.a}%  →  2022: ${d.b}%  (${dir}${(d.b - d.a).toFixed(1)}pp)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
    groups.forEach(({ line: l }) => l.setAttribute("opacity", "0.08"));
    line.setAttribute("opacity", "1");
    line.setAttribute("stroke-width", "2.4");
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach(({ line: l }) => { l.setAttribute("opacity", "0.85"); l.setAttribute("stroke-width", "1.4"); });
  });
});

// draw labels
resolvedL.forEach(item => {
  const d = item.d;
  const origY = scale(d.a);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(mkEl("line", { x1: xL - 3, y1: origY, x2: xL - 6, y2: item.y, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  const label = `${d.n.replace("Cote d'Ivoire","C. d'Ivoire").replace("Gambia, The","Gambia").replace("Congo, Dem. Rep.","D.R. Congo").replace("Congo, Rep.","Congo").replace("Burkina Faso","Burkina F.")}  ${d.a}%`;
  svg.appendChild(mkEl("text", { x: xL - 8, y: item.y + 3.5, "text-anchor": "end", fill: "#2B2A27", "font-size": "9", "font-weight": "500" }, label));
});

resolvedR.forEach(item => {
  const d = item.d;
  const origY = scale(d.b);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(mkEl("line", { x1: xR + 3, y1: origY, x2: xR + 6, y2: item.y, stroke: item.color, "stroke-width": "0.5", opacity: "0.5" }));
  }
  svg.appendChild(mkEl("text", { x: xR + 8, y: item.y + 3.5, fill: "#2B2A27", "font-size": "9", "font-weight": "500" }, `${d.b}%  ${d.n.replace("Cote d'Ivoire","C. d'Ivoire").replace("Gambia, The","Gambia").replace("Congo, Dem. Rep.","D.R. Congo").replace("Congo, Rep.","Congo").replace("Burkina Faso","Burkina F.")}`));
});
</script>
</body></html>

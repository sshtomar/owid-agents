<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      margin: 0; padding: 24px;
      background: #fff; color: #0f172a;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    svg { display: block; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #1e293b; color: #f8fafc;
      font-size: 12px; padding: 6px 10px; border-radius: 4px;
      white-space: nowrap; transition: opacity 0.1s;
    }
  </style>
</head>
<body>
  <h1>Progress in Universal Health Coverage, 2000–2023</h1>
  <p class="subtitle">UHC Service Coverage Index (0–100) — higher means broader access to essential health services</p>
  <div id="chart"></div>
  <p class="source">Source: WHO Global Health Observatory — UHC Service Coverage Index (SDG 3.8.1)</p>
  <div id="tip"></div>
  <script>
    // Data: {n: name, a: 2000 value, b: 2023 value}
    const data = [{"n":"Ethiopia","a":13,"b":33},{"n":"Madagascar","a":15,"b":34},{"n":"Nepal","a":18,"b":58},{"n":"Comoros","a":25,"b":52},{"n":"Benin","a":25,"b":35},{"n":"Pakistan","a":36,"b":56},{"n":"Micronesia","a":42,"b":65},{"n":"Cabo Verde","a":49,"b":71},{"n":"Eswatini","a":51,"b":67},{"n":"Bosnia & Herz.","a":54,"b":64},{"n":"Jamaica","a":61,"b":75},{"n":"Mongolia","a":62,"b":70},{"n":"Paraguay","a":62,"b":79},{"n":"Algeria","a":68,"b":70},{"n":"Argentina","a":74,"b":80},{"n":"Cuba","a":74,"b":86},{"n":"Jordan","a":75,"b":71},{"n":"Costa Rica","a":76,"b":84},{"n":"Barbados","a":77,"b":82},{"n":"Uzbekistan","a":78,"b":79},{"n":"Kuwait","a":79,"b":84},{"n":"Bahamas","a":79,"b":80}];

    const W = 680, H = 620;
    const pad = { left: 130, right: 140, top: 48, bottom: 24 };
    const innerH = H - pad.top - pad.bottom;

    const xL = pad.left;
    const xR = W - pad.right;
    const minV = 0, maxV = 100;
    const scale = v => pad.top + (maxV - v) / (maxV - minV) * innerH;

    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width","100%");
    svg.style.maxWidth = W + "px";

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }
    function mkText(tag, attrs, text) {
      const el = mkEl(tag, attrs);
      el.textContent = text;
      return el;
    }

    // Column headers
    svg.appendChild(mkText("text", {
      x: xL, y: pad.top - 16, "text-anchor": "middle",
      "font-size": "11", "font-weight": "600", fill: "#475569",
      "font-family": "ui-monospace, monospace"
    }, "2000"));
    svg.appendChild(mkText("text", {
      x: xR, y: pad.top - 16, "text-anchor": "middle",
      "font-size": "11", "font-weight": "600", fill: "#475569",
      "font-family": "ui-monospace, monospace"
    }, "2023"));

    // Axis lines
    svg.appendChild(mkEl("line", {
      x1: xL, y1: pad.top, x2: xL, y2: pad.top + innerH,
      stroke: "#e2e8f0", "stroke-width": "1"
    }));
    svg.appendChild(mkEl("line", {
      x1: xR, y1: pad.top, x2: xR, y2: pad.top + innerH,
      stroke: "#e2e8f0", "stroke-width": "1"
    }));

    // Reference lines at 25, 50, 75
    [25, 50, 75].forEach(v => {
      svg.appendChild(mkEl("line", {
        x1: xL, y1: scale(v), x2: xR, y2: scale(v),
        stroke: "#f1f5f9", "stroke-width": "1", "stroke-dasharray": "3,3"
      }));
      svg.appendChild(mkText("text", {
        x: (xL + xR) / 2, y: scale(v) - 2,
        "text-anchor": "middle", "font-size": "8", fill: "#cbd5e1",
        "font-family": "ui-monospace, monospace"
      }, v));
    });

    function colorForChange(d) {
      const ch = d.b - d.a;
      if (ch >= 30) return "#3D7A5A";
      if (ch >= 20) return "#5B9E78";
      if (ch >= 10) return "#8BAD72";
      if (ch >= 0) return "#C49A45";
      return "#C4715A";
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let j = 1; j < sorted.length; j++) {
          const gap = sorted[j].y - sorted[j-1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[j-1].y -= shift;
            sorted[j].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      // Clamp to bounds
      sorted.forEach(it => {
        it.y = Math.max(pad.top + 6, Math.min(pad.top + innerH - 6, it.y));
      });
      return sorted;
    }

    const leftLabels = data.map((d, i) => ({ y: scale(d.a), i, d }));
    const rightLabels = data.map((d, i) => ({ y: scale(d.b), i, d }));
    const rLeft = resolveCollisions(leftLabels, 13);
    const rRight = resolveCollisions(rightLabels, 13);
    const leftMap = {}; rLeft.forEach(it => { leftMap[it.i] = it.y; });
    const rightMap = {}; rRight.forEach(it => { rightMap[it.i] = it.y; });

    const groups = [];
    const tip = document.getElementById("tip");

    data.forEach((d, i) => {
      const color = colorForChange(d);
      const g = mkEl("g", {});

      const ya = scale(d.a), yb = scale(d.b);
      const lY = leftMap[i], rY = rightMap[i];

      // Main line
      const line = mkEl("line", {
        x1: xL, y1: ya, x2: xR, y2: yb,
        stroke: color, "stroke-width": "1.5", opacity: "0.85"
      });
      g.appendChild(line);

      // Dots
      g.appendChild(mkEl("circle", { cx: xL, cy: ya, r: "3", fill: color }));
      g.appendChild(mkEl("circle", { cx: xR, cy: yb, r: "3", fill: color }));

      // Leader lines if label shifted
      if (Math.abs(lY - ya) > 2)
        g.appendChild(mkEl("line", { x1: xL-3, y1: ya, x2: xL-6, y2: lY, stroke: color, "stroke-width":"0.5", opacity:"0.4" }));
      if (Math.abs(rY - yb) > 2)
        g.appendChild(mkEl("line", { x1: xR+3, y1: yb, x2: xR+6, y2: rY, stroke: color, "stroke-width":"0.5", opacity:"0.4" }));

      // Left label
      g.appendChild(mkText("text", {
        x: xL - 8, y: lY + 4,
        "text-anchor": "end", "font-size": "9", fill: color,
        "font-family": "ui-monospace, monospace"
      }, `${d.n}  ${d.a}`));

      // Right label
      g.appendChild(mkText("text", {
        x: xR + 8, y: rY + 4,
        "text-anchor": "start", "font-size": "9", fill: color,
        "font-family": "ui-monospace, monospace"
      }, `${d.b}  ${d.b >= d.a ? "+" : ""}${d.b - d.a}`));

      // Hit area
      const hit = mkEl("line", {
        x1: xL, y1: ya, x2: xR, y2: yb,
        stroke: "transparent", "stroke-width": "10"
      });
      hit.style.cursor = "pointer";
      hit.addEventListener("mouseover", e => {
        tip.textContent = `${d.n}: ${d.a} (2000) → ${d.b} (2023), change: ${d.b >= d.a ? "+" : ""}${d.b - d.a}`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
        groups.forEach((grp, j) => { grp.style.opacity = j === i ? "1" : "0.08"; });
      });
      hit.addEventListener("mousemove", e => {
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        tip.style.opacity = "0";
        groups.forEach(grp => { grp.style.opacity = "1"; });
      });
      g.appendChild(hit);
      groups.push(g);
      svg.appendChild(g);
    });

    // Legend
    const legendItems = [
      { color: "#3D7A5A", label: "+30 or more" },
      { color: "#5B9E78", label: "+20 to +29" },
      { color: "#8BAD72", label: "+10 to +19" },
      { color: "#C49A45", label: "0 to +9" },
      { color: "#C4715A", label: "Declined" },
    ];
    let lx = xL;
    const ly = H - 8;
    legendItems.forEach(item => {
      svg.appendChild(mkEl("rect", { x: lx, y: ly - 8, width: 10, height: 8, fill: item.color }));
      const label = mkText("text", {
        x: lx + 13, y: ly - 1, "font-size": "9", fill: "#64748b",
        "font-family": "ui-monospace, monospace"
      }, item.label);
      svg.appendChild(label);
      lx += 90;
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

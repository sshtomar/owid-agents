<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 16px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 8px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #0f172a; color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 4px;
      transition: opacity 0.1s; white-space: nowrap; z-index: 10;
    }
  </style>
</head>
<body>
  <h1>International Tourism Arrivals — The COVID Collapse</h1>
  <p class="subtitle">Annual international tourist arrivals (millions), 1995–2020 — top destinations</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — International Tourism, Number of Arrivals (ST.INT.ARVL)</p>
  <div id="tip"></div>
  <script>
    // Data exported from catalog: wb--ST-INT-ARVL
    const data = [{"n":"France","s":[null,148.3,157.6,null,null,null,null,null,null,190.3,185.8,193.9,193.3,193.6,192.4,189.8,196.6,197.5,204.4,206.6,203.3,203.0,207.3,212.0,217.9,117.1],"y0":1995},{"n":"China","s":[46.4,51.1,57.6,63.5,72.8,83.4,89.0,97.9,91.7,109.0,120.3,124.9,131.9,130.0,126.5,133.8,135.4,132.4,129.1,128.5,133.8,141.8,153.3,158.6,162.5,30.4],"y0":1995},{"n":"Italy","s":[55.7,59.8,58.0,58.5,59.5,62.7,61.0,63.6,63.0,58.5,59.2,66.4,70.3,70.7,71.7,73.2,75.9,76.3,76.8,77.7,81.1,84.9,89.9,93.2,95.4,38.4],"y0":1995},{"n":"Germany","s":[14.8,15.2,15.8,16.5,17.1,19.0,17.9,18.0,18.4,20.1,21.5,23.6,24.4,24.9,24.2,26.9,28.4,30.4,31.5,33.0,35.0,35.6,37.5,38.9,39.6,12.4],"y0":1995},{"n":"Greece","s":[10.7,9.8,10.6,11.4,12.6,13.6,14.7,14.9,14.8,14.3,15.9,17.3,null,null,null,null,null,null,20.1,24.3,26.1,28.1,30.2,33.1,34.0,7.4],"y0":1995},{"n":"Austria","s":[17.2,17.1,16.6,17.4,17.5,18.0,18.2,18.6,19.1,19.4,20.0,20.3,20.8,21.9,21.4,22.0,23.0,24.2,24.8,25.3,26.7,28.1,29.5,30.8,31.9,15.1],"y0":1995},{"n":"Japan","s":[3.3,3.8,4.2,4.1,4.4,4.8,4.8,5.2,5.2,6.1,6.7,7.3,8.3,8.4,6.8,8.6,6.2,8.4,10.4,13.4,19.7,24.0,28.7,31.2,31.9,4.1],"y0":1995},{"n":"Korea, Rep.","s":[3.8,3.7,3.9,4.3,4.7,5.3,5.1,5.3,4.8,5.8,6.0,6.2,6.4,6.9,7.8,8.8,9.8,11.1,12.2,14.2,13.2,17.2,13.3,15.3,17.5,2.5],"y0":1995},{"n":"Croatia","s":[16.1,19.1,23.7,25.5,29.2,37.2,40.1,41.7,42.9,45.0,45.8,47.7,52.3,51.3,47.6,49.0,50.0,47.2,48.3,51.2,55.9,57.6,59.2,57.7,60.0,21.6],"y0":1995},{"n":"Denmark","s":[null,null,null,null,null,null,null,null,21.1,22.1,26.9,26.9,27.1,26.9,26.6,26.7,25.8,26.4,26.5,28.1,28.2,28.7,30.7,30.8,33.1,15.6],"y0":1995}];

    const COLORS = ["#EA5E33","#C93A1E","#3D7A5A","#2B6CB0","#7B55AA","#F29A44","#5B9E78","#4A9ED1","#B34B3B","#C49A45"];

    const W = 760, H = 440;
    const margin = {top: 30, right: 110, bottom: 36, left: 52};
    const innerW = W - margin.left - margin.right;
    const innerH = H - margin.top - margin.bottom;

    const yearMin = 1995, yearMax = 2020;
    const valMin = 0, valMax = 230;

    const xScale = yr => margin.left + (yr - yearMin) / (yearMax - yearMin) * innerW;
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * innerH;

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = mkEl("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:760px;display:block;"});

    // COVID annotation band
    svg.appendChild(mkEl("rect", {
      x: xScale(2019.5), y: margin.top,
      width: xScale(2020) - xScale(2019.5),
      height: innerH,
      fill: "#EA5E33", opacity: "0.07"
    }));
    const covidLbl = mkEl("text", {x: xScale(2020) - 2, y: margin.top + 14, "text-anchor": "end", "font-size": "9.5", fill: "#EA5E33", "font-weight": "600"});
    covidLbl.textContent = "COVID-19";
    svg.appendChild(covidLbl);

    // Gridlines
    [0, 50, 100, 150, 200].forEach(v => {
      svg.appendChild(mkEl("line", {
        x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
        stroke: "#E8E5DC", "stroke-width": "0.8"
      }));
      const lbl = mkEl("text", {x: margin.left - 6, y: yScale(v) + 4, "text-anchor": "end", "font-size": "10", fill: "#94a3b8", "font-family": "monospace"});
      lbl.textContent = v + "M";
      svg.appendChild(lbl);
    });

    // X axis ticks
    [1995, 2000, 2005, 2010, 2015, 2019, 2020].forEach(yr => {
      const x = xScale(yr);
      svg.appendChild(mkEl("line", {x1: x, y1: margin.top, x2: x, y2: H - margin.bottom + 4, stroke: "#E8E5DC", "stroke-width": "0.8"}));
      const lbl = mkEl("text", {x, y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "10", fill: "#94a3b8", "font-family": "monospace"});
      lbl.textContent = yr;
      svg.appendChild(lbl);
    });

    const tip = document.getElementById("tip");
    const groups = [];

    // Build labels for collision resolution
    const labelItems = data.map((row, i) => {
      const pts = row.s.map((v, j) => v !== null ? {year: row.y0 + j, value: v} : null).filter(Boolean);
      // Use 2020 value for label position
      const last = pts[pts.length - 1];
      return {y: yScale(last.value), name: row.n, color: COLORS[i], lastVal: last.value};
    });
    const resolved = resolveCollisions(labelItems, 13);

    data.forEach((row, i) => {
      const color = COLORS[i];
      const pts = row.s.map((v, j) => v !== null ? {year: row.y0 + j, value: v} : null).filter(Boolean);
      if (pts.length < 2) return;

      const g = mkEl("g", {});

      // Build path segments (handle nulls)
      let pathD = "";
      let firstPt = true;
      pts.forEach(p => {
        pathD += `${firstPt ? "M" : "L"}${xScale(p.year).toFixed(1)},${yScale(p.value).toFixed(1)} `;
        firstPt = false;
      });

      const line = mkEl("path", {d: pathD.trim(), stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"});
      g.appendChild(line);

      const hit = mkEl("path", {d: pathD.trim(), stroke: "transparent", "stroke-width": "14", fill: "none", style: "cursor:pointer"});
      g.appendChild(hit);

      const last = pts[pts.length - 1];
      g.appendChild(mkEl("circle", {cx: xScale(last.year), cy: yScale(last.value), r: "3", fill: color}));

      const labelEntry = resolved.find(r => r.name === row.n);
      const labelY = labelEntry ? labelEntry.y : yScale(last.value);
      const labelX = xScale(last.year) + 8;

      if (Math.abs(labelY - yScale(last.value)) > 4) {
        g.appendChild(mkEl("line", {x1: xScale(last.year) + 4, y1: yScale(last.value), x2: labelX, y2: labelY, stroke: color, "stroke-width": "0.6", opacity: "0.5"}));
      }

      const lbl = mkEl("text", {x: labelX, y: labelY + 4, "font-size": "9.5", fill: color, "font-family": "monospace", "font-weight": "600"});
      lbl.textContent = `${last.value.toFixed(0)}M  ${row.n}`;
      g.appendChild(lbl);

      svg.appendChild(g);
      groups.push({g, line, hit, row, pts, color, lbl});
    });

    groups.forEach(({line, hit, row, pts, lbl}, idx) => {
      hit.addEventListener("mousemove", e => {
        groups.forEach(({line: l, lbl: lb}, j) => {
          l.setAttribute("stroke-width", j === idx ? "3" : "1.8");
          l.setAttribute("opacity", j === idx ? "1" : "0.1");
          lb.setAttribute("opacity", j === idx ? "1" : "0.15");
        });
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / innerW));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const ptAtYr = pts.find(p => p.year === yr);
        const val = ptAtYr ? ptAtYr.value.toFixed(1) + "M" : "—";
        tip.textContent = `${row.n} (${yr}): ${val} arrivals`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(({line: l, lbl: lb}) => {
          l.setAttribute("stroke-width", "1.8");
          l.setAttribute("opacity", "1");
          lb.setAttribute("opacity", "1");
        });
        tip.style.opacity = "0";
      });
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>

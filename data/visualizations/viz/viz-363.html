<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 540px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>The Uneven Energy Transition: Fossil Fuel Dependence, 1995 vs 2015</h1>
<p class="subtitle">Fossil fuel energy as % of total consumption. Brazil and Iceland cut their reliance sharply; Japan increased after the 2011 Fukushima nuclear shutdown.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Fossil Fuel Energy Consumption (EG.USE.COMM.FO.ZS)</p>
<script>
const data = [
  {"n":"Japan","a":81.9,"b":93.8},
  {"n":"Australia","a":94.0,"b":92.4},
  {"n":"Korea, Rep.","a":86.4,"b":83.7},
  {"n":"Canada","a":72.4,"b":73.5},
  {"n":"Germany","a":85.8,"b":79.6},
  {"n":"China","a":77.9,"b":71.1},
  {"n":"France","a":53.6,"b":45.2},
  {"n":"Italy","a":93.0,"b":79.0},
  {"n":"Austria","a":78.0,"b":65.7},
  {"n":"Finland","a":52.9,"b":40.2},
  {"n":"Indonesia","a":69.0,"b":54.3},
  {"n":"India","a":64.1,"b":46.0},
  {"n":"Denmark","a":92.3,"b":64.2},
  {"n":"Brazil","a":54.5,"b":20.8},
  {"n":"Iceland","a":28.8,"b":11.7}
];

const W = 700, H = 560;
const pad = { left: 120, right: 130, top: 48, bottom: 24 };

function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

const allVals = data.flatMap(d => [d.a, d.b]);
const minV = Math.max(0, Math.min(...allVals) - 5);
const maxV = Math.min(100, Math.max(...allVals) + 5);
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const xL = pad.left, xR = W - pad.right;

function colorForChange(d) {
  const ch = d.b - d.a;
  if (ch > 5) return "#B34B3B";
  if (ch > 0) return "#C4715A";
  if (ch > -10) return "#C49A45";
  if (ch > -20) return "#8BAD72";
  if (ch > -30) return "#5B9E78";
  return "#3D7A5A";
}

const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px;` });
document.getElementById("chart").appendChild(svg);

// Column headers
[["1995", xL], ["2015", xR]].forEach(([label, x]) => {
  const t = svgEl("text", { x, y: pad.top - 16, "text-anchor": "middle", "font-size": "10", fill: "#7A786F", style: "font-family:'JetBrains Mono',monospace" });
  t.textContent = label;
  svg.appendChild(t);
  svg.appendChild(svgEl("line", { x1: x, y1: pad.top - 8, x2: x, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.5" }));
});

// Grid lines
[20, 40, 60, 80, 100].forEach(v => {
  if (v >= minV && v <= maxV) {
    svg.appendChild(svgEl("line", { x1: xL, y1: scale(v), x2: xR, y2: scale(v), stroke: "#E2E0D5", "stroke-width": "0.4", "stroke-dasharray": "2,3" }));
  }
});

const tip = document.getElementById("tip");
const groups = [];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

data.forEach((d, di) => {
  const color = colorForChange(d);
  const yA = scale(d.a), yB = scale(d.b);
  const g = svgEl("g", {});
  svg.appendChild(g);

  g.appendChild(svgEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: color, "stroke-width": "1.5" }));
  g.appendChild(svgEl("circle", { cx: xL, cy: yA, r: "3", fill: color }));
  g.appendChild(svgEl("circle", { cx: xR, cy: yB, r: "3", fill: color }));

  // Hit area
  const hit = svgEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: "transparent", "stroke-width": "12", cursor: "crosshair" });
  g.appendChild(hit);
  hit.addEventListener("mouseenter", e => {
    groups.forEach((gg, gi) => gg.setAttribute("opacity", gi === di ? "1" : "0.1"));
    const ch = d.b - d.a;
    tip.textContent = `${d.n}: ${d.a}% → ${d.b}% (${ch > 0 ? "+" : ""}${ch.toFixed(1)})`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => { groups.forEach(gg => gg.setAttribute("opacity", "1")); tip.style.opacity = "0"; });

  groups.push(g);
});

// Left labels
const leftItems = data.map(d => ({ name: d.n, val: d.a, y: scale(d.a), color: colorForChange(d) }));
resolveCollisions(leftItems, 14).forEach(item => {
  const origY = scale(item.val);
  const t = svgEl("text", { x: xL - 8, y: item.y + 4, "text-anchor": "end", "font-size": "9.5", fill: item.color, style: "font-family:'Inter',sans-serif" });
  t.textContent = `${item.name}  ${item.val}%`;
  svg.appendChild(t);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(svgEl("line", { x1: xL - 4, y1: origY, x2: xL - 4, y2: item.y, stroke: item.color, "stroke-width": "0.4", opacity: "0.4" }));
  }
});

// Right labels
const rightItems = data.map(d => ({ name: d.n, val: d.b, y: scale(d.b), color: colorForChange(d) }));
resolveCollisions(rightItems, 14).forEach(item => {
  const origY = scale(item.val);
  const t = svgEl("text", { x: xR + 8, y: item.y + 4, "text-anchor": "start", "font-size": "9.5", fill: item.color, style: "font-family:'Inter',sans-serif" });
  t.textContent = `${item.val}%  ${item.name}`;
  svg.appendChild(t);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(svgEl("line", { x1: xR + 4, y1: origY, x2: xR + 4, y2: item.y, stroke: item.color, "stroke-width": "0.4", opacity: "0.4" }));
  }
});

// Legend
const legend = [["#B34B3B","Increased"],["#C49A45","Small decrease"],["#8BAD72","Moderate decrease"],["#3D7A5A","Large decrease"]];
let lx = pad.left;
legend.forEach(([c, label]) => {
  svg.appendChild(svgEl("rect", { x: lx, y: 6, width: 10, height: 10, fill: c }));
  const t = svgEl("text", { x: lx + 14, y: 15, "font-size": "8.5", fill: "#7A786F", style: "font-family:'Inter',sans-serif" });
  t.textContent = label;
  svg.appendChild(t);
  lx += 14 + label.length * 5.5 + 12;
});
</script>
</body></html>

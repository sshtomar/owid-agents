<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 560px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>From Youth Bulge to Aging: Age Dependency Ratio, 1970 vs 2022</h1>
<p class="subtitle">Dependents (children + elderly) per 100 working-age adults. Korea and China halved their ratio; Sub-Saharan Africa remains above 80; Japan reversed course as its population ages.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — Age Dependency Ratio (SP.POP.DPND)</p>
<script>
const data = [
  {"n":"Chad","y":1970,"a":87.6,"b":97.9},
  {"n":"Congo, Dem. Rep.","y":1970,"a":86.2,"b":96.8},
  {"n":"Angola","y":1970,"a":95.4,"b":90.6},
  {"n":"Burkina Faso","y":1970,"a":83.6,"b":83.7},
  {"n":"Ethiopia","y":1970,"a":88.6,"b":74.9},
  {"n":"Ghana","y":1970,"a":106.6,"b":66.9},
  {"n":"Kenya","y":1970,"a":116.5,"b":69.3},
  {"n":"Bangladesh","y":1970,"a":90.3,"b":53.6},
  {"n":"India","y":1970,"a":81.9,"b":47.5},
  {"n":"Iran, Islamic Rep.","y":1970,"a":92.5,"b":44.6},
  {"n":"China","y":1970,"a":80.2,"b":44.7},
  {"n":"Korea, Rep.","y":1970,"a":83.5,"b":40.6},
  {"n":"Brazil","y":1970,"a":83.9,"b":43.8},
  {"n":"Colombia","y":1970,"a":95.6,"b":42.8},
  {"n":"France","y":1970,"a":60.5,"b":62.4},
  {"n":"Italy","y":1970,"a":55.6,"b":57.0},
  {"n":"Germany","y":1970,"a":58.3,"b":57.2},
  {"n":"Japan","y":1970,"a":43.5,"b":70.2}
];

const W = 700, H = 600;
const pad = { left: 138, right: 148, top: 48, bottom: 24 };

function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

const allVals = data.flatMap(d => [d.a, d.b]);
const minV = 30, maxV = 125;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const xL = pad.left, xR = W - pad.right;

function colorForChange(d) {
  const ch = d.b - d.a;
  if (ch > 10) return "#B34B3B";
  if (ch > 2) return "#C4715A";
  if (ch > -5) return "#C49A45";
  if (ch > -20) return "#8BAD72";
  if (ch > -35) return "#5B9E78";
  return "#3D7A5A";
}

const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px;` });
document.getElementById("chart").appendChild(svg);

[["1970", xL], ["2022", xR]].forEach(([label, x]) => {
  const t = svgEl("text", { x, y: pad.top - 16, "text-anchor": "middle", "font-size": "10", fill: "#7A786F", style: "font-family:'JetBrains Mono',monospace" });
  t.textContent = label;
  svg.appendChild(t);
  svg.appendChild(svgEl("line", { x1: x, y1: pad.top - 8, x2: x, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.5" }));
});

[40, 60, 80, 100, 120].forEach(v => {
  if (v >= minV && v <= maxV) {
    svg.appendChild(svgEl("line", { x1: xL, y1: scale(v), x2: xR, y2: scale(v), stroke: "#E2E0D5", "stroke-width": "0.4", "stroke-dasharray": "2,3" }));
    const t = svgEl("text", { x: (xL + xR) / 2, y: scale(v) - 3, "text-anchor": "middle", "font-size": "8", fill: "#C2C0B5", style: "font-family:'JetBrains Mono',monospace" });
    t.textContent = v;
    svg.appendChild(t);
  }
});

const tip = document.getElementById("tip");
const groups = [];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

data.forEach((d, di) => {
  const color = colorForChange(d);
  const yA = scale(d.a), yB = scale(d.b);
  const g = svgEl("g", {});
  svg.appendChild(g);

  g.appendChild(svgEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: color, "stroke-width": "1.5" }));
  g.appendChild(svgEl("circle", { cx: xL, cy: yA, r: "2.5", fill: color }));
  g.appendChild(svgEl("circle", { cx: xR, cy: yB, r: "2.5", fill: color }));

  const hit = svgEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: "transparent", "stroke-width": "12", cursor: "crosshair" });
  g.appendChild(hit);
  hit.addEventListener("mouseenter", e => {
    groups.forEach((gg, gi) => gg.setAttribute("opacity", gi === di ? "1" : "0.1"));
    const ch = d.b - d.a;
    tip.textContent = `${d.n}: ${d.a} → ${d.b} (${ch >= 0 ? "+" : ""}${ch.toFixed(1)})`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => { groups.forEach(gg => gg.setAttribute("opacity", "1")); tip.style.opacity = "0"; });

  groups.push(g);
});

// Shorten Congo name for label
const shortNames = {"Congo, Dem. Rep.": "Congo DRC", "Iran, Islamic Rep.": "Iran", "Korea, Rep.": "Korea"};

const leftItems = data.map(d => ({ name: shortNames[d.n] || d.n, val: d.a, y: scale(d.a), color: colorForChange(d) }));
resolveCollisions(leftItems, 13).forEach(item => {
  const origY = scale(item.val);
  const t = svgEl("text", { x: xL - 8, y: item.y + 4, "text-anchor": "end", "font-size": "9", fill: item.color, style: "font-family:'Inter',sans-serif" });
  t.textContent = `${item.name}  ${item.val}`;
  svg.appendChild(t);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(svgEl("line", { x1: xL - 5, y1: origY, x2: xL - 5, y2: item.y, stroke: item.color, "stroke-width": "0.4", opacity: "0.4" }));
  }
});

const rightItems = data.map(d => ({ name: shortNames[d.n] || d.n, val: d.b, y: scale(d.b), color: colorForChange(d) }));
resolveCollisions(rightItems, 13).forEach(item => {
  const origY = scale(item.val);
  const t = svgEl("text", { x: xR + 8, y: item.y + 4, "text-anchor": "start", "font-size": "9", fill: item.color, style: "font-family:'Inter',sans-serif" });
  t.textContent = `${item.val}  ${item.name}`;
  svg.appendChild(t);
  if (Math.abs(item.y - origY) > 3) {
    svg.appendChild(svgEl("line", { x1: xR + 5, y1: origY, x2: xR + 5, y2: item.y, stroke: item.color, "stroke-width": "0.4", opacity: "0.4" }));
  }
});

// Legend
const legend = [["#B34B3B","Increased (>10)"],["#C49A45","Stable (±5)"],["#8BAD72","Reduced (5–20)"],["#3D7A5A","Reduced (>35)"]];
let lx = pad.left;
legend.forEach(([c, label]) => {
  svg.appendChild(svgEl("rect", { x: lx, y: 6, width: 10, height: 10, fill: c }));
  const t = svgEl("text", { x: lx + 14, y: 15, "font-size": "8.5", fill: "#7A786F", style: "font-family:'Inter',sans-serif" });
  t.textContent = label;
  svg.appendChild(t);
  lx += 14 + label.length * 5.2 + 10;
});
</script>
</body></html>
